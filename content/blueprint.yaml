# Exam formats, learning units, objectives and weights (learn_togaf.md §0, learn_sabsa_archimate.md §4.1).
# Exams are data: one entry per exam code, each with its track and its scoring shape. Every
# figure marked "verify" was transcribed from memory and must be checked against the certifying
# body's current datasheet before a mock of that exam is trusted; record the revision on the entry.
revision: "TOGAF 10 Foundation & Practitioner Conformance Requirements — transcription 2026-09-10, unverified against the live document; ArchiMate 3 and SABSA formats transcribed 2026-09-25, unverified"

