# Every defined term (learn_togaf.md §2, §4.4). Authored starter paraphrases, status draft;
# `generate glossary` replaces this from the Definitions chapter with a source sentence beside
# each entry for review.
- {id: architecture, term: Architecture, definition: "The fundamental concepts or properties of a system in its environment, embodied in its elements, relationships and the principles of its design and evolution; also, the structure of components, their relationships, and the principles governing their design over time.", document: INTRO, section: "3", objectives: ["2.1"], confusable_with: [architecture_framework], source: authored, status: draft}
- {id: architecture_framework, term: Architecture Framework, definition: "A conceptual structure used to plan, develop, implement, govern and sustain an architecture. It should describe a method, a set of tools and a common vocabulary, and a list of recommended standards and compliant products.", document: INTRO, section: "3", objectives: ["2.1", "1.1"], confusable_with: [architecture], source: authored, status: draft}
- {id: adm, term: Architecture Development Method (ADM), definition: "The core of the TOGAF Standard: a step-by-step, iterative method for developing and managing an enterprise architecture, made of the Preliminary Phase, Phases A to H and the Requirements Management process.", document: INTRO, section: "3", objectives: ["3.1"], confusable_with: [sabsa_lifecycle], source: authored, status: draft}
- {id: artifact, term: Artifact, definition: "An architectural work product that describes an aspect of the architecture. Classified as a catalog (a list of things), a matrix (relationships between things) or a diagram (a picture of things).", document: INTRO, section: "3", objectives: ["1.4", "2.2", "7.2"], confusable_with: [deliverable, building_block, archimate_artifact], source: authored, status: draft}
- {id: deliverable, term: Deliverable, definition: "An architectural work product that is contractually specified and formally reviewed, agreed and signed off by the stakeholders. Deliverables are the outputs of projects and typically contain many artifacts.", document: INTRO, section: "3", objectives: ["1.4", "2.2"], confusable_with: [artifact, building_block, archimate_deliverable], source: authored, status: draft}
- {id: building_block, term: Building Block, definition: "A potentially reusable component of capability that can be combined with other building blocks to deliver architectures and solutions. Can be defined at many levels of detail.", document: INTRO, section: "3", objectives: ["1.4", "2.2", "7.3"], confusable_with: [artifact, deliverable, abb, sbb], source: authored, status: draft}
- {id: abb, term: Architecture Building Block (ABB), definition: "A constituent of the architecture model that describes a single aspect of the overall model; it captures architecture requirements and directs and guides the development of Solution Building Blocks.", document: CONTENT, section: "5", objectives: ["7.3"], confusable_with: [sbb, building_block, security_service], source: authored, status: draft}
- {id: sbb, term: Solution Building Block (SBB), definition: "A candidate physical solution for an Architecture Building Block: a product or specific custom development that implements one or more ABBs.", document: CONTENT, section: "5", objectives: ["7.3"], confusable_with: [abb, building_block, security_mechanism, component_layer], source: authored, status: draft}
- {id: architecture_vision, term: Architecture Vision, definition: "A succinct description of the Target Architecture that describes its business and technical value and the changes it will bring to the enterprise; produced in Phase A and used to obtain sponsor agreement.", document: INTRO, section: "3", objectives: ["2.1", "4.2"], confusable_with: [architecture_definition_document], source: authored, status: draft}
- {id: architecture_definition_document, term: Architecture Definition Document, definition: "The deliverable container for the core architectural artifacts created during a project and for important related information; it spans the Baseline and Target Architectures across all four domains and the Transition Architectures.", document: CONTENT, section: "6", objectives: ["2.2", "4.3"], confusable_with: [architecture_vision, architecture_requirements_specification], source: authored, status: draft}
- {id: architecture_requirements_specification, term: Architecture Requirements Specification, definition: "A set of quantitative statements outlining what an implementation project must do to comply with the architecture; the companion to the Architecture Definition Document.", document: CONTENT, section: "6", objectives: ["2.1", "4.3"], confusable_with: [architecture_definition_document], source: authored, status: draft}
- {id: architecture_roadmap, term: Architecture Roadmap, definition: "Lists individual work packages that will realise the Target Architecture and lays them out on a timeline, showing progression from Baseline to Target; produced incrementally through B to F.", document: CONTENT, section: "6", objectives: ["2.1", "4.5"], confusable_with: [implementation_and_migration_plan], source: authored, status: draft}
- {id: implementation_and_migration_plan, term: Implementation and Migration Plan, definition: "A schedule of the projects that will realise the Target Architecture, with the Implementation and Migration Strategy and the project and portfolio breakdown; outlined in Phase E, finalised in Phase F.", document: CONTENT, section: "6", objectives: ["4.5"], confusable_with: [architecture_roadmap], source: authored, status: draft}
- {id: transition_architecture, term: Transition Architecture, definition: "A formal description of the enterprise architecture at an architecturally significant state between the Baseline and Target Architectures, showing periods of transition and clear business value.", document: INTRO, section: "3", objectives: ["2.1", "4.5"], confusable_with: [target_architecture, plateau], source: authored, status: draft}
- {id: baseline_architecture, term: Baseline Architecture, definition: "The existing defined system architecture before entering a cycle of architecture review and redesign.", document: INTRO, section: "3", objectives: ["2.1"], confusable_with: [target_architecture], source: authored, status: draft}
- {id: target_architecture, term: Target Architecture, definition: "The description of a future state of the architecture being developed for an organisation; may be several Transition Architectures away.", document: INTRO, section: "3", objectives: ["2.1"], confusable_with: [baseline_architecture, transition_architecture], source: authored, status: draft}
- {id: enterprise_continuum, term: Enterprise Continuum, definition: "A categorisation mechanism for classifying architecture and solution artifacts, both internal and external to the Architecture Repository, as they evolve from generic Foundation Architectures to Organization-Specific Architectures.", document: CONTENT, section: "8", objectives: ["1.5", "2.2", "7.5"], confusable_with: [architecture_repository, architecture_continuum, solutions_continuum], source: authored, status: draft}
- {id: architecture_continuum, term: Architecture Continuum, definition: "The part of the Enterprise Continuum that classifies architectures (ABBs) from Foundation Architectures through Common Systems and Industry Architectures to Organization-Specific Architectures.", document: CONTENT, section: "8", objectives: ["7.5"], confusable_with: [solutions_continuum, enterprise_continuum], source: authored, status: draft}
- {id: solutions_continuum, term: Solutions Continuum, definition: "The part of the Enterprise Continuum that classifies solutions (SBBs) corresponding to each level of the Architecture Continuum.", document: CONTENT, section: "8", objectives: ["7.5"], confusable_with: [architecture_continuum, enterprise_continuum], source: authored, status: draft}
- {id: architecture_repository, term: Architecture Repository, definition: "The part of the Architecture Capability that stores architectural output: the Architecture Metamodel, Architecture Capability, Architecture Landscape, Standards Information Base, Reference Library, Governance Log, Architecture Requirements Repository and Solutions Landscape.", document: CONTENT, section: "9", objectives: ["1.5", "2.2", "7.4"], confusable_with: [enterprise_continuum, architecture_landscape], source: authored, status: draft}
- {id: architecture_landscape, term: Architecture Landscape, definition: "The architectural representation of assets in use, or planned, by the enterprise at particular points in time; held at strategic, segment and capability levels.", document: CONTENT, section: "9", objectives: ["6.2", "7.4"], confusable_with: [architecture_repository, solutions_landscape], source: authored, status: draft}
- {id: solutions_landscape, term: Solutions Landscape, definition: "The Solution Building Blocks supporting the Architecture Landscape, which have been planned or deployed by the enterprise.", document: CONTENT, section: "9", objectives: ["7.4"], confusable_with: [architecture_landscape], source: authored, status: draft}
- {id: reference_library, term: Reference Library, definition: "The part of the Architecture Repository holding guidelines, templates, patterns and other reference material to accelerate new architectures.", document: CONTENT, section: "9", objectives: ["7.4"], confusable_with: [standards_library], source: authored, status: draft}
- {id: standards_library, term: Standards Library, definition: "The part of the Architecture Repository that captures the standards with which new architectures must comply, including industry, organisational and product standards.", document: CONTENT, section: "9", objectives: ["7.4"], confusable_with: [reference_library], source: authored, status: draft}
- {id: governance_log, term: Governance Repository (Governance Log), definition: "The part of the Architecture Repository recording governance activity: decisions, compliance assessments, dispensations, capability assessments, calendar, project portfolio and performance measurements.", document: CONTENT, section: "9", objectives: ["7.4"], confusable_with: [], source: authored, status: draft}
- {id: architecture_requirements_repository, term: Architecture Requirements Repository, definition: "The part of the Architecture Repository that holds all authorised architecture requirements agreed with the Architecture Board.", document: CONTENT, section: "9", objectives: ["7.4", "4.7"], confusable_with: [archimate_requirement, business_attribute, business_attributes_profile], source: authored, status: draft}
- {id: architecture_capability, term: Architecture Capability (EA Capability), definition: "The organisation's ability to perform enterprise architecture: the people, processes, tools, governance, roles and responsibilities that produce and use architecture. Established in the Preliminary Phase.", document: GOV, section: "2", objectives: ["1.5", "8.1"], confusable_with: [archimate_capability], source: authored, status: draft}
- {id: architecture_board, term: Architecture Board, definition: "A cross-organisational body responsible for the governance and oversight of the enterprise architecture, its consistency, compliance, dispensations and the resolution of ambiguities.", document: GOV, section: "3", objectives: ["8.1"], confusable_with: [], source: authored, status: draft}
- {id: architecture_governance, term: Architecture Governance, definition: "The practice by which enterprise architectures are managed and controlled at an enterprise-wide level: controls over creation and monitoring, compliance, accountability and effective processes.", document: GOV, section: "4", objectives: ["8.2"], confusable_with: [architecture_compliance, service_management_layer], source: authored, status: draft}
- {id: architecture_compliance, term: Architecture Compliance, definition: "The degree to which an implementation conforms to the architecture, on a scale from irrelevant, consistent, compliant, conformant, fully conformant and non-conformant; assessed through Architecture Compliance Reviews.", document: GOV, section: "5", objectives: ["8.3"], confusable_with: [architecture_governance, assurance_framework], source: authored, status: draft}
- {id: architecture_contract, term: Architecture Contract, definition: "A joint agreement between development partners and sponsors on the deliverables, quality and fitness-for-purpose of an architecture; signed in Phase G.", document: GOV, section: "6", objectives: ["8.4"], confusable_with: [statement_of_architecture_work], source: authored, status: draft}
- {id: statement_of_architecture_work, term: Statement of Architecture Work, definition: "The document that defines the scope and approach that will be used to complete an architecture project; the deliverable that Phase A produces for sponsor approval.", document: CONTENT, section: "6", objectives: ["4.2", "2.1"], confusable_with: [request_for_architecture_work, architecture_contract], source: authored, status: draft}
- {id: request_for_architecture_work, term: Request for Architecture Work, definition: "A document sent from the sponsoring organisation to the architecture organisation to trigger the start of an architecture development cycle; the primary input to Phase A.", document: CONTENT, section: "6", objectives: ["4.2", "2.1"], confusable_with: [statement_of_architecture_work], source: authored, status: draft}
- {id: stakeholder, term: Stakeholder, definition: "An individual, team, organisation or class of these with interests in, or concerns relative to, the outcome of the architecture.", document: INTRO, section: "3", objectives: ["2.1", "5.2"], confusable_with: [concern, archimate_stakeholder], source: authored, status: draft}
- {id: concern, term: Concern, definition: "An interest in a system relevant to one or more of its stakeholders; concerns may pertain to any aspect of the system's functioning, development or operation.", document: INTRO, section: "3", objectives: ["2.1", "5.2"], confusable_with: [stakeholder, view, viewpoint], source: authored, status: draft}
- {id: view, term: View, definition: "A representation of a system from the perspective of a related set of concerns; what the stakeholder sees.", document: INTRO, section: "3", objectives: ["2.1"], confusable_with: [viewpoint, archimate_view, sabsa_matrix, concern], source: authored, status: draft}
- {id: viewpoint, term: Viewpoint, definition: "A specification of the conventions for constructing and using a view; the template from which a view is developed.", document: INTRO, section: "3", objectives: ["2.1"], confusable_with: [view, archimate_viewpoint, concern], source: authored, status: draft}
- {id: gap_analysis, term: Gap Analysis, definition: "The technique of comparing Baseline and Target Architectures to find what is eliminated, new or carried forward, so that nothing is omitted by accident.", document: TECH, section: "6", objectives: ["5.3"], confusable_with: [archimate_gap], source: authored, status: draft}
- {id: capability, term: Capability, definition: "An ability that an organisation, person or system possesses; typically expressed in general terms and requiring a combination of organisation, people, processes and technology to achieve.", document: INTRO, section: "3", objectives: ["2.1", "5.5"], confusable_with: [archimate_capability], source: authored, status: draft}
- {id: value_stream, term: Value Stream, definition: "A representation of an end-to-end collection of value-adding activities that create an overall result for a customer, stakeholder or end user.", document: INTRO, section: "3", objectives: ["2.1"], confusable_with: [archimate_value_stream], source: authored, status: draft}
- {id: work_package, term: Work Package, definition: "A set of actions identified to achieve one or more objectives for the business; a work package can be a part of a project, a complete project, or a programme.", document: INTRO, section: "3", objectives: ["2.1", "4.5"], confusable_with: [archimate_work_package], source: authored, status: draft}
- {id: metamodel, term: Metamodel, definition: "A model that describes how and with what the architecture will be described in a structured way; the content metamodel defines the entities (actors, functions, services, data entities, components...) and their relationships.", document: CONTENT, section: "3", objectives: ["7.1"], confusable_with: [], source: authored, status: draft}
- {id: architecture_principle, term: Architecture Principle, definition: "A qualitative statement of intent that should be met by the architecture; has a name, statement, rationale and implications.", document: TECH, section: "2", objectives: ["5.1"], confusable_with: [archimate_principle], source: authored, status: draft}
- {id: business_scenario, term: Business Scenario, definition: "A technique used to discover and document business requirements by describing a problem, its environment, desired outcome, and the human and computer actors involved.", document: TECH, section: "5", objectives: ["5.4"], confusable_with: [], source: authored, status: draft}
- {id: segment_architecture, term: Segment Architecture, definition: "A detailed, formal description of areas within an enterprise, used at the programme or portfolio level to organise and align change activity.", document: APPLY, section: "3", objectives: ["6.2"], confusable_with: [strategic_architecture, capability_architecture], source: authored, status: draft}
- {id: strategic_architecture, term: Strategic Architecture, definition: "A summary formal description of the enterprise, providing an organising framework for operational and change activity and an executive-level, long-term view for direction setting.", document: APPLY, section: "3", objectives: ["6.2"], confusable_with: [segment_architecture, capability_architecture], source: authored, status: draft}
- {id: capability_architecture, term: Capability Architecture, definition: "A highly detailed description of the architectural approach to realise a particular solution or solution aspect; the project level of the Architecture Landscape.", document: APPLY, section: "3", objectives: ["6.2"], confusable_with: [segment_architecture, strategic_architecture], source: authored, status: draft}
# ---------------------------------------------------------------- TOGAF: added for the cross-framework confusables (learn_sabsa_archimate.md §3.4)
- {id: architecture_domain, term: Architecture Domain, definition: "One of the four subject areas TOGAF divides an enterprise architecture into: Business, Data, Application and Technology Architecture. Data and Application together form the Information Systems Architectures of Phase C.", document: INTRO, section: "3", objectives: ["2.1", "3.1"], confusable_with: [security_domain, layer], source: authored, status: draft}
# ---------------------------------------------------------------- ArchiMate 3.2 (document ARCHIMATE, section = chapter)
- {id: aspect, term: Aspect (ArchiMate), definition: "One of the three columns of the ArchiMate framework: active structure (who or what acts), behaviour (what is done) and passive structure (what is acted on). Aspects cut across every layer.", document: ARCHIMATE, section: "3.4", objectives: ["A1.2"], confusable_with: [layer], source: authored, status: draft}
- {id: layer, term: Layer (ArchiMate), definition: "A horizontal band of the ArchiMate framework grouping elements at one level of the enterprise: business, application and technology in the core, with strategy, physical, implementation and migration extending it. The nearest thing ArchiMate has to a TOGAF architecture domain.", document: ARCHIMATE, section: "3.3", objectives: ["A1.2"], confusable_with: [aspect, architecture_domain], source: authored, status: draft}
- {id: active_structure, term: Active Structure Element, definition: "An element that can perform behaviour: an actor, role, collaboration, interface, component, node, device. Drawn with square corners in the ArchiMate notation.", document: ARCHIMATE, section: "4.1", objectives: ["A1.2", "A4.1"], confusable_with: [behaviour, passive_structure], source: authored, status: draft}
- {id: behaviour, term: Behaviour Element, definition: "A unit of activity performed by one or more active structure elements: a process, function, interaction, event or service. Drawn with rounded corners.", document: ARCHIMATE, section: "4.1", objectives: ["A1.2", "A4.2"], confusable_with: [active_structure, passive_structure], source: authored, status: draft}
- {id: passive_structure, term: Passive Structure Element, definition: "An element on which behaviour is performed: a business object, data object, artifact, material. It has no behaviour of its own and is reached through the access relationship.", document: ARCHIMATE, section: "4.1", objectives: ["A1.2", "A5.3"], confusable_with: [active_structure, behaviour], source: authored, status: draft}
- {id: archimate_stakeholder, term: Stakeholder (ArchiMate), definition: "A motivation element: the role of an individual, team or organisation that has an interest in the outcome of the architecture. Associated with the drivers it cares about; the TOGAF stakeholder concept drawn as an element.", document: ARCHIMATE, section: "6.2", objectives: ["A2.1", "X1.1"], confusable_with: [stakeholder, driver], source: authored, status: draft}
- {id: driver, term: Driver, definition: "A motivation element: an external or internal condition that motivates an organisation to define its goals, such as a regulation, a cost pressure or a customer expectation. Assessed by assessments and influencing goals.", document: ARCHIMATE, section: "6.2", objectives: ["A2.1", "X3.1"], confusable_with: [archimate_stakeholder, assessment, goal], source: authored, status: draft}
- {id: assessment, term: Assessment, definition: "A motivation element: the result of analysing a driver, typically a strength, weakness, opportunity or threat. W172 specialises it to model both vulnerability and risk.", document: ARCHIMATE, section: "6.2", objectives: ["A2.1", "X3.1"], confusable_with: [driver, two_sided_risk], source: authored, status: draft}
- {id: goal, term: Goal, definition: "A motivation element: a high-level statement of intent, direction or desired end state for an organisation and its stakeholders. Realised by outcomes and, through them, by the core architecture.", document: ARCHIMATE, section: "6.3", objectives: ["A2.1", "X3.1"], confusable_with: [outcome, archimate_requirement, driver], source: authored, status: draft}
- {id: outcome, term: Outcome, definition: "A motivation element: an end result, measurable where possible, that realises a goal. The ArchiMate element for a TOGAF objective.", document: ARCHIMATE, section: "6.3", objectives: ["A2.1", "X1.1"], confusable_with: [goal], source: authored, status: draft}
- {id: archimate_principle, term: Principle (ArchiMate), definition: "A motivation element: a statement of intent defining a general property that applies to any system in a context, realising goals and realised by requirements. The TOGAF architecture principle drawn as an element; SABSA places the same idea at the Conceptual layer as policy.", document: ARCHIMATE, section: "6.3", objectives: ["A2.2", "X1.1"], confusable_with: [architecture_principle, archimate_requirement], source: authored, status: draft}
- {id: archimate_requirement, term: Requirement (ArchiMate), definition: "A motivation element: a statement of need defining a property that applies to a specific system, realised by the core element that satisfies it. TOGAF manages requirements across the ADM; SABSA writes them as business attributes with targets.", document: ARCHIMATE, section: "6.3", objectives: ["A2.2", "X1.1", "X3.1"], confusable_with: [archimate_principle, constraint, business_attribute, architecture_requirements_repository, goal], source: authored, status: draft}
- {id: constraint, term: Constraint, definition: "A motivation element: a limitation on the way a system is realised, such as a mandated technology or a budget. A specialisation of requirement that restricts the solution space rather than stating a need.", document: ARCHIMATE, section: "6.3", objectives: ["A2.2"], confusable_with: [archimate_requirement], source: authored, status: draft}
- {id: archimate_capability, term: Capability (ArchiMate), definition: "A strategy element: an ability that an active structure element, such as the enterprise, possesses. Realised by the behaviour, structure and resources of the core layers. TOGAF uses the same word for business capabilities and for the EA Capability.", document: ARCHIMATE, section: "7.3", objectives: ["A3.1", "X1.1"], confusable_with: [capability, architecture_capability, archimate_value_stream, course_of_action], source: authored, status: draft}
- {id: archimate_value_stream, term: Value Stream (ArchiMate), definition: "A strategy element: a sequence of activities that creates an overall result for a customer, stakeholder or end user. Stages are composed into the whole; capabilities serve each stage.", document: ARCHIMATE, section: "7.3", objectives: ["A3.1", "X1.1"], confusable_with: [value_stream, archimate_capability], source: authored, status: draft}
- {id: course_of_action, term: Course of Action, definition: "A strategy element: an approach or plan for configuring capabilities and resources to achieve a goal. A strategy or tactic drawn as an element.", document: ARCHIMATE, section: "7.3", objectives: ["A3.1"], confusable_with: [archimate_capability], source: authored, status: draft}
- {id: business_actor, term: Business Actor, definition: "A business-layer active structure element: an organisational entity capable of performing behaviour, such as a person, department or organisation unit. Assigned to the roles it fills.", document: ARCHIMATE, section: "8.2", objectives: ["A4.1", "X3.2"], confusable_with: [business_role], source: authored, status: draft}
- {id: business_role, term: Business Role, definition: "A business-layer active structure element: the responsibility for performing specific behaviour, to which an actor can be assigned. The element for a TOGAF role and for a SABSA policy authority.", document: ARCHIMATE, section: "8.2", objectives: ["A4.1", "X3.2"], confusable_with: [business_actor, policy_authority], source: authored, status: draft}
- {id: archimate_service, term: Business Service (ArchiMate), definition: "A business-layer behaviour element: an explicitly defined exposed business behaviour, offered to the environment through an interface. Application and technology services follow the same pattern one layer down; SABSA's security service is the same idea at the Logical layer.", document: ARCHIMATE, section: "8.3", objectives: ["A4.2", "X1.1"], confusable_with: [security_service, archimate_interface], source: authored, status: draft}
- {id: archimate_interface, term: Interface (ArchiMate), definition: "An active structure element: a point of access where a service is made available to the environment, in the business, application or technology layer. The element at which a SABSA inter-domain service crosses a domain boundary.", document: ARCHIMATE, section: "8.2", objectives: ["A4.1", "X3.2"], confusable_with: [archimate_service, trust_relationship], source: authored, status: draft}
- {id: business_object, term: Business Object, definition: "A business-layer passive structure element: a concept used within a business domain, such as a customer, an account or a claim. The element for a TOGAF data entity at the conceptual level; realised by data objects.", document: ARCHIMATE, section: "8.4", objectives: ["A4.3", "X1.1"], confusable_with: [data_object], source: authored, status: draft}
- {id: application_component, term: Application Component, definition: "An application-layer active structure element: an encapsulation of application functionality aligned to the structure of the implementation, modular and replaceable. The element for a TOGAF logical or physical application component.", document: ARCHIMATE, section: "9.2", objectives: ["A5.1", "X1.1"], confusable_with: [node], source: authored, status: draft}
- {id: data_object, term: Data Object, definition: "An application-layer passive structure element: data structured for automated processing, realising a business object and realised by an artifact. The element for a TOGAF logical data component.", document: ARCHIMATE, section: "9.4", objectives: ["A5.3", "X1.1"], confusable_with: [business_object, archimate_artifact], source: authored, status: draft}
- {id: node, term: Node, definition: "A technology-layer active structure element: a computational or physical resource that hosts, manipulates or interacts with other computational or physical resources. Composed of devices and system software; the element for a TOGAF technology component.", document: ARCHIMATE, section: "10.2", objectives: ["A6.1", "X1.1"], confusable_with: [application_component], source: authored, status: draft}
- {id: archimate_artifact, term: Artifact (ArchiMate), definition: "A technology-layer passive structure element: a piece of data used or produced in software development or deployment, such as a file, a database or a deployable. Not a TOGAF artifact, which is a catalog, matrix or diagram.", document: ARCHIMATE, section: "10.4", objectives: ["A6.3", "X1.1"], confusable_with: [artifact, data_object], source: authored, status: draft}
- {id: plateau, term: Plateau, definition: "An implementation and migration element: a relatively stable state of the architecture that exists during a limited period. Baseline, transition and target architectures are plateaus; gaps sit between them.", document: ARCHIMATE, section: "12.2", objectives: ["A8.1", "X1.1"], confusable_with: [transition_architecture, archimate_gap], source: authored, status: draft}
- {id: archimate_gap, term: Gap (ArchiMate), definition: "An implementation and migration element: a statement of difference between two plateaus, associated with the elements that differ. The output of TOGAF gap analysis drawn as an element; SABSA speaks of a control gap.", document: ARCHIMATE, section: "12.2", objectives: ["A8.1", "X1.1"], confusable_with: [gap_analysis, plateau], source: authored, status: draft}
- {id: archimate_work_package, term: Work Package (ArchiMate), definition: "An implementation and migration element: a series of actions identified and designed to achieve specific results within specified time and resource constraints. A TOGAF work package drawn as an element, realising deliverables.", document: ARCHIMATE, section: "12.2", objectives: ["A8.1", "X1.1"], confusable_with: [work_package, archimate_deliverable], source: authored, status: draft}
- {id: archimate_deliverable, term: Deliverable (ArchiMate), definition: "An implementation and migration element: a precisely defined result of a work package, which may realise architecture elements. Distinct from the TOGAF deliverable, a formally signed-off work product.", document: ARCHIMATE, section: "12.2", objectives: ["A8.1", "X1.1"], confusable_with: [deliverable, archimate_work_package], source: authored, status: draft}
- {id: grouping, term: Grouping, definition: "A composite element that aggregates or composes concepts that belong together on some common characteristic. A real element with relationships, not a visual box; the element for a SABSA security domain.", document: ARCHIMATE, section: "4.5", objectives: ["A8.2", "X3.2"], confusable_with: [location, security_domain], source: authored, status: draft}
- {id: location, term: Location, definition: "A composite element: a place or position where structure elements can be located or behaviour can be performed. Aggregates what is sited there; the element for a physical or geographic SABSA domain.", document: ARCHIMATE, section: "4.5", objectives: ["A8.2", "X3.2"], confusable_with: [grouping, security_domain], source: authored, status: draft}
- {id: archimate_view, term: View (ArchiMate), definition: "A representation of a system from the perspective of a related set of concerns, in the ISO 42010 sense; a selection of model elements drawn for one audience. Removing an element from a view does not remove it from the model.", document: ARCHIMATE, section: "13.3", objectives: ["A9.1", "X1.2"], confusable_with: [view, archimate_viewpoint], source: authored, status: draft}
- {id: archimate_viewpoint, term: Viewpoint (ArchiMate), definition: "A specification of the conventions for a view: its stakeholders, concerns, purpose, abstraction level and permitted element types. Defined through the viewpoint mechanism; TOGAF uses the same ISO sense, and a SABSA Matrix cell plays the same role.", document: ARCHIMATE, section: "13.4", objectives: ["A9.1", "X1.1"], confusable_with: [viewpoint, archimate_view, sabsa_matrix], source: authored, status: draft}
- {id: composition, term: Composition, definition: "A structural relationship: an element consists of one or more other elements, which belong to it exclusively. Drawn with a filled diamond; the strongest whole-part relationship.", document: ARCHIMATE, section: "5.1", objectives: ["A7.1"], confusable_with: [aggregation], source: authored, status: draft}
- {id: aggregation, term: Aggregation, definition: "A structural relationship: an element combines one or more other elements, which may also belong to other aggregates. Drawn with an open diamond; how a grouping or location holds its members.", document: ARCHIMATE, section: "5.1", objectives: ["A7.1"], confusable_with: [composition, specialization], source: authored, status: draft}
- {id: assignment, term: Assignment, definition: "A structural relationship: the allocation of responsibility, performance of behaviour, storage or execution, such as an actor assigned to a role or system software assigned to a node.", document: ARCHIMATE, section: "5.1", objectives: ["A7.1"], confusable_with: [realization], source: authored, status: draft}
- {id: realization, term: Realization, definition: "A structural relationship: an element plays a critical role in the creation, achievement, sustenance or operation of a more abstract element, such as a process realising a service or a core element realising a requirement.", document: ARCHIMATE, section: "5.1", objectives: ["A7.1", "X3.1"], confusable_with: [assignment, serving], source: authored, status: draft}
- {id: serving, term: Serving, definition: "A dependency relationship: an element provides its functionality to another element. Say serving for provides-functionality-to and flow for information-passes; the direction of serving is the direction of SABSA trust.", document: ARCHIMATE, section: "5.2", objectives: ["A7.2", "X1.2"], confusable_with: [flow, realization, trust_relationship], source: authored, status: draft}
- {id: access, term: Access, definition: "A dependency relationship: the ability of behaviour and active structure elements to observe or act upon passive structure elements, qualified as read, write or both. Never drawn between two active elements.", document: ARCHIMATE, section: "5.2", objectives: ["A7.2", "A5.3"], confusable_with: [flow], source: authored, status: draft}
- {id: influence, term: Influence, definition: "A dependency relationship: an element affects the implementation or achievement of a motivation element, with an optional sign or strength. How a risk lowers a goal and a control lowers a risk.", document: ARCHIMATE, section: "5.2", objectives: ["A7.2", "X3.1"], confusable_with: [association], source: authored, status: draft}
- {id: association, term: Association, definition: "The weakest relationship: an unspecified relationship, used when nothing more precise applies. Drawing it because you are unsure leaves the model unfinished.", document: ARCHIMATE, section: "5.4", objectives: ["A7.2"], confusable_with: [influence], source: authored, status: draft}
- {id: triggering, term: Triggering, definition: "A dynamic relationship: a temporal or causal relationship between elements, such as one process step starting the next or a threat event triggering a loss event.", document: ARCHIMATE, section: "5.3", objectives: ["A7.3"], confusable_with: [flow, junction], source: authored, status: draft}
- {id: flow, term: Flow, definition: "A dynamic relationship: the transfer of information, goods or money from one element to another, labelled with what flows. Not serving, which says who provides functionality to whom.", document: ARCHIMATE, section: "5.3", objectives: ["A7.3", "X1.2"], confusable_with: [serving, triggering, access], source: authored, status: draft}
- {id: specialization, term: Specialization, definition: "A relationship stating that an element is a particular kind of another element. Also the language customisation mechanism by which W172 defines risk, vulnerability and threat agent as stereotyped elements.", document: ARCHIMATE, section: "5.4", objectives: ["A7.3", "A1.4", "X3.1"], confusable_with: [aggregation], source: authored, status: draft}
- {id: junction, term: Junction, definition: "A relationship connector used to combine several relationships of the same type, as an and-junction or an or-junction; the decision point in a process flow.", document: ARCHIMATE, section: "5.5", objectives: ["A7.3"], confusable_with: [triggering], source: authored, status: draft}
- {id: derivation, term: Derivation, definition: "The rules by which a relationship between two elements may be inferred from a chain of relationships through intermediate elements; the reason transitive trust is visible in a model even when nobody drew it.", document: ARCHIMATE, section: "5.7", objectives: ["A7.4", "X3.2"], confusable_with: [trust_relationship], source: authored, status: draft}
# ---------------------------------------------------------------- SABSA (document SABSA; section numbers refer to the White Paper and are to be verified against the registered PDF)
- {id: sabsa_matrix, term: SABSA Matrix, definition: "The six-layer by six-column grid at the centre of SABSA: Contextual, Conceptual, Logical, Physical, Component and Service Management layers against Assets, Motivation, Process, People, Location and Time. Each row is a view for one reader; each cell a viewpoint and a completeness check.", document: SABSA, section: "3", objectives: ["S1.2", "S7.3", "X2.1"], confusable_with: [view, archimate_viewpoint], source: authored, status: draft}
- {id: contextual_layer, term: Contextual Layer, definition: "The top layer of the SABSA Matrix: the business view. Business assets and decisions, business risk and opportunity, processes, governance and relationships, geography and time dependence.", document: SABSA, section: "3.1", objectives: ["S2.1"], confusable_with: [conceptual_layer], source: authored, status: draft}
- {id: conceptual_layer, term: Conceptual Layer, definition: "The second SABSA layer: the architect's view. The Business Attributes Profile, risk-management and control objectives, process-assurance strategies, roles and the trust framework, the domain framework and the through-life risk framework.", document: SABSA, section: "3.2", objectives: ["S2.2", "S3.1"], confusable_with: [contextual_layer, logical_layer], source: authored, status: draft}
- {id: logical_layer, term: Logical Layer, definition: "The third SABSA layer: the designer's view. Information assets, policies, security services and information flows, entities and trust relationships, domain definitions, and the calendar of lifetimes and deadlines.", document: SABSA, section: "3.3", objectives: ["S4.1"], confusable_with: [conceptual_layer, physical_layer], source: authored, status: draft}
- {id: physical_layer, term: Physical Layer, definition: "The fourth SABSA layer: the builder's view. Data structures and storage, rules and procedures, security mechanisms, the human interface and access-control systems, platforms and networks, and control-structure execution timing. Not hardware only.", document: SABSA, section: "3.4", objectives: ["S5.1"], confusable_with: [logical_layer, component_layer], source: authored, status: draft}
- {id: component_layer, term: Component Layer, definition: "The fifth SABSA layer: the tradesman's view. Products, tools and standards, identities and access-control lists, nodes and addresses, clocks and timers. The layer at which a purchase order could be written; the counterpart of a TOGAF Solution Building Block.", document: SABSA, section: "3.5", objectives: ["S5.2", "S5.3"], confusable_with: [physical_layer, sbb, security_mechanism], source: authored, status: draft}
- {id: service_management_layer, term: Service Management Layer, definition: "The sixth SABSA layer, formerly the Operational layer: the facilities manager's view, running across all other layers. Operations, incident and change, operational risk management, assurance and audit; where the Manage and Measure phase is performed.", document: SABSA, section: "3.6", objectives: ["S6.2", "S6.3"], confusable_with: [architecture_governance, sabsa_lifecycle], source: authored, status: draft}
- {id: business_attribute, term: Business Attribute, definition: "A business-language property the architecture must deliver, such as Available, Confidential, Auditable or Recoverable, each with a metric type, a measurement approach and a performance target. SABSA's form of a security requirement.", document: SABSA, section: "5", objectives: ["S3.1", "S3.2", "X2.1"], confusable_with: [archimate_requirement, business_attributes_profile, architecture_requirements_repository], source: authored, status: draft}
- {id: business_attributes_profile, term: Business Attributes Profile, definition: "The selection of business attributes for one engagement, with their targets, produced in Strategy and Planning at the Conceptual layer. W117 places it as the security requirements of Phase A and Requirements Management.", document: SABSA, section: "5", objectives: ["S3.1", "S7.1", "X2.1"], confusable_with: [business_attribute, architecture_requirements_repository], source: authored, status: draft}
- {id: security_domain, term: Security Domain, definition: "A set of elements subject to a common security policy under one policy authority. Domains nest into sub-domains and stack into multi-tiered domains; drawn in ArchiMate as a Grouping or a Location. Not a TOGAF architecture domain.", document: SABSA, section: "8", objectives: ["S4.2", "X3.2"], confusable_with: [architecture_domain, grouping, location, policy_authority], source: authored, status: draft}
- {id: policy_authority, term: Policy Authority, definition: "The role accountable for the security policy of a domain and for deciding what the domain trusts. Modelled in ArchiMate as a Business Role with an actor assigned to it.", document: SABSA, section: "8", objectives: ["S4.2", "X3.2"], confusable_with: [security_domain, business_role], source: authored, status: draft}
- {id: trust_relationship, term: Trust Relationship, definition: "A relationship between two domains in which one relies on the other for a service: one-way, two-way or transitive, carried by an inter-domain service across an interface. Drawn as Serving between an interface and a role.", document: SABSA, section: "8", objectives: ["S4.3", "X3.2"], confusable_with: [archimate_interface, derivation, serving], source: authored, status: draft}
- {id: two_sided_risk, term: Two-Sided Risk, definition: "SABSA's view that risk includes both threat (a push below an attribute's target) and opportunity (a push above it). Modelled in ArchiMate as Assessments with negative or positive influence on goals.", document: SABSA, section: "7", objectives: ["S3.3", "X2.2", "X3.1"], confusable_with: [assessment, control_types], source: authored, status: draft}
- {id: control_types, term: Control Types, definition: "The five kinds of control in the SABSA risk model: enhance (opportunity), protect, detect, recover and correct (threat). What a control does, as opposed to G152's mitigation strategies, which are decisions about what to do with a risk.", document: SABSA, section: "7", objectives: ["S3.3", "X2.2"], confusable_with: [two_sided_risk], source: authored, status: draft}
- {id: sabsa_lifecycle, term: SABSA Lifecycle, definition: "The four-phase loop Strategy and Planning, Design, Implement, Manage and Measure, with attribute metrics feeding back into strategy. Design covers the Logical, Physical, Component and Service Management layers.", document: SABSA, section: "4", objectives: ["S1.3", "S6.1", "S6.3"], confusable_with: [service_management_layer, adm], source: authored, status: draft}
- {id: traceability, term: Traceability (SABSA), definition: "Two-way linkage across the Matrix layers: top-down, every control justified by a business attribute and driver; bottom-up, every attribute delivered by a service, mechanism, component and operational measurement.", document: SABSA, section: "6", objectives: ["S7.1"], confusable_with: [assurance_framework], source: authored, status: draft}
- {id: assurance_framework, term: Assurance Framework, definition: "The activities that produce evidence that traceability holds: the design is complete, was built as designed, performs against the attribute targets and continues to. Owned by the operators, independently examined by audit; TOGAF compliance reviews are one of its evidence kinds.", document: SABSA, section: "6", objectives: ["S7.2"], confusable_with: [traceability, architecture_compliance], source: authored, status: draft}
- {id: security_service, term: Security Service, definition: "A Logical-layer capability described by what it does for the business, independent of technology, such as access control or confidentiality in storage. Delivered by mechanisms; the TOGAF risk and security guide treats it as an ABB in the Security Services Catalog.", document: SABSA, section: "3.3", objectives: ["S4.1", "S5.3"], confusable_with: [archimate_service, abb, security_mechanism], source: authored, status: draft}
- {id: security_mechanism, term: Security Mechanism, definition: "A Physical-layer means by which a security service is delivered: a technique, data structure, procedure or timing rule, technology-specific but vendor-neutral. Realised by components; the counterpart of a TOGAF ABB specification on its way to an SBB.", document: SABSA, section: "3.4", objectives: ["S5.1", "S5.3"], confusable_with: [security_service, sbb, component_layer], source: authored, status: draft}
