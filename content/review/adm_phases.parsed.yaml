- code: B
  name: 'Phase B: Business Architecture'
  objective:
  - Develop the Target Business Architecture that describes how the enterprise needs to operate to achieve the business
    goals, and respond to the strategic drivers set out in the Architecture Vision, in a way that addresses the
    Statement of Architecture Work and stakeholder concerns
  - Identify candidate Architecture Roadmap components based upon gaps between the Baseline and Target Business
    Architectures
  approach: Business Architecture is a representation of holistic, multi-dimensional business views of capabilities,
    end-to-end value delivery, information, and organizational structure; and the relationships among these business
    views and strategies, products, policies, initiatives, and stakeholders. Business Architecture relates business
    elements to business goals and elements of other domains.
  inputs: []
  steps:
