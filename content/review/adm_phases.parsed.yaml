- code: E
  name: 'Phase E: Opportunities & Solutions'
  objective:
  - Generate the initial complete version of the Architecture Roadmap, based upon the gap analysis and candidate
    Architecture Roadmap components from Phases B, C, and D
  - Determine whether an incremental approach is required, and if so identify Transition Architectures that will
    deliver continuous business value
  - Define the overall Solution Building Blocks (SBBs) to finalize the Target Architecture based on the ABBs
  approach: 'Phase E concentrates on how to deliver the architecture. It takes into account the complete set of
    gaps between the Target and Baseline Architectures in all architecture domains, and logically groups changes
    into work packages within the enterprise’s portfolios. This is an effort to build a best-fit roadmap that is
    based upon the stakeholder requirements, the enterprise’s business transformation readiness, identified opportunities
    and solutions, and identified implementation constraints. The key is to focus on the final target while realizing
    incremental business value. Phase E is the initial step in the creation of the Implementation and Migration
    Plan which is completed in Phase F. It provides the basis of a well considered Implementation and Migration
    Plan that is integrated into the enterprise’s portfolio in Phase F. The following four concepts are key to transitioning
    from developing to delivering a Target Architecture: - Architecture Roadmap - Work Packages - Transition Architectures
    - Implementation and Migration Plan The Architecture Roadmap lists individual work packages in a timeline that
    will realize the Target Architecture. Each work package identifies a logical group of changes necessary to realize
    the Target Architecture. A Transition Architecture describes the enterprise at an architecturally significant
    state between the Baseline and Target Architectures. Transition Architectures provide interim Target Architectures
    upon which the organization can converge. The Implementation and Migration Plan provides a schedule of the projects
    that will realize the Target Architecture. ← Previous: Phase D: Technology Architecture | ↑ Up: TOGAF® Standard
    — Architecture Development Method | ⌂ Home: TOGAF® Standard — Architecture Development Method | Next: Phase
    F: Migration Planning → © The Open Group, All Rights Reserved. Last updated 2025-06-02 17:38:10 +0100'
