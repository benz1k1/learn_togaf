- code: C
  name: 'Phase C: Information Systems Architectures'
  objective:
  - Develop the Target Information Systems Architectures, describing how the enterprise’s Information Systems Architecture
    will enable the Business Architecture and the Architecture Vision, in a way that addresses the Statement of
    Architecture Work and stakeholder concerns
  - Identify candidate Architecture Roadmap components based upon gaps between the Baseline and Target Information
    Systems (Data and Application) Architectures
  approach: 'Phase C involves some combination of Data and Application Architecture, in either order. Advocates
    exist for both sequences. For example, Steven Spewak’s Enterprise Architecture Planning (EAP) recommends a data-driven
    approach. On the other hand, major applications systems — such as those for Enterprise Resource Planning (ERP),
    Customer Relationship Management (CRM), etc. — often provide a combination of technology infrastructure and
    business application logic. Some organizations take an application-driven approach, whereby they recognize certain
    key applications as forming the core underpinning of the mission-critical business processes, and take the implementation
    and integration of those core applications as the primary focus of their architecture effort (the integration
    issues often constituting a major challenge). Detailed descriptions for Phase C are given separately for each
    architecture domain: - Phase C: Information Systems Architectures — Data Architecture; see Chapter 6, Phase
    C: Information Systems Architectures — Data Architecture - Phase C: Information Systems Architectures — Application
    Architecture; see Chapter 7, Phase C: Information Systems Architectures — Application Architecture ← Previous:
    Phase B: Business Architecture | ↑ Up: TOGAF® Standard — Architecture Development Method | ⌂ Home: TOGAF® Standard
    — Architecture Development Method | Next: Phase C: Information Systems Architectures — Data Architecture → ©
    The Open Group, All Rights Reserved. Last updated 2025-06-02 17:38:10 +0100'
