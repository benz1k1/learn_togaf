- code: F
  name: 'Phase F: Migration Planning'
  objective:
  - Finalize the Architecture Roadmap and the supporting Implementation and Migration Plan
  - Ensure that the Implementation and Migration Plan is co-ordinated with the enterprise’s approach to managing
    and implementing change in the enterprise’s overall change portfolio
  - Ensure that the business value and cost of work packages and Transition Architectures is understood by key stakeholders
  approach: 'The focus of Phase F is the creation of an Implementation and Migration Plan in co-operation with the
    project and portfolio managers. Phase E provides an incomplete Architecture Roadmap and Implementation and Migration
    Plan that address the Statement of Architecture Work. In Phase F this Roadmap and the Implementation and Migration
    Plan are integrated with the enterprise’s other change activity. Activities include assessing the dependencies,
    costs, and benefits of the various migration projects within the context of the enterprise’s other activity.
    The Draft Architecture Roadmap, and Draft Implementation and Migration Plan, from Phase E will form the basis
    of the final Implementation and Migration Plan that will include portfolio and project-level detail. The architecture
    development cycle should then be completed and lessons learned documented to enable continuous process improvement.
    ← Previous: Phase E: Opportunities & Solutions | ↑ Up: TOGAF® Standard — Architecture Development Method | ⌂
    Home: TOGAF® Standard — Architecture Development Method | Next: Phase G: Implementation Governance → © The Open
    Group, All Rights Reserved. Last updated 2025-06-02 17:38:10 +0100'
  inputs: []
