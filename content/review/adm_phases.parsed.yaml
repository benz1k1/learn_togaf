  - Develop Target Business Architecture Description; see Section 4.3.3, “Develop Target Business Architecture Description”
  - Perform gap analysis; see Section 4.3.4, “Perform Gap Analysis”
  - Define candidate roadmap components; see Section 4.3.5, “Define Candidate Roadmap Components”
  - Resolve impacts across the Architecture Landscape; see Section 4.3.6, “Resolve Impacts Across the Architecture
    Landscape”
  - Conduct formal stakeholder review; see Section 4.3.7, “Conduct Formal Stakeholder Review”
  - Finalize the Business Architecture; see Section 4.3.8, “Finalize the Business Architecture”
  - Create/Update the Architecture Definition Document; see Section 4.3.9, “Create/Update the Architecture Definition
    Document”
  outputs:
