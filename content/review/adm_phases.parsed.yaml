- code: G
  name: 'Phase G: Implementation Governance'
  objective:
  - Ensure conformance with the Target Architecture by implementation projects
  - Perform appropriate Architecture Governance functions for the solution and any implementation-driven architecture
    Change Requests
  approach: 'It is here that all the information for successful management of the various implementation projects
    is brought together. Note that, in parallel with Phase G, there is the execution of an organizational-specific
    development process, where the actual development happens. To enable early realization of business value and
    benefits, and to minimize the risk in the transformation and migration program, the favored approach is to deploy
    the Target Architecture as a series of transitions. Each transition represents an incremental step towards the
    target, and each delivers business benefit in its own right. Therefore, the overall approach in Phase G is to:
    - Establish an implementation program that will enable the delivery of the Transition Architectures agreed for
    implementation during the Migration Planning phase - Adopt a phased deployment schedule that reflects the business
    priorities embodied in the Architecture Roadmap - Follow the organization’s standard for corporate, IT, and
    Architecture Governance - Use the organization’s established portfolio/program management approach, where this
    exists - Define an operations framework to ensure the effective long life of the deployed solution Phase G establishes
    the connection between architecture and implementation organization, through the Architecture Contract. Project
    details are developed, including: - Name, description, and objectives - Scope, deliverables, and constraints
    - Measures of effectiveness - Acceptance criteria - Risks and issues Implementation governance is closely allied
    to overall Architecture Governance, which is discussed in the TOGAF Standard — EA Capability and Governance
    . A key aspect of Phase G is ensuring compliance with the defined architecture(s), not only by the implementation
    projects, but also by other ongoing projects within the enterprise. The considerations involved with this are
    explained in detail in the TOGAF Standard — EA Capability and Governance . ← Previous: Phase F: Migration Planning
    | ↑ Up: TOGAF® Standard — Architecture Development Method | ⌂ Home: TOGAF® Standard — Architecture Development
    Method | Next: Phase H: Architecture Change Management → © The Open Group, All Rights Reserved. Last updated
    2025-06-02 17:38:10 +0100'
  inputs: []
