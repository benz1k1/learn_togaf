- code: H
  name: 'Phase H: Architecture Change Management'
  objective:
  - Ensure that the architecture development cycle is maintained
  - Ensure that the Architecture Governance Framework is executed
  - Ensure that the Enterprise Architecture Capability meets current requirements
  approach: 'The goal of an architecture change management process is to ensure that the architecture achieves its
    original target business value. This includes managing changes to the architecture in a cohesive and architected
    way. This process will typically provide for the continual monitoring of such things as governance requests,
    new developments in technology, and changes in the business environment. When changes are identified, change
    management will determine whether to formally initiate a new architecture evolution cycle. Additionally, the
    architecture change management process aims to establish and support the implemented Enterprise Architecture
    as a dynamic architecture; that is, one having the flexibility to evolve rapidly in response to changes in the
    technology and business environment. Monitoring business growth and decline is a critical aspect of this phase.
    Usage of the Enterprise Architecture is the most important part of the architecture development cycle. All too
    often the business has been left with an Enterprise Architecture that works for the organization of yesterday
    but may not give back sufficient capability to meet the needs of the enterprise of today and tomorrow. In many
    cases the architecture continues to fit, but the solutions underlying them may not, and some changes are required.
    The Enterprise Architect needs to be aware of these change requirements and considers this an essential part
    of constant renewal of the architecture. Capacity measurement and recommendations for planning are a key aspect
    of this phase. While the architecture has been built to deliver a steady state Business Architecture with agreed
    capacity during the lifecycle of this Enterprise Architecture, the growth or decline in usage needs to be continually
    assessed to ensure that maximum business value is achieved. For example, some Solution Architectures may not
    lend themselves to be scalable by a large factor — say 10 — or alternative solutions may be more economic when
    scaled up. While the architecture specifications may not change, the solutions or their operational context
    may change. If the performance management and reporting has been built into the work products through previous
    phases, then this phase is about ensuring the effectiveness of these. If there needs to be additional monitoring
    or reporting, then this phase will handle the changes. The value and change management process, once established,
    will determine: - The circumstances under which the Enterprise Architecture, or parts of it, will be permitted
    to change after deployment, and the process by which that will happen - The circumstances under which the architecture
    development cycle will be initiated again to develop a new architecture The architecture change management process
    is very closely related to the Architecture Governance processes of the enterprise, and to the management of
    the Architecture Contract (see the TOGAF Standard — EA Capability and Governance ) between the architecture
    function and the business users of the enterprise. In Phase H it is critical that the governance body establish
    criteria to judge whether a Change Request warrants just an architecture update or whether it warrants starting
    a new cycle of the ADM. It is especially important to avoid “creeping elegance”, and the governance body must
    continue to look for changes that relate directly to business value. An Architecture Compliance report should
    state whether the change is compliant to the current architecture. If it is non-compliant, an exemption may
    be granted with valid rationale. If the change has high impact on the architecture, then a strategy to manage
    its impact should be defined. Guidelines for establishing these criteria are difficult to prescribe, as many
    companies accept risk differently, but as the ADM is exercised, the maturity level of the governance body will
    improve, and criteria will become clear for specific needs.'
