- code: PRELIM
  name: Preliminary Phase
  objective:
  - 'Determine the Architecture Capability desired by the organization: Review the organizational context for conducting
    Enterprise Architecture Identify and scope the elements of the enterprise organizations affected by the Architecture
    Capability Identify the established frameworks, methods, and processes that intersect with the Architecture
    Capability Establish Capability Maturity target'
  - 'Establish the Architecture Capability: Define and establish the Organizational Model for Enterprise Architecture
    Define and establish the detailed process and resources for Architecture Governance Select and implement tools
    that support the Architecture Capability Define the Architecture Principles'
  approach: 'This Preliminary Phase is about defining “where, what, why, who, and how we do architecture” in the
    enterprise concerned. The main aspects are as follows: - Defining the enterprise - Identifying key drivers and
    elements in the organizational context - Defining the requirements for architecture work - Defining the Architecture
    Principles that will inform any architecture work - Defining the framework to be used - Defining the relationships
    between management frameworks - Evaluating the Enterprise Architecture maturity The Enterprise Architecture
    provides a strategic, top-down view of an organization to enable executives, planners, architects, and engineers
    to coherently co-ordinate, integrate, and conduct their activities. The Enterprise Architecture framework provides
    the strategic context within which this team can operate. Therefore, developing the Enterprise Architecture
    is not a solitary activity and Enterprise Architects need to recognize the interoperability between their frameworks
    and the rest of the business. Strategic, interim, and tactical business objectives and aspirations need to be
    met. Similarly, the Enterprise Architecture needs to reflect this requirement and allow for operation of architecture
    discipline at different levels within the organization. Depending on the scale of the enterprise and the level
    of budgetary commitment to Enterprise Architecture discipline, a number of approaches may be adopted to sub-divide
    or partition architecture teams, processes, and deliverables. Approaches for architecture partitioning are discussed
    in the TOGAF Standard — Architecture Content . The Preliminary Phase should be used to determine the desired
    approach to partitioning and to establish the groundwork for the selected approach to be put into practice.
    The Preliminary Phase may be revisited, from the Architecture Vision phase (see the TOGAF Standard — Applying
    the ADM ), in order to ensure that the organization’s Architecture Capability is suitable to address a specific
    architecture problem. The Preliminary Phase is about creating an architecture for the Enterprise Architecture
    Capability in an organization. As such, the same best practices employed in developing any architecture should
    be used here. Refer to the TOGAF Standard — EA Capability and Governance for an explanation about the application
    of the TOGAF ADM to establish the Enterprise Architecture Capability. Further guidance on how to construct an
    Enterprise Architecture Capability may be found in the following document: TOGAF ® Series Guide: The TOGAF Leader’s
    Guide to Establishing and Evolving an EA Capability .'
