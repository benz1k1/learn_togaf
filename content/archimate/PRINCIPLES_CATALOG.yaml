  - {id: g_mobile, type: goal, name: "Grow mobile adoption", col: 2, row: 0}
  - {id: g_fraud, type: goal, name: "Reduce fraud losses", col: 3, row: 0}
  - {id: p1, type: principle, name: "PR-01 Data is an asset", col: 0, row: 1}
  - {id: p2, type: principle, name: "PR-02 One customer record", col: 1, row: 1}
  - {id: p3, type: principle, name: "PR-03 Buy before build", col: 2, row: 1}
  - {id: p5, type: principle, name: "PR-05 Channel independence", col: 3, row: 1}
  - {id: p4, type: principle, name: "PR-04 Security by design", col: 4, row: 1}
  - {id: r1, type: requirement, name: "Every data entity has a steward", col: 0, row: 2}
