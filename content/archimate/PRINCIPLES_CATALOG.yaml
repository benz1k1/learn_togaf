# Principles Catalog (PRELIM) drawn as an ArchiMate Motivation view: each principle realizes the
# goal it serves and is realized by the requirement its implication becomes (ARCHIMATE §6.4).
id: PRINCIPLES_CATALOG
title: "Northgate Bank — Principles Catalog as a Motivation view"
