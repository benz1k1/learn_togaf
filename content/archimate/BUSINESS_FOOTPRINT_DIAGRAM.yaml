  - {id: s_open, type: business_service, name: "Open account", col: 0, row: 1}
  - {id: s_transfer, type: business_service, name: "Transfer funds", col: 2, row: 1}
  - {id: f_onboard, type: business_function, name: "Onboarding", col: 0, row: 2}
