# Business Footprint Diagram (Phase B) as a Layered view: one goal, the services that realize it, the
# functions that realize the services, the unit assigned to them, and the application components
# serving them (ARCHIMATE §C.1).
id: BUSINESS_FOOTPRINT_DIAGRAM
title: "Northgate Bank — Business Footprint Diagram as a Layered view"
viewpoint: Layered
elements:
