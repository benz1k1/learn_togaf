  - {id: f_pay, type: business_function, name: "Payments", col: 2, row: 2}
  - {id: app, type: application_component, name: "Mobile App", col: 0, row: 3}
  - {id: core, type: application_component, name: "Core Banking", col: 1, row: 3}
  - {id: switch, type: application_component, name: "Card Switch", col: 2, row: 3}
relations:
