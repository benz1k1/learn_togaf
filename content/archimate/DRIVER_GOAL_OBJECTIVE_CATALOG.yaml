  - {from: d2, to: g2, type: influence, label: "+"}
  - {from: d3, to: g3, type: influence, label: "+"}
  - {from: d4, to: g4, type: influence, label: "+"}
  - {from: d5, to: g5, type: influence, label: "+"}
  - {from: o1, to: g1, type: realization}
  - {from: o2, to: g2, type: realization}
  - {from: o3, to: g3, type: realization}
  - {from: o4, to: g4, type: realization}
  - {from: o5, to: g5, type: realization}
notes:
  - {text: "One catalog row per line. The measure (mobile share of transfers, fraud loss per 1,000 cards, minutes per onboarding, reports with rework, median decision time) is a property of the Outcome; the owning unit (Retail Banking, Cards Operations, Finance, Lending) is a Business Actor in the Organization view, not here.", col: 3, row: 0, w: 2, h: 2}
