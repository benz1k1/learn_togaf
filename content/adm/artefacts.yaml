# Catalogs, matrices and diagrams by phase (learn_togaf.md §2). Authored starter, status draft.
# `archimate:` says how each artefact is expressed in the ArchiMate language (the specification's TOGAF appendix D.1 and
# The Open Group W14C harmonization): the viewpoint that carries it, the elements and relationships it is drawn with.
# A view drawn for Northgate Bank in the notation lives at pages/static/archimate/<CODE>.svg (from content/archimate/<CODE>.yaml).
- {code: PRINCIPLES_CATALOG, name: Principles Catalog, kind: CATALOG, phase: PRELIM, domain: CROSS, purpose: Captures the architecture principles, refs: ["CONTENT §3.6.2", "CONTENT §3.6.1"], archimate: {viewpoint: "Motivation", elements: [Principle, Goal, Requirement], relationships: [realization, influence], ref: "ARCHIMATE §6.4", note: "Each principle is a Principle element realizing the goal it serves; its implications become Requirements."}}
- {code: STAKEHOLDER_MAP_MATRIX, name: Stakeholder Map Matrix, kind: MATRIX, phase: A, domain: CROSS, purpose: Stakeholders, their concerns, class and the artefacts they need, refs: ["CONTENT §3.6.3", "CONTENT §3.6.1"], archimate: {viewpoint: "Stakeholder", elements: [Stakeholder, Driver, Assessment, Goal], relationships: [association, influence], ref: "ARCHIMATE §C.2", note: "Rows of the matrix become Stakeholder elements associated with the Drivers (concerns) that move them."}}
- {code: VALUE_CHAIN_DIAGRAM, name: Value Chain Diagram, kind: DIAGRAM, phase: A, domain: BUSINESS, purpose: High-level orientation view of the enterprise and how it interacts with the outside world, refs: ["CONTENT §3.6.3", "CONTENT §3.6.1"], archimate: {viewpoint: "Value Stream", elements: [Value Stream, Capability, Business Actor], relationships: [triggering, serving, composition], ref: "ARCHIMATE §7.3", note: "Primary activities are the stages of one Value Stream; support activities are Capabilities that serve them."}}
- {code: SOLUTION_CONCEPT_DIAGRAM, name: Solution Concept Diagram, kind: DIAGRAM, phase: A, domain: CROSS, purpose: High-level orientation of the solution envisaged, refs: ["CONTENT §3.6.3", "CONTENT §3.6.1"], archimate: {viewpoint: "Layered", elements: [Business Service, Application Component, Node, Grouping], relationships: [serving, realization], ref: "ARCHIMATE §C.1", note: "One Grouping per solution area, business services above the components that realize them."}}
- {code: BUSINESS_MODEL_DIAGRAM, name: Business Model Diagram, kind: DIAGRAM, phase: A, domain: BUSINESS, purpose: How the enterprise creates, delivers and captures value, refs: ["CONTENT §3.6.3", "CONTENT §3.6.1"], archimate: {viewpoint: "Strategy", elements: [Value, Resource, Capability, Course of Action, Stakeholder], relationships: [association, realization, influence], ref: "ARCHIMATE §C.3", note: "Value propositions are Value elements; segments are Stakeholders; key resources and activities are Resources and Capabilities."}}
- {code: BUSINESS_CAPABILITY_MAP, name: Business Capability Map, kind: DIAGRAM, phase: A, domain: BUSINESS, purpose: The capabilities the enterprise needs, refs: ["CONTENT §3.6.3", "CONTENT §3.6.1"], archimate: {viewpoint: "Capability Map", elements: [Capability], relationships: [composition, aggregation], ref: "ARCHIMATE §C.3", note: "Levels of the map are nested Capabilities; colour the target-state gaps."}}
- {code: VALUE_STREAM_MAP, name: Value Stream Map, kind: DIAGRAM, phase: A, domain: BUSINESS, purpose: The stages by which value is delivered to a stakeholder, refs: ["CONTENT §3.6.3", "CONTENT §3.6.1"], archimate: {viewpoint: "Value Stream", elements: [Value Stream, Capability, Outcome], relationships: [triggering, serving, realization], ref: "ARCHIMATE §C.3", note: "Stages are Value Streams composed into the whole; enabling Capabilities serve each stage."}}
- {code: ORGANIZATION_ACTOR_CATALOG, name: Organization/Actor Catalog, kind: CATALOG, phase: B, domain: BUSINESS, purpose: Organisation units, actors and locations, refs: ["CONTENT §3.6.4", "CONTENT §3.6.1"], archimate: {viewpoint: "Organization", elements: [Business Actor, Business Role, Location], relationships: [composition, assignment, aggregation], ref: "ARCHIMATE §C.1", note: "Organization units and actors are Business Actors nested by composition; locations aggregate them."}}
- {code: DRIVER_GOAL_OBJECTIVE_CATALOG, name: Driver/Goal/Objective Catalog, kind: CATALOG, phase: B, domain: BUSINESS, purpose: Cross-organisational reference of drivers, goals and objectives, refs: ["CONTENT §3.6.4", "CONTENT §3.6.1"], archimate: {viewpoint: "Goal Realization", elements: [Driver, Goal, Outcome], relationships: [realization, influence], ref: "ARCHIMATE §C.2", note: "Drivers influence Goals; measurable objectives are Outcomes that realize them."}}
- {code: ROLE_CATALOG, name: Role Catalog, kind: CATALOG, phase: B, domain: BUSINESS, purpose: The roles in the enterprise, refs: ["CONTENT §3.6.4", "CONTENT §3.6.1"], archimate: {viewpoint: "Organization", elements: [Business Role, Business Actor], relationships: [assignment], ref: "ARCHIMATE §8.2", note: "Each role is a Business Role; the actors that fill it are assigned to it."}}
- {code: BUSINESS_SERVICE_FUNCTION_CATALOG, name: Business Service/Function Catalog, kind: CATALOG, phase: B, domain: BUSINESS, purpose: Functional decomposition and the services offered, refs: ["CONTENT §3.6.4", "CONTENT §3.6.1"], archimate: {viewpoint: "Business Process Cooperation", elements: [Business Function, Business Service], relationships: [realization, composition], ref: "ARCHIMATE §8.3", note: "Functions decompose by composition and realize the services the catalog lists."}}
- {code: BUSINESS_INTERACTION_MATRIX, name: Business Interaction Matrix, kind: MATRIX, phase: B, domain: BUSINESS, purpose: Interaction relationships between organisations and business functions, refs: ["CONTENT §3.6.4", "CONTENT §3.6.1"], archimate: {viewpoint: "Business Process Cooperation", elements: [Business Actor, Business Function, Business Interaction], relationships: [flow, serving], ref: "ARCHIMATE §C.1", note: "A cell of the matrix is a Flow between two functions, or an Interaction the two actors share."}}
- {code: ACTOR_ROLE_MATRIX, name: Actor/Role Matrix, kind: MATRIX, phase: B, domain: BUSINESS, purpose: Which actors perform which roles, refs: ["CONTENT §3.6.4", "CONTENT §3.6.1"], archimate: {viewpoint: "Organization", elements: [Business Actor, Business Role], relationships: [assignment], ref: "ARCHIMATE §8.2", note: "Every tick in the matrix is one Assignment from an actor to a role."}}
- {code: BUSINESS_FOOTPRINT_DIAGRAM, name: Business Footprint Diagram, kind: DIAGRAM, phase: B, domain: BUSINESS, purpose: Links business goals, organisation units, functions and services to the technical components that deliver them, refs: ["CONTENT §3.6.4", "CONTENT §3.6.1"], archimate: {viewpoint: "Layered", elements: [Goal, Business Actor, Business Function, Business Service, Application Component], relationships: [realization, serving, assignment], ref: "ARCHIMATE §C.1", note: "Goals at the top, the organisation and functions that realize them, the services and components that serve them below."}}
- {code: FUNCTIONAL_DECOMPOSITION_DIAGRAM, name: Functional Decomposition Diagram, kind: DIAGRAM, phase: B, domain: BUSINESS, purpose: The capabilities of an organisation on one page, refs: ["CONTENT §3.6.4", "CONTENT §3.6.1"], archimate: {viewpoint: "Business Process Cooperation", elements: [Business Function], relationships: [composition], ref: "ARCHIMATE §8.3", note: "A tree of Business Functions, each composed of the ones beneath it."}}
- {code: PROCESS_FLOW_DIAGRAM, name: Process Flow Diagram, kind: DIAGRAM, phase: B, domain: BUSINESS, purpose: Sequential flow of controls within a process, refs: ["CONTENT §3.6.4", "CONTENT §3.6.1"], archimate: {viewpoint: "Business Process Cooperation", elements: [Business Process, Business Event, Business Role, Junction], relationships: [triggering, flow, assignment], ref: "ARCHIMATE §8.3", note: "Steps are Business Processes chained by Triggering; swim lanes are the Roles assigned to them; decisions are Junctions."}}
- {code: ORGANIZATION_DECOMPOSITION_DIAGRAM, name: Organization Decomposition Diagram, kind: DIAGRAM, phase: B, domain: BUSINESS, purpose: Links actors, roles and locations in an organisation tree, refs: ["CONTENT §3.6.4", "CONTENT §3.6.1"], archimate: {viewpoint: "Organization", elements: [Business Actor, Business Role, Location], relationships: [composition, aggregation, assignment], ref: "ARCHIMATE §C.1", note: "The org chart is a composition tree of Business Actors; sites are Locations that aggregate them."}}
- {code: DATA_ENTITY_DATA_COMPONENT_CATALOG, name: Data Entity/Data Component Catalog, kind: CATALOG, phase: C, domain: DATA, purpose: The data entities and the components that hold them, refs: ["CONTENT §3.6.5", "CONTENT §3.6.1"], archimate: {viewpoint: "Information Structure", elements: [Business Object, Data Object, Application Component], relationships: [realization, composition], ref: "ARCHIMATE §C.1", note: "Entities are Business Objects, realized by the Data Objects the listed components hold."}}
- {code: DATA_ENTITY_BUSINESS_FUNCTION_MATRIX, name: Data Entity/Business Function Matrix, kind: MATRIX, phase: C, domain: DATA, purpose: Which functions use which data entities, refs: ["CONTENT §3.6.5", "CONTENT §3.6.1"], archimate: {viewpoint: "Information Structure", elements: [Business Object, Business Function], relationships: [access], ref: "ARCHIMATE §8.4", note: "Each cell is an Access relationship (read, write or both) from a function to an entity."}}
- {code: APPLICATION_DATA_MATRIX, name: Application/Data Matrix, kind: MATRIX, phase: C, domain: DATA, purpose: Which applications use which data entities, refs: ["CONTENT §3.6.5", "CONTENT §3.6.1"], archimate: {viewpoint: "Application Usage", elements: [Application Component, Application Function, Data Object], relationships: [access, assignment], ref: "ARCHIMATE §9.4", note: "A cell is an Access from the component's function to the Data Object; the CRUD letter is the access type."}}
- {code: CONCEPTUAL_DATA_DIAGRAM, name: Conceptual Data Diagram, kind: DIAGRAM, phase: C, domain: DATA, purpose: Critical data entities and their relationships, refs: ["CONTENT §3.6.5", "CONTENT §3.6.1"], archimate: {viewpoint: "Information Structure", elements: [Business Object], relationships: [aggregation, composition, specialization, association], ref: "ARCHIMATE §C.1", note: "Entities and their relationships as Business Objects; cardinalities as association labels."}}
- {code: LOGICAL_DATA_DIAGRAM, name: Logical Data Diagram, kind: DIAGRAM, phase: C, domain: DATA, purpose: Logical view of data entities and relationships, refs: ["CONTENT §3.6.5", "CONTENT §3.6.1"], archimate: {viewpoint: "Information Structure", elements: [Data Object, Business Object], relationships: [realization, aggregation, association], ref: "ARCHIMATE §C.1", note: "Logical entities are Data Objects that realize the conceptual Business Objects."}}
- {code: DATA_DISSEMINATION_DIAGRAM, name: Data Dissemination Diagram, kind: DIAGRAM, phase: C, domain: DATA, purpose: Relationship between data entities, business services and application components, refs: ["CONTENT §3.6.5", "CONTENT §3.6.1"], archimate: {viewpoint: "Application Usage", elements: [Business Service, Application Component, Data Object], relationships: [serving, access, realization], ref: "ARCHIMATE §C.1", note: "Which component holds which data for which business service: Access plus Serving."}}
- {code: APPLICATION_PORTFOLIO_CATALOG, name: Application Portfolio Catalog, kind: CATALOG, phase: C, domain: APPLICATION, purpose: All applications in the enterprise, refs: ["CONTENT §3.6.6", "CONTENT §3.6.1"], archimate: {viewpoint: "Application Cooperation", elements: [Application Component, Application Service], relationships: [realization, composition], ref: "ARCHIMATE §C.1", note: "One Application Component per application, with the services it realizes."}}
- {code: INTERFACE_CATALOG, name: Interface Catalog, kind: CATALOG, phase: C, domain: APPLICATION, purpose: Interfaces between applications, refs: ["CONTENT §3.6.6", "CONTENT §3.6.1"], archimate: {viewpoint: "Application Cooperation", elements: [Application Interface, Application Component, Application Service], relationships: [composition, assignment, serving], ref: "ARCHIMATE §9.2", note: "Each interface is an Application Interface composed into its component and assigned to the service it exposes."}}
- {code: APPLICATION_ORGANIZATION_MATRIX, name: Application/Organization Matrix, kind: MATRIX, phase: C, domain: APPLICATION, purpose: Which organisation units use which applications, refs: ["CONTENT §3.6.6", "CONTENT §3.6.1"], archimate: {viewpoint: "Application Usage", elements: [Application Component, Business Actor, Business Role], relationships: [serving], ref: "ARCHIMATE §C.1", note: "A cell is the component (or its service) Serving the organisation unit."}}
- {code: APPLICATION_INTERACTION_MATRIX, name: Application Interaction Matrix, kind: MATRIX, phase: C, domain: APPLICATION, purpose: Communication relationships between applications, refs: ["CONTENT §3.6.6", "CONTENT §3.6.1"], archimate: {viewpoint: "Application Cooperation", elements: [Application Component, Application Interaction], relationships: [flow, serving], ref: "ARCHIMATE §C.1", note: "A cell is a Flow of information between two components."}}
- {code: APPLICATION_COMMUNICATION_DIAGRAM, name: Application Communication Diagram, kind: DIAGRAM, phase: C, domain: APPLICATION, purpose: Models and their communication, refs: ["CONTENT §3.6.6", "CONTENT §3.6.1"], archimate: {viewpoint: "Application Cooperation", elements: [Application Component, Application Interface, Data Object], relationships: [flow, serving, access], ref: "ARCHIMATE §C.1", note: "Components with Flow relationships carrying the Data Objects exchanged; interfaces where the boundary matters."}}
- {code: APPLICATION_USE_CASE_DIAGRAM, name: Application Use-Case Diagram, kind: DIAGRAM, phase: C, domain: APPLICATION, purpose: Relationships between consumers and providers of application services, refs: ["CONTENT §3.6.6", "CONTENT §3.6.1"], archimate: {viewpoint: "Application Usage", elements: [Business Actor, Business Role, Application Service, Application Component], relationships: [serving, realization], ref: "ARCHIMATE §C.1", note: "Use cases become Application Services serving the roles that use them, realized by components."}}
- {code: TECHNOLOGY_STANDARDS_CATALOG, name: Technology Standards Catalog, kind: CATALOG, phase: D, domain: TECHNOLOGY, purpose: Agreed standards for technology, refs: ["CONTENT §3.6.7", "CONTENT §3.6.1"], archimate: {viewpoint: "Technology", elements: [System Software, Technology Service, Artifact], relationships: [realization], ref: "ARCHIMATE §10", note: "Standards are the System Software and Artifacts that realize the technology services the enterprise permits."}}
- {code: TECHNOLOGY_PORTFOLIO_CATALOG, name: Technology Portfolio Catalog, kind: CATALOG, phase: D, domain: TECHNOLOGY, purpose: All technology in use, refs: ["CONTENT §3.6.7", "CONTENT §3.6.1"], archimate: {viewpoint: "Technology", elements: [Node, Device, System Software], relationships: [composition, assignment], ref: "ARCHIMATE §C.1", note: "Platforms are Nodes composed of Devices with System Software assigned to them."}}
- {code: APPLICATION_TECHNOLOGY_MATRIX, name: Application/Technology Matrix, kind: MATRIX, phase: D, domain: TECHNOLOGY, purpose: Mapping of applications to technology platforms, refs: ["CONTENT §3.6.7", "CONTENT §3.6.1"], archimate: {viewpoint: "Technology Usage", elements: [Application Component, Node, Technology Service, Artifact], relationships: [serving, realization], ref: "ARCHIMATE §C.1", note: "A cell is the Node's Technology Service serving the component, or the Artifact that realizes it."}}
- {code: ENVIRONMENTS_LOCATIONS_DIAGRAM, name: Environments and Locations Diagram, kind: DIAGRAM, phase: D, domain: TECHNOLOGY, purpose: Which locations host which applications and environments, refs: ["CONTENT §3.6.7", "CONTENT §3.6.1"], archimate: {viewpoint: "Physical", elements: [Location, Node, Facility, Equipment, Distribution Network], relationships: [aggregation, assignment], ref: "ARCHIMATE §C.1", note: "Sites are Locations (or Facilities) aggregating the Nodes deployed there, per environment."}}
- {code: PLATFORM_DECOMPOSITION_DIAGRAM, name: Platform Decomposition Diagram, kind: DIAGRAM, phase: D, domain: TECHNOLOGY, purpose: The technology platform that supports the architecture, refs: ["CONTENT §3.6.7", "CONTENT §3.6.1"], archimate: {viewpoint: "Technology", elements: [Node, System Software, Technology Service, Technology Function], relationships: [composition, realization, assignment], ref: "ARCHIMATE §C.1", note: "Platform layers are Nodes with System Software assigned, realizing the Technology Services above them."}}
- {code: NETWORKED_COMPUTING_HARDWARE_DIAGRAM, name: Networked Computing/Hardware Diagram, kind: DIAGRAM, phase: D, domain: TECHNOLOGY, purpose: Logical view of hardware and network, refs: ["CONTENT §3.6.7", "CONTENT §3.6.1"], archimate: {viewpoint: "Technology", elements: [Node, Device, Communication Network, Path], relationships: [association, composition], ref: "ARCHIMATE §C.1", note: "Hardware as Devices, links as Communication Networks, logical connections as Paths."}}
- {code: PROJECT_CONTEXT_DIAGRAM, name: Project Context Diagram, kind: DIAGRAM, phase: E, domain: CROSS, purpose: The scope of a work package and its relation to the architecture, refs: ["CONTENT §3.6.8", "CONTENT §3.6.1"], archimate: {viewpoint: "Project", elements: [Work Package, Deliverable, Business Actor, Business Role], relationships: [realization, assignment, triggering], ref: "ARCHIMATE §C.4", note: "The project is a Work Package assigned to its roles, realizing Deliverables that realize architecture elements."}}
- {code: BENEFITS_DIAGRAM, name: Benefits Diagram, kind: DIAGRAM, phase: E, domain: CROSS, purpose: Opportunities identified, classified by benefit, refs: ["CONTENT §3.6.8", "CONTENT §3.6.1"], archimate: {viewpoint: "Outcome Realization", elements: [Outcome, Goal, Work Package, Deliverable], relationships: [realization, influence], ref: "ARCHIMATE §C.2", note: "Benefits are Outcomes that realize Goals; the work packages that deliver them sit below."}}
- {code: REQUIREMENTS_CATALOG, name: Requirements Catalog, kind: CATALOG, phase: REQ, domain: CROSS, purpose: Requirements output from every phase, refs: ["CONTENT §3.6.10", "CONTENT §3.6.1"], archimate: {viewpoint: "Requirements Realization", elements: [Requirement, Constraint, Goal, Business Service], relationships: [realization, influence], ref: "ARCHIMATE §C.2", note: "Each requirement is a Requirement (or Constraint) realized by the core element that satisfies it."}}
