# Authored Practitioner scenarios testing the Series Guide objectives G1.1 to G4.1 (learn_togaf.md §2, §6).
# Each question's unit is the guide unit its objective belongs to.
code: G_BANK_1
exam: OGEA-102
name: "Series Guides 1: Leader's Guide, Practitioners' Approach, Business Scenarios, Business Architecture"
kind: DRILL
source: authored
questions:
  - id: G1-101
    unit: G_LEADERS
    objective: "G1.1"
    lesson: G_LEADERS/01_the_leaders_guide
    scenario: |
      Penrose Media is a broadcasting and streaming group of 8,000 staff formed from three
      companies: a public-service broadcaster with a fifty-year history, a streaming start-up it
      acquired three years ago, and a production company bought last year. Each brought an
      architecture team. The broadcaster's team of nine is IT-centric, reports to the CIO, and is
      respected for its standards and technology roadmaps; it publishes a quarterly "technology
      radar" that the other companies ignore. The streaming team of five sits inside product
      management, reports to the Chief Product Officer, works in two-week cycles and calls itself
      "platform architecture"; it has never produced a document longer than a page. The production
      company's two architects report to its operations director and mostly design studio and
      post-production workflows; they regard the other two teams as "IT people".

      The group Chief Executive has hired you as Group Head of Architecture "to make architecture
      work for the group". Her stated problem is that the three companies cannot launch a combined
      subscription offer — one account, one price, live broadcast plus on-demand plus original
      production — because every attempt stalls in disagreements about platforms, customer data and
      content rights, and the board cannot tell whose advice to take. The last attempt produced
      three incompatible target architectures and a board paper that recommended "further work".
      The CIO believes the answer is to fold the other two teams into his and adopt his standards
      group-wide. The Chief Product Officer says his team will leave if that happens, and that the
      broadcaster's architects "have never shipped anything". The operations director wants to be
      left alone and says production "is not a technology business".

      In your first month you find: three architecture repositories in three tools, none of which
      references the others; three sets of principles, two of which contradict each other on data
      residency for subscriber data; no shared view of the group's capabilities, and three different
      words for "subscriber"; and no agreed measure of what any of the teams contributes. The
      broadcaster's team spends most of its time on infrastructure standards and vendor
      evaluations; the streaming team spends its time in delivery and does the architecture in its
      head; nobody is doing architecture for the combined offer, which is the board's priority and
      has a launch window tied to a sports rights deal in fourteen months. The group finance
      director wants a plan and a budget for the architecture function within eight weeks and has
      asked, pointedly, "what would we lose if none of these teams existed?" The Chief Executive
      has said she does not care where the teams report as long as the offer launches and the
      board gets one answer.

      You have also established what each team is measured on today. The broadcaster's team
      reports the number of standards published and reviews completed. The streaming team reports
      release frequency. The production company's architects report nothing. None of the three has
      ever been asked to provide advice ahead of a board decision; the combined-offer attempts were
      run by the strategy function, which asked each team for "an architecture" after the
      commercial terms had been drafted. The group has a single annual planning cycle in which the
      board approves the following year's programmes in October; it is now March. The sports rights
      deal that fixes the launch window was signed without any architecture input, and its
      technical obligations — concurrent viewers, latency, regional rights enforcement — are not
      yet understood by anyone in the group. The Chief Executive has offered to sponsor whatever
      governance structure you propose, provided the business leaders of the three companies, not
      the architects, own the decisions about the offer.

      You must recommend how the group's architecture capability should be organised, aligned and
      measured, and what it should work on first.
    question: "Refer to the scenario. Based on the Series Guides and the TOGAF Standard, which of the following is the best answer?"
    answers:
      - key: A
        points: 5
        text: >-
          Apply the Leader's Guide. Start from the group's context and the capability's
          purpose: agree with the Chief Executive that the capability's primary purpose is EA to
          support strategy and portfolio for the combined offer, and that the delivery-level
          work the streaming team does is EA to support solution delivery, both legitimate at
          their own depth. Treat the three teams as one EA Capability under one Leader — you —
          with reporting and funding lines left where they are but alignment and execution
          against shared objectives, a shared content framework and repository model, and a
          single reconciled principle set through a governance body in which decision rights
          over the target sit with the business stakeholders. Define success measures from the
          purpose — recommendations accepted by the board on the combined offer, risks
          identified, benefits tracked — so that the finance director's question has an answer.
          Produce a multi-year EA Capability roadmap with a project manager, sequencing the
          combined-offer architecture first and the tooling and standards consolidation behind
          it, and validate the charter with the sponsors each planning cycle.
        why: >-
          The guide's central rule is that context and objectives must be explicit and that
          purpose shapes the organisation model, governance, content and process
          (GUIDE:togaf-leaders-guide §5); where there are multiple EA teams "there is one EA
          Capability and there should be one Leader", with reporting and funding separable
          from alignment and execution (§9.2); measures derive from purpose and answer what the
          enterprise would do if the capability did not exist (§5.4); decision rights belong to
          stakeholders (§6.2); and the roadmap is a multi-year plan needing a project manager
          (§11.1). Teams delivering transformations are more successful than standards-focused
          ones (§12.3).
      - key: B
        points: 3
        text: >-
          Establish one EA Capability under one Leader with the three teams aligned to shared
          objectives and a reconciled principle set, and define measures derived from the
          purpose. Then, because consistency is the immediate problem, spend the first year
          consolidating the three repositories into one tool, merging the standards catalogues
          and documenting a group capability map, before starting architecture for the combined
          offer in year two.
        why: >-
          The organisation, alignment and measures are right, but sequencing a year of
          tooling and standards before the board's priority repeats the pattern the guide warns
          about: capabilities that focus on standards, reference architectures and structures
          are statistically less successful than those delivering key transformations (§12.3),
          and it delays the value the sponsor and the finance director are asking for (§5.4).
      - key: C
        points: 1
        text: >-
          Accept the CIO's proposal and merge the streaming and production architects into the
          IT-centric team, adopt the broadcaster's principles and standards for the group, and
          have the merged team produce a group technology roadmap; measure success by
          completion of the roadmap and the number of standards adopted.
        why: >-
          An IT-centric alignment constrains support for decisions and governance to the IT
          domain and is unlikely to fit a strategy-and-portfolio purpose (§5.3; §9.2), measuring
          by models and standards produced is inadequate to communicate value (§9.3.3), and
          imposing one team's principles ignores the context-first sequence (§4).
      - key: D
        points: 0
        text: >-
          Recommend disbanding all three teams and engaging a consultancy to design the
          combined offer, since the finance director's question implies the teams add nothing
          and the board needs an answer quickly.
        why: >-
          The finance director's question is one the guide poses as a way to define value
          measures, not a verdict (§5.4). Disbanding the capability discards the group's ability
          to develop, use and sustain its architecture and govern change (§3.3), and hands the
          board's most important decision to a party outside any governance.
    refs: ["GUIDE:togaf-leaders-guide §5", "GUIDE:togaf-leaders-guide §9.2", "GUIDE:togaf-leaders-guide §5.4", "GUIDE:togaf-leaders-guide §6.2", "GUIDE:togaf-leaders-guide §11.1", "GUIDE:togaf-leaders-guide §12.3"]
    open_book_hint: "Where to look: Leader's Guide §5 (purpose and objectives shape everything), §9.2 (alignment; one capability, one Leader), §5.4 (measures; what if it did not exist), §6.2 (decision rights), §11.1 (roadmap), §12.3 (transformation-focused teams succeed)."
    difficulty: 2
    tags: [leaders-guide, organisation-model, alignment, measures]
  - id: G1-102
    unit: G_LEADERS
    objective: "G1.1"
    lesson: G_LEADERS/01_the_leaders_guide
    scenario: |
      Castellan Bank is a commercial bank with 12,000 staff, serving mid-sized companies through
      payments, lending and trading services, and supervised by a regulator that reviews its
      governance annually. Its EA Capability is five years old, strategy-centric, and reports to
      the Chief Strategy Officer; it has fourteen architects and a well-populated repository. Two
      years ago the bank created an Architecture Governance Board, chaired by the Head of EA, with
      the bank's domain architects as members and a charter that gives it authority "to approve
      target architectures and to approve or reject project designs for compliance". The board
      meets fortnightly and has a backlog of eleven items awaiting decision.

      The board has become a bottleneck and a battleground. Three episodes have been escalated to
      the Chief Executive in the last quarter. First, the board rejected the payments division's
      target architecture twice because the architects on the board preferred a different
      integration pattern; the payments director complains that the board is "designing my
      business" and that the division's stakeholders — who had approved the target — were never
      asked. Second, a lending project was found non-compliant with the target's data-residency
      constraint; the board granted a "temporary" exception eighteen months ago that has never been
      reviewed, three further projects have since cited it as precedent, and the constraint is now
      widely ignored. Third, a trading project reasonably interpreted an ambiguous constraint one
      way, was declared non-compliant by a board member who had written the constraint, and was
      ordered to re-work at a cost of three months and a missed market window. The Chief Risk
      Officer notes that none of the board's decisions are visible to the enterprise risk
      management process, and that the regulator's last review asked how architecture exceptions
      are tracked. The bank's existing governance already has an investment committee, a risk
      committee and a change advisory board, none of which the architecture board reports to.

      The Chief Executive has asked you, as an external adviser, whether the board should be given
      more authority to "make its decisions stick", or less. The Head of EA argues that without
      the power to approve and reject, governance is meaningless and projects will "do what they
      like". The payments director argues the board should be abolished and each division left to
      govern itself. The Chief Risk Officer wants whatever emerges to be visible to her committee.
      The regulator's next review is in six months and will ask about exception handling.

      You have reviewed the board's records. Of forty decisions in two years, thirty-one concerned
      the content of targets or designs and nine concerned process. In no case is there a record
      of the stakeholders of the architecture having approved the views on which the board ruled;
      in most cases the stakeholders were not present. The exception granted to the lending project
      has no expiry date and no owner. The trading project's ambiguous constraint has never been
      clarified in the target. The board's charter was written by the Head of EA and approved by
      the Chief Strategy Officer without reference to the risk committee. The bank's enterprise risk
      management framework has a tier for "technology and change risk" that would accept
      architecture non-compliance reports if any were sent. The investment committee already
      requires a "confidence statement" for large projects, which the board does not contribute
      to. The Head of EA is well regarded and has said he would accept a redesign "as long as it
      does not turn the board into a talking shop".

      You must recommend how architecture governance at Castellan should be designed: who decides
      what, what the board's role is, how non-compliance and relief are handled, and how it fits
      the bank's existing governance and risk processes.
    question: "Refer to the scenario. Based on the Series Guides and the TOGAF Standard, which of the following is the best answer?"
    answers:
      - key: A
        points: 5
        text: >-
          Redesign the board's role rather than its power. Decision rights over the content of
          a target architecture, over relief from it, and over enforcement are vested in the
          architecture's stakeholders — the payments director and his peers — not in the
          board; the board owns the process and issues a recommendation on the completeness of
          the work and the confidence stakeholders should have. Give the board the guide's
          decision-tree checklist for assessing a target: were the correct stakeholders
          identified, were the constraints of superior architecture respected, do SMEs agree
          with the facts, do the views reflect the stakeholders' concerns and the underlying
          models, do the stakeholders understand the value, the work and the limits of
          confidence, and have they approved the views — and for non-compliance: was the
          target reasonably interpreted (if so, accept it as compliance and change the
          architecture), do SMEs agree with the impact assessment, and have the stakeholders
          approved the recommendation to enforce, grant time-bound relief, or change the target.
          Make every relief time-bound with scheduled re-assessment, and integrate the process
          with the bank's existing governance tiers and enterprise risk management so that
          decisions are visible to the CRO.
        why: >-
          The guide names as "a common failure pattern" an EA board that believes it holds
          decision rights over the target, relief and enforcement; those rights belong to the
          stakeholders, and the board owns process and a completeness-and-confidence
          recommendation (GUIDE:togaf-leaders-guide §6.2). The two checklists are the guide's
          own, including the reasonable-interpretation test and the enforce/relief/change
          choice, and relief without future re-assessment means the enterprise has changed its
          architecture without approval (§6.2). Governance must be designed in the context of
          existing governance, reporting and ERM practices and tiers (§6.2; §6.1).
      - key: B
        points: 3
        text: >-
          Keep the board's authority to approve targets and designs but change its membership
          so that business stakeholders sit alongside the architects, reduce its scope to
          matters of enterprise significance, add a time limit to exceptions, and report its
          decisions to the enterprise risk process.
        why: >-
          Time-bound relief and ERM visibility are right, but keeping content decision rights
          in the board — even a board with business members — still places approval of the
          target in a body rather than with the stakeholders of that architecture, which is
          the failure pattern itself (§6.2). The board's role is to assess completeness and
          confidence and manage the process, not to approve content.
      - key: C
        points: 1
        text: >-
          Strengthen the board: give it final authority over targets and compliance, remove the
          right of divisions to appeal, and require every project to obtain board approval at
          design and at go-live, so that its decisions stick and the data-residency constraint
          is enforced.
        why: >-
          This deepens the failure pattern the guide describes, embedding in the board rights
          that must sit with stakeholders (§6.2) and ignoring that reasonable interpretations
          of the target should be accepted as compliance with issues handled by changing the
          architecture (§6.2). It also perpetuates the "fixing the blame" style of governance
          the guide warns against (§6.1).
      - key: D
        points: 0
        text: >-
          Abolish the board and let each division's architects approve their own targets and
          judge their own compliance, since the payments director is right that the board
          designs his business.
        why: >-
          The development and use of EA must be governed (§6), and removing the process owner
          removes the completeness and confidence assessment, the compliance process and any
          link to enterprise risk management (§6.2). Self-certification is compliance by
          assertion.
    refs: ["GUIDE:togaf-leaders-guide §6.2", "GUIDE:togaf-leaders-guide §6.1", "GUIDE:togaf-leaders-guide §6", "GUIDE:adm-practitioners §3.3.3", "GOV §2.3"]
    open_book_hint: "Where to look: Leader's Guide §6 (governance questions), §6.1 (characteristics; tiers), §6.2 (Essential Governance: who holds decision rights; the target-assessment and non-compliance checklists; time-bound relief); Practitioners' Approach §3.3.3 (compliance decisions are made by stakeholders)."
    difficulty: 3
    tags: [leaders-guide, governance, architecture-board, compliance]
  - id: G2-101
    unit: G_PRACTITIONERS
    objective: "G2.1"
    lesson: G_PRACTITIONERS/01_the_practitioners_approach
    scenario: |
      Orrin Logistics is a warehousing and fulfilment provider with 3,900 staff, 22 warehouses
      and a corporate strategy, approved eighteen months ago, of "one-day delivery anywhere" in its
      home market. Its EA team of four sits in the IT function and is led by an architect who
      built the company's first integration platform. Over the past two years the team has been
      praised by delivery managers: its architects are embedded in projects, choose products, write
      integration designs, set coding standards and resolve technical problems, and are often the
      only people who understand how the systems fit together. Project retrospectives describe them
      as "the reason we ship".

      The Chief Executive has now asked the CIO why, with an architecture team in place, the
      company's three largest programmes — a warehouse automation rollout, a customer portal, and a
      transport management replacement — have each been found by internal audit to have no approved
      target architecture, no traceable link to the corporate strategy of one-day delivery, and no
      evidence of compliance beyond the architects' own sign-off. The audit also found that the
      three programmes have made incompatible assumptions about the same order data, and that the
      automation rollout's chosen system cannot exchange data with the transport system's chosen
      system without a fourth product that nobody has budgeted for.

      The lead architect's response is that the team "does real architecture, not paperwork": every
      design decision was made by an architect, the products chosen are good, the programmes are on
      time, and "the audit is measuring the wrong thing". The programme sponsors — the Chief
      Operating Officer for automation, the Chief Commercial Officer for the portal, and the Head of
      Transport — say they have never been asked to approve anything and would not know what they
      were approving; the COO says she was shown "a diagram with boxes" once. The internal auditor
      notes that when she asked how the transport replacement conforms to the architecture, the
      answer was "the architect designed it, so it does", and that when she asked what the
      architecture was, she was given a set of integration designs. The CIO has asked you, as the
      incoming Head of EA, to diagnose the situation and propose a remedy without stopping the
      programmes, which are eight, five and three months from go-live respectively, and without
      losing the four architects, whose technical knowledge the company depends on.

      You have looked for what an architecture would need to have been. The strategy names three
      capabilities — "same-day pick", "dynamic carrier allocation" and "customer self-service" —
      that nobody has mapped to the three programmes. The order data that the programmes have
      defined differently is the same business information, "order", "consignment" and "delivery
      slot", used with three meanings. The customer portal's sponsor has a list of what she expects
      it to do that has never been reconciled with what the automation rollout will change in the
      warehouse. Each programme has a risk register, none of which mentions the others. The
      integration platform the lead architect built is the one thing all three depend on and is
      documented only in his head. The auditor's report gives the company ninety days to respond.
      The CIO has said he will fund a fifth architect if the remedy needs one, and that he does not
      want "a documentation exercise that satisfies audit and changes nothing". The three sponsors
      have agreed to give the EA team a half day each if they are shown "something we can actually
      decide on", and the auditor has offered to review whatever governance basis is proposed
      before the ninety days expire.

      You must diagnose what has gone wrong, in the standard's terms, and recommend the change:
      what the architects must now produce for each programme, for whom, and how the roles they play
      should be separated.
    question: "Refer to the scenario. Based on the Series Guides and the TOGAF Standard, which of the following is the best answer?"
    answers:
      - key: A
        points: 5
        text: >-
          Diagnose the "not doing architecture" failure pattern: the practitioners have been
          acting as implementers, SMEs and stakeholders' agents, and the architecture was never
          described and approved by stakeholders, so the only compliance available is by
          assertion. Remedy it by separating the roles and restoring the products that make
          governance possible. For each programme, identify the stakeholders with approval
          rights and their concerns, produce views that show how the candidate target addresses
          them, and obtain approval; give each implementation team an Architecture Contract
          equivalent stating project context, the gaps and work packages it is responsible for
          (and those it is not), and the specifications and controls it will be assessed
          against, with specifications written as prohibitions and each linked to a requirement;
          then run Phase G compliance against those, judged by reasonable interpretation. Keep
          the architects' technical involvement but make explicit when they act as architect,
          SME or implementer. Trace each target to the one-day-delivery strategy through the
          requirements repository.
        why: >-
          The Practitioners' Approach names "not doing architecture" as the most pernicious
          practice: practitioners busy as agent, SME and implementer never get the architecture
          described and approved, leaving compliance by assertion (GUIDE:adm-practitioners §11.3).
          Without approval the practitioner has "a documented opinion" and no governance is
          possible (§6.3.5). Implementers are served by context, scope, and conformance through
          the Architecture Contract, with exclusionary specifications tested by reasonable
          interpretation and linked to requirements (§3.3.2), and stakeholders approve views
          that address their concerns (§3.3.1). Traceability from strategy to requirement is
          the basis of requirements management (§6.1.1).
      - key: B
        points: 3
        text: >-
          Recognise that the architects have been acting as implementers and pull them out of
          the programmes into a central team that produces target architectures and reviews
          designs for compliance; have the CIO approve the targets on behalf of the business so
          that the programmes are not delayed by sponsor education.
        why: >-
          Restoring described architecture and compliance review is right, but approval by the
          CIO on behalf of the business substitutes a proxy for the stakeholders who hold
          approval rights; the sponsors' inability to know what they are approving is solved by
          views that address their concerns, not by bypassing them (§3.3.1; §6.3.5). Withdrawing
          the architects entirely also loses the legitimate SME role the guide describes (§11.3).
      - key: C
        points: 1
        text: >-
          Accept the lead architect's position that embedded design is real architecture, and
          satisfy the auditor by having the architects retrospectively write up the designs
          they made as target architecture documents and sign them as compliant.
        why: >-
          Implementation design, specification and standards produced as the end result of an
          "architecture project" are not architecture, and writing them up afterwards and
          self-certifying is exactly compliance by assertion, "rife with personal bias"
          (GUIDE:adm-practitioners §11.3). Nothing is traced to strategy or approved by
          stakeholders.
      - key: D
        points: 0
        text: >-
          Report to the Chief Executive that the audit findings are a documentation issue with
          no practical consequence, since the programmes are on time and the products are good,
          and recommend closing the findings.
        why: >-
          Without an approved architecture the enterprise has no ability to exercise
          implementation governance and the value the architecture might enable is fragile,
          because operational and future teams are unaware of preference, priority or
          traceability to value (§11.3). Being on time is not evidence of enterprise value
          (§4.1.3).
    refs: ["GUIDE:adm-practitioners §11.3", "GUIDE:adm-practitioners §6.3.5", "GUIDE:adm-practitioners §3.3.2", "GUIDE:adm-practitioners §3.3.1", "GUIDE:adm-practitioners §6.1.1", "GUIDE:adm-practitioners §4.1.3"]
    open_book_hint: "Where to look: Practitioners' Approach §11.3 (Failure Pattern: Not Doing Architecture; compliance by assertion), §6.3.5 (approval), §3.3.1 (stakeholders, concerns, views), §3.3.2 (communicating with implementers: Architecture Contract, exclusionary specifications), §6.1.1, §4.1.3."
    difficulty: 2
    tags: [practitioners-approach, roles, compliance, architecture-contract]
  - id: G2-102
    unit: G_PRACTITIONERS
    objective: "G2.1"
    lesson: G_PRACTITIONERS/01_the_practitioners_approach
    scenario: |
      Sable & Rowe is a fashion retailer with 260 stores, a large online business and 8,000 staff,
      competing on speed of range change. Its portfolio-level target architecture for "seamless
      customer journey" was approved by the Chief Customer Officer and the Chief Operating Officer
      six months ago, with a roadmap of five work packages sequenced over three years. The first
      two — a customer identity service and a unified stock view — have been funded and are about to
      start implementation: identity with an external systems integrator under a fixed-price
      contract, and stock with an internal team of twelve. You are the practitioner responsible for
      both, with one other architect.

      The systems integrator has asked for "the architecture" so that it can finalise its
      statement of work. The internal stock team has asked "what exactly are we building and how
      will we be judged?" — its lead has been burned before by a review that "moved the goalposts".
      The Chief Financial Officer, who chairs the portfolio board, has asked when she will see
      value, what the trade-offs were between the customer and operations sides, and how confident
      she should be that the two projects will deliver; she has to defend the spend to the board
      next quarter. The Chief Customer Officer has asked for a "dashboard view" of how the journey
      will look for a customer, to use with the store managers.

      The EA team's repository contains: the approved target models in a modelling tool; a
      stakeholder map with concerns clustered under agility, customer experience and cost; the
      Architecture Requirements Specification, which currently lists what components "should" use
      and several requirements written as "the solution must be modern and scalable" and "the
      platform should be cloud native"; a gap list per domain; a risk register; and the roadmap with
      work packages described by name only. The team has so far sent the integrator the full model
      export from the tool and given the stock team the same, plus a copy of the Architecture
      Definition Document. The integrator has responded with a 40-page "clarifications" list and a
      request for a change to its fixed price. The stock team lead says he will "just build what
      makes sense to us and see what the review says". The CFO's office has asked for "a one-page
      summary", and the CCO's office has asked for "the diagrams".

      You have also examined what the roadmap and repository can support. The roadmap's five work
      packages are named but their gaps are recorded only in the domain gap lists, not against the
      work packages; the identity work package's scope therefore includes, by omission, a customer
      data migration that belongs to the third work package. The Architecture Requirements
      Specification's "should use" statements were written by an architect who has since left and
      were never linked to a stakeholder concern; the "modern and scalable" requirement came from
      the CCO's original brief. The trade-off between the customer side's wish for one identity
      across channels and the operations side's wish to keep store logins separate was decided by
      the sponsors in Phase B, and is recorded in a meeting note that neither the CFO nor the
      implementers have seen. The integrator's clarifications list includes forty questions that a
      scope statement of gaps and work packages would have answered, and ten that ask which of the
      "should" statements are mandatory. The stock team's review will be against "the architecture"
      in general because nothing more specific has been agreed.

      A colleague proposes answering all four parties with one comprehensive architecture pack, on
      the grounds that everyone then has the same information and nobody can claim they were not
      told. The programme office supports this because it is one deliverable. You disagree and
      must set out how each party should be communicated with, what each receives, and what has to
      change in the Architecture Requirements Specification before the implementers can be held to
      it.
    question: "Refer to the scenario. Based on the Series Guides and the TOGAF Standard, which of the following is the best answer?"
    answers:
      - key: A
        points: 5
        text: >-
          Communicate with each community in the way it uses the architecture. For the two
          implementation teams, replace the model dumps with an Architecture Contract for each
          project: the project's context in the roadmap and the value it enables, its scope —
          the gaps and work packages it is responsible for and the adjacent gaps it is not —
          and its conformance basis, the specific architecture specifications and controls it
          will be assessed against. Rewrite the specifications so that they are exclusionary,
          stating what is prohibited rather than what "should" be used, and link each to the
          requirement or risk that motivates it, replacing "modern and scalable" with
          requirements captured as stakeholder scores or testable statements. Tell the teams
          compliance will be assessed by reasonable interpretation against those pairs. For the
          CFO, provide "other useful things": timing from the roadmap and Implementation and
          Migration Plan, the trade-off decisions taken between the stakeholders and why, status,
          budget, compliance approach and an honest statement of confidence. For the Chief
          Customer Officer, a view built from the models against her customer-experience concern.
        why: >-
          The guide distinguishes three communities: stakeholders get views that address
          concerns; implementers get context, gap, specification and control through the
          Architecture Contract, with specifications that are exclusionary, linked to
          requirements, and assessed by a reasonable-interpretation test; decision-makers get
          "other useful things" — timing, trade-off, status, budget, compliance and confidence
          (GUIDE:adm-practitioners §3.3; §3.3.1; §3.3.2; §3.3.3). Requirements for portfolio
          architecture are commonly captured as scores, and the practitioner must distinguish
          architecture requirements from implementation design (§5.1.4). Models are poor
          communication tools and should not be handed over as the deliverable (§3.2.3).
      - key: B
        points: 3
        text: >-
          Produce an Architecture Contract for each implementation team with context, scope
          and conformance, and give the CFO a view of the roadmap timeline. Leave the
          Architecture Requirements Specification as written, since the integrator can
          clarify "should" statements in its questions list, and answer the Chief Customer
          Officer with the Architecture Definition Document.
        why: >-
          The contracts and the timing are right, but a conformance basis made of "should"
          statements and "modern and scalable" is not a set of specifications an implementer
          can be assessed against; specifications must prohibit, be linked to a requirement
          and be reasonably interpretable (§3.3.2; §5.1.4). The Architecture Definition
          Document is a description, not a view addressing the CCO's concern (§3.3.1).
      - key: C
        points: 1
        text: >-
          Send the comprehensive architecture pack to all four, with a covering note for each
          indicating the relevant sections, and schedule a joint workshop where the integrator
          and stock team can raise their clarifications and the executives can ask about value.
        why: >-
          This treats models as the communication and expects each community to extract
          what it needs, which the guide says sets implementers up to fail and leaves
          stakeholders unable to verify their concerns (§3.3.2; §3.3.1). The 40-page
          clarifications list is the predictable result of handing implementers diagrams
          instead of gap, specification and control.
      - key: D
        points: 0
        text: >-
          Let the stock team build what makes sense to it and let the integrator propose its
          own design, then use the Phase G compliance review to correct whatever diverges from
          the models; tell the CFO that value will be visible once both projects go live.
        why: >-
          Without a contract stating scope and conformance, compliance can only be assessed
          by assertion or by surprise, and the first Phase G assessment — scope against the
          gap and work package — is impossible (§5.1.5; §3.3.2). Deferring the CFO's confidence
          and trade-off questions to go-live removes the decision-maker's ability to direct
          change (§3.3.3).
    refs: ["GUIDE:adm-practitioners §3.3", "GUIDE:adm-practitioners §3.3.1", "GUIDE:adm-practitioners §3.3.2", "GUIDE:adm-practitioners §3.3.3", "GUIDE:adm-practitioners §5.1.4", "GUIDE:adm-practitioners §5.1.5", "GUIDE:adm-practitioners §3.2.3"]
    open_book_hint: "Where to look: Practitioners' Approach §3.3 (three communities), §3.3.1 (stakeholders: concern and view), §3.3.2 (implementers: Architecture Contract; exclusionary specifications; reasonable interpretation), §3.3.3 (decision-makers: timing, trade-off, status, budget, compliance, confidence), §5.1.4 (requirements as scores), §5.1.5, §3.2.3."
    difficulty: 3
