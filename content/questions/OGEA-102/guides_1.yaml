  - id: G3-101
    unit: G_BUSINESS_SCENARIOS
    objective: "G3.1"
    lesson: G_BUSINESS_SCENARIOS/01_business_scenarios_guide
    scenario: |
      Lindqvist Ports operates three container terminals with 2,200 staff, handling 1.8 million
      containers a year for shipping lines, hauliers and freight forwarders. Its Chief Operating
      Officer has sponsored an architecture engagement whose Phase A has decided to use the
      Business Scenario method to establish the requirements for "reducing truck turnaround time
      at the gates", a problem the terminal managers, hauliers, customs and the port authority all
      describe differently and blame on each other. Average turnaround is 71 minutes against a
      regional benchmark of 40, and the largest shipping line has threatened to move volume. The
      premise-formulation phase is done: the premise ("an automated gate system will halve
      turnaround") is documented with its unstated questions — does the delay actually occur at the
      gate? — and a list of stakeholders willing to validate it exists. You are the Business
      Scenario Consultant and must plan the gathering and analysis.

      The programme manager has proposed a single two-hour workshop for sixty people — every gate
      supervisor, all the hauliers' dispatchers, the customs liaison, the port authority, the IT
      team and the gate-system vendor — "so that everyone is heard at once", with the vendor
      demonstrating its product at the start "to focus minds". No pre-reading is planned; the
      workshop will be minuted by whoever is free; there is no agenda beyond "requirements". The
      Chief Operating Officer would like the requirements agreed at that meeting so that
      procurement can start the following week, and has said she will chair it personally.

      Three constraints matter. The hauliers are suspicious that the port will use "requirements"
      to shift costs to them — a previous "efficiency" change introduced a booking fee — and will not
      speak openly in front of the port authority; their association has said as much in writing.
      The terminal managers have already argued in public about which terminal's process is best,
      and one of them believes the whole problem is customs and has said he will "prove it" in the
      workshop. The port's strategic plan and last year's gate throughput data, with timestamps for
      every truck movement, exist but have never been analysed against the turnaround problem;
      the IT team says the analysis would take a week. The customs liaison can attend only in the
      morning. The Chief Operating Officer wants to be visibly in charge of the workshop and has
      asked to present the automated gate concept as the opening item.

      The EA team has three people available for four weeks. The vendor has offered a consultant
      "at no cost" to write up the results.

      You have already done some of the groundwork the method asks for. The premise-formulation
      output names a candidate sponsor — the COO — and the capstone question: is the delay at the
      gate, or before it in documentation and customs, or after it in the yard? It identifies
      buy-side participants (terminal managers, yard planners, customs, the port authority) and
      supply-side participants (haulier dispatchers, the shipping lines' agents, the gate-system
      vendor) by name. A first look at the throughput data shows that trucks spend a median of
      nine minutes at the gate itself and forty in the queue before it, which nobody in the
      premise-formulation conversations mentioned. The customs liaison has said privately that
      half the delays are missing documents that hauliers could have submitted the day before. The
      port's strategic plan sets a turnaround target of 45 minutes by next year. The hauliers'
      association has offered to host a session at its own premises. The COO has not seen the
      throughput analysis.

      You must plan how the business scenario will be gathered, analysed and reviewed: who does
      what, how many sessions and with whom, what happens before and after them, and what the COO
      and the vendor should and should not do.
    question: "Refer to the scenario. Based on the Series Guides, which of the following is the best answer?"
    answers:
      - key: A
        points: 5
        text: >-
          Plan the iteration as a mini-project with named roles: the COO as sponsor and host
          who reassures participants and opens the room, a facilitator and a recorder who are
          not the COO, primary and secondary questioners, and SME contributors chosen by name
          from the business and technical sides at senior enough level to speak openly. Gather
          off-line first — analyse the strategic plan and the throughput data and draft a
          strawman scenario — then run more than one small workshop: separate sessions for the
          hauliers and for the port and customs side so that each speaks openly, and a
          business-side and a technical-side session, each with scripted questions that test
          whether the problem is stated as a what rather than a technology how, and where, when
          and at what cost it occurs. Exclude the vendor demonstration; vendors contribute later
          when technical solutions are explored. Analyse by normalising the raw data with
          affinity analysis and linking business processes to constituencies, actors, issues
          and objectives in a matrix; where the terminal managers' argument shows bias towards
          one approach, use alternative analysis with a weighted decision matrix. Then hold a
          readout with the sponsors and involved parties for buy-in or stop, and iterate.
        why: >-
          The planning step configures the team and roles — project manager, consultant,
          analyst, facilitator, recorders, questioners, host and sponsor — and identifies
          participants by name (GUIDE:business-scenarios §3.2.1; §10). Gathering favours
          preprocessing available data off-line, a strawman draft, small and carefully selected
          workshop groups, and multiple workshops to separate business from technical or to
          gather from more people (§3.2.2). The questions test what-versus-how and cost
          (§7.2.1). Vendors contribute in the later stages (§5). Analysis normalises data with
          affinity analysis and builds the linking matrix (§3.2.3); the decision matrix counters
          bias (§12.8); the review step seeks buy-in or stop (§3.2.5).
      - key: B
        points: 3
        text: >-
          Keep one workshop but reduce it to twenty carefully chosen senior people, have a
          neutral facilitator and recorder, circulate a strawman scenario built from the
          throughput data beforehand, and drop the vendor demonstration; run the analysis
          afterwards and send the resulting draft to the COO for approval.
        why: >-
          The selection, preparation and facilitation are right and the vendor is correctly
          removed, but a single mixed workshop ignores the guidance to hold separate sessions
          where openness requires it — the hauliers will not speak in front of the port
          authority (§3.2.2) — and approval by the COO alone replaces the review readout with
          sponsors and involved parties whose shared expectations the step exists to create
          (§3.2.5).
      - key: C
        points: 1
        text: >-
          Run the programme manager's sixty-person workshop as proposed, but replace the vendor
          demonstration with a presentation of the premise by the COO, and capture the
          requirements list in the meeting for procurement.
        why: >-
          Sixty people is not the "select and small group" the guide prescribes, no off-line
          gathering or strawman precedes it, the COO presenting the premise anchors the room on
          the solution the scenario is meant to test, and a requirements list captured in one
          meeting skips analysis, documentation and review (§3.2.2; §3.2.3; §3.2.5).
      - key: D
        points: 0
        text: >-
          Let the gate-system vendor run the workshop and produce the requirements document,
          since it knows the domain and has offered to do so at no charge, with the COO
          endorsing the result.
        why: >-
          Vendor involvement is greatest in the later stages when the role of specific
          technical solutions is explored; business management leads while the problem is
          being captured (§5). A vendor-written requirements document confirms the premise
          rather than validating it — the "solution looking for a problem" trigger the method
          exists to catch (§3.3.1).
    refs: ["GUIDE:business-scenarios §3.2.1", "GUIDE:business-scenarios §3.2.2", "GUIDE:business-scenarios §3.2.3", "GUIDE:business-scenarios §3.2.5", "GUIDE:business-scenarios §5", "GUIDE:business-scenarios §7.2.1", "GUIDE:business-scenarios §10", "GUIDE:business-scenarios §12.8"]
    open_book_hint: "Where to look: Series Guide: Business Scenarios §3.2.1 (planning), §3.2.2 (gathering: preprocessing, small workshops, separate sessions), §3.2.3 (analysing: affinity analysis, the linking matrix), §3.2.5 (reviewing: buy-in or stop), §5 (who contributes when), §7.2.1 (questions), §10 (roles), §12.8 (decision matrix)."
    difficulty: 2
    tags: [business-scenarios, workshops, roles, gathering]
  - id: G3-102
    unit: G_BUSINESS_SCENARIOS
    objective: "G3.1"
    lesson: G_BUSINESS_SCENARIOS/01_business_scenarios_guide
    scenario: |
      The Northern Water Board is a public utility with 3,100 staff supplying water and
      wastewater services to 900,000 households, regulated on price and on customer outcomes. It
      is about to establish an Enterprise Architecture capability for the first time, following a
      regulator's finding that its investment decisions are not traceable to customer outcomes and
      a fine for a repeated sewage discharge. The Chief Executive has appointed an EA Leader, who
      has begun the Preliminary Phase with two seconded staff. At the same time, the Board's
      largest programme — replacing the systems that plan and schedule mains repairs, worth a
      tenth of the capital budget — is in Phase B of an architecture engagement run by a
      consultancy under a contract signed before the EA Leader arrived.

      The EA Leader has attended a Business Scenarios training course and has proposed using the
      method in three places. First, in the Preliminary Phase, to establish what the new EA
      capability is for and what "traceable to customer outcomes" would mean in practice, since
      the Chief Executive, the regulator liaison and the finance director each have a different
      idea — the Chief Executive thinks it means fewer complaints, the regulator liaison thinks it
      means a published outcomes framework, and the finance director thinks it means a cost per
      outcome. Second, in the repairs programme's Phase B, to derive the characteristics of the
      Business Architecture from the field crews' and dispatchers' real problems, because the
      consultancy has so far worked from a list of features the previous system had, and the field
      crews say the previous system "never did what we needed anyway". Third, to replace the
      programme's forty existing use-cases, which the consultancy has produced for the software team
      and which the EA Leader regards as duplicating what a business scenario would contain.

      The consultancy's lead objects, in writing, to all three. She says business scenarios are a
      Phase A technique only and Phase A closed two months ago; that they cannot be used for
      something as abstract as an EA capability, "which is not a business problem"; that the
      programme's use-cases already are business scenarios "in a more rigorous form" and that
      replacing them would delay the software team by two months; and that the method is irrelevant
      in Phase B because the requirements were fixed at the end of Phase A and any change is a
      change request. The programme director, who commissioned the consultancy, supports her. The
      regulator liaison supports the EA Leader. The Chief Executive has asked you, as an independent
      adviser retained by the board, to arbitrate, and wants an answer that both the EA Leader and
      the consultancy can act on next week.

      The three proposals have been written up in enough detail to judge. The Preliminary Phase
      proposal would run two workshops with the Chief Executive, the regulator liaison, the finance
      director and the heads of the operational directorates, produce a scenario describing the
      investment-traceability problem, its environment, SMART outcomes such as "every capital
      project above a threshold states the customer outcome it serves and reports against it", and
      the human and computing actors — and would use it to define the EA capability's requirements.
      The Phase B proposal would run workshops with field crews, dispatchers and the repairs
      planning managers to describe the real repair-scheduling problem and its outcomes, documented
      in models and text, reviewed with the programme director as sponsor, and placed in the
      Requirements Repository alongside the consultancy's feature list. The use-case replacement
      proposal would delete the forty use-cases and give the software team the scenario document
      instead. The consultancy's Phase A produced a Vision and a Statement of Architecture Work
      whose requirements section reads "as per the previous system, plus mobile".

      You must say where the method applies, where it does not, and why, in terms both parties can
      check against the standard.
    question: "Refer to the scenario. Based on the Series Guides and the TOGAF Standard, which of the following is the best answer?"
    answers:
      - key: A
        points: 5
        text: >-
          Uphold the first two uses and reject the third. The method figures most prominently
          in Phase A but is also used in Phase B to derive the characteristics of the
          architecture directly from the high-level requirements of the business, and it can be
          used in any phase where requirements need to be derived — including the Preliminary
          Phase to define requirements for establishing the EA capability, which is precisely
          the first proposal. The repairs programme's Phase B use is legitimate because its
          current requirements are a feature list, not a description of real problems,
          environment, SMART outcomes and actors; a scenario built with the field crews and
          dispatchers, documented with models and text and reviewed with the sponsors, would
          give the Business Architecture a whole-problem context and go into the Requirements
          Repository. But a business scenario is not a use-case: use-cases are more detailed
          descriptions of human-to-computer interaction used in software development, and the
          scenario informs them rather than replacing them; keep the forty use-cases and check
          them against the scenario. Remind both parties that scenarios are a tool, not the
          objective, and should not be iterated beyond what is fit for purpose.
        why: >-
          Business scenarios are used principally in the Preliminary, Architecture Vision and
          Business Architecture phases and in other phases to derive requirements
          (GUIDE:business-scenarios §1); they figure most prominently in Phase A, are also used
          in Phase B to derive the characteristics of the architecture from high-level
          requirements, and can be used in the Preliminary Phase to define requirements for an
          EA capability (§6). A scenario is explicitly not a use-case, which is more detailed and
          software-oriented, nor a business case (§1). Its content is models plus text with a
          defined structure (§4), and it is placed in the Requirements Repository (§3.3). It is
          a tool, not the end game (§13).
      - key: B
        points: 3
        text: >-
          Uphold the Preliminary Phase use and the Phase B use, and also allow the forty
          use-cases to be replaced, since a business scenario that captures the actors and their
          interactions in models and text is a richer statement of the same requirements and
          removing duplication will simplify the programme.
        why: >-
          The first two rulings are correct, but the guide draws the line the other way on
          use-cases: business scenarios are not use-cases, which are more detailed
          human-to-computer interaction descriptions typically used in software development
          (§1). A scenario informs downstream artefacts; it does not substitute for engineering
          specifications or use-cases (§1; §13).
      - key: C
        points: 1
        text: >-
          Side with the consultancy: business scenarios belong in Phase A, the programme's
          requirements were fixed at the end of Phase A, and the EA capability is too abstract
          for the method; the EA Leader should instead define the capability with a business
          case.
        why: >-
          This contradicts the guide on all three points: the method is used in Phase B and in
          other phases where requirements must be derived (§6), it is explicitly cited for the
          Preliminary Phase and EA capability requirements (§6), and business requirements are
          referred to throughout all phases rather than fixed at the end of Phase A (§6). A
          business case is one of the things a scenario can inform, not a substitute (§1).
      - key: D
        points: 0
        text: >-
          Rule that the method must be applied everywhere at once: rerun the repairs
          programme's Phase A with a full business scenario before Phase B continues, replace
          the use-cases, and iterate the EA capability scenario until every stakeholder agrees
          on every element.
        why: >-
          Iterating unnecessarily and treating the scenario as the end game is the guide's own
          warning — it is a tool, feature creep must be watched, and refinement continues only
          until fit for purpose (§1; §13). Restarting a programme in Phase B to redo Phase A is
          not what "used in Phase B" means, and replacing use-cases contradicts §1.
    refs: ["GUIDE:business-scenarios §1", "GUIDE:business-scenarios §6", "GUIDE:business-scenarios §4", "GUIDE:business-scenarios §3.3", "GUIDE:business-scenarios §13", "ADM §4.5.1"]
    open_book_hint: "Where to look: Series Guide: Business Scenarios §1 (where used; what a scenario is not — use-cases, business cases), §6 (Business Scenarios and the ADM: Phase A, Phase B, any phase, Preliminary Phase), §4 (contents), §3.3 (Requirements Repository), §13 (a tool, not the objective); ADM §4.5.1 (business scenarios in Phase B)."
    difficulty: 2
    tags: [business-scenarios, adm-placement, use-cases, preliminary-phase]
  - id: G4-101
    unit: G_BUSINESS_ARCH
    objective: "G4.1"
    lesson: G_BUSINESS_ARCH/01_the_business_architecture_guides
    scenario: |
      Fennimore Foods is a regional grocery chain with 92 stores, an online delivery service and
      7,800 staff, known for fresh produce and local suppliers. Its Chief Executive has sponsored an
      architecture engagement to respond to a competitor's rapid delivery offer — groceries within
      an hour — which has taken 4% of Fennimore's online sales in six months. Phase A is complete
      and Phase B has started with a team of three and ten weeks. In Phase A the team searched the
      repository and found only an organisation chart and a three-year-old process library. A
      junior architect has since produced a "business capability map" in a week by copying the
      organisation chart: its level-1 capabilities are Stores, Online, Buying, Supply Chain,
      Marketing, Finance, HR and IT, with the departments beneath each as level 2. The Chief
      Executive liked it because "it looks like the company" and has shown it to the board.

      The Chief Operating Officer says the map is useless for the delivery problem: rapid delivery
      cuts across Stores, Online and Supply Chain, and the map cannot show where the gaps are; he
      suspects the gap is in picking and in the last mile, but has no way to demonstrate it. The
      Head of Online says the real question is how an order gets from a customer's basket to their
      door and where it slows down; she has drawn a swim-lane process diagram with 140 steps that
      nobody else can read, and she wants it adopted as "the delivery architecture". The Buying
      Director says the company's key problem is that nobody agrees what "product" means — the
      stores, online and buying systems each define it differently, so a "case of apples" is one
      thing in buying, twelve things in the store and a weight online — and that this, not
      delivery, is why online stock is wrong and orders are substituted. The Chief Financial Officer
      wants to know which parts of the business to invest in and has a fixed sum to allocate at the
      next board meeting. The Head of Stores says her store managers "already do rapid delivery
      informally" for regular customers and nobody has asked them how.

      The consultancy supporting the programme has proposed to "heat-map the capability map" as it
      stands, colouring departments red where managers report problems, and to present it to the
      board as the investment case next month; it has produced a draft in which Online and Supply
      Chain are red. The lead architect is uneasy: the map is an org chart, the heat map is a
      complaints chart, the 140-step diagram is not a value stream, and the "product" question has
      been parked as "a data issue". The Chief Executive has asked why the team "cannot just use
      what the consultancy has done".

      The lead architect has begun to gather what a proper Phase B would use. The Chief Executive
      can name the company's 25 or so "things we must be good at" in an hour, and the executive
      team has agreed to a half-day session if the result is not "another org chart". The Head of
      Online's 140 steps can be grouped, by her own reckoning, into six stages from "customer
      places order" to "customer receives goods", each with a clear hand-off and a measurable
      outcome. The Buying Director has a draft glossary of 40 business terms — product, line, case,
      unit, range — that he wrote for a systems project that was cancelled. The store managers'
      informal rapid delivery involves a picker, a driver and a phone call, and takes 50 minutes.
      The competitor's offer, analysed from its public terms, depends on capabilities Fennimore has
      in part — picking, routing, customer notification — and one it lacks entirely, local
      inventory accuracy. The CFO's board paper is due in five weeks; the consultancy's heat map
      is the only candidate for it so far.

      You must propose how Phase B should build the Business Architecture: which of the guides'
      constructs to use, how to build each correctly, how they relate to each other, and what
      answers the COO, the Head of Online, the Buying Director and the CFO each get.
    question: "Refer to the scenario. Based on the Series Guides and the TOGAF Standard, which of the following is the best answer?"
    answers:
      - key: A
        points: 5
        text: >-
          Rebuild the business architecture from the four pillars rather than the org chart.
          Redo the capability map: start top-down with senior leaders on 20 to 30 level-1
          capabilities named noun-verb around business objects (Product Management, Order
          Fulfilment, Customer Management, Inventory Management), described as "the ability
          to…", stratified into strategic, customer-facing and supporting tiers, and explicitly
          independent of department names — treating the org chart, the business model and the
          plans as sources, not the frame. Define a "Fulfil Online Order" value stream with the
          customer as triggering stakeholder, decomposed into stages with entrance and exit
          criteria and value items, and cross-map each stage to the capabilities that enable it,
          keeping it at value-stage level rather than the 140-step process. Heat-map the
          capabilities in the context of that value stream to find where delivery stalls —
          which gives the CFO investment focus. Build an information map to settle "product"
          and the other concepts that matter most, cross-mapped to the capabilities that
          establish and use them, and use the organisation map to show which units and partners
          participate in each stage.
        why: >-
          Transposing the org chart onto the capability map is "a common mistake"; capability
          names should be noun-verb around business objects and resist department names, the
          map is built top-down from 20 to 30 level-1 capabilities using structure, business
          model and plans as sources, and stratified (GUIDE:business-capabilities §3.1.1;
          §2.1.1; §3.1). Heat mapping identifies gaps and investment priorities, and mapping
          capabilities to value stream stages shows which are critical to value delivery
          (§5.1; §5.2.2). A value stream needs a triggering stakeholder, stages with criteria and
          value items, and is kept concise above process detail (GUIDE:value-streams §2.1;
          §3.1); heat-mapping capabilities by stage against a stated problem is the guide's
          worked scenario (§4.3). The information map settles the business vocabulary before
          data models (GUIDE:information-mapping §2). Phase B applies capability mapping,
          value streams, organisation and information maps to the project's scope (ADM §4.5.3).
      - key: B
        points: 3
        text: >-
          Keep the existing map but rename its level-1 entries as capabilities, add a "Rapid
          Delivery" capability under Online, and heat-map it using the managers' reported
          problems; adopt the Head of Online's 140-step process diagram as the value stream
          for delivery, and record the "product" definition problem as a data issue for Phase C.
        why: >-
          Renaming departments does not remove the org-chart frame the guide warns against
          (GUIDE:business-capabilities §3.1.1), a 140-step process diagram is process design
          rather than a value stream, which stays at value-stage level with a triggering
          stakeholder (GUIDE:value-streams §3.1), and "product" is a business information
          concept for the information map in Phase B, not a Phase C data problem
          (GUIDE:information-mapping §5; §6).
      - key: C
        points: 1
        text: >-
          Accept the consultancy's proposal: heat-map the departmental map by reported problems
          and present it to the board as the investment case, since the Chief Executive already
          recognises the map and time is short against the competitor.
        why: >-
          A heat map is only as good as the map beneath it; colouring departments cannot show
          where a cross-cutting capability gap lies, which is the COO's objection and the
          reason capability maps are made independent of organisational structure
          (GUIDE:business-capabilities §3.1; §5.1). No value stream context exists to say which
          capabilities matter for delivery (§5.2.2).
      - key: D
        points: 0
        text: >-
          Skip the business architecture pillars altogether and proceed to Phase C to fix the
          product data definitions, since the Buying Director has identified the root cause and
          the delivery problem will resolve once online stock is correct.
        why: >-
          Business Architecture is a prerequisite for the other domains (ADM §4.5.1), and
          resolving "product" is an information-mapping task at the business level whose
          relationships to capabilities must be understood first; limiting concepts to what
          data models can hold risks solving the wrong problem (GUIDE:information-mapping §5).
          Adopting one director's diagnosis skips the value stream analysis that would test it.
    refs: ["GUIDE:business-capabilities §3.1.1", "GUIDE:business-capabilities §2.1.1", "GUIDE:business-capabilities §3.1", "GUIDE:business-capabilities §5.1", "GUIDE:business-capabilities §5.2.2", "GUIDE:value-streams §2.1", "GUIDE:value-streams §3.1", "GUIDE:value-streams §4.3", "GUIDE:information-mapping §2", "ADM §4.5.3"]
    open_book_hint: "Where to look: Business Capabilities §2.1.1 (naming), §3.1 and §3.1.1 (approach; the org-chart mistake), §5.1 (heat maps), §5.2.2 (capability/value stream mapping); Value Streams §2.1 (elements), §3.1 (principles), §4.3 (heat-mapping scenario); Information Mapping §2; ADM §4.5.3."
    difficulty: 3
    tags: [business-capabilities, value-streams, information-map, phase-b]
  - id: G4-102
    unit: G_BUSINESS_ARCH
    objective: "G4.1"
    lesson: G_BUSINESS_ARCH/01_the_business_architecture_guides
    scenario: |
      Hallam Motors is a vehicle manufacturer with 14,000 staff and two assembly plants that sells
      through 300 independent dealers under franchise agreements. Its board has decided to change
      its business model: to sell vehicles by subscription directly to customers, with servicing,
      insurance and charging bundled into one monthly payment, while keeping dealers as service
      partners rather than sales agents. The Chief Strategy Officer has drawn the future-state
      business model on a Business Model Canvas, showing new customer segments, a new value
      proposition, new revenue streams and new key partners, and presented it to the executive,
      which endorsed it. The Chief Executive has sponsored an architecture engagement and Phase A is
      under way with a team of five. You are the lead architect.

      In Phase A you have found the following in the repository and the business. There is a
      detailed organisation chart maintained by HR, current to last month, and a data model for the
      dealer management system, but no organisation map and no information map; the repository was
      set up two years ago for an ERP programme and holds little else. The strategy team believes
      the canvas is the target architecture and wants Phase B to "implement it"; the Chief Strategy
      Officer has said the canvas "took six months to agree and is not up for debate". The dealers'
      council has not been consulted and is threatening to withdraw from the network; its
      relationship to Hallam is contractual, worth a third of Hallam's revenue in parts and
      servicing, and does not appear on any chart. The insurance and charging partners are new and
      unknown; one has not yet been selected. The Chief Information Officer's data architects say
      that "customer" in the dealer system means the dealer, not the driver, that "subscription"
      does not exist as a data entity anywhere, and that the finance system counts a sale on
      delivery rather than over a contract term. The Chief Financial Officer wants to know which
      organisation units the change will affect and what it will cost before approving the
      Statement of Architecture Work, and has said the canvas "tells me nothing I can budget".

      A consultant engaged by the strategy team has proposed treating the HR organisation chart as
      the organisation map and the dealer system data model as the information map, "since both
      already exist and Phase A should reuse what is in the repository", and moving straight to
      Phase B design of the subscription platform, with the dealers "brought in once the design is
      stable". The CIO has asked whether the canvas can be handed to Phase C as the data
      requirements. The Chief Executive wants the Statement of Architecture Work signed within the
      month.

      You have begun to test what each proposed shortcut would miss. The HR chart shows Sales
      reporting to the Commercial Director and Aftersales to the Operations Director; it shows no
      dealers, no insurers, no charging network operator and no customer, and it will not change
      when the subscription model launches. The dealer system's data model has 300 tables built
      around the dealer as customer, vehicle as stock, and a sale as a single event; it has no
      concept of a subscription term, a bundle, or a driver who is not the buyer. The canvas names
      "subscription customers", "dealers as service partners", "insurance partner" and "charging
      partner" as elements, and states the value proposition as "mobility without ownership", but
      says nothing about which units deliver which part of it, what information flows between
      them, or what the dealers must do differently. The dealers' council has asked for a meeting
      with the Chief Executive within the month and for "a clear statement of our role". The
      strategy team has scheduled a Phase B kick-off with the platform vendor's architects for next
      week.

      You must advise on how the business model, the organisation map and the information map
      should be used in Phases A and B: what the canvas is and is not, what each map must contain,
      where each is built, and what the CFO and the dealers' council get from them.
    question: "Refer to the scenario. Based on the Series Guides and the TOGAF Standard, which of the following is the best answer?"
    answers:
      - key: A
        points: 5
        text: >-
          Use the canvas as what it is — a high-level sketch of value creation that aligns
          leadership — and not as the architecture. In Phase A, analyse the business model to
          identify the partners who are stakeholders in the change (the dealers' council, the
          insurance and charging partners), verify the goals, drivers and constraints, use
          capability and value stream mapping to identify the capabilities and value streams the
          target model requires, scope the Statement of Architecture Work and formulate
          principles, and anchor the project's value proposition to the model's value
          proposition — which gives the CFO what he needs to approve. Build an organisation map,
          distinct from the HR chart: a web of the units, dealers, insurance and charging
          partners and the customer, with their working relationships and value and information
          flows, because that is what tells the CFO which units are affected and who must be
          engaged. Build an information map at the business level — defining Customer as the
          driver, Subscription, Vehicle, Agreement, Partner — cross-mapped to the capabilities
          that establish and use each concept, independent of the dealer system's data model,
          and translate it into data models only in Phase C. Then, in Phase B, break the business
          model into capabilities, value streams, organisation and information, feeding gaps and
          conflicts in its assumptions back to the strategy team.
        why: >-
          A business model is an abstract sketch sufficient for feasibility and leadership
          alignment but not for risk assessment or execution; Business Architecture breaks it
          into capabilities, value streams, organisation and information and can feed back gaps
          in its assumptions (GUIDE:business-models §4). In the ADM it is a Phase A input to
          Phase B: identify partners as stakeholders, verify goals and drivers, map capabilities
          and value streams, scope the Statement of Architecture Work, formulate principles and
          anchor the value proposition (§5). An organisation map differs from an org chart in
          scope, complexity, explicitness and lifecycle, includes partners and even customers,
          and identifies which units a change affects and who must collaborate
          (GUIDE:organization-mapping §3; §4; §2). An information map is the business vocabulary,
          not a data model, and is translated into data only in Phases C and D
          (GUIDE:information-mapping §5; §6).
      - key: B
        points: 3
        text: >-
          Use the business model in Phase A to identify the new partners as stakeholders and
          to scope the Statement of Architecture Work, and build a proper organisation map
          including dealers and partners. To save time, take the dealer system data model as the
          starting information map and correct its definition of "customer" in Phase C, when
          the data architects can add "subscription" as an entity.
        why: >-
          The business model use and the organisation map are right, but an information map
          derived from a system's data model inherits that system's view — here the wrong
          meaning of "customer" — and the guide is explicit that information maps are not data
          models and that limiting concepts to what existing data models capture leads to gaps
          and wasted investment; concepts are settled at business level in Phase B before Phase
          C translates them (GUIDE:information-mapping §5; §6).
      - key: C
        points: 1
        text: >-
          Adopt the consultant's proposal: use the HR chart as the organisation map and the
          dealer data model as the information map, since both exist and Phase A should reuse
          repository assets, and proceed to Phase B design of the subscription platform from
          the canvas.
        why: >-
          An org chart shows reporting lines between named individuals, internally focused
          and stable; it omits the contractual, partner and customer relationships and the
          collaborations that the change depends on, which is the whole difference the guide
          draws (GUIDE:organization-mapping §3). Reusing assets does not mean substituting a
          different kind of artefact, and treating the canvas as the target skips the Business
          Architecture that articulates it (GUIDE:business-models §4).
      - key: D
        points: 0
        text: >-
          Treat the Business Model Canvas as the approved target architecture, since the
          executive has endorsed it, and instruct Phase B to produce the platform design and
          Phase C to build the subscription data model, consulting the dealers once the design
          is complete.
        why: >-
          The canvas "does not normally contain sufficient information to perform a risk
          assessment or to develop a plan to execute the agreed strategy"; that is the role of
          Business Architecture (GUIDE:business-models §4). Deferring the dealers, who are
          partners in the value stream and stakeholders identified from the business model,
          contradicts the first Phase A use of the model (§5) and the organisation map's purpose
          (GUIDE:organization-mapping §4).
    refs: ["GUIDE:business-models §4", "GUIDE:business-models §5", "GUIDE:organization-mapping §2", "GUIDE:organization-mapping §3", "GUIDE:organization-mapping §4", "GUIDE:information-mapping §5", "GUIDE:information-mapping §6", "ADM §3.5.2"]
    open_book_hint: "Where to look: Business Models §4 (business model versus Business Architecture; what the sketch cannot do), §5 (using business models in the TOGAF Standard: Phase A steps); Organization Mapping §2, §3 (map versus chart), §4 (benefits); Information Mapping §5 (not a data model), §6 (Phase A finds, B builds, C translates); ADM §3.5.2."
    difficulty: 3
    tags: [business-models, organization-map, information-map, phase-a]
