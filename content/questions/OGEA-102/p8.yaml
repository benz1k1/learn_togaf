  - id: P8-105
    unit: P8
    objective: "P8.2"
    lesson: P8/02_applying_the_risk_security_agile_and_digital_guides
    scenario: |
      Willowbrook Software is a business-software vendor with 1,400 staff that sells a payroll and
      human-resources suite to mid-sized employers and is moving the suite from on-premise
      installations to a subscription service. Two years ago it reorganised development into
      fourteen product teams working in two-week sprints with product owners and a continuous
      delivery pipeline. The Enterprise Architecture team of four was created a year later, after
      the teams' independent choices produced three incompatible identity mechanisms, two payroll
      calculation engines and a customer-facing portal that could not show data from half the
      products. The Chief Product Officer sponsors the architecture work; the Preliminary Phase
      defined principles including a single product owner per product and a tailored ADM.

      The architecture team's first attempt did not land. It ran Phases A to D over five months,
      produced a 180-page Architecture Definition Document for the whole suite, and presented it to
      the product teams as the architecture they must follow. The teams called it "waterfall in
      disguise", pointed out that by the time it was published two products had pivoted, and
      largely ignored it. The Chief Product Officer has now asked the architecture team to "work the
      way the teams work" without abandoning the enterprise view that the identity and portal
      failures showed was missing.

      The current situation has specific features. The board has agreed a strategic theme,
      "one subscription, one login, one view of the employee", with a horizon of eighteen months.
      Three portfolio-level programmes are being formed, for identity, for a shared data platform and
      for the portal. The product teams have full backlogs and a release train every eight weeks.
      The Head of Security insists that identity is not something to "try and see" because of
      customer data obligations. The product owners want to know what the architects will actually
      deliver in a sprint and how decisions between teams will be governed without a monthly board
      becoming a bottleneck. One team lead has proposed that the architects simply join the sprint
      retrospectives.

      You are the lead Enterprise Architect. The sponsor has asked you to propose how the
      architecture work will be organised so that it supports the sprinting teams, keeps the
      enterprise view and delivers the strategic theme.
    question: "Refer to the scenario. The sponsor has asked how the architecture work should be organised to support the sprinting teams while keeping the enterprise view. Based on the TOGAF Standard, which of the following is the best answer?"
    answers:
      - key: A
        points: 5
        text: >-
          Restructure the architecture work using the agility guides. Partition it into three levels:
          an Enterprise Strategic Architecture that turns the strategic theme into context, guardrails
          and the identification of the identity, data and portal segments; Segment Architectures for
          each of the three programmes, providing just enough architecture to identify features and
          the epics for the portfolio backlogs, with KPIs; and Capability Architectures developed just
          in time as a solution runway for the product teams' sprints, tightly scoped to sprint
          time-boxes and fed back upward. Run the architecture work itself in sprints using the
          solution-collaboration pattern: a sprint zero to build the business change backlog from the
          theme, value streams and capabilities and to take the no-regret decisions, then each sprint
          delivering a Minimum Viable Architecture for the coming solution sprints, demonstrated,
          reviewed and re-planned in a DORP with the product owners. Embed governance in the sprints
          as guardrails and runway with compliance reviewed continuously rather than at a gate, using
          delegation levels so that reversible decisions sit with teams and irreversible ones, such as
          the identity mechanism, are made by the wider group, and treat identity as a Robust-style
          transition within the otherwise agile programme because of its risk.
        why: >-
          The three levels, strategic, segment and capability, with Capability Architectures scoped to
          sprint time-boxes and just-in-time runway, are the agility guide's model
          (GUIDE:enabling-enterprise-agility §4.1, §4.4.3), governance is embedded and continuous rather
          than deferred (§4.4.4), and high-risk elements use the Robust delivery style (§4.7.1). The
          sprints guide supplies the collaboration patterns, the sprint zero that builds the business
          change backlog and no-regret decisions, the MVA per sprint and the DORP
          (GUIDE:agile-sprints §3.3, §3.3.2, §3.3.4), and its governance section moves governance into
          the sprint process with delegation levels and the reversible versus irreversible decision
          rule (§5.4). The answer addresses every planted fact: the failed big document, the pivots,
          the security constraint and the product owners' questions.
      - key: B
        points: 3
        text: >-
          Keep the Architecture Definition Document as the enterprise view but re-issue it as a shorter
          set of standards and patterns, then have architects join each product team's sprint
          retrospectives to check compliance and feed issues back into the document, revising it
          every release train.
        why: >-
          Joining retrospectives and shortening the document move toward embedded governance, but
          the architecture is still delivered as one whole-suite document rather than partitioned into
          levels with just-in-time Capability Architectures, so the pivot problem remains
          (GUIDE:enabling-enterprise-agility §4.1, §4.3); and compliance checking in retrospectives
          without a collaboration pattern, a backlog or MVAs is not the sprinting of architecture work
          the guide describes (GUIDE:agile-sprints §3.3).
      - key: C
        points: 1
        text: >-
          Run every part of the work, including the identity mechanism, in the same two-week sprints
          as the product teams so that the architects are seen to "work the way the teams work", and
          let each team choose its own identity approach within a sprint, to be reconciled later.
        why: >-
          The guide is explicit that agility is not just sprints and that high-risk, large-scale,
          quality-driven change belongs in the Robust style, nested within the agile programme
          (GUIDE:enabling-enterprise-agility §4.7.1); letting teams pick identity mechanisms per sprint
          recreates the incompatibility that created the architecture team, and irreversible decisions
          should be made by the wider group (GUIDE:agile-sprints §5.4).
      - key: D
        points: 0
        text: >-
          Conclude that an enterprise architecture cannot coexist with fourteen autonomous sprint teams,
          disband the architecture team's ADM work and rely on the product owners and the release train
          to converge the products over time.
        why: >-
          The guides exist because the ADM can be applied in sprints and because architecture is what
          maintains the link between business needs and agile solution delivery; the standard says
          iteration is deep-rooted in the ADM and warns that agile delivery without architecture yields
          products that cannot connect (GUIDE:agile-sprints §3.1, GUIDE:enabling-enterprise-agility §4.1).
    refs: ["GUIDE:enabling-enterprise-agility §4.1", "GUIDE:enabling-enterprise-agility §4.4.3", "GUIDE:enabling-enterprise-agility §4.4.4", "GUIDE:enabling-enterprise-agility §4.7.1", "GUIDE:agile-sprints §3.3", "GUIDE:agile-sprints §3.3.4"]
    open_book_hint: "Where to look: Series Guide Enabling Enterprise Agility, section 4.1 (three levels), 4.4 (levels and iterations, governance), 4.7.1 (delivery styles); Series Guide Applying the TOGAF ADM using Agile Sprints, section 3.3 (collaboration patterns, DORP, sprint zero), 4.4 (Phase G in sprints), 5.4 (governance and delegation)."
    difficulty: 3
    tags: [agile, sprints, architecture-levels, governance]
    status: draft

  - id: P8-106
    unit: P8
    objective: "P8.2"
    lesson: P8/02_applying_the_risk_security_agile_and_digital_guides
    scenario: |
      Beacon Mutual is a regional mutual bank with 620,000 members, 90 branches and 2,100 staff. Its
      board has been alarmed by a digital-only competitor that opened 40,000 accounts in the region
      last year, and it has approved a "digital first" programme with a budget for the coming two
      years. The Chief Executive, who is the sponsor, has been persuaded by a vendor that a cloud
      banking platform with embedded machine-learning credit decisions and a conversational
      assistant would let the bank "leapfrog" the competitor, and he wants the platform selected and
      contracted within three months, with all branches and channels moved in one programme.

      The Enterprise Architecture function is one architect and a manager, created a year ago; the
      Preliminary Phase produced principles and a tailored method but no assessment of the bank's own
      capabilities. The facts that have emerged in early conversations are uncomfortable. The core
      banking system is thirty years old and the two people who understand its batch processes retire
      next year. The IT department has never run a cloud workload; its change process is a quarterly
      release. Branch managers run the bank's relationship model and see digital as a threat to their
      roles. The Chief Financial Officer has funded the first year only and wants "a business case per
      release". The Chief Risk Officer notes that the regulator has not yet published guidance on
      machine-learning credit decisions and that the bank's model-risk policy does not cover them.
      The Head of Retail is enthusiastic, has drafted a new mobile onboarding journey with a design
      agency, and wants to start with it. Two board members have asked whether the bank should instead
      partner with a technology provider, given the competitor's success.

      The Chief Executive has asked the architecture manager to bring a recommendation to the next
      board meeting on how the bank should approach the adoption of the digital technologies, what
      should be assessed before the platform decision is made, and how the vision, the sponsor's
      timetable and the bank's actual readiness should be reconciled. He has warned that he does not
      want "a report that says no".
    question: "Refer to the scenario. You have been asked to recommend how the bank should approach the adoption of the digital technologies and what should be assessed before the platform decision. Based on the TOGAF Standard, which of the following is the best answer?"
    answers:
      - key: A
        points: 5
        text: >-
          Recommend that the bank follow the Digital Technology Adoption guide's four steps before
          contracting the platform. First, select and justify an adoption approach with the ABCD
          framework, breadth of adoption against speed: given the bank's facts, an Avant-Garde approach
          that lets one part of the bank, for example the mobile onboarding journey the Head of Retail
          has drafted, adopt first and pass on the experience, or a Discreet approach that builds
          competence gradually, rather than the Big-Bang the sponsor assumes. Second, perform a Digital
          Technology Readiness Assessment with the key leaders through dialogue and consensus, using
          the guide's questionnaire, across the foundational factors of vision, sponsorship and
          direction, IT capability, culture, scope and scale, business rationale and implementation
          approach, the impact factors of business-model adaptability, skills and competence,
          technology maturity, ecosystem and governance and compliance, and the sustaining factors of
          value realisation, policy and regulations and funding. Third, identify the factors needing
          management attention and their consequences, which the scenario already signals in IT
          capability, culture, skills, technology maturity of machine-learning credit decisions, and
          policy and regulation. Fourth, address the foundational shortcomings first before evaluating
          the rest, and use the assessment to initiate Phase A of the ADM so that the vision, the
          stakeholders and the readiness output shape the architecture path, including the partner
          option, with value realisation measured per release for the CFO.
        why: >-
          The guide makes the readiness assessment a prerequisite for adoption and the antidote to the
          70 percent failure rate (GUIDE:digital-technology-adoption §2.2, §2.3, §2.4); the factors are
          grouped as foundational, impact and sustaining (§4); the four steps are select the approach
          with the ABCD framework, where no quadrant is better than another and the choice must be
          justified, perform the assessment with key leaders, identify factors needing attention and
          their consequences, and address shortcomings progressively, foundational first, because it is
          futile to evaluate impact and sustaining factors when foundational ones are unmet (§5.1, §5.2,
          §5.3, §5.4). The assessment should initiate the Architecture Vision phase and its output guides
          the architecture path selected (§6). The answer gives the sponsor a route rather than a no.
      - key: B
        points: 3
        text: >-
          Recommend a Big-Bang adoption as the sponsor wants, but precede it with a readiness
          assessment limited to IT capability and skills, since those are the obvious gaps, and plan
          training and cloud recruitment into the first year so that the platform can be contracted on
          schedule.
        why: >-
          Assessing readiness before contracting is right, but restricting it to two factors ignores
          the guide's insistence that all factors be assessed with the leadership and that missing
          foundational factors, here culture, business rationale and implementation approach as well as
          IT capability, be addressed before the rest (§4, §5.2, §5.4); and the adoption approach is
          chosen before, not after, the evidence, when the guide requires strong justification for the
          approach selected (§5.1).
      - key: C
        points: 1
        text: >-
          Recommend that the bank start immediately with the Head of Retail's mobile onboarding
          journey as a pilot, using the vendor's platform on a trial basis, and let the pilot's results
          decide the wider adoption; skip the assessment because the pilot will reveal readiness in
          practice.
        why: >-
          A pilot in one part of the bank resembles the Avant-Garde approach, but the guide treats the
          adoption approach and the readiness assessment as separate, complementary steps; a pilot does
          not assess sponsorship, governance and compliance, policy and regulations or funding, and the
          machine-learning regulatory gap is a policy factor no pilot resolves (§5.1, §5.2, §4). Trial
          use of an unassessed platform also pre-empts the platform decision the board asked about.
      - key: D
        points: 0
        text: >-
          Recommend that the platform be contracted within three months as the sponsor asks, since the
          competitor's success proves the technology works and delay is the greater risk; readiness
          issues can be handled by the vendor's implementation team.
        why: >-
          This is precisely the pattern the guide's failure examples describe: transformation for its
          own sake, disconnected from an assessment of the enterprise's readiness and strategy, with
          the guide warning that enterprises do not want to begin a large transformation without knowing
          they have the resources to complete it (§2.2, §2.3). It also ignores the regulatory and
          model-risk gap that no vendor can close.
    refs: ["GUIDE:digital-technology-adoption §2.2", "GUIDE:digital-technology-adoption §4", "GUIDE:digital-technology-adoption §5.1", "GUIDE:digital-technology-adoption §5.2", "GUIDE:digital-technology-adoption §5.4", "GUIDE:digital-technology-adoption §6"]
    open_book_hint: "Where to look: Series Guide Digital Technology Adoption, section 2.2 (what a readiness assessment is and why), 2.3 (why transformations fail), chapter 4 (foundational, impact and sustaining factors), chapter 5 (the four steps: ABCD approach, assessment, factors needing attention, addressing shortcomings), chapter 6 (alignment to the ADM, initiating Phase A)."
    difficulty: 2
    tags: [digital, readiness-assessment, adoption-approach]
    status: draft
