  - id: P9-105
    unit: P9
    objective: "P9.1"
    lesson: P9/01_the_governance_framework_in_practice
    scenario: |
      Calder Agricultural is a co-operative that processes and markets dairy and grain for 4,000
      farmer members, with 2,800 staff, twelve processing sites and a trading arm. Its Enterprise
      Architecture function of five reports to the Chief Information Officer and has run for three
      years; an Architecture Board of six, sponsored by the Chief Executive, meets monthly and has
      granted several dispensations and approved two Target Architectures. The Board's agenda follows
      the standard's model and its decisions are logged. The co-operative's governance was praised by
      its auditors last year.

      This year the picture has changed in three ways. First, the co-operative has acquired a
      food-ingredients company in another country with 900 staff, its own IT function and its own
      informal way of deciding technology, which now reports to the trading arm's managing director.
      Second, a new national food-safety regulation requires every processing site to keep traceable
      production records in a defined format and to make them available to inspectors within
      twenty-four hours; the regulation must be "taken on" by every site's systems and by the
      ingredients company. Third, the trading arm has adopted a commodity-trading platform under a
      dispensation granted for twelve months because it did not meet the integration standard; the
      dispensation expires next month, the platform still does not comply, the trading arm says it
      cannot operate without it, and the Board's chair is minded to "extend it again".

      The Board's own processes are showing strain. The compliance assessments of the two Target
      Architectures' implementation projects are up to date, but the acquired company has never been
      assessed and its managing director has said the Board's authority "does not extend across the
      border". The regulation has been assigned to the Head of Food Safety, who has asked the
      architecture team "what the architecture says about it" and been told, correctly, that it says
      nothing yet. The monitoring and reporting of service levels agreed in the operating-level
      agreements with the processing sites has lapsed since the service manager left. The
      Governance Repository's decision log is complete, but its project portfolio does not include
      the acquired company's projects.

      The Chief Executive has asked you, the lead Enterprise Architect, to advise the Board on how
      the governance framework should respond to the acquisition, the regulation and the expiring
      dispensation, and what the Board should do about its own lapses.
    question: "Refer to the scenario. The Chief Executive has asked how the governance framework should respond to the acquisition, the regulation and the expiring dispensation, and what the Board should do about its lapses. Based on the TOGAF Standard, which of the following is the best answer?"
    answers:
      - key: A
        points: 5
        text: >-
          Advise the Board to apply each part of the governance framework to the matching problem. For
          the acquisition, extend the governance structure: establish a local governance board or
          design authority for the acquired company under the global Board's remit and authority
          limits, with the Chief Executive's sponsorship making clear that the Board's authority is a
          matter of the co-operative's governance hierarchy rather than geography, add the company's
          projects to the Governance Repository's portfolio and schedule compliance assessments. For
          the regulation, take it on through the policy management and take-on process so that the
          requirement is registered, validated, ratified and published as governance content, then
          update the architecture through Requirements Management and a Change Request, with the Head of
          Food Safety as the business owner and compliance assessed against it. For the trading
          platform, refuse a rolling extension: a dispensation is time-bound and its expiry is a
          trigger for compliance activity, so either the platform is realigned to the integration
          standard on a dated plan with enforced interim criteria, or the Board decides through a
          Change Request whether the standard itself should change. For the lapses, restore monitoring
          and reporting against the operating-level agreements by assigning an owner, and review the
          Board's performance measures.
        why: >-
          The governance structure has global and local boards, design authorities and working parties
          within a hierarchy that may span geographic levels (GOV §3.2.2, §3.1.1), and each board has
          articulated responsibilities, remit and authority limits (GOV §4.1). All new governance
          material, regulatory included, comes under the policy management and take-on process
          (GOV §3.2.1); Change Requests and impact assessments carry the architecture change
          (CONTENT §4.2.11). Dispensations are granted for a given period against criteria and are
          never indefinite, their expiry triggering the compliance cycle (GOV §3.2.1, §4.4.3), and the
          Board considers policy changes where similar dispensations keep being requested (GOV §4.2).
          Monitoring and reporting against SLAs and OLAs is a governance process (GOV §3.2.1), and the
          portfolio and performance measurement belong in the Governance Repository (CONTENT §7.5).
      - key: B
        points: 3
        text: >-
          Bring the acquired company under the Board by adding its managing director as a seventh
          member, ask the Head of Food Safety to specify the regulation's requirements directly to the
          site system owners, and extend the trading platform's dispensation for a final six months on
          the condition that a compliance plan is produced.
        why: >-
          Adding a member and setting a final, conditional extension are closer to the framework than
          an open extension, but the regulation bypasses the policy take-on and Requirements
          Management processes and so never becomes governed architecture content (GOV §3.2.1); and a
          "final" extension without enforced interim criteria and without the Board deciding whether
          the standard should change repeats the pattern the standard warns about (GOV §3.2.1, §4.2).
          The monitoring lapse is left unaddressed.
      - key: C
        points: 1
        text: >-
          Treat the acquired company as outside the Board's remit until it is integrated, handle the
          regulation as a food-safety project with no architecture involvement since it is a business
          matter, and let the trading dispensation lapse so that the platform becomes non-compliant
          and the trading arm must decide what to do.
        why: >-
          Governance operates within a hierarchy that includes geographic levels, and an acquired
          company's architectures are within the co-operative's governance (GOV §3.1.1, §3.2.2); a
          regulation is exactly the legal and regulatory material the framework's content-agnostic
          design exists to take on (GOV §3.2.1); and letting a dispensation lapse without a decision
          abandons the compliance cycle that its expiry is meant to trigger (GOV §3.2.1).
      - key: D
        points: 0
        text: >-
          Extend the trading dispensation indefinitely as the chair prefers, leave the acquired
          company to its own devices, and record the regulation as a risk for each site to manage; the
          Board's processes are otherwise sound and its auditors were satisfied last year.
        why: >-
          An indefinite dispensation contradicts the standard directly (GOV §3.2.1), leaving the
          acquisition ungoverned contradicts the structure and remit of Architecture Governance
          (GOV §3.2.2, §4.1), and treating a regulation as a site-level risk ignores the compliance
          system for external standards and regulatory obligations that Architecture Governance
          includes (GOV §3.1.5). Last year's audit does not cover this year's lapses.
    refs: ["GOV §3.1.1", "GOV §3.1.5", "GOV §3.2.1", "GOV §3.2.2", "GOV §4.2", "CONTENT §4.2.11"]
    open_book_hint: "Where to look: EA Capability and Governance 3.1.1 for the governance hierarchy and geographic levels, 3.1.5 for what Architecture Governance includes, 3.2.1 for the processes (policy take-on, compliance, dispensation, monitoring), 3.2.2 for global and local boards and design authorities, 4.1 and 4.2 for the Board's remit and responsibilities including repeated dispensations; Architecture Content 4.2.11 for the Change Request and 7.5 for the repository."
    difficulty: 3
    tags: [governance, dispensation, policy-take-on, local-board]
