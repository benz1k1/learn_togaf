name: F3 Introduction to the ADM drill bank
kind: DRILL
source: authored
questions:
  # ------------------------------------------------------------ 3.1 the cycle and Requirements Management
  - id: F3-101
    unit: F3
    objective: "3.1"
    lesson: F3/02_the_adm_cycle_and_requirements_management
    stem: "Which ADM phase conducts initial implementation planning and identifies delivery vehicles for the architecture defined in the previous phases?"
    options:
      - {key: A, text: "Phase D, Technology Architecture"}
      - {key: B, text: "Phase E, Opportunities and Solutions", correct: true}
      - {key: C, text: "Phase F, Migration Planning"}
      - {key: D, text: "Phase G, Implementation Governance"}
    explanation: "Phase E does initial implementation planning and identifies delivery vehicles. Phase D develops the Technology Architecture. Phase F finalises the detailed Implementation and Migration Plan. Phase G provides oversight of implementation."
    refs: ["INTRO §3.4"]
    difficulty: 1
    tags: [phases]
    status: draft
  - id: F3-102
    unit: F3
    objective: "3.1"
    lesson: F3/02_the_adm_cycle_and_requirements_management
    stem: "Which phase addresses how to move from the Baseline to the Target Architecture by finalising a detailed Implementation and Migration Plan?"
    options:
      - {key: A, text: "Phase E"}
      - {key: B, text: "Phase F", correct: true}
      - {key: C, text: "Phase G"}
      - {key: D, text: "Phase H"}
    explanation: "Phase F, Migration Planning, finalises the detailed plan. Phase E does the initial planning. Phase G governs implementation. Phase H manages change to the delivered architecture."
    refs: ["INTRO §3.4"]
    difficulty: 1
    tags: [phases]
    status: draft
  - id: F3-103
    unit: F3
    objective: "3.1"
    lesson: F3/02_the_adm_cycle_and_requirements_management
    stem: "Which phase provides architectural oversight of the implementation?"
    options:
      - {key: A, text: "Phase F, Migration Planning"}
      - {key: B, text: "Phase G, Implementation Governance", correct: true}
      - {key: C, text: "Phase H, Architecture Change Management"}
      - {key: D, text: "The Preliminary Phase"}
    explanation: "Phase G is oversight of implementation. Phase F plans migration. Phase H establishes procedures for managing change to the new architecture. The Preliminary Phase prepares the capability."
    refs: ["INTRO §3.4"]
    difficulty: 1
    tags: [phases]
    status: draft
  - id: F3-104
    unit: F3
    objective: "3.1"
    lesson: F3/02_the_adm_cycle_and_requirements_management
    stem: "Which phase establishes procedures for managing change to the new architecture?"
    options:
      - {key: A, text: "Requirements Management"}
      - {key: B, text: "Phase G"}
      - {key: C, text: "Phase H", correct: true}
      - {key: D, text: "Phase A"}
    explanation: "Phase H, Architecture Change Management, sets up change procedures for the delivered architecture. Requirements Management manages requirements throughout. Phase G governs implementation. Phase A creates the vision and scope."
    refs: ["INTRO §3.4"]
    difficulty: 1
    tags: [phases]
    status: draft
  - id: F3-105
    unit: F3
    objective: "3.1"
    lesson: F3/02_the_adm_cycle_and_requirements_management
    stem: "What does the Preliminary Phase describe?"
    options:
      - {key: A, text: "The preparation and initiation activities to create an Architecture Capability, including customising the framework and defining Architecture Principles", correct: true}
      - {key: B, text: "Defining the scope of the initiative, identifying stakeholders and obtaining approval to proceed"}
      - {key: C, text: "Developing the Business Architecture to support the Vision"}
      - {key: D, text: "Managing architecture requirements throughout the cycle"}
    explanation: "The Preliminary Phase prepares the capability, tailors the framework and defines principles. B is Phase A. C is Phase B. D is Requirements Management."
    refs: ["INTRO §3.4"]
    difficulty: 1
    tags: [phases, preliminary]
    status: draft
  - id: F3-106
    unit: F3
    objective: "3.1"
    lesson: F3/02_the_adm_cycle_and_requirements_management
    stem: "Which statement about the sequence of ADM phases is correct?"
    options:
      - {key: A, text: "The phases must be executed in the order shown in the ADM graphic"}
      - {key: B, text: "The ADM is a waterfall method with a fixed sequence"}
      - {key: C, text: "The ADM does not mandate that the phases be performed in any specific sequence, nor a waterfall method; the graphic is better read as a reference model of what must be done", correct: true}
      - {key: D, text: "The phases may be run in any order except that Phase A must be last"}
    explanation: "The standard states the ADM mandates neither a specific sequence nor a waterfall, and recommends viewing the graphic as a reference model rather than a process model. A and B contradict this. D invents a rule."
    refs: ["INTRO §3.4"]
    difficulty: 2
    tags: [adm-cycle, sequence]
    status: draft
  - id: F3-107
    unit: F3
    objective: "3.1"
    lesson: F3/02_the_adm_cycle_and_requirements_management
    stem: "Which set of decisions does the standard say must be taken afresh for every iteration of the ADM?"
    options:
      - {key: A, text: "The breadth of coverage, the level of detail, the time period, and the architecture assets to be leveraged", correct: true}
      - {key: B, text: "The modelling notation, the tool vendor and the project manager"}
      - {key: C, text: "Whether to skip Requirements Management"}
      - {key: D, text: "Which of the six documents of the standard to read"}
    explanation: "The key points list breadth, level of detail, time period and assets to leverage, decided per iteration on the basis of resources, competence and expected value. B lists practical choices the standard does not tie to each iteration. C is contradicted by Requirements Management being continuous. D is not a cycle decision."
    refs: ["ADM §1.2.1"]
    difficulty: 2
    tags: [adm-cycle, key-points]
    status: draft
  - id: F3-108
    unit: F3
    objective: "3.1"
    lesson: F3/02_the_adm_cycle_and_requirements_management
    stem: "The ADM is described as iterative at which levels?"
    options:
      - {key: A, text: "Only over the whole process"}
      - {key: B, text: "Over the whole process, between phases, and within phases", correct: true}
      - {key: C, text: "Only within Phases B, C and D"}
      - {key: D, text: "Only between the Preliminary Phase and Phase A"}
    explanation: "The first key point says iteration applies to the whole process, between phases and within phases. A, C and D each restrict iteration to one of those scopes."
    refs: ["ADM §1.2.1"]
    difficulty: 2
    tags: [adm-cycle, iteration]
    status: draft
  - id: F3-109
    unit: F3
    objective: "3.1"
    lesson: F3/02_the_adm_cycle_and_requirements_management
    stem: "In the ADM, what is the difference between a document designated 'draft' and one designated 'approved'?"
    options:
      - {key: A, text: "A draft has not undergone formal review and approval; an approved document has been reviewed and approved but is not necessarily final and may only change through change control and governance", correct: true}
      - {key: B, text: "A draft is written by the sponsor; an approved document by the architect"}
      - {key: C, text: "An approved document can never change again"}
      - {key: D, text: "A draft is stored in the repository; an approved document is archived"}
    explanation: "Draft means no formal review yet; approved means reviewed and approved, though it may still evolve under change control. B invents authorship. C contradicts the statement that approved does not mean finalised. D is not how the standard describes storage."
    refs: ["ADM §1.2.2"]
    difficulty: 2
    tags: [adm-cycle, status]
    status: draft
  - id: F3-110
    unit: F3
    objective: "3.1"
    lesson: F3/02_the_adm_cycle_and_requirements_management
    stem: "What does the Requirements Management circle at the centre of the ADM graphic denote?"
    options:
      - {key: A, text: "A static set of requirements fixed at the start of the cycle"}
      - {key: B, text: "A dynamic process by which requirements and changes to them are identified, stored and fed into and out of the relevant phases and between cycles", correct: true}
      - {key: C, text: "The Architecture Board's approval gate"}
      - {key: D, text: "The phase in which requirements are prioritised"}
    explanation: "The circle is a dynamic process, not a static list. A is explicitly rejected. C is a governance mechanism, not Requirements Management. D is wrong because prioritisation happens in the relevant ADM phase, not in Requirements Management."
    refs: ["ADM §13.5.1"]
    difficulty: 2
    tags: [requirements-management]
    status: draft
  - id: F3-111
    unit: F3
    objective: "3.1"
    lesson: F3/02_the_adm_cycle_and_requirements_management
    stem: "Which statement about the Requirements Management process is correct?"
    options:
      - {key: A, text: "It disposes of and prioritises requirements on behalf of the other phases"}
      - {key: B, text: "It does not dispose of, address or prioritise any requirements; that is done within the relevant ADM phase", correct: true}
      - {key: C, text: "It runs only during Phase A"}
      - {key: D, text: "It replaces gap analysis in Phases B to D"}
    explanation: "Requirements Management is only the process for managing requirements across the ADM; disposal, addressing and prioritisation happen inside the relevant phase. A reverses this. C contradicts its continuous nature. D is wrong; a Requirements Management step revises gap analysis but does not replace it."
    refs: ["ADM §13.5.1"]
    difficulty: 2
    tags: [requirements-management]
    status: draft
  - id: F3-112
    unit: F3
    objective: "3.1"
    lesson: F3/02_the_adm_cycle_and_requirements_management
    stem: "Which requirements-related artefact can hold information from multiple ADM cycles?"
    options:
      - {key: A, text: "The Architecture Requirements Specification"}
      - {key: B, text: "The Requirements Impact Assessment"}
      - {key: C, text: "The Architecture Requirements Repository", correct: true}
      - {key: D, text: "The Statement of Architecture Work"}
    explanation: "The standard singles out the Architecture Requirements Repository as the one store that spans cycles; the Architecture Requirements Specification and the Requirements Impact Assessment are scoped to a single cycle. A and B are named as single-cycle. D scopes one cycle."
    refs: ["ADM §13.5.1"]
    difficulty: 3
    tags: [requirements-management, repository]
    status: draft
  - id: F3-113
    unit: F3
    objective: "3.1"
    lesson: F3/02_the_adm_cycle_and_requirements_management
    stem: "Which of the following is NOT an objective of the Requirements Management phase?"
    options:
      - {key: A, text: "Keep the Requirements Management process running for all the relevant ADM phases"}
      - {key: B, text: "Manage the architecture requirements that any execution of the cycle, or of a phase, identifies"}
      - {key: C, text: "Make the relevant architecture requirements available to each phase while it runs"}
      - {key: D, text: "Approve the Target Architecture on behalf of the stakeholders", correct: true}
    explanation: "The three objectives are sustaining the process, managing identified requirements, and making them available to each phase. Approving the Target Architecture is a governance decision, not a Requirements Management objective. A, B and C are the three listed."
    refs: ["ADM §13.1"]
    difficulty: 2
    tags: [requirements-management, objectives]
    status: draft
  - id: F3-114
    unit: F3
    objective: "3.1"
    lesson: F3/02_the_adm_cycle_and_requirements_management
    stem: "In the Requirements Management steps, what is a 'gap requirement'?"
    options:
      - {key: A, text: "Any element present in the target but not in the baseline"}
      - {key: B, text: "Something eliminated from the Target Architecture by accident, which therefore requires a change to the Target Architecture", correct: true}
      - {key: C, text: "A requirement that no stakeholder has prioritised"}
      - {key: D, text: "The difference between the budget and the estimated cost"}
    explanation: "Two gap kinds are described: eliminated (in baseline, not target) and new (in target, not baseline); a gap requirement is anything eliminated by accident, needing a target change. A describes a new element, not a gap requirement. C and D are not the definition."
    refs: ["ADM §13.3"]
    difficulty: 3
    tags: [requirements-management, gap]
    status: draft
  - id: F3-115
    unit: F3
    objective: "3.1"
    lesson: F3/02_the_adm_cycle_and_requirements_management
    stem: "Where are the first high-level architecture requirements articulated, and by what technique?"
    options:
      - {key: A, text: "In the Architecture Vision, by means of the business scenario or an analogous technique", correct: true}
      - {key: B, text: "In Phase F, by migration planning techniques"}
      - {key: C, text: "In the Preliminary Phase, by defining Architecture Principles"}
      - {key: D, text: "In Phase G, by compliance review"}
    explanation: "The first requirements come with the Architecture Vision via business scenarios or similar. Phase F plans migration. The Preliminary Phase defines principles, not requirements. Phase G reviews compliance."
    refs: ["ADM §13.5.2"]
    difficulty: 2
    tags: [requirements-management, business-scenarios]
    status: draft
  - id: F3-116
    unit: F3
    objective: "3.1"
    lesson: F3/02_the_adm_cycle_and_requirements_management
    stem: "During Phase C a new requirement is found that falls outside the scope of the current Statement of Architecture Work. What should be done with it?"
    options:
      - {key: A, text: "Document it in the Architecture Requirements Specification for the current cycle"}
      - {key: B, text: "Feed it into the Architecture Requirements Repository so the Requirements Management process can manage it", correct: true}
      - {key: C, text: "Discard it, since it is out of scope"}
      - {key: D, text: "Add it to the Architecture Contract"}
    explanation: "In-scope new requirements go into the Architecture Requirements Specification; out-of-scope ones go to the Architecture Requirements Repository for management. A is the in-scope route. C loses the requirement. D is a governance deliverable, not the requirements store."
    refs: ["ADM §13.5.2"]
    difficulty: 3
    tags: [requirements-management, situation]
    status: draft
  - id: F3-117
    unit: F3
    objective: "3.1"
    lesson: F3/02_the_adm_cycle_and_requirements_management
    stem: "Which of the following are listed as outputs of the Requirements Management process?"
    options:
      - {key: A, text: "Requirements Impact Assessment and an updated Architecture Requirements Specification, if necessary", correct: true}
      - {key: B, text: "Architecture Contract and Compliance Assessment"}
      - {key: C, text: "Implementation and Migration Plan"}
      - {key: D, text: "Request for Architecture Work"}
    explanation: "The outputs may include a Requirements Impact Assessment and an updated ARS, and the Architecture Requirements Repository is updated. B lists Phase G outputs. C is a Phase E/F output. D is an output of Preliminary, F and H."
    refs: ["ADM §13.4"]
    difficulty: 2
    tags: [requirements-management, outputs]
    status: draft
  - id: F3-118
    unit: F3
    objective: "3.1"
    lesson: F3/02_the_adm_cycle_and_requirements_management
    stem: "What does the TOGAF Standard mandate regarding the process and tools for Requirements Management?"
    options:
      - {key: A, text: "It mandates a specific COTS requirements tool"}
      - {key: B, text: "It mandates the use of business scenarios and no other technique"}
      - {key: C, text: "It mandates no specific process or tool; it states what an effective Requirements Management process should achieve", correct: true}
      - {key: D, text: "It requires all requirements to be stored in the Architecture Contract"}
    explanation: "The standard states the requirements for requirements rather than prescribing a process or tool. A and B over-prescribe; business scenarios are recommended, not mandated. D names the wrong store."
    refs: ["ADM §13.5.3"]
    difficulty: 2
    tags: [requirements-management]
    status: draft
  - id: F3-119
    unit: F3
    objective: "3.1"
    lesson: F3/02_the_adm_cycle_and_requirements_management
    stem: "Throughout the ADM cycle, results should be validated against what?"
    options:
      - {key: A, text: "The original expectations, both for the whole cycle and for the particular phase", correct: true}
      - {key: B, text: "The Architecture Board's meeting minutes"}
      - {key: C, text: "The previous year's budget"}
      - {key: D, text: "The TOGAF certification syllabus"}
    explanation: "The standard calls for frequent validation against the original expectations for the whole cycle and for the current phase. B, C and D are not the stated yardstick."
    refs: ["ADM §1.2.2"]
    difficulty: 2
    tags: [adm-cycle]
    status: draft
  # ------------------------------------------------------------ 3.2 adapting, scoping, iterating, governing
  - id: F3-120
    unit: F3
    objective: "3.2"
    lesson: F3/03_adapting_scoping_iterating_and_governing_the_adm
    stem: "Why does the standard say the order of ADM phases may depend on the maturity of the architecture discipline in the enterprise?"
    options:
      - {key: A, text: "Because immature enterprises must skip Phase A"}
      - {key: B, text: "Because where the case for doing architecture is not yet accepted, an Architecture Vision is nearly always essential, usually followed by a detailed Business Architecture to underpin that vision and win stakeholder participation", correct: true}
      - {key: C, text: "Because mature enterprises no longer need Requirements Management"}
      - {key: D, text: "Because the Architecture Board sets the order each year"}
    explanation: "The standard gives this maturity example: Vision first, then Business Architecture to detail the business case. A is the opposite of the advice. C contradicts the continuous nature of Requirements Management. D is invented."
    refs: ["ADM §1.3"]
    difficulty: 2
    tags: [adapting]
    status: draft
  - id: F3-121
    unit: F3
    objective: "3.2"
    lesson: F3/03_adapting_scoping_iterating_and_governing_the_adm
    stem: "An enterprise's business principles state that it will adjust its business processes to fit packaged software so it can respond quickly to the market. How might this affect the order of ADM phases?"
    options:
      - {key: A, text: "The Business Architecture may follow completion of the Information Systems or Technology Architecture", correct: true}
      - {key: B, text: "Phase A must be omitted"}
      - {key: C, text: "Phase H must be run first"}
      - {key: D, text: "The order cannot change under any principle"}
    explanation: "The standard uses this exact example: with such principles, the Business Architecture (or its completion) may come after the Information Systems or Technology Architecture. B and C are not stated. D contradicts the guidance that principles can define the order."
    refs: ["ADM §1.3"]
    difficulty: 3
    tags: [adapting, situation]
    status: draft
  - id: F3-122
    unit: F3
    objective: "3.2"
    lesson: F3/03_adapting_scoping_iterating_and_governing_the_adm
    stem: "Which of the following is a reason the standard gives for adapting the ADM?"
    options:
      - {key: A, text: "The enterprise is a small-to-medium enterprise wanting a cut-down method suited to fewer resources and less system complexity", correct: true}
      - {key: B, text: "The enterprise wants to avoid producing any deliverables"}
      - {key: C, text: "The enterprise wishes to remove Requirements Management from the cycle"}
      - {key: D, text: "The ADM cannot be used with other frameworks"}
    explanation: "A cut-down method for an SME is one of the listed reasons, alongside integration with other frameworks, outsourcing, very large enterprises and product lines. B is not a reason the standard recognises. C contradicts the continuous phase. D is the opposite of the integration reason."
    refs: ["ADM §1.3"]
    difficulty: 1
    tags: [adapting]
    status: draft
  - id: F3-123
    unit: F3
    objective: "3.2"
    lesson: F3/03_adapting_scoping_iterating_and_governing_the_adm
    stem: "What is the Architecture Board's responsibility regarding the ADM itself?"
    options:
      - {key: A, text: "To rewrite the ADM for each project"}
      - {key: B, text: "To satisfy itself that the method is applied correctly in every phase of an iteration, because complying with the ADM is fundamental to governing the architecture", correct: true}
      - {key: C, text: "To approve every artifact before it is drawn"}
      - {key: D, text: "To select the modelling tool"}
    explanation: "The ADM is a key process to be governed; the Board should satisfy itself it is applied correctly so all considerations are made and all deliverables produced. A, C and D are not stated responsibilities in this section."
    refs: ["ADM §1.4"]
    difficulty: 2
    tags: [governance, architecture-board]
    status: draft
  - id: F3-124
    unit: F3
    objective: "3.2"
    lesson: F3/03_adapting_scoping_iterating_and_governing_the_adm
    stem: "The ADM introduction says a governance repository should manage three major information areas. Which of the following is NOT one of them?"
    options:
      - {key: A, text: "Reference data, including a description of the governance procedures"}
      - {key: B, text: "Process status, such as outstanding compliance and dispensation requests"}
      - {key: C, text: "Audit information recording completed governance actions"}
      - {key: D, text: "Vendor price lists for procured components", correct: true}
    explanation: "The three areas are reference data, process status and audit information. Vendor pricing is not among them. A, B and C are the three listed."
    refs: ["ADM §1.4"]
    difficulty: 2
    tags: [governance, repository]
    status: draft
  - id: F3-125
    unit: F3
    objective: "3.2"
    lesson: F3/03_adapting_scoping_iterating_and_governing_the_adm
    stem: "The standard says most reasons to constrain the scope of architecture work relate to limits in three things. Which option lists them?"
    options:
      - {key: A, text: "The organisational authority of the team, the objectives and stakeholder concerns to be addressed, and the availability of people, finance and other resources", correct: true}
      - {key: B, text: "The number of domains, the number of phases and the number of tools"}
      - {key: C, text: "The size of the repository, the age of the standards and the maturity of the Board"}
      - {key: D, text: "The contract value, the vendor list and the delivery date"}
    explanation: "Authority, objectives and concerns, and resources are the three limits named. B, C and D are not the stated reasons."
    refs: ["ADM §1.5"]
    difficulty: 2
    tags: [scoping]
    status: draft
  - id: F3-126
    unit: F3
    objective: "3.2"
    lesson: F3/03_adapting_scoping_iterating_and_governing_the_adm
    stem: "Which four dimensions are typically used to define and limit the scope of an architecture?"
    options:
      - {key: A, text: "Breadth, depth, time period and architecture domains", correct: true}
      - {key: B, text: "Business, data, application and technology"}
      - {key: C, text: "Contextual, conceptual, logical and physical"}
      - {key: D, text: "Strategic, segment, capability and solution"}
    explanation: "Breadth, depth, time period and domains are the four scope dimensions. B lists the domains alone (one of the four dimensions). C lists abstraction levels. D lists Landscape levels plus an invented one."
    refs: ["ADM §1.5"]
    difficulty: 1
    tags: [scoping]
    status: draft
  - id: F3-127
    unit: F3
    objective: "3.2"
    lesson: F3/03_adapting_scoping_iterating_and_governing_the_adm
    stem: "In what order is the scope of an architecture typically expressed?"
    options:
      - {key: A, text: "Domains first, then breadth, depth and time"}
      - {key: B, text: "First breadth, depth and time; once those are understood, a suitable combination of domains is selected", correct: true}
      - {key: C, text: "Time first, then domains, then breadth"}
      - {key: D, text: "All four at once with no ordering"}
    explanation: "The standard says scope is first expressed in breadth, depth and time, then domains are chosen. A and C reorder it. D ignores the stated sequence."
    refs: ["ADM §1.5"]
    difficulty: 2
    tags: [scoping, ordering]
    status: draft
  - id: F3-128
    unit: F3
    objective: "3.2"
    lesson: F3/03_adapting_scoping_iterating_and_governing_the_adm
    stem: "In a large enterprise using federated architectures under a publish-and-subscribe model, which two processes does the standard say let usage of architecture material be monitored and compliance exhibited?"
    options:
      - {key: A, text: "A Compliance Assessment process and a dispensation process", correct: true}
      - {key: B, text: "A budgeting process and a procurement process"}
      - {key: C, text: "A gap analysis process and a migration planning process"}
      - {key: D, text: "A risk assessment process and a stakeholder mapping process"}
    explanation: "Compliance assessment describes what the user subscribes to and assesses compliance; dispensation grants exceptions with a strong business imperative. B, C and D are not the processes named for this purpose."
    refs: ["ADM §1.5.1"]
    difficulty: 3
    tags: [scoping, breadth, governance]
    status: draft
  - id: F3-129
    unit: F3
    objective: "3.2"
    lesson: F3/03_adapting_scoping_iterating_and_governing_the_adm
    stem: "When Target Architecture work is split into a distant Target and a series of Transition Architectures, which statement reflects the standard?"
    options:
      - {key: A, text: "Target Architectures are evolutionary and periodically reviewed; Transition Architectures are incremental and, by design, should not evolve during implementation of the increment", correct: true}
      - {key: B, text: "Transition Architectures evolve continuously; Target Architectures are frozen"}
      - {key: C, text: "Both must be frozen from the outset"}
      - {key: D, text: "Neither is ever reviewed once approved"}
    explanation: "Targets stay generic and are reviewed as business and technology change; Transitions are fixed to avoid a moving target during their short implementation window. B reverses the roles. C and D contradict the periodic review of Targets."
    refs: ["ADM §1.5.3"]
    difficulty: 2
    tags: [scoping, time-period, transition]
    status: draft
  - id: F3-130
    unit: F3
    objective: "3.2"
    lesson: F3/03_adapting_scoping_iterating_and_governing_the_adm
    stem: "Keeping a Transition Architecture unchanged during its implementation is only possible under what condition, according to the ADM?"
    options:
      - {key: A, text: "The implementation schedule is tightly controlled and fairly short, typically under two years", correct: true}
      - {key: B, text: "The Architecture Board meets monthly"}
      - {key: C, text: "No new technology is released during the period"}
      - {key: D, text: "The sponsor signs an Architecture Contract"}
    explanation: "The standard ties it to a tightly controlled and short schedule, typically under two years. B, C and D are not the stated condition."
    refs: ["ADM §1.5.3"]
    difficulty: 3
    tags: [scoping, time-period]
    status: draft
  - id: F3-131
    unit: F3
    objective: "3.2"
    lesson: F3/03_adapting_scoping_iterating_and_governing_the_adm
    stem: "How are architecture alternatives commonly defined in the method described in the ADM introduction?"
    options:
      - {key: A, text: "Per domain, to simplify analysis, with the per-domain alternatives later merged into an overall analysis", correct: true}
      - {key: B, text: "Only for the Technology domain"}
      - {key: C, text: "By the sponsor before the Vision is agreed"}
      - {key: D, text: "Only once, in Phase E"}
    explanation: "Alternatives are commonly defined per domain then merged; the method selects criteria, defines alternatives, then selects or combines, and can be used in any phase at any level. B, C and D each restrict it in ways the standard does not."
    refs: ["ADM §1.6"]
    difficulty: 3
    tags: [alternatives]
    status: draft
  - id: F3-132
    unit: F3
    objective: "3.2"
    lesson: F3/03_adapting_scoping_iterating_and_governing_the_adm
    stem: "What does the ADM introduction say about the current state of architecture integration?"
    options:
      - {key: A, text: "Integration is fully automated by modern tools"}
      - {key: B, text: "Only the lower end of the integratability spectrum is achievable today; granularity, level of detail and the maturity of interchange standards are the key factors", correct: true}
      - {key: C, text: "Integration is impossible and should not be attempted"}
      - {key: D, text: "Integration requires all architectures to use the same vendor"}
    explanation: "The standard says only the low end of the spectrum is achievable today and names granularity, detail and standards maturity as the factors. A overstates. C understates; integration is possible at the low end. D is invented."
    refs: ["ADM §1.7"]
    difficulty: 3
    tags: [integration]
    status: draft
  - id: F3-133
    unit: F3
    objective: "3.2"
    lesson: F3/03_adapting_scoping_iterating_and_governing_the_adm
    stem: "Which statement matches the summary of the ADM introduction chapter?"
    options:
      - {key: A, text: "The ADM recommends a sequence of phases but cannot recommend a scope; the organisation must decide scope, knowing the process is iterative and depth and breadth grow with each iteration", correct: true}
      - {key: B, text: "The ADM prescribes both the sequence and the scope of every architecture effort"}
      - {key: C, text: "The ADM prescribes scope but leaves the sequence to the organisation"}
      - {key: D, text: "The first iteration must cover the entire enterprise"}
    explanation: "Sequence is recommended, scope is the organisation's decision. B and C misassign scope. D contradicts the guidance to grow width and depth across iterations."
    refs: ["ADM §1.8"]
    difficulty: 2
    tags: [scoping, summary]
    status: draft
  - id: F3-134
    unit: F3
    objective: "3.2"
    lesson: F3/03_adapting_scoping_iterating_and_governing_the_adm
    stem: "The Applying the ADM document says 'iteration' describes three different things. Which option lists them?"
    options:
      - {key: A, text: "Describing a comprehensive Architecture Landscape through multiple ADM cycles; the integrated development of an architecture where phases interact within a cycle; and managing change to the Architecture Capability", correct: true}
      - {key: B, text: "Repeating Phase A, repeating Phase B and repeating Phase C"}
      - {key: C, text: "Daily, weekly and monthly iterations"}
      - {key: D, text: "Baseline, target and gap iterations"}
    explanation: "Multiple cycles across the landscape, iteration within a cycle, and capability iteration are the three. B and C are not the standard's meanings. D describes the passes within an Architecture Development iteration, not the three kinds."
    refs: ["APPLY §2.1"]
    difficulty: 2
    tags: [iteration]
    status: draft
  - id: F3-135
    unit: F3
    objective: "3.2"
    lesson: F3/03_adapting_scoping_iterating_and_governing_the_adm
    stem: "Which of the following is NOT one of the four suggested iteration cycles?"
    options:
      - {key: A, text: "Architecture Capability iterations"}
      - {key: B, text: "Architecture Development iterations"}
      - {key: C, text: "Requirements Management iterations", correct: true}
      - {key: D, text: "Transition Planning iterations"}
    explanation: "The four cycles are Architecture Capability, Architecture Development, Transition Planning and Architecture Governance. Requirements Management is the continuous central phase, not an iteration cycle. A, B and D are three of the four."
    refs: ["APPLY §2.2"]
    difficulty: 1
    tags: [iteration, cycles]
    status: draft
  - id: F3-136
    unit: F3
    objective: "3.2"
    lesson: F3/03_adapting_scoping_iterating_and_governing_the_adm
    stem: "In which situation is the Baseline First approach to architecture development most suitable?"
    options:
      - {key: A, text: "When the target state is agreed at a high level and the enterprise wants to transition to it efficiently"}
      - {key: B, text: "When the baseline is complex, not clearly understood, or not agreed upon, as is common where units have had a high degree of autonomy", correct: true}
      - {key: C, text: "When no stakeholders are available"}
      - {key: D, text: "When the Architecture Repository is empty"}
    explanation: "Baseline First suits a complex or disputed baseline. A is the Target First condition. C and D are not the stated criteria."
    refs: ["APPLY §2.4"]
    difficulty: 2
    tags: [iteration, baseline-first]
    status: draft
  - id: F3-137
    unit: F3
    objective: "3.2"
    lesson: F3/03_adapting_scoping_iterating_and_governing_the_adm
    stem: "When the baseline landscape is already broadly understood, which approach does the standard say usually yields higher value?"
    options:
      - {key: A, text: "Baseline First, documenting the baseline in full before any target work"}
      - {key: B, text: "Target First, elaborating the target and then describing the baseline only to the extent necessary to identify changes", correct: true}
      - {key: C, text: "Neither; both states must be developed in equal detail in parallel"}
      - {key: D, text: "Skipping Phases B to D entirely"}
    explanation: "With a broadly understood baseline, focusing on the target first and doing baseline work only as needed gives more value. A over-invests in the baseline. C contradicts the advice to prioritise one state for focus. D is not an option the standard offers."
    refs: ["APPLY §2.4"]
    difficulty: 2
    tags: [iteration, target-first]
    status: draft
  - id: F3-138
    unit: F3
    objective: "3.2"
    lesson: F3/03_adapting_scoping_iterating_and_governing_the_adm
    stem: "A change initiative arises from a prior architectural strategy: the desired outcome is already understood and agreed. Which engagement class is this, and which iteration cycles does it focus on?"
    options:
      - {key: A, text: "Architectural Definition of Bounded Change Initiatives, focusing on Architecture Development (Target First) and Transition Planning", correct: true}
      - {key: B, text: "Architectural Definition of Foundational Change Initiatives, focusing on Architecture Capability and Baseline First development"}
      - {key: C, text: "Supporting Business Strategy, focusing on Architecture Capability"}
      - {key: D, text: "Architectural Governance of Change Implementation, focusing on Architecture Governance"}
    explanation: "An agreed outcome makes it a bounded change initiative, elaborating the target to meet the agreed vision. B is for initiatives with a known objective but no agreed scope. C is strategy support outside a change initiative. D is implementation governance after the solution is defined."
    refs: ["APPLY §2.3"]
    difficulty: 3
    tags: [iteration, engagement, situation]
    status: draft
  - id: F3-139
    unit: F3
    objective: "3.2"
    lesson: F3/03_adapting_scoping_iterating_and_governing_the_adm
    stem: "The Applying the ADM document names three areas of engagement for architects. Which option lists them?"
    options:
      - {key: A, text: "Identification of required change, definition of change, and implementation of change", correct: true}
      - {key: B, text: "Business, information systems and technology"}
      - {key: C, text: "Strategy, tactics and operations"}
      - {key: D, text: "Preliminary, development and governance"}
    explanation: "Identification, definition and implementation of change are the three areas, each with its engagement classes. B lists domains. C and D are not the standard's grouping."
    refs: ["APPLY §2.3"]
    difficulty: 2
    tags: [iteration, engagement]
    status: draft
  - id: F3-140
    unit: F3
    objective: "3.2"
    lesson: F3/03_adapting_scoping_iterating_and_governing_the_adm
    stem: "If the expected level of stakeholder involvement in an iterative architecture process is high, what does the standard suggest about checkpoints?"
    options:
      - {key: A, text: "Very frequent but informal checkpoints to ensure the process is moving in the intended direction", correct: true}
      - {key: B, text: "Infrequent but formal checkpoints"}
      - {key: C, text: "No checkpoints, since stakeholders are already involved"}
      - {key: D, text: "A single checkpoint at the end of the cycle"}
    explanation: "High involvement suits frequent informal checkpoints; low involvement suits rarer formal ones. B is the low-involvement case. C and D ignore the guidance."
    refs: ["APPLY §2.5"]
    difficulty: 3
    tags: [iteration, checkpoints]
    status: draft
  - id: F3-141
    unit: F3
    objective: "3.2"
    lesson: F3/03_adapting_scoping_iterating_and_governing_the_adm
    stem: "In iteration between ADM cycles, which phase is used to initiate new, more detailed architecture development projects?"
    options:
      - {key: A, text: "Phase A"}
      - {key: B, text: "Phase F, Migration Planning", correct: true}
      - {key: C, text: "Phase H"}
      - {key: D, text: "The Preliminary Phase"}
    explanation: "Each iteration completes a cycle at one level of description, and Phase F initiates the more detailed projects beneath it. Phase A starts a cycle but is not the trigger for lower-level cycles in this model. Phase H manages change. The Preliminary Phase sets up the capability."
    refs: ["APPLY §2.5.1"]
    difficulty: 3
    tags: [iteration, levels]
    status: draft
  - id: F3-142
    unit: F3
    objective: "3.2"
    lesson: F3/03_adapting_scoping_iterating_and_governing_the_adm
    stem: "A Change Request in Phase H identifies new requirements for the organisation's Architecture Capability. Which kind of iteration does the standard describe for this?"
    options:
      - {key: A, text: "A new iteration of the Preliminary Phase to adjust the Architecture Capability", correct: true}
      - {key: B, text: "A new iteration of Phase E to reselect solutions"}
      - {key: C, text: "A new iteration of Phase B only"}
      - {key: D, text: "No iteration; capability changes are outside the ADM"}
    explanation: "Architecture Capability iteration re-runs the Preliminary Phase to adjust the capability, whether prompted by Phase A or by a Phase H Change Request. B and C target the wrong phases. D contradicts the standard."
    refs: ["APPLY §2.1", "APPLY §2.5.2"]
    difficulty: 2
    tags: [iteration, capability, situation]
    status: draft
  # ------------------------------------------------------------ 3.3 the ADM, the continuum and the repository
  - id: F3-143
    unit: F3
    objective: "3.3"
    lesson: F3/04_the_adm_the_continuum_and_the_repository
    stem: "According to the ADM introduction, what will the practical implementation of the Enterprise Continuum typically take the form of?"
    options:
      - {key: A, text: "An Architecture Repository containing reference architectures, models and patterns accepted for use, plus previous architecture work and work in progress", correct: true}
      - {key: B, text: "A Statement of Architecture Work"}
      - {key: C, text: "A set of Architecture Contracts"}
      - {key: D, text: "The TOGAF Library"}
    explanation: "The continuum is implemented as the Architecture Repository. B and C are deliverables. D is external guidance material that feeds the Reference Library, not the implementation of the continuum."
    refs: ["ADM §1.1.1"]
    difficulty: 1
    tags: [continuum, repository]
    status: draft
  - id: F3-144
    unit: F3
    objective: "3.3"
    lesson: F3/04_the_adm_the_continuum_and_the_repository
    stem: "Why does the standard say the first execution of the ADM is often the hardest?"
    options:
      - {key: A, text: "Because the Architecture Board has not yet been formed"}
      - {key: B, text: "Because the architecture assets available for reuse will be relatively scarce, though external assets such as the standard itself can still be leveraged", correct: true}
      - {key: C, text: "Because Requirements Management cannot run in the first cycle"}
      - {key: D, text: "Because the first cycle must cover all four domains at full depth"}
    explanation: "Reusable assets are scarce the first time; later executions get easier as the repository fills. A, C and D are not the stated reason."
    refs: ["ADM §1.1.1"]
    difficulty: 2
    tags: [repository, reuse]
    status: draft
  - id: F3-145
    unit: F3
    objective: "3.3"
    lesson: F3/04_the_adm_the_continuum_and_the_repository
    stem: "Who or what typically decides the criteria for including source materials in an organisation's Architecture Repository?"
    options:
      - {key: A, text: "The Enterprise Architecture Governance process", correct: true}
      - {key: B, text: "The tool vendor"}
      - {key: C, text: "Each project manager independently"}
      - {key: D, text: "The Open Group Architecture Forum"}
    explanation: "Inclusion criteria form part of the EA governance process, which weighs internal and external resources for adaptation and generalisation. B, C and D are not the deciding party."
    refs: ["ADM §1.1.1"]
    difficulty: 2
    tags: [repository, governance]
    status: draft
  - id: F3-146
    unit: F3
    objective: "3.3"
    lesson: F3/04_the_adm_the_continuum_and_the_repository
    stem: "In the wider context, the ADM can be viewed as which process?"
    options:
      - {key: A, text: "Populating the enterprise's own Architecture Repository with relevant reusable building blocks taken from the more generic side of the Enterprise Continuum", correct: true}
      - {key: B, text: "Replacing the Enterprise Continuum with a project plan"}
      - {key: C, text: "Removing generic assets from the repository"}
      - {key: D, text: "Certifying architects"}
    explanation: "Beyond developing a specific architecture, repeated ADM cycles populate the repository with building blocks from the generic, left side of the continuum. B, C and D are not descriptions the standard gives."
    refs: ["ADM §1.1.1"]
    difficulty: 2
    tags: [continuum, repository]
    status: draft
  - id: F3-147
    unit: F3
    objective: "3.3"
    lesson: F3/04_the_adm_the_continuum_and_the_repository
    stem: "The ADM contains reminders to consider which repository assets to use. Which example does the standard give for the development of a Technology Architecture?"
    options:
      - {key: A, text: "An industry e-commerce reference model"}
      - {key: B, text: "The TOGAF Foundation Architecture", correct: true}
      - {key: C, text: "The Statement of Architecture Work"}
      - {key: D, text: "The Communications Plan"}
    explanation: "For Technology Architecture the example is the TOGAF Foundation Architecture; the e-commerce reference model is the Business Architecture example. C and D are deliverables, not reusable reference assets."
    refs: ["ADM §1.1.1"]
    difficulty: 2
    tags: [repository, reuse]
    status: draft
  - id: F3-148
    unit: F3
    objective: "3.3"
    lesson: F3/04_the_adm_the_continuum_and_the_repository
    stem: "What does the ADM introduction say about using the ADM to populate an enterprise's Foundation Architecture?"
    options:
      - {key: A, text: "It cannot be used for that purpose"}
      - {key: B, text: "It can be, following similar principles to an enterprise architecture, except that requirements for the whole enterprise are restricted to overall concerns and so are less complete than for a specific enterprise", correct: true}
      - {key: C, text: "It requires a separate method defined in the TOGAF Library"}
      - {key: D, text: "It produces a fully coherent enterprise architecture automatically"}
    explanation: "The ADM can populate the Foundation Architecture with common models, policy definitions or mandated technology selections, with whole-enterprise requirements being less complete. A contradicts this. C is invented. D contradicts the warning that integrated models are not necessarily coherent."
    refs: ["ADM §1.1.2"]
    difficulty: 3
    tags: [foundation-architecture]
    status: draft
  - id: F3-149
    unit: F3
    objective: "3.3"
    lesson: F3/04_the_adm_the_continuum_and_the_repository
    stem: "Application of the ADM is supported by an extended set of resources. Which option lists where the standard says they are found?"
    options:
      - {key: A, text: "The ADM Techniques document, the TOGAF Series Guides, and White Papers and Guides in the TOGAF Library", correct: true}
      - {key: B, text: "Only the Architecture Development Method document"}
      - {key: C, text: "The Architecture Contract and the Compliance Assessment"}
      - {key: D, text: "ISO/IEC/IEEE 42010 only"}
    explanation: "Techniques, Series Guides and Library material are the three sources, kept separate so the ADM description stays uncluttered. B is too narrow. C names deliverables. D names an external standard the TOGAF Standard draws terminology from, not its supporting resources."
    refs: ["ADM §1.1.3"]
    difficulty: 2
    tags: [guidelines, techniques]
    status: draft
  - id: F3-150
    unit: F3
    objective: "3.3"
    lesson: F3/04_the_adm_the_continuum_and_the_repository
    stem: "Where does the standard say the governance artifacts and process are held?"
    options:
      - {key: A, text: "Outside the Architecture Repository, in a separate legal archive"}
      - {key: B, text: "They are themselves part of the contents of the Architecture Repository", correct: true}
      - {key: C, text: "In the TOGAF Library"}
      - {key: D, text: "In the Architecture Vision"}
    explanation: "Governance artifacts and process are part of the repository. A describes only Architecture Board minutes excluded for legal reasons, not the governance artifacts in general. C and D are wrong locations."
    refs: ["ADM §1.4"]
    difficulty: 2
    tags: [governance, repository]
    status: draft
  - id: F3-151
    unit: F3
    objective: "3.3"
    lesson: F3/04_the_adm_the_continuum_and_the_repository
    stem: "In terms of the Enterprise Continuum, which direction describes the ADM's adoption and adaptation of generic architectures to produce an enterprise-specific one, and which describes generalising a proven specific solution for reuse?"
    options:
      - {key: A, text: "Left to right for adopting generic assets; right to left for generalising specific ones", correct: true}
      - {key: B, text: "Right to left for adopting generic assets; left to right for generalising specific ones"}
      - {key: C, text: "Both are left to right"}
      - {key: D, text: "Both are top to bottom"}
    explanation: "Generic is on the left, specific on the right: adoption moves left to right, generalisation right to left. B reverses it. C and D ignore the two-way movement."
    refs: ["CONTENT §6.5"]
    difficulty: 2
    tags: [continuum, adm]
    status: draft
  - id: F3-152
    unit: F3
    objective: "3.3"
    lesson: F3/04_the_adm_the_continuum_and_the_repository
    stem: "The Architecture Repository is described as one part of what larger structure?"
    options:
      - {key: A, text: "The Enterprise Repository, which links architecture assets to detailed design, deployment and service management repositories", correct: true}
      - {key: B, text: "The TOGAF Library"}
      - {key: C, text: "The Architecture Contract"}
      - {key: D, text: "The Solutions Continuum"}
    explanation: "The Architecture Repository sits within the wider Enterprise Repository. B is external guidance material. C is a deliverable. D is a classification, not a container."
    refs: ["CONTENT §7.1"]
    difficulty: 2
    tags: [repository]
    status: draft
  - id: F3-153
    unit: F3
    objective: "3.3"
    lesson: F3/04_the_adm_the_continuum_and_the_repository
    stem: "Which repository area can use the Architecture Continuum as its classification scheme, with more reusable elements found toward the left?"
    options:
      - {key: A, text: "The Governance Repository"}
      - {key: B, text: "The Reference Library", correct: true}
      - {key: C, text: "The Architecture Requirements Repository"}
      - {key: D, text: "The Architecture Capability"}
    explanation: "The Reference Library can be organised by the Architecture Continuum from Foundation to Organization-Specific. The Governance Repository records governance; the Requirements Repository holds requirements; the Architecture Capability holds governance parameters."
    refs: ["CONTENT §7.3.1"]
    difficulty: 3
    tags: [repository, reference-library, continuum]
    status: draft
  - id: F3-154
    unit: F3
    objective: "3.3"
    lesson: F3/04_the_adm_the_continuum_and_the_repository
    stem: "Which phase is responsible for managing the contents of the Architecture Requirements Repository and ensuring requirements are available to all phases?"
    options:
      - {key: A, text: "Phase A"}
      - {key: B, text: "Requirements Management", correct: true}
      - {key: C, text: "Phase H"}
      - {key: D, text: "The Preliminary Phase"}
    explanation: "The Architecture Requirements Repository is used by all phases and managed by Requirements Management. Phase A originates the first requirements but does not manage the repository. Phase H manages architecture change. The Preliminary Phase establishes the capability."
    refs: ["CONTENT §7.6.1"]
    difficulty: 2
    tags: [repository, requirements-management]
    status: draft
  - id: F3-155
    unit: F3
    objective: "3.3"
    lesson: F3/04_the_adm_the_continuum_and_the_repository
    stem: "What does each iteration of the ADM do to the organisation-specific landscape?"
    options:
      - {key: A, text: "Nothing; the landscape is only updated in Phase H"}
      - {key: B, text: "It fills the landscape with every architecture asset the iteration identified and used, including the final organisation-specific architecture it delivered", correct: true}
      - {key: C, text: "It resets the landscape to the Foundation Architecture"}
      - {key: D, text: "It archives the landscape and starts a new one"}
    explanation: "Each iteration adds the assets it used and produced to the landscape. A limits updates to one phase, which the standard does not. C and D describe destructive actions the standard does not prescribe."
    refs: ["ADM §1.1.1"]
    difficulty: 2
    tags: [landscape, repository]
    status: draft
  - id: F3-156
    unit: F3
    objective: "3.3"
    lesson: F3/04_the_adm_the_continuum_and_the_repository
    stem: "The Architecture Content document says the simplest way to think of the Enterprise Continuum is as what?"
    options:
      - {key: A, text: "A view of the repository of all the architecture assets, both within the enterprise and in the IT industry at large, that the enterprise considers available", correct: true}
      - {key: B, text: "A list of the ADM phases"}
      - {key: C, text: "The organisation chart of the architecture team"}
      - {key: D, text: "A timeline of Transition Architectures"}
    explanation: "The continuum is a view over all available architecture assets, internal and external, such as previous deliverables and industry reference models. B, C and D are unrelated structures."
    refs: ["CONTENT §6.2"]
    difficulty: 2
    tags: [continuum]
    status: draft
  - id: F3-157
    unit: F3
    objective: "3.3"
    lesson: F3/04_the_adm_the_continuum_and_the_repository
    stem: "According to the Architecture Content document, what determines which architecture and solution artifacts an organisation includes in its Architecture Repository, and what is the major consideration?"
    options:
      - {key: A, text: "The Enterprise Architecture determines it, with reuse as a major consideration", correct: true}
      - {key: B, text: "The tool vendor determines it, with licensing cost as the consideration"}
      - {key: C, text: "The sponsor determines it, with budget as the consideration"}
      - {key: D, text: "The Open Group determines it, with certification as the consideration"}
    explanation: "The enterprise architecture decides inclusion and reuse is the major factor. B, C and D name parties and criteria the standard does not."
    refs: ["CONTENT §6.2"]
    difficulty: 3
    tags: [repository, reuse]
    status: draft
  - id: F3-158
    unit: F3
    objective: "3.3"
    lesson: F3/04_the_adm_the_continuum_and_the_repository
    stem: "Which statement about the Solutions Landscape is correct?"
    options:
      - {key: A, text: "It holds the SBBs supporting the specified ABBs, categorised by the continuum or as strategic, segment or capability SBBs, but not the data content produced by the solutions", correct: true}
      - {key: B, text: "It holds the information and data produced by deployed solutions"}
      - {key: C, text: "It holds only Architecture Building Blocks"}
      - {key: D, text: "It is another name for the Architecture Landscape"}
    explanation: "The Solutions Landscape holds SBBs and may include tools, systems and services describing actual solutions; the data those solutions produce is the solutions' own responsibility. B is explicitly excluded. C names the wrong block type. D confuses two distinct repository areas."
    refs: ["CONTENT §7.7"]
    difficulty: 3
    tags: [repository, solutions-landscape]
    status: draft
