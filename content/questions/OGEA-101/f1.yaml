  - id: F1-170
    unit: F1
    objective: "1.5"
    lesson: F1/06_continuum_repository_and_capability
    stem: "The Architecture Landscape is divided into three levels of granularity. Which level is used at the programme or portfolio level to organise and align change activity?"
    options:
      - {key: A, text: "Strategic Architecture"}
      - {key: B, text: "Segment Architecture", correct: true}
      - {key: C, text: "Capability Architecture"}
      - {key: D, text: "Foundation Architecture"}
    explanation: "Segment Architectures give more detailed operating models for areas of the enterprise at programme or portfolio level. Strategic Architectures are the executive-level summary of the whole enterprise. Capability Architectures show how one unit of capability is supported. Foundation Architecture is a continuum stage, not a Landscape level."
    refs: ["CONTENT §7.2"]
    difficulty: 2
    tags: [landscape, levels]
    status: draft
  - id: F1-171
    unit: F1
    objective: "1.5"
    lesson: F1/06_continuum_repository_and_capability
    stem: "According to the Core Concepts chapter, an Enterprise Architecture Capability is put in place through which of the following?"
    options:
      - {key: A, text: "Organisation structures, roles, responsibilities, skills and processes", correct: true}
      - {key: B, text: "A modelling tool and a repository"}
      - {key: C, text: "A signed Architecture Contract"}
      - {key: D, text: "Completion of Phase A"}
    explanation: "The capability is a business capability for architecture built from structures, roles, responsibilities, skills and processes. Tools and a repository support it but do not constitute it. A contract is a governance deliverable. Phase A starts a cycle; the capability is established in the Preliminary Phase and beyond."
    refs: ["INTRO §3.12"]
    difficulty: 1
    tags: [capability]
    status: draft
  - id: F1-172
    unit: F1
    objective: "1.5"
    lesson: F1/06_continuum_repository_and_capability
    stem: "The standard says an EA practice should be run like a business and lists management capabilities it should establish beyond the ADM. Which of the following is NOT on that list?"
    options:
      - {key: A, text: "Financial Management"}
      - {key: B, text: "Supplier Management"}
      - {key: C, text: "Software Development Management", correct: true}
      - {key: D, text: "Configuration Management"}
    explanation: "The ten areas are financial, performance, service, risk and opportunity, resource, communications and stakeholder, quality, supplier, configuration and environment management. Software development is not one of them. A, B and D are all listed."
    refs: ["INTRO §3.13"]
    difficulty: 3
    tags: [capability]
    status: draft
  - id: F1-173
    unit: F1
    objective: "1.5"
    lesson: F1/06_continuum_repository_and_capability
    stem: "Which of the following is listed as a benefit of Architecture Governance in the Core Concepts chapter?"
    options:
      - {key: A, text: "Elimination of the need for an Architecture Board"}
      - {key: B, text: "Protection of the existing asset base through maximising reuse of existing architectural components", correct: true}
      - {key: C, text: "Guaranteed delivery of every project on time"}
      - {key: D, text: "Removal of all risk from transformation"}
    explanation: "Asset protection through reuse is one of the listed benefits, alongside transparency of accountability, proactive risk management, and value creation through measurement. A contradicts the governance structures the standard describes. C and D are overclaims the standard does not make."
