# Authored F1 bank (learn_togaf.md §2, §6). Every question is original paraphrase, cites the
# section(s) that entail the answer, and is status: draft until reviewed.
code: F1_BANK
exam: OGEA-101
name: F1 Concepts drill bank
kind: DRILL
source: authored
questions:
  # ------------------------------------------------------------ 1.1 what EA is, why TOGAF
  - id: F1-101
    unit: F1
    objective: "1.1"
    lesson: F1/03_enterprise_architecture_and_the_togaf_standard
    stem: "According to the TOGAF Standard, what is an 'enterprise'?"
    options:
      - {key: A, text: "Any collection of organisations that have a common set of goals", correct: true}
      - {key: B, text: "A single legal company with its own IT department"}
      - {key: C, text: "The IT infrastructure that supports a business"}
      - {key: D, text: "A government body that regulates an industry"}
    explanation: "The standard defines an enterprise by shared goals, not legal form: a corporation, a division, an agency, a chain of sites under common ownership, or a consortium all qualify. B is too narrow (a division or a partnership also counts). C confuses the enterprise with its technology. D is one example of an organisation, not the definition."
    refs: ["INTRO §1.1"]
    difficulty: 1
    tags: [enterprise, definitions]
    status: draft
  - id: F1-102
    unit: F1
    objective: "1.1"
    lesson: F1/03_enterprise_architecture_and_the_togaf_standard
    stem: "Which of the following is NOT given by the standard as an example of an enterprise?"
    options:
      - {key: A, text: "A division of a corporation"}
      - {key: B, text: "A single government department"}
      - {key: C, text: "A single software application and its users", correct: true}
      - {key: D, text: "A supply chain of partner businesses"}
    explanation: "The examples are a corporation or division, a government agency or department, a chain linked by common ownership, groups of governments, and partnerships such as a consortium or supply chain. An application is a component inside an enterprise, not an enterprise. A, B and D are all listed examples."
    refs: ["INTRO §1.1"]
    difficulty: 1
    tags: [enterprise]
    status: draft
  - id: F1-103
    unit: F1
    objective: "1.1"
    lesson: F1/03_enterprise_architecture_and_the_togaf_standard
    stem: "What does the standard state as the purpose of enterprise architecture?"
    options:
      - {key: A, text: "To document every IT system in the enterprise for audit purposes"}
      - {key: B, text: "To optimise the fragmented legacy of processes into an integrated environment that is responsive to change and supports the business strategy", correct: true}
      - {key: C, text: "To select the technology vendors the enterprise will standardise on"}
      - {key: D, text: "To replace project management with an architecture-led method"}
    explanation: "The purpose is integration of a fragmented process legacy into an environment that responds to change and delivers the strategy. A reduces EA to documentation, which the standard explicitly warns against. C is a possible outcome of technology work, not the purpose. D is invented; the ADM sits beside project management processes."
    refs: ["INTRO §1.1"]
    difficulty: 1
    tags: [purpose-of-ea]
    status: draft
  - id: F1-104
    unit: F1
    objective: "1.1"
    lesson: F1/03_enterprise_architecture_and_the_togaf_standard
    stem: "Which of the following is NOT one of the reasons the standard lists for embarking on an enterprise architecture review or development?"
    options:
      - {key: A, text: "A business-driven initiative to enable business transformation"}
      - {key: B, text: "A technology-driven initiative for efficiency and cost reduction"}
      - {key: C, text: "The arrival of the annual budgeting cycle", correct: true}
      - {key: D, text: "Management of technical debt accrued by Agile development"}
    explanation: "The four named triggers are business-driven transformation, technology-driven efficiency, merger or acquisition, and technical debt from Agile initiatives. A budget cycle is not among them. A, B and D are all on the list."
    refs: ["INTRO §1.1"]
    difficulty: 2
    tags: [triggers]
    status: draft
  - id: F1-105
    unit: F1
    objective: "1.1"
    lesson: F1/03_enterprise_architecture_and_the_togaf_standard
    stem: "The standard says the architect addresses stakeholder concerns in three ways. Which option is NOT one of them?"
    options:
      - {key: A, text: "Identifying and refining the stakeholders' requirements"}
      - {key: B, text: "Developing views of the architecture that show how concerns will be addressed"}
      - {key: C, text: "Showing the trade-offs made in reconciling conflicting concerns"}
      - {key: D, text: "Approving the funding for each stakeholder's initiative", correct: true}
    explanation: "Requirements, views and trade-offs are the three listed activities. Funding approval is a management or sponsor decision, not the architect's role in the standard's description. A, B and C are the three listed."
    refs: ["INTRO §1.1"]
    difficulty: 2
    tags: [stakeholders, architect-role]
    status: draft
  - id: F1-106
    unit: F1
    objective: "1.1"
    lesson: F1/03_enterprise_architecture_and_the_togaf_standard
    stem: "When does the standard say enterprise architecture should be done to give the greatest benefit?"
    options:
      - {key: A, text: "After the key decisions have been taken, so the architecture can record them"}
      - {key: B, text: "Only during the implementation phase of a programme"}
      - {key: C, text: "Early and throughout the change process, so decision-makers understand the implications of their decisions", correct: true}
      - {key: D, text: "Once a year, as part of strategic planning"}
    explanation: "EA should be done early and throughout change. A describes what the standard calls mere documentation or enforcement of decisions with no insight gained. B limits it to one phase. D is not stated anywhere."
    refs: ["INTRO §1.1"]
    difficulty: 1
    tags: [when-ea]
    status: draft
  - id: F1-107
    unit: F1
    objective: "1.1"
    lesson: F1/03_enterprise_architecture_and_the_togaf_standard
    stem: "Which statement best describes an architecture framework, as the Executive Overview defines it?"
    options:
      - {key: A, text: "A foundational structure, or set of structures, used to develop a broad range of different architectures", correct: true}
      - {key: B, text: "A completed reference architecture that enterprises copy"}
      - {key: C, text: "A database that stores all architecture deliverables"}
      - {key: D, text: "A certification scheme for enterprise architects"}
    explanation: "A framework is a foundational structure for developing many architectures, including a method for describing baseline and target states in building blocks and planning the move between them. B describes a reference architecture, which a framework may use but is not. C is the Architecture Repository. D is unrelated."
    refs: ["INTRO §1.1"]
    difficulty: 2
    tags: [framework]
    status: draft
  - id: F1-108
    unit: F1
    objective: "1.1"
    lesson: F1/03_enterprise_architecture_and_the_togaf_standard
    stem: "The benefit that buying decisions become simpler because the information governing procurement is available in a coherent plan belongs to which benefit group in the standard?"
    options:
      - {key: A, text: "More effective strategic decision-making"}
      - {key: B, text: "Better return on existing investment"}
      - {key: C, text: "Faster, simpler and cheaper procurement", correct: true}
      - {key: D, text: "More effective and efficient business operations"}
    explanation: "Simpler buying decisions and faster, multi-vendor procurement are listed under the procurement group. A covers agility and transformation; B covers reduced complexity and make/buy/outsource flexibility; D covers operating cost and productivity."
    refs: ["INTRO §1.1"]
    difficulty: 2
    tags: [benefits]
    status: draft
  - id: F1-109
    unit: F1
    objective: "1.1"
    lesson: F1/03_enterprise_architecture_and_the_togaf_standard
    stem: "A retail group wants its business units to innovate with new digital products while the shared operations stay efficient and coherent. Which stated capability of a good enterprise architecture addresses this?"
    options:
      - {key: A, text: "Striking the right balance between business transformation and continuous operational efficiency, letting units innovate safely under an integrated strategy", correct: true}
      - {key: B, text: "Preventing business units from changing processes without central approval"}
      - {key: C, text: "Outsourcing operations so that units can focus on innovation"}
      - {key: D, text: "Standardising all units on a single product catalogue"}
    explanation: "The standard says a good EA balances transformation against operational efficiency so units can innovate safely while the enterprise keeps an integrated strategy. B is control, not balance, and is not stated. C and D are specific tactics the standard does not prescribe."
    refs: ["INTRO §1.1"]
    difficulty: 2
    tags: [benefits, situation]
    status: draft
  - id: F1-110
    unit: F1
    objective: "1.1"
    lesson: F1/03_enterprise_architecture_and_the_togaf_standard
    stem: "The first version of the TOGAF Standard was based on which earlier framework?"
    options:
      - {key: A, text: "The Zachman Framework"}
      - {key: B, text: "TAFIM, developed by the US Department of Defense", correct: true}
      - {key: C, text: "ITIL"}
      - {key: D, text: "The IT4IT Reference Architecture"}
    explanation: "Version 1 in 1995 was built on the US DoD's TAFIM with its explicit permission. Zachman is a separate framework the ADM can be integrated with. ITIL is a service management practice named as something to integrate with. IT4IT is Open Group reference material in the TOGAF Library."
    refs: ["INTRO §1"]
    difficulty: 2
    tags: [history]
    status: draft
  - id: F1-111
    unit: F1
    objective: "1.1"
    lesson: F1/03_enterprise_architecture_and_the_togaf_standard
    stem: "Who develops and maintains the TOGAF Standard?"
    options:
      - {key: A, text: "The ISO/IEC/IEEE 42010 working group"}
      - {key: B, text: "The US Department of Defense"}
      - {key: C, text: "Members of The Open Group working within the Architecture Forum", correct: true}
      - {key: D, text: "An independent certification body"}
    explanation: "The standard is developed and maintained by Open Group members in the Architecture Forum. ISO 42010 is a standard the TOGAF Standard draws terminology from. The DoD supplied the original TAFIM but does not maintain TOGAF. D is invented."
    refs: ["INTRO §1"]
    difficulty: 1
    tags: [open-group]
    status: draft
  - id: F1-112
    unit: F1
    objective: "1.1"
    lesson: F1/03_enterprise_architecture_and_the_togaf_standard
    stem: "In the Core Concepts chapter, what is the TOGAF Standard said to be?"
    options:
      - {key: A, text: "A modelling notation for describing enterprise systems"}
      - {key: B, text: "An architecture framework providing methods and tools for the acceptance, production, use and maintenance of an enterprise architecture", correct: true}
      - {key: C, text: "A reference architecture for information systems"}
      - {key: D, text: "A project management method for IT programmes"}
    explanation: "It is an architecture framework with methods and tools, based on an iterative process model, best practice and reusable assets. A describes ArchiMate or UML, which the standard may use but is not. C describes the TRM or III-RM. D is a category the ADM complements, not one it belongs to."
    refs: ["INTRO §3.1"]
    difficulty: 1
    tags: [what-togaf-is]
    status: draft
  - id: F1-113
    unit: F1
    objective: "1.1"
    lesson: F1/03_enterprise_architecture_and_the_togaf_standard
    stem: "Why does the Executive Overview say privacy legislation has made enterprise architecture documentation crucial?"
    options:
      - {key: A, text: "Because regulators require the use of the TOGAF Standard"}
      - {key: B, text: "Because processes around personal data must be documented in a way untrained readers such as data subjects and judges can understand", correct: true}
      - {key: C, text: "Because privacy law forbids storing architecture models in the cloud"}
      - {key: D, text: "Because personal data must be removed from all architecture artifacts"}
    explanation: "The point is legal: global privacy legislation demands documented personal-data processes readable by lay people, with significant penalties for failure. A, C and D are not claims the standard makes."
    refs: ["INTRO §1.1"]
    difficulty: 3
    tags: [why-ea, privacy]
    status: draft
  - id: F1-114
    unit: F1
    objective: "1.1"
    lesson: F1/03_enterprise_architecture_and_the_togaf_standard
    stem: "Which statement about the guidance in the TOGAF Standard is consistent with its value proposition?"
    options:
      - {key: A, text: "It must be applied exactly as written to preserve certification"}
      - {key: B, text: "It is intended to be adapted to different needs and use cases, including Agile enterprises and digital transformation", correct: true}
      - {key: C, text: "It applies only to organisations with a large IT function"}
      - {key: D, text: "It replaces the need for stakeholder involvement"}
    explanation: "A key consideration is that the guidance is meant to be adapted to particular needs and use cases. A contradicts that. C contradicts the breadth of enterprises the standard addresses. D contradicts the emphasis on stakeholders throughout."
    refs: ["INTRO §1.1"]
    difficulty: 2
    tags: [adaptation, value-proposition]
    status: draft
  # ------------------------------------------------------------ 1.2 structure of the standard
  - id: F1-115
    unit: F1
    objective: "1.2"
    lesson: F1/03_enterprise_architecture_and_the_togaf_standard
    stem: "Which of the following is NOT one of the six documents of the TOGAF Fundamental Content?"
    options:
      - {key: A, text: "Architecture Development Method"}
      - {key: B, text: "ADM Techniques"}
      - {key: C, text: "Business Scenarios", correct: true}
      - {key: D, text: "Applying the ADM"}
    explanation: "The six are Introduction and Core Concepts, Architecture Development Method, ADM Techniques, Applying the ADM, Architecture Content, and EA Capability and Governance. Business Scenarios is a TOGAF Series Guide. A, B and D are Fundamental Content documents."
    refs: ["INTRO §2.2"]
    difficulty: 1
    tags: [structure, documents]
    status: draft
  - id: F1-116
    unit: F1
    objective: "1.2"
    lesson: F1/03_enterprise_architecture_and_the_togaf_standard
    stem: "Which Fundamental Content document describes the Content Framework, the metamodel for artifacts and the use of reusable Architecture Building Blocks?"
    options:
      - {key: A, text: "Introduction and Core Concepts"}
      - {key: B, text: "Architecture Content", correct: true}
      - {key: C, text: "ADM Techniques"}
      - {key: D, text: "EA Capability and Governance"}
    explanation: "Architecture Content holds the Content Framework, the metamodel, ABBs and deliverable descriptions. Introduction and Core Concepts only overviews them. ADM Techniques holds techniques such as gap analysis. EA Capability and Governance covers the architecture function and governance."
    refs: ["INTRO §2.2"]
    difficulty: 1
    tags: [structure, documents]
    status: draft
  - id: F1-117
    unit: F1
    objective: "1.2"
    lesson: F1/03_enterprise_architecture_and_the_togaf_standard
    stem: "An architect needs guidance on the organisation, roles, skills and responsibilities of an architecture function, and on a governance framework. Which document should they open?"
    options:
      - {key: A, text: "Applying the ADM"}
      - {key: B, text: "Architecture Content"}
      - {key: C, text: "EA Capability and Governance", correct: true}
      - {key: D, text: "ADM Techniques"}
    explanation: "EA Capability and Governance covers organisation, processes, skills, roles and responsibilities plus the governance framework. Applying the ADM is about adapting the method to a style. Architecture Content is about work products. ADM Techniques is a collection of techniques."
    refs: ["INTRO §2.2"]
    difficulty: 1
    tags: [structure, documents]
    status: draft
  - id: F1-118
    unit: F1
    objective: "1.2"
    lesson: F1/03_enterprise_architecture_and_the_togaf_standard
    stem: "Which document contains guidelines for adapting the ADM to the particular style of architecture a practical situation calls for?"
    options:
      - {key: A, text: "Applying the ADM", correct: true}
      - {key: B, text: "Architecture Development Method"}
      - {key: C, text: "Introduction and Core Concepts"}
      - {key: D, text: "The TOGAF Library"}
    explanation: "Applying the ADM is defined by exactly that purpose: guidelines for adapting the ADM to a style in a practical context. The ADM document describes the method itself. Introduction and Core Concepts is the overview. The TOGAF Library is supplementary material outside the Fundamental Content."
    refs: ["INTRO §2.2"]
    difficulty: 2
    tags: [structure, documents]
    status: draft
  - id: F1-119
    unit: F1
    objective: "1.2"
    lesson: F1/03_enterprise_architecture_and_the_togaf_standard
    stem: "What is the TOGAF Library?"
    options:
      - {key: A, text: "The set of six documents that make up the Fundamental Content"}
      - {key: B, text: "A portfolio of additional guidance material that supports the practical application of the TOGAF approach", correct: true}
      - {key: C, text: "The part of the Architecture Repository that stores standards"}
      - {key: D, text: "The collection of certified TOGAF tools"}
    explanation: "The Library is a reference library of guidelines, templates, patterns and other material accompanying the standard. A is the Fundamental Content. C is the Standards Library inside the repository. D is not a concept in the standard."
    refs: ["INTRO §2.1", "INTRO §2.3"]
    difficulty: 1
    tags: [togaf-library]
    status: draft
  - id: F1-120
    unit: F1
    objective: "1.2"
    lesson: F1/03_enterprise_architecture_and_the_togaf_standard
    stem: "The TOGAF Library supports which class of information in the TOGAF Architecture Repository?"
    options:
      - {key: A, text: "The Governance Repository"}
      - {key: B, text: "The Standards Library"}
      - {key: C, text: "The Reference Library", correct: true}
      - {key: D, text: "The Solutions Landscape"}
    explanation: "The Library is described as supporting the Reference Library, which holds guidelines, templates and patterns. The Governance Repository records governance activity, the Standards Library holds standards to comply with, and the Solutions Landscape holds SBBs."
    refs: ["INTRO §2.3"]
    difficulty: 2
    tags: [togaf-library, repository]
    status: draft
  - id: F1-121
    unit: F1
    objective: "1.2"
    lesson: F1/03_enterprise_architecture_and_the_togaf_standard
    stem: "Which statement about the TOGAF Series Guides is correct?"
    options:
      - {key: A, text: "They form part of the TOGAF Standard and evolve more rapidly than the core content", correct: true}
      - {key: B, text: "They are the six core documents of the standard"}
      - {key: C, text: "They are external white papers with no formal status"}
      - {key: D, text: "Every guide must be applied on every architecture engagement"}
    explanation: "The Standard comprises the Fundamental Content plus the Series Guides, and the guides evolve faster to cover emerging needs. B describes the Fundamental Content. C is closer to the TOGAF Library's white papers. D is contradicted: not every guide is relevant in every situation."
    refs: ["INTRO §2.2"]
    difficulty: 2
    tags: [series-guides]
    status: draft
  - id: F1-122
    unit: F1
    objective: "1.2"
    lesson: F1/03_enterprise_architecture_and_the_togaf_standard
    stem: "An organisation new to the TOGAF approach wants to adopt the ADM process now and consider the Architecture Capability material later. What is the standard's position?"
    options:
      - {key: A, text: "This is not allowed; the documents must be adopted together"}
      - {key: B, text: "This is encouraged; the documents are free-standing so particular ones can be adopted while others are excluded", correct: true}
      - {key: C, text: "This is allowed only after certification of the architecture team"}
      - {key: D, text: "This is allowed only if the organisation already uses another framework"}
    explanation: "The split into independent documents exists so areas can be adopted in isolation, and incremental adoption by newcomers is one of the two situations explicitly encouraged. A contradicts that. C is invented. D describes the other encouraged situation (merging with an existing framework), not a precondition."
    refs: ["INTRO §2.2"]
    difficulty: 2
    tags: [adoption, situation]
    status: draft
  - id: F1-123
    unit: F1
    objective: "1.2"
    lesson: F1/03_enterprise_architecture_and_the_togaf_standard
    stem: "The standard describes itself as a 'foundational framework'. What does this mean?"
    options:
      - {key: A, text: "It can be applied to developing any kind of architecture in any context", correct: true}
      - {key: B, text: "It defines the Foundation Architecture of every enterprise"}
      - {key: C, text: "It is the first framework an organisation must adopt before any other"}
      - {key: D, text: "It applies only to infrastructure and technology architecture"}
    explanation: "Foundational means generally applicable, supplemented by the Library for specific contexts. B confuses the term with the Foundation Architecture stage of the continuum. C and D are not claims the standard makes."
    refs: ["INTRO §2.2"]
    difficulty: 2
    tags: [structure]
    status: draft
  - id: F1-124
    unit: F1
    objective: "1.2"
    lesson: F1/03_enterprise_architecture_and_the_togaf_standard
    stem: "The structure of the TOGAF Standard is said to reflect the structure and content of what?"
    options:
      - {key: A, text: "The ISO/IEC/IEEE 42010 standard"}
      - {key: B, text: "An Architecture Capability within an enterprise", correct: true}
      - {key: C, text: "A typical IT department"}
      - {key: D, text: "The phases of a software development lifecycle"}
    explanation: "The standard's structure mirrors an Architecture Capability within an enterprise. ISO 42010 supplies terminology, not structure. C and D are not stated."
    refs: ["INTRO §2.2"]
    difficulty: 3
    tags: [structure]
    status: draft
  - id: F1-125
    unit: F1
    objective: "1.2"
    lesson: F1/03_enterprise_architecture_and_the_togaf_standard
    stem: "The ADM document concentrates on WHAT may be done when defining and deploying an enterprise architecture. Where does the standard say guidance on HOW to do it can be found?"
    options:
      - {key: A, text: "In the Definitions chapter"}
      - {key: B, text: "In the TOGAF Series Guides", correct: true}
      - {key: C, text: "In the Architecture Content document"}
      - {key: D, text: "In the Architecture Requirements Specification"}
    explanation: "The Core Concepts chapter says the phase descriptions recommend what may be done and the Series Guides give how-to guidance. Definitions is vocabulary. Architecture Content describes work products. The ARS is a deliverable, not guidance."
    refs: ["INTRO §3.4", "INTRO §2.2"]
    difficulty: 2
    tags: [series-guides]
    status: draft
  - id: F1-126
    unit: F1
    objective: "1.2"
    lesson: F1/03_enterprise_architecture_and_the_togaf_standard
    stem: "Under whose governance is the TOGAF Library maintained?"
    options:
      - {key: A, text: "The Open Group Architecture Forum", correct: true}
      - {key: B, text: "Each enterprise's Architecture Board"}
      - {key: C, text: "The ISO technical committee for systems engineering"}
      - {key: D, text: "The vendors who contribute reference models"}
    explanation: "The Library is maintained under the governance of the Architecture Forum, the same body that evolves the standard. An enterprise's Architecture Board governs that enterprise's architecture, not the Library. C and D are invented."
    refs: ["INTRO §2.3"]
    difficulty: 2
    tags: [togaf-library]
    status: draft
  - id: F1-127
    unit: F1
    objective: "1.2"
    lesson: F1/03_enterprise_architecture_and_the_togaf_standard
    stem: "Which of the following is NOT listed as an area addressed by the TOGAF Series Guides?"
    options:
      - {key: A, text: "Security architecture and risk management"}
      - {key: B, text: "Supporting the Agile enterprise"}
      - {key: C, text: "The definitions of the core terms used across the standard", correct: true}
      - {key: D, text: "Supporting the digital enterprise"}
    explanation: "Definitions live in Chapter 4 of Introduction and Core Concepts, part of the Fundamental Content. Security, Agile and digital are all listed guide areas."
    refs: ["INTRO §2.2", "INTRO §1.2"]
    difficulty: 2
    tags: [series-guides]
    status: draft
  - id: F1-128
    unit: F1
    objective: "1.2"
    lesson: F1/03_enterprise_architecture_and_the_togaf_standard
    stem: "Within the Introduction and Core Concepts document, which chapter contains the definitions of terms used consistently across the standard?"
    options:
      - {key: A, text: "Chapter 1, Introduction"}
      - {key: B, text: "Chapter 2, The TOGAF Documentation Set"}
      - {key: C, text: "Chapter 3, Core Concepts"}
      - {key: D, text: "Chapter 4, Definitions", correct: true}
    explanation: "Chapter 4 holds the definitions; Appendix B holds supplementary ones. Chapter 1 is the general introduction, Chapter 2 describes the documentation set, and Chapter 3 the core concepts."
    refs: ["INTRO §1.2"]
    difficulty: 1
    tags: [structure]
    status: draft
  # ------------------------------------------------------------ 1.3 the four domains
  - id: F1-129
    unit: F1
    objective: "1.3"
    lesson: F1/04_architecture_domains_and_abstraction
    stem: "Which architecture domain defines the business strategy, governance, organisation and key business processes?"
    options:
      - {key: A, text: "Business Architecture", correct: true}
      - {key: B, text: "Data Architecture"}
      - {key: C, text: "Application Architecture"}
      - {key: D, text: "Technology Architecture"}
    explanation: "That is the standard's description of Business Architecture. Data Architecture covers data assets and data management resources; Application Architecture covers applications and their interactions; Technology Architecture covers infrastructure capabilities and standards."
    refs: ["INTRO §3.3"]
    difficulty: 1
    tags: [domains]
    status: draft
  - id: F1-130
    unit: F1
    objective: "1.3"
    lesson: F1/04_architecture_domains_and_abstraction
    stem: "Which domain describes the structure of an organisation's logical and physical data assets and its data management resources?"
    options:
      - {key: A, text: "Information Systems Architecture"}
      - {key: B, text: "Data Architecture", correct: true}
      - {key: C, text: "Technology Architecture"}
      - {key: D, text: "Digital Architecture"}
    explanation: "This is the Data Architecture description. Information Systems Architecture is the Phase C grouping of Data and Application together, not one of the four domains. Technology covers infrastructure. Digital Architecture is a combined, cross-cutting domain."
    refs: ["INTRO §3.3"]
    difficulty: 1
    tags: [domains]
    status: draft
  - id: F1-131
    unit: F1
    objective: "1.3"
    lesson: F1/04_architecture_domains_and_abstraction
    stem: "Which domain gives the blueprint of the individual applications to be deployed, how they interact, and how they relate to the core business processes?"
    options:
      - {key: A, text: "Business Architecture"}
      - {key: B, text: "Solution Architecture"}
      - {key: C, text: "Application Architecture", correct: true}
      - {key: D, text: "Technology Architecture"}
    explanation: "This is the Application Architecture description. Business Architecture covers strategy and processes. Solution Architecture is a defined term for a discrete business operation and its IS/IT support, not one of the four domains. Technology covers infrastructure."
    refs: ["INTRO §3.3"]
    difficulty: 1
    tags: [domains]
    status: draft
  - id: F1-132
    unit: F1
    objective: "1.3"
    lesson: F1/04_architecture_domains_and_abstraction
    stem: "Cloud services, IoT, middleware, networks and social media infrastructure are placed by the standard within which domain?"
    options:
      - {key: A, text: "Application Architecture"}
      - {key: B, text: "Data Architecture"}
      - {key: C, text: "Technology Architecture", correct: true}
      - {key: D, text: "A separate Digital domain outside the four"}
    explanation: "The Technology Architecture description explicitly includes digital services, IoT, social media infrastructure, cloud services, IT infrastructure, middleware, networks and more. Application and Data are different domains. Digital Architecture is a combination of views over the four, not a fifth domain."
    refs: ["INTRO §3.3"]
    difficulty: 1
    tags: [domains, technology]
    status: draft
  - id: F1-133
    unit: F1
    objective: "1.3"
    lesson: F1/04_architecture_domains_and_abstraction
    stem: "How does the standard treat Security Architecture and Information Architecture?"
    options:
      - {key: A, text: "As two additional primary domains, making six in total"}
      - {key: B, text: "As domains that are built by combining suitable views drawn from the Business, Data, Application and Technology domains", correct: true}
      - {key: C, text: "As synonyms for Data Architecture"}
      - {key: D, text: "As out of scope for the TOGAF framework"}
    explanation: "The standard names Information, Risk and Security, and Digital Architecture as examples of domains built by combining views of the four primary domains. A adds domains the standard does not define. C is wrong for both. D contradicts the statement that the framework enables creating these views."
    refs: ["INTRO §3.3", "INTRO §4.12"]
    difficulty: 2
    tags: [domains]
    status: draft
  - id: F1-134
    unit: F1
    objective: "1.3"
    lesson: F1/04_architecture_domains_and_abstraction
    stem: "Which ADM phase develops more than one of the four architecture domains?"
    options:
      - {key: A, text: "Phase B, which covers Business and Data"}
      - {key: B, text: "Phase C, which covers Data and Application", correct: true}
      - {key: C, text: "Phase D, which covers Application and Technology"}
      - {key: D, text: "No phase; each domain has its own phase"}
    explanation: "Phase C, Information Systems Architectures, develops the Data and Application Architectures. Phase B is Business only and Phase D is Technology only. D is wrong because two domains share Phase C."
    refs: ["INTRO §3.4"]
    difficulty: 1
    tags: [domains, phases]
    status: draft
  - id: F1-135
    unit: F1
    objective: "1.3"
    lesson: F1/04_architecture_domains_and_abstraction
    stem: "An architecture effort is scoped to compare technology options for a capability whose business processes are not open to change. What does the ADM say about the Business Architecture in this case?"
    options:
      - {key: A, text: "A full Business Architecture is mandatory regardless of scope"}
      - {key: B, text: "A full Business Architecture may not be warranted, but it must still be thought through and understood because the other domains build on it", correct: true}
      - {key: C, text: "The Business Architecture can be skipped entirely with no consequence"}
      - {key: D, text: "The Business Architecture must be completed after the Technology Architecture"}
    explanation: "The standard uses exactly this example: a full Business Architecture may not be justified, yet Data, Application and Technology build on it, so it still has to be understood. A ignores the resource realities the standard acknowledges. C ignores the dependency. D describes a different adaptation case driven by business principles."
    refs: ["ADM §1.5.4"]
    difficulty: 3
    tags: [domains, scope, situation]
    status: draft
  - id: F1-136
    unit: F1
    objective: "1.3"
    lesson: F1/04_architecture_domains_and_abstraction
    stem: "An Architecture Description is built that does not cover all four domains. Which statement reflects the standard?"
    options:
      - {key: A, text: "It is still a complete enterprise architecture provided the sponsor accepts it"}
      - {key: B, text: "It cannot, by definition, be a complete enterprise architecture, and the risks of inconsistency and integration difficulty must be communicated", correct: true}
      - {key: C, text: "It is invalid and must not be produced"}
      - {key: D, text: "It automatically becomes a Segment Architecture"}
    explanation: "Circumstances may justify omitting domains, but such an architecture is not complete, risks inconsistency, and the trade-offs must be articulated to management. A contradicts the definition. C is too strong; the standard allows it. D confuses domain coverage with the Landscape levels."
    refs: ["ADM §1.5.4"]
    difficulty: 2
    tags: [domains, scope]
    status: draft
  - id: F1-137
    unit: F1
    objective: "1.3"
    lesson: F1/04_architecture_domains_and_abstraction
    stem: "What does the ADM say about the depth to which each architecture domain in scope should be developed?"
    options:
      - {key: A, text: "Business Architecture should always be deeper than the other domains"}
      - {key: B, text: "A consistent and equal level of depth should be completed in each domain included", correct: true}
      - {key: C, text: "Technology Architecture should be developed in the most detail"}
      - {key: D, text: "Depth is unimportant as long as breadth is complete"}
    explanation: "Equal depth across the included domains is the rule; omitting pertinent detail makes the architecture useless and adding unnecessary detail exhausts resources. A and C favour one domain, which the standard does not. D contradicts the guidance that depth must fit the purpose."
    refs: ["ADM §1.5.2"]
    difficulty: 2
    tags: [domains, depth]
    status: draft
  - id: F1-138
    unit: F1
    objective: "1.3"
    lesson: F1/04_architecture_domains_and_abstraction
    stem: "Architecture effort can be divided into four abstraction levels that cross the domains. Which level answers the question 'with what assets shall we implement this structure?'"
    options:
      - {key: A, text: "Contextual"}
      - {key: B, text: "Conceptual"}
      - {key: C, text: "Logical"}
      - {key: D, text: "Physical", correct: true}
    explanation: "Physical answers 'with what', allocating physical components to realise logical ones. Contextual answers 'why', Conceptual 'what', and Logical 'how'."
    refs: ["INTRO §3.7"]
    difficulty: 2
    tags: [abstraction]
    status: draft
  - id: F1-139
    unit: F1
    objective: "1.3"
    lesson: F1/04_architecture_domains_and_abstraction
    stem: "Which abstraction level is also referred to as service abstraction or behaviour abstraction?"
    options:
      - {key: A, text: "Contextual"}
      - {key: B, text: "Conceptual", correct: true}
      - {key: C, text: "Logical"}
      - {key: D, text: "Physical"}
    explanation: "The Conceptual level decomposes requirements and is usually modelled with business, application and technology service models, hence the alternative names. Contextual is about environment and motivation; Logical about implementation-independent components; Physical about physical components."
    refs: ["INTRO §3.7"]
    difficulty: 3
    tags: [abstraction]
    status: draft
  - id: F1-140
    unit: F1
    objective: "1.3"
    lesson: F1/04_architecture_domains_and_abstraction
    stem: "Which abstraction level identifies the kinds of business, data, application and technology components needed, in an implementation-independent fashion?"
    options:
      - {key: A, text: "Logical", correct: true}
      - {key: B, text: "Physical"}
      - {key: C, text: "Contextual"}
      - {key: D, text: "Conceptual"}
    explanation: "The Logical level is about how the architecture is organised and structured independently of implementation, with several possible logical alternatives. Physical chooses actual components. Contextual asks why. Conceptual asks what is needed, in terms of services."
    refs: ["INTRO §3.7"]
    difficulty: 2
    tags: [abstraction]
    status: draft
  - id: F1-141
    unit: F1
    objective: "1.3"
    lesson: F1/04_architecture_domains_and_abstraction
    stem: "An architect is capturing the goals, drivers and objectives that motivate an architecture effort and the scope of the work. Which abstraction level is this?"
    options:
      - {key: A, text: "Conceptual"}
      - {key: B, text: "Contextual", correct: true}
      - {key: C, text: "Logical"}
      - {key: D, text: "Physical"}
    explanation: "The Contextual level answers why the enterprise undertakes the work, its scope, and the motivation in goals, drivers and objectives. Conceptual decomposes requirements into services. Logical and Physical are about components."
    refs: ["INTRO §3.7"]
    difficulty: 2
    tags: [abstraction, situation]
    status: draft
  - id: F1-142
    unit: F1
    objective: "1.3"
    lesson: F1/04_architecture_domains_and_abstraction
    stem: "Which statement about the definition of 'architecture' in the TOGAF Standard is correct?"
    options:
      - {key: A, text: "The standard strictly adheres to ISO/IEC/IEEE 42010 terminology"}
      - {key: B, text: "The standard adopts the ISO/IEC/IEEE 42010 definition and adds a second, structural meaning used depending on context", correct: true}
      - {key: C, text: "The standard rejects the ISO definition in favour of its own"}
      - {key: D, text: "The standard defines architecture only as a set of diagrams"}
    explanation: "Two meanings are kept: the ISO 42010 one and the structure-of-components one. The standard says it embraces but does not strictly adhere to ISO terminology, so A is wrong. C is the opposite of embracing. D is not a definition the standard gives."
    refs: ["INTRO §3.2"]
    difficulty: 2
    tags: [definitions, architecture]
    status: draft
  - id: F1-143
    unit: F1
    objective: "1.3"
    lesson: F1/04_architecture_domains_and_abstraction
    stem: "The four abstraction levels (contextual, conceptual, logical, physical) apply to which architecture domains?"
    options:
      - {key: A, text: "Only the Technology domain"}
      - {key: B, text: "Only the Business domain"}
      - {key: C, text: "All four: Business, Data, Application and Technology", correct: true}
      - {key: D, text: "Only the Information Systems domains"}
    explanation: "The levels cross all four domains to answer the why, what, how and with-what questions about an architecture. A, B and D each restrict them to a subset."
    refs: ["INTRO §3.7"]
    difficulty: 1
    tags: [abstraction, domains]
    status: draft
  # ------------------------------------------------------------ 1.4 deliverables, artifacts, building blocks
  - id: F1-144
    unit: F1
    objective: "1.4"
    lesson: F1/05_deliverables_artifacts_building_blocks
    stem: "Which category of architectural work product is contractually specified and formally reviewed, agreed and signed off by the stakeholders?"
    options:
      - {key: A, text: "Artifact"}
      - {key: B, text: "Building block"}
      - {key: C, text: "Deliverable", correct: true}
      - {key: D, text: "Architecture view"}
    explanation: "Contractual specification and sign-off define a deliverable. An artifact describes one aspect of the architecture and is only a deliverable if the contract says so. A building block is a reusable component. A view is a representation for a set of concerns, not a contractual category."
    refs: ["INTRO §3.6", "INTRO §4.40"]
    difficulty: 1
    tags: [deliverables]
    status: draft
  - id: F1-145
    unit: F1
    objective: "1.4"
    lesson: F1/05_deliverables_artifacts_building_blocks
    stem: "Artifacts are generally classified into which three kinds?"
    options:
      - {key: A, text: "Catalogs, matrices and diagrams", correct: true}
      - {key: B, text: "Baseline, Transition and Target"}
      - {key: C, text: "Business, Data and Technology"}
      - {key: D, text: "Deliverables, building blocks and models"}
    explanation: "Catalogs list things, matrices show relationships, diagrams picture things. B lists architecture states. C lists domains (and omits Application). D mixes the other two work product categories with models."
    refs: ["INTRO §3.6", "CONTENT §3.6.1"]
    difficulty: 1
    tags: [artifacts]
    status: draft
  - id: F1-146
    unit: F1
    objective: "1.4"
    lesson: F1/05_deliverables_artifacts_building_blocks
    stem: "An architect draws a value chain diagram of the enterprise. In the Content Framework's categories, what has been produced?"
    options:
      - {key: A, text: "A deliverable"}
      - {key: B, text: "An artifact of the diagram kind", correct: true}
      - {key: C, text: "A Solution Building Block"}
      - {key: D, text: "A viewpoint"}
    explanation: "A value chain diagram is one of the standard's own examples of an artifact. It becomes a deliverable only if contractually specified. It is not a building block, which is a reusable component, and not a viewpoint, which is the convention for constructing a view."
    refs: ["INTRO §3.6"]
    difficulty: 1
    tags: [artifacts, situation]
    status: draft
  - id: F1-147
    unit: F1
    objective: "1.4"
    lesson: F1/05_deliverables_artifacts_building_blocks
    stem: "What typically happens to a deliverable that is in documentation form when its project completes?"
    options:
      - {key: A, text: "It is deleted to avoid confusion with newer work"}
      - {key: B, text: "It is archived, or moved into the Architecture Repository to serve as a reference model, a standard, or a point-in-time snapshot of the Architecture Landscape", correct: true}
      - {key: C, text: "It is converted into a building block"}
      - {key: D, text: "It is handed to the Architecture Board for re-approval"}
    explanation: "Documentation deliverables are archived or moved into the repository as reference models, standards or landscape snapshots. A is the opposite of the standard's retention approach. C confuses categories. D is not stated."
    refs: ["INTRO §3.6", "INTRO §4.40"]
    difficulty: 2
    tags: [deliverables, repository]
    status: draft
  - id: F1-148
    unit: F1
    objective: "1.4"
    lesson: F1/05_deliverables_artifacts_building_blocks
    stem: "Is an artifact also a deliverable?"
    options:
      - {key: A, text: "Always; every artifact is signed off"}
      - {key: B, text: "Never; the two categories are mutually exclusive"}
      - {key: C, text: "It may or may not be, depending on the contractual specification", correct: true}
      - {key: D, text: "Only if it is a diagram"}
    explanation: "The standard makes it contract-dependent: whether an artifact counts as a deliverable turns on what was contractually specified. A and B are both absolute and wrong. D invents a rule based on artifact kind."
    refs: ["INTRO §3.6"]
    difficulty: 2
    tags: [artifacts, deliverables]
    status: draft
  - id: F1-149
    unit: F1
    objective: "1.4"
    lesson: F1/05_deliverables_artifacts_building_blocks
    stem: "In the standard's example, an Architecture Definition Document contains a process flow diagram describing the target call handling process. How are the three items classified?"
    options:
      - {key: A, text: "Document: deliverable; diagram: artifact; call handling process: building block", correct: true}
      - {key: B, text: "Document: building block; diagram: deliverable; call handling process: artifact"}
      - {key: C, text: "Document: artifact; diagram: building block; call handling process: deliverable"}
      - {key: D, text: "All three are artifacts at different levels of detail"}
    explanation: "The ADD is the deliverable, the process flow diagram is an artifact that is a view of the building block, and the target process is the building block. B and C rotate the categories. D collapses the three categories into one."
    refs: ["INTRO §3.6"]
    difficulty: 2
    tags: [deliverables, artifacts, building-blocks]
    status: draft
  - id: F1-150
    unit: F1
    objective: "1.4"
    lesson: F1/05_deliverables_artifacts_building_blocks
    stem: "A required network capability could be realised as a hive of many microsatellites or as a small set of large satellites. In the standard's terms, what are the two satellite configurations?"
    options:
      - {key: A, text: "Architecture Building Blocks"}
      - {key: B, text: "Solution Building Blocks", correct: true}
      - {key: C, text: "Artifacts"}
      - {key: D, text: "Deliverables"}
    explanation: "The network is the ABB describing required capability; each implementation choice is an SBB. C and D are work product categories, not implementation choices."
    refs: ["INTRO §3.6"]
    difficulty: 2
    tags: [building-blocks, situation]
    status: draft
  - id: F1-151
    unit: F1
    objective: "1.4"
    lesson: F1/05_deliverables_artifacts_building_blocks
    stem: "Which pair correctly states the characteristics of Architecture Building Blocks?"
    options:
      - {key: A, text: "They capture architecture requirements and direct and guide the development of SBBs", correct: true}
      - {key: B, text: "They define what products will implement the functionality and are vendor-aware"}
      - {key: C, text: "They are always procured off the shelf"}
      - {key: D, text: "They describe the physical topology of the IT estate"}
    explanation: "ABBs capture business, data, application and technology requirements and steer SBB development. B and C describe SBBs, which are product-aware and may be procured or developed. D belongs to SBB specification content."
    refs: ["CONTENT §5.2.3"]
    difficulty: 2
    tags: [building-blocks]
    status: draft
  - id: F1-152
    unit: F1
    objective: "1.4"
    lesson: F1/05_deliverables_artifacts_building_blocks
    stem: "Which of the following is a characteristic of Solution Building Blocks?"
    options:
      - {key: A, text: "They are supplier-independent"}
      - {key: B, text: "They relate to the Architecture Continuum"}
      - {key: C, text: "They are product- or vendor-aware and define the implementation", correct: true}
      - {key: D, text: "They only exist at the Foundation level"}
    explanation: "SBBs define which products and components implement the functionality and are vendor-aware. A and B describe ABBs, which are logical and belong to the Architecture Continuum. D is invented; SBBs exist at every level of the Solutions Continuum."
    refs: ["CONTENT §5.2.4"]
    difficulty: 2
    tags: [building-blocks]
    status: draft
  - id: F1-153
    unit: F1
    objective: "1.4"
    lesson: F1/05_deliverables_artifacts_building_blocks
    stem: "Which of the following is NOT a characteristic of a good building block according to the Architecture Content document?"
    options:
      - {key: A, text: "It takes implementation and usage into account and evolves to take advantage of technology and standards"}
      - {key: B, text: "It may be assembled from other building blocks"}
      - {key: C, text: "Its boundary and specification are tightly coupled to a single implementation", correct: true}
      - {key: D, text: "It is ideally reusable, replaceable and well specified"}
    explanation: "The standard says the boundary and specification should be loosely coupled to the implementation, so the block can be realised in several ways. A, B and D are all listed characteristics of a good building block."
    refs: ["CONTENT §5.2.2"]
    difficulty: 2
    tags: [building-blocks]
    status: draft
  - id: F1-154
    unit: F1
    objective: "1.4"
    lesson: F1/05_deliverables_artifacts_building_blocks
    stem: "When identifying building blocks during design, the standard suggests considering three classes. Which option lists them?"
    options:
      - {key: A, text: "Reusable (such as legacy items), to be developed (such as new applications), and to be purchased (COTS)", correct: true}
      - {key: B, text: "Business, data and technology"}
      - {key: C, text: "Strategic, segment and capability"}
      - {key: D, text: "Foundation, common systems and industry"}
    explanation: "The three classes are reuse, build and buy. B is a partial list of domains. C lists Landscape levels. D lists continuum stages."
    refs: ["CONTENT §5.3.1"]
    difficulty: 2
    tags: [building-blocks]
    status: draft
  - id: F1-155
    unit: F1
    objective: "1.4"
    lesson: F1/05_deliverables_artifacts_building_blocks
    stem: "In which ADM phases does the process of building block definition mainly take place?"
    options:
      - {key: A, text: "Preliminary Phase only"}
      - {key: B, text: "Phases A, B, C and D", correct: true}
      - {key: C, text: "Phases E and F only"}
      - {key: D, text: "Phase G only"}
    explanation: "Building block definition is gradual and iterative, mainly in Phases A to D, identifying ABBs and refining them into SBBs. The Preliminary Phase sets up the capability. E and F plan implementation. G governs it."
    refs: ["CONTENT §5.3.2"]
    difficulty: 2
    tags: [building-blocks, phases]
    status: draft
  - id: F1-156
    unit: F1
    objective: "1.4"
    lesson: F1/05_deliverables_artifacts_building_blocks
    stem: "A table shows which applications create, read, update and delete each type of data. According to the Architecture Content document, which artifact kind is this and why?"
    options:
      - {key: A, text: "A catalog, because it lists applications"}
      - {key: B, text: "A matrix, because it shows a list-based relationship between two entity types that is hard to draw", correct: true}
      - {key: C, text: "A diagram, because it is rendered as a grid"}
      - {key: D, text: "A building block, because it carries metadata"}
    explanation: "The CRUD table is the standard's own example of a matrix: a grid of relationships that is list-based rather than graphical. A catalog lists building blocks of a type, not relationships between types. A diagram is graphical. A building block is a metamodel entity instance, not an artifact."
    refs: ["CONTENT §3.6.1"]
    difficulty: 3
    tags: [artifacts, situation]
    status: draft
  - id: F1-157
    unit: F1
    objective: "1.4"
    lesson: F1/05_deliverables_artifacts_building_blocks
    stem: "How do building blocks support query and analysis in an architecture tool, according to the Architecture Content document?"
    options:
      - {key: A, text: "They carry metadata according to the Enterprise Metamodel, so a stakeholder can query, for example, all business services owned by one organisation", correct: true}
      - {key: B, text: "They are stored as free-text documents indexed by keyword"}
      - {key: C, text: "They are always rendered as diagrams that can be searched visually"}
      - {key: D, text: "They cannot be queried; only catalogs can"}
    explanation: "Building blocks are metamodel entities with metadata attributes such as owner, which supports query. B and C are not how the standard describes them. D contradicts the example of querying business services by owner."
    refs: ["CONTENT §3.6.1"]
    difficulty: 3
    tags: [building-blocks, metamodel]
    status: draft
  - id: F1-158
    unit: F1
    objective: "1.4"
    lesson: F1/05_deliverables_artifacts_building_blocks
    stem: "How should the list of deliverables in the Architecture Content document be regarded?"
    options:
      - {key: A, text: "As a mandatory set that every architecture project must produce in full"}
      - {key: B, text: "As a typical baseline that is likely to be constrained or altered by overarching project or process management methods such as PRINCE2 or PMBOK, and a starting point for tailoring", correct: true}
      - {key: C, text: "As the only work products that may be stored in the repository"}
      - {key: D, text: "As artifacts rather than deliverables"}
    explanation: "Deliverables are the contractual work products, so an enterprise's project method will shape them; the list is a baseline for tailoring. A contradicts this. C ignores artifacts and building blocks in the repository. D misnames the category."
    refs: ["CONTENT §4.1"]
    difficulty: 3
    tags: [deliverables]
    status: draft
  - id: F1-159
    unit: F1
    objective: "1.4"
    lesson: F1/05_deliverables_artifacts_building_blocks
    stem: "Architecture Building Blocks and Solution Building Blocks relate respectively to which parts of the Enterprise Continuum?"
    options:
      - {key: A, text: "ABBs to the Solutions Continuum; SBBs to the Architecture Continuum"}
      - {key: B, text: "ABBs to the Architecture Continuum; SBBs to the Solutions Continuum", correct: true}
      - {key: C, text: "Both to the Architecture Continuum"}
      - {key: D, text: "Both to the Reference Library only"}
    explanation: "ABBs relate to the Architecture Continuum and SBBs to the Solutions Continuum. A swaps them. C and D misplace SBBs."
    refs: ["CONTENT §5.2.3", "CONTENT §5.2.4"]
    difficulty: 2
    tags: [building-blocks, continuum]
    status: draft
  # ------------------------------------------------------------ 1.5 continuum, repository, capability
  - id: F1-160
    unit: F1
    objective: "1.5"
    lesson: F1/06_continuum_repository_and_capability
    stem: "The Enterprise Continuum comprises which two complementary concepts?"
    options:
      - {key: A, text: "The Architecture Repository and the Solutions Landscape"}
      - {key: B, text: "The Architecture Continuum and the Solutions Continuum", correct: true}
      - {key: C, text: "The Reference Library and the Standards Library"}
      - {key: D, text: "The Baseline Architecture and the Target Architecture"}
    explanation: "The Enterprise Continuum consists of the Architecture Continuum and the Solutions Continuum. A and C name parts of the Architecture Repository, which stores rather than classifies. D names architecture states."
    refs: ["INTRO §3.10"]
    difficulty: 1
    tags: [continuum]
    status: draft
  - id: F1-161
    unit: F1
    objective: "1.5"
    lesson: F1/06_continuum_repository_and_capability
    stem: "Which option lists the four architecture types of the Architecture Continuum in order from most generic to most specific?"
    options:
      - {key: A, text: "Organization-Specific, Industry, Common Systems, Foundation"}
      - {key: B, text: "Foundation, Common Systems, Industry, Organization-Specific", correct: true}
      - {key: C, text: "Foundation, Industry, Common Systems, Organization-Specific"}
      - {key: D, text: "Strategic, Segment, Capability, Solution"}
    explanation: "Detail and specialisation increase from Foundation through Common Systems and Industry to Organization-Specific. A is reversed. C swaps the middle two. D lists Landscape levels plus an invented stage."
    refs: ["CONTENT §6.4.1"]
    difficulty: 1
    tags: [continuum, ordering]
    status: draft
  - id: F1-162
    unit: F1
    objective: "1.5"
    lesson: F1/06_continuum_repository_and_capability
    stem: "The TOGAF Technical Reference Model (TRM) is given as an example of which kind of architecture in the Architecture Continuum?"
    options:
      - {key: A, text: "Foundation Architecture", correct: true}
      - {key: B, text: "Common Systems Architecture"}
      - {key: C, text: "Industry Architecture"}
      - {key: D, text: "Organization-Specific Architecture"}
    explanation: "The TRM is the standard's example of a Foundation Architecture. The III-RM is the Common Systems example. Industry architectures are vertical-specific, such as a retail store architecture. Organization-Specific is the enterprise's own."
    refs: ["CONTENT §6.4.1"]
    difficulty: 2
    tags: [continuum, trm]
    status: draft
  - id: F1-163
    unit: F1
    objective: "1.5"
    lesson: F1/06_continuum_repository_and_capability
    stem: "The Integrated Information Infrastructure Reference Model (III-RM) supports describing which kind of architecture?"
    options:
      - {key: A, text: "A Foundation Architecture"}
      - {key: B, text: "A Common Systems Architecture in the Application domain", correct: true}
      - {key: C, text: "An Industry Architecture for telecommunications"}
      - {key: D, text: "A Solutions Continuum entry"}
    explanation: "The III-RM is named as a reference model for a Common Systems Architecture in the Application domain focused on Boundaryless Information Flow. The TRM is the Foundation example. C is invented. D confuses an architecture with a solution."
    refs: ["CONTENT §6.4.1"]
    difficulty: 3
    tags: [continuum, iii-rm]
