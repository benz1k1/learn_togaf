      - {key: D, text: "Governance Repository"}
    explanation: "The components are the Architecture Metamodel, Architecture Capability, Architecture Landscape, Standards Library, Reference Library, Governance Repository, Architecture Requirements Repository and Solutions Landscape. An Architecture Contract is a deliverable, not a repository component."
