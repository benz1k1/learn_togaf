    difficulty: 2
    tags: [governance, capability]
    status: draft
  - id: F1-174
    unit: F1
    objective: "1.5"
    lesson: F1/06_continuum_repository_and_capability
    stem: "How should the establishment of an architecture practice be regarded, according to the EA Capability and Governance document?"
    options:
      - {key: A, text: "As a one-off project completed before the first ADM cycle"}
      - {key: B, text: "As a phase of each architecture project"}
      - {key: C, text: "As an ongoing discipline that provides the context, environment and resources for architecture delivery, which a project may later ask to change", correct: true}
      - {key: D, text: "As the responsibility of the IT service desk"}
    explanation: "The practice is an ongoing discipline, not a phase or a one-off; a project executed within it may request a change that triggers another ADM cycle to extend the practice. A and B are explicitly rejected. D is invented."
