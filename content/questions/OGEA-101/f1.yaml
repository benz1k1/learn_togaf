    difficulty: 3
    tags: [capability]
    status: draft
  - id: F1-176
    unit: F1
    objective: "1.5"
    lesson: F1/06_continuum_repository_and_capability
    stem: "On the Solutions Continuum, what does 'moving to the right' focus on?"
    options:
      - {key: A, text: "Addressing enterprise needs"}
      - {key: B, text: "Providing solutions value, with foundation solutions feeding common systems solutions, then industry, then organisation-specific solutions", correct: true}
      - {key: C, text: "Reducing the level of detail in the specification"}
      - {key: D, text: "Returning solutions to the Reference Library"}
    explanation: "Moving right provides solution value through successive specialisation; moving left addresses enterprise needs. A is the leftward direction. C is backwards, since detail increases to the right. D is not a continuum concept."
    refs: ["CONTENT §6.4.2"]
    difficulty: 3
    tags: [continuum]
    status: draft
  - id: F1-177
    unit: F1
    objective: "1.5"
    lesson: F1/06_continuum_repository_and_capability
    stem: "Why does the Architecture Content document say the Enterprise Continuum is an important aid to communication?"
    options:
      - {key: A, text: "Because it replaces the need for architecture views"}
      - {key: B, text: "Because without knowing where in the continuum they are, people discussing architecture may talk at cross-purposes by referencing different points at once", correct: true}
      - {key: C, text: "Because it defines the notation to be used in every diagram"}
      - {key: D, text: "Because it lists every stakeholder in the enterprise"}
    explanation: "The continuum gives a consistent language for the differences between architectures at different points, preventing cross-purpose discussion within enterprises and with vendors. A, C and D are not functions of the continuum."
    refs: ["CONTENT §6.1"]
    difficulty: 2
    tags: [continuum]
    status: draft
