    difficulty: 2
    tags: [capability]
    status: draft
  - id: F1-175
    unit: F1
    objective: "1.5"
    lesson: F1/06_continuum_repository_and_capability
    stem: "When the ADM is used to establish an architecture practice, which domain architecture of the practice defines the structure of the organisation's Enterprise Continuum and Architecture Repository?"
    options:
      - {key: A, text: "The Business Architecture of the practice"}
      - {key: B, text: "The Data Architecture of the practice", correct: true}
      - {key: C, text: "The Application Architecture of the practice"}
      - {key: D, text: "The Technology Architecture of the practice"}
    explanation: "The Data Architecture of the practice specifies the structure of the continuum and repository and is sometimes called the metamodel of the practice. Business covers governance, processes and organisation; Application covers tooling functionality; Technology covers infrastructure."
