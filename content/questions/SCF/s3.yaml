questions:
  # ---------------------------------------------------------------- S3.1 the profile and its families
  - id: S3-101
    unit: S3
    objective: "S3.1"
    lesson: S3/01_the_business_attributes_profile
    stem: "What is a business attribute in SABSA?"
    options:
      - {key: A, text: "A quality the business needs its information, systems or services to possess, stated in the business's own words", correct: true}
      - {key: B, text: "A technical control selected from a standard", why: "Controls are below attributes in the trace."}
      - {key: C, text: "A field in a database schema", why: "Physical-layer data content."}
      - {key: D, text: "A threat scenario", why: "Threats are assessed against attributes."}
    explanation: "Attributes such as available, confidential and reputable are the business's requirements as adjectives."
    refs: ["SABSA §3.3"]
    difficulty: 1
    tags: [attributes, definitions]
  - id: S3-102
    unit: S3
    objective: "S3.1"
    lesson: S3/01_the_business_attributes_profile
    stem: "What is the Business Attributes Profile?"
    options:
      - {key: A, text: "The full published taxonomy of attributes", why: "The taxonomy is the menu; the profile is the selection."}
      - {key: B, text: "The set of attributes selected for a scope, each with a metric, a measurement approach and a performance target", correct: true}
      - {key: C, text: "A list of threats ranked by likelihood", why: "That is a risk register."}
      - {key: D, text: "A catalogue of security products", why: "Component-layer content."}
    explanation: "The profile is the selected, measurable attribute set at Conceptual × Assets."
    refs: ["SABSA §3.3"]
    difficulty: 1
    tags: [attributes, profile]
  - id: S3-103
    unit: S3
    objective: "S3.1"
    lesson: S3/01_the_business_attributes_profile
    stem: "Which family does the attribute 'reputable' belong to?"
    options:
      - {key: A, text: "User", why: "User attributes concern the experience of using systems."}
      - {key: B, text: "Risk management", why: "Risk-management attributes are the classic security qualities."}
      - {key: C, text: "Business strategy", correct: true}
      - {key: D, text: "Legal and regulatory", why: "Reputation is not a legal obligation."}
    explanation: "Reputable, brand-enhancing and credible are business-strategy attributes."
    refs: ["SABSA §3.4"]
    difficulty: 2
    tags: [attributes, families]
  - id: S3-104
    unit: S3
    objective: "S3.1"
    lesson: S3/01_the_business_attributes_profile
    stem: "Which family does 'available' belong to?"
    options:
      - {key: A, text: "Operational", correct: true}
      - {key: B, text: "Risk management", why: "Availability is grouped with the operational qualities in SABSA's taxonomy."}
      - {key: C, text: "Management", why: "Management attributes concern administration."}
      - {key: D, text: "Technical strategy", why: "Those concern the long-term technology shape."}
    explanation: "Available, detectable, error-free, interoperable, productive and recoverable are operational attributes."
    refs: ["SABSA §3.4"]
    difficulty: 2
    tags: [attributes, families]
  - id: S3-105
    unit: S3
    objective: "S3.1"
    lesson: S3/01_the_business_attributes_profile
    stem: "Which family does 'confidential' belong to?"
    options:
      - {key: A, text: "Risk management", correct: true}
      - {key: B, text: "Operational", why: "Operational holds availability and recoverability."}
      - {key: C, text: "User", why: "User attributes concern the user's experience."}
      - {key: D, text: "Business strategy", why: "Strategy attributes are about the long-term business."}
    explanation: "The risk-management family holds the classic security qualities: confidential, integrity-assured, authenticated, auditable and so on."
    refs: ["SABSA §3.4"]
    difficulty: 1
    tags: [attributes, families]
  - id: S3-106
    unit: S3
    objective: "S3.1"
    lesson: S3/01_the_business_attributes_profile
    stem: "Which family does 'compliant' belong to?"
    options:
      - {key: A, text: "Legal and regulatory", correct: true}
      - {key: B, text: "Management", why: "Management is about running systems."}
      - {key: C, text: "Risk management", why: "Compliance is an external obligation, grouped with legal attributes."}
      - {key: D, text: "User", why: "Not a user-experience quality."}
    explanation: "Admissible, compliant, enforceable, insurable, legal, liability-managed, regulated, resolvable and time-bound are legal and regulatory attributes."
    refs: ["SABSA §3.4"]
    difficulty: 1
    tags: [attributes, families]
  - id: S3-107
    unit: S3
    objective: "S3.1"
    lesson: S3/01_the_business_attributes_profile
    stem: "Which family does 'usable' belong to?"
    options:
      - {key: A, text: "User", correct: true}
      - {key: B, text: "Operational", why: "Operational is service delivery, not user experience."}
      - {key: C, text: "Technical strategy", why: "Not about the technology's long-term shape."}
      - {key: D, text: "Business strategy", why: "Not a business-level strategic quality."}
    explanation: "Usable, accessible, responsive, supported and informed are user attributes."
