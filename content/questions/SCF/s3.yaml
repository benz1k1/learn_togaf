    lesson: S3/04_operational_risk_and_risk_assessment
    stem: "What is a key risk indicator in SABSA's terms?"
    options:
      - {key: A, text: "The measured value of an attribute's metric, used as an early warning", correct: true}
      - {key: B, text: "A threat listed in the register", why: "A threat, not an indicator."}
      - {key: C, text: "The number of controls deployed", why: "Not an indicator of risk."}
      - {key: D, text: "The audit schedule", why: "Assurance planning."}
