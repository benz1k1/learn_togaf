    difficulty: 1
    tags: [attributes, families]
  - id: S3-108
    unit: S3
    objective: "S3.1"
    lesson: S3/01_the_business_attributes_profile
    stem: "Which family does 'scalable' belong to?"
    options:
      - {key: A, text: "Technical strategy", correct: true}
      - {key: B, text: "Operational", why: "Scalability is a long-term technology quality, not day-to-day delivery."}
      - {key: C, text: "Management", why: "Not an administration quality."}
      - {key: D, text: "Legal and regulatory", why: "No legal element."}
    explanation: "Scalable, extendible, future-proof, migratable and standards-compliant are technical-strategy attributes."
    refs: ["SABSA §3.4"]
    difficulty: 2
    tags: [attributes, families]
  - id: S3-109
    unit: S3
    objective: "S3.1"
    lesson: S3/01_the_business_attributes_profile
    stem: "Which family does 'cost-effective' belong to?"
    options:
      - {key: A, text: "Management", correct: true}
      - {key: B, text: "Business strategy", why: "Return on investment is strategy; cost-effective operation is management."}
      - {key: C, text: "User", why: "Not a user-experience quality."}
      - {key: D, text: "Risk management", why: "Not a security quality."}
    explanation: "Automated, change-managed, controlled, cost-effective, efficient, maintainable, measured and supportable are management attributes."
    refs: ["SABSA §3.4"]
    difficulty: 2
    tags: [attributes, families]
  - id: S3-110
    unit: S3
    objective: "S3.1"
    lesson: S3/01_the_business_attributes_profile
    stem: "How many attribute families does SABSA's taxonomy use?"
    options:
      - {key: A, text: "Three", why: "Confidentiality, integrity and availability are three attributes, not families."}
      - {key: B, text: "Seven", correct: true}
      - {key: C, text: "Six, one per Matrix column", why: "Families are not aligned to columns."}
      - {key: D, text: "Twelve", why: "Not the taxonomy's count."}
    explanation: "User, management, operational, risk management, legal and regulatory, technical strategy and business strategy."
    refs: ["SABSA §3.4"]
    difficulty: 1
    tags: [attributes, families]
  - id: S3-111
    unit: S3
    objective: "S3.1"
    lesson: S3/01_the_business_attributes_profile
    stem: "What is the relationship between the taxonomy and a profile?"
    options:
      - {key: A, text: "They are the same thing", why: "The taxonomy is the vocabulary; the profile is a selection from it."}
      - {key: B, text: "The taxonomy is a standard menu of attributes; a profile selects and weights those a scope needs, adding any missing", correct: true}
      - {key: C, text: "The profile is the taxonomy plus threats", why: "Threats are not part of the profile."}
      - {key: D, text: "The taxonomy is derived from each profile", why: "Reversed."}
    explanation: "A shared taxonomy with per-scope profiles keeps profiles comparable."
    refs: ["SABSA §3.3"]
    difficulty: 2
    tags: [attributes, taxonomy]
  - id: S3-112
    unit: S3
    objective: "S3.1"
    lesson: S3/01_the_business_attributes_profile
    stem: "Why is the Business Attributes Profile called the hinge of the framework?"
    options:
      - {key: A, text: "Because it is the first Matrix cell", why: "It is Conceptual, not the first cell."}
      - {key: B, text: "Because every driver above maps down to an attribute and every control below traces up to one", correct: true}
      - {key: C, text: "Because it is owned by the SABSA Institute", why: "Irrelevant."}
      - {key: D, text: "Because it lists every product", why: "Products are Component content."}
    explanation: "The profile is the abstraction layer between business needs and technical controls."
    refs: ["SABSA §3.3"]
    difficulty: 2
    tags: [attributes, traceability]
  - id: S3-113
    unit: S3
    objective: "S3.1"
    lesson: S3/01_the_business_attributes_profile
    stem: "Which attribute is in the risk-management family?"
    options:
      - {key: A, text: "Recoverable", why: "Operational."}
      - {key: B, text: "Auditable", correct: true}
      - {key: C, text: "Maintainable", why: "Management."}
      - {key: D, text: "Insurable", why: "Legal and regulatory."}
    explanation: "Auditable, accountable, authenticated, authorised and non-repudiable are risk-management attributes."
    refs: ["SABSA §3.4"]
    difficulty: 2
    tags: [attributes, families]
  - id: S3-114
    unit: S3
    objective: "S3.1"
    lesson: S3/01_the_business_attributes_profile
    stem: "Which attribute is in the operational family?"
    options:
      - {key: A, text: "Recoverable", correct: true}
      - {key: B, text: "Confidential", why: "Risk management."}
      - {key: C, text: "Reputable", why: "Business strategy."}
      - {key: D, text: "Legal", why: "Legal and regulatory."}
    explanation: "Recoverable sits with available, detectable, error-free, interoperable and productive."
    refs: ["SABSA §3.4"]
    difficulty: 1
    tags: [attributes, families]
  - id: S3-115
    unit: S3
    objective: "S3.1"
    lesson: S3/01_the_business_attributes_profile
    stem: "What does the profile give business people and engineers that they lacked?"
    options:
      - {key: A, text: "A shared vocabulary: the business states the quality it needs and engineers design to it without either side learning the other's language", correct: true}
      - {key: B, text: "A list of vendors", why: "Not the point."}
      - {key: C, text: "A budget", why: "Budgets follow; the profile is a requirement set."}
      - {key: D, text: "A network diagram", why: "Physical content."}
    explanation: "The attribute is the word both sides agree on; that is the abstraction layer's value."
    refs: ["SABSA §3.3"]
    difficulty: 1
    tags: [attributes]
  - id: S3-116
    unit: S3
    objective: "S3.1"
    lesson: S3/01_the_business_attributes_profile
    stem: "A profile contains attributes from only one family. What does SABSA suggest about it?"
    options:
      - {key: A, text: "It is well focused", why: "The opposite."}
      - {key: B, text: "The Contextual layer was read narrowly and other business concerns were missed", correct: true}
      - {key: C, text: "It is complete for a small system", why: "Size does not excuse a single-family profile."}
      - {key: D, text: "It should be split into sub-domains", why: "Unrelated."}
    explanation: "Families prompt breadth: usability, cost, legal exposure and strategy, not only classic security."
    refs: ["SABSA §3.4"]
    difficulty: 2
    tags: [attributes, families]
  - id: S3-117
    unit: S3
    objective: "S3.1"
    lesson: S3/01_the_business_attributes_profile
    stem: "Which family gives a first cut at ownership of attributes, for example legal attributes to the compliance function?"
    options:
      - {key: A, text: "The families themselves, feeding the Conceptual × People cell", correct: true}
      - {key: B, text: "The Lifecycle phases", why: "Process, not ownership."}
      - {key: C, text: "The control types", why: "Those classify controls."}
      - {key: D, text: "The trust relationships", why: "Logical-layer content."}
    explanation: "User attributes belong to process owners, legal to compliance, technical strategy to the CTO, and so on."
    refs: ["SABSA §3.4"]
    difficulty: 2
    tags: [attributes, families, ownership]
  - id: S3-118
    unit: S3
    objective: "S3.1"
    lesson: S3/01_the_business_attributes_profile
    stem: "In the Matrix, how does the profile relate to the Logical × Assets cell?"
    options:
      - {key: A, text: "It replaces it", why: "Each layer has its own Assets cell."}
      - {key: B, text: "The Logical information-asset inventory classifies each asset by the attributes it needs from the profile", correct: true}
      - {key: C, text: "They are unrelated", why: "Traceability connects them."}
      - {key: D, text: "The Logical cell holds the taxonomy", why: "The taxonomy is Conceptual."}
    explanation: "Classification in SABSA is attaching attributes and targets to information assets."
    refs: ["SABSA §2.2"]
    difficulty: 2
    tags: [attributes, classification]
  - id: S3-119
    unit: S3
    objective: "S3.1"
    lesson: S3/01_the_business_attributes_profile
    stem: "Where does the TOGAF guide place the Business Attribute Profile?"
    options:
      - {key: A, text: "Requirements Management", correct: true}
      - {key: B, text: "Phase D", why: "Technology architecture."}
      - {key: C, text: "Phase G", why: "Implementation governance."}
      - {key: D, text: "The Architecture Repository's Standards Information Base", why: "Standards, not requirements."}
    explanation: "The profile is the requirement set every phase consumes, so it lives with Requirements Management."
