  # ---------------------------------------------------------------- S3.2 metrics, measurement, targets
  - id: S3-121
    unit: S3
    objective: "S3.2"
    lesson: S3/02_metrics_measurement_and_performance_targets
    stem: "What three things does SABSA record against each attribute to make it measurable?"
    options:
      - {key: A, text: "Metric type, measurement approach, performance target", correct: true}
      - {key: B, text: "Threat, vulnerability, impact", why: "Those are risk-assessment inputs."}
      - {key: C, text: "Owner, custodian, user", why: "Those are Conceptual × People roles."}
      - {key: D, text: "Service, mechanism, component", why: "Those are the three lower layers."}
    explanation: "Type says what kind of measure, approach says how it is obtained, target says what level is good enough."
    refs: ["SABSA §3.5"]
    difficulty: 1
    tags: [metrics]
  - id: S3-122
    unit: S3
    objective: "S3.2"
    lesson: S3/02_metrics_measurement_and_performance_targets
    stem: "What is a hard metric?"
    options:
      - {key: A, text: "A quantitative, objective measure counted or timed from records", correct: true}
      - {key: B, text: "A measure that is difficult to obtain", why: "Hard means objective, not difficult."}
      - {key: C, text: "A survey score", why: "That is a soft metric."}
      - {key: D, text: "An expert's opinion", why: "That is a soft metric."}
    explanation: "Two observers would agree on a hard metric's value; soft metrics are qualitative and subjective."
    refs: ["SABSA §3.5"]
    difficulty: 1
    tags: [metrics, hard-soft]
  - id: S3-123
    unit: S3
    objective: "S3.2"
    lesson: S3/02_metrics_measurement_and_performance_targets
    stem: "What is a soft metric?"
    options:
      - {key: A, text: "A metric that has no target", why: "Soft metrics still carry targets."}
      - {key: B, text: "A qualitative, subjective measure assessed by judgement, survey or review", correct: true}
      - {key: C, text: "A metric measured less than monthly", why: "Frequency is part of the approach, not the type."}
      - {key: D, text: "A metric for opportunities only", why: "Type is independent of the risk side."}
    explanation: "Soft metrics are declared as such so a survey score is not mistaken for an audit count."
    refs: ["SABSA §3.5"]
    difficulty: 1
    tags: [metrics, hard-soft]
  - id: S3-124
    unit: S3
    objective: "S3.2"
    lesson: S3/02_metrics_measurement_and_performance_targets
    stem: "'Availability is the percentage of one-minute intervals per month in which the synthetic probe succeeded, reported by operations on the first working day of the next month.' What is this?"
    options:
      - {key: A, text: "A metric type", why: "Type would be 'hard'."}
      - {key: B, text: "A measurement approach", correct: true}
      - {key: C, text: "A performance target", why: "No threshold is stated."}
      - {key: D, text: "A control objective", why: "It says how to measure, not what to achieve."}
    explanation: "Source, method, frequency and owner make up the measurement approach."
    refs: ["SABSA §3.5"]
    difficulty: 2
    tags: [metrics, approach]
  - id: S3-125
    unit: S3
    objective: "S3.2"
    lesson: S3/02_metrics_measurement_and_performance_targets
    stem: "'99.95 % of one-minute intervals per month.' What is this?"
    options:
      - {key: A, text: "A performance target", correct: true}
      - {key: B, text: "A metric type", why: "Type would be hard or soft."}
      - {key: C, text: "A measurement approach", why: "No method or frequency is stated, only a level."}
      - {key: D, text: "A business driver", why: "Drivers are business needs in business words."}
    explanation: "A level on a metric is the target."
    refs: ["SABSA §3.3"]
    difficulty: 1
    tags: [metrics, targets]
  - id: S3-126
    unit: S3
    objective: "S3.2"
    lesson: S3/02_metrics_measurement_and_performance_targets
    stem: "Which attribute would most naturally use a soft metric?"
    options:
      - {key: A, text: "Available", why: "Uptime is counted: hard."}
      - {key: B, text: "Usable", correct: true}
      - {key: C, text: "Accurate", why: "Reconciliation errors are counted: hard."}
      - {key: D, text: "Compliant", why: "Findings against a rule set are counted: hard."}
    explanation: "Usability is assessed by survey or task-completion study, a judgement-based measure."
    refs: ["SABSA §3.5"]
    difficulty: 2
    tags: [metrics, hard-soft]
  - id: S3-127
    unit: S3
    objective: "S3.2"
    lesson: S3/02_metrics_measurement_and_performance_targets
    stem: "Who agrees the performance target for an attribute?"
    options:
      - {key: A, text: "The architect, from best practice", why: "The target is a business decision."}
      - {key: B, text: "The business, because the target is a statement of risk appetite", correct: true}
      - {key: C, text: "The vendor", why: "Never."}
      - {key: D, text: "The operations team", why: "Operations measures against it."}
    explanation: "The gap between target and perfection is the shortfall the business tolerates: appetite in disguise."
    refs: ["SABSA §3.3"]
    difficulty: 2
    tags: [metrics, targets, appetite]
  - id: S3-128
    unit: S3
    objective: "S3.2"
    lesson: S3/02_metrics_measurement_and_performance_targets
    stem: "In which Lifecycle phase and Matrix layer are the targets actually measured?"
    options:
      - {key: A, text: "Strategy and Planning; Conceptual", why: "That is where they are set."}
      - {key: B, text: "Manage and Measure; Service Management", correct: true}
      - {key: C, text: "Design; Logical", why: "Design uses them; it does not measure them."}
      - {key: D, text: "Implement; Physical", why: "Implementation builds to them."}
    explanation: "Targets are set at the Conceptual layer and measured operationally, the same attribute seen twice."
    refs: ["SABSA §5.1"]
    difficulty: 2
    tags: [metrics, lifecycle]
  - id: S3-129
    unit: S3
    objective: "S3.2"
    lesson: S3/02_metrics_measurement_and_performance_targets
    stem: "What makes a measurement approach a good one?"
    options:
      - {key: A, text: "It is repeatable by someone other than its author and affordable at the stated frequency", correct: true}
      - {key: B, text: "It always produces a percentage", why: "Units depend on the metric."}
      - {key: C, text: "It is performed by the architect", why: "Ownership varies; repeatability matters."}
      - {key: D, text: "It requires no data source", why: "An approach without a source is not a measurement."}
    explanation: "Source, method, frequency and owner, stated so that another person could run it."
    refs: ["SABSA §3.5"]
    difficulty: 2
    tags: [metrics, approach]
  - id: S3-130
    unit: S3
    objective: "S3.2"
    lesson: S3/02_metrics_measurement_and_performance_targets
    stem: "Which statement about hard and soft metrics is correct?"
    options:
      - {key: A, text: "Hard metrics are always better", why: "Neither is better; the type must be declared."}
      - {key: B, text: "Neither is better; declaring the type prevents a survey score being mistaken for an audit count", correct: true}
      - {key: C, text: "Soft metrics cannot carry a target", why: "They can: 'mean score 4.2 of 5'."}
      - {key: D, text: "Hard metrics apply only to the risk-management family", why: "Any family may use either."}
    explanation: "The type is a declaration of the kind of evidence, not a ranking."
    refs: ["SABSA §3.5"]
    difficulty: 2
    tags: [metrics, hard-soft]
  - id: S3-131
    unit: S3
    objective: "S3.2"
    lesson: S3/02_metrics_measurement_and_performance_targets
    stem: "'Mean customer satisfaction score 4.2 of 5 or above, from a survey after each release.' Which parts are target and approach?"
    options:
      - {key: A, text: "Target: 4.2 of 5 or above; approach: survey after each release", correct: true}
      - {key: B, text: "Target: survey after each release; approach: 4.2 of 5", why: "Reversed."}
      - {key: C, text: "Both are the metric type", why: "The type would be 'soft'."}
      - {key: D, text: "Both are the target", why: "The survey describes how, not what level."}
    explanation: "Level is target; method and frequency are approach; the type here is soft."
    refs: ["SABSA §3.5"]
    difficulty: 2
    tags: [metrics, targets, approach]
  - id: S3-132
    unit: S3
    objective: "S3.2"
    lesson: S3/02_metrics_measurement_and_performance_targets
    stem: "Why does SABSA say an attribute without metric, approach and target is a slogan?"
    options:
      - {key: A, text: "Because it cannot be designed to, tested against or reported on", correct: true}
      - {key: B, text: "Because it is not in the taxonomy", why: "Taxonomy membership is separate."}
      - {key: C, text: "Because it has no owner", why: "Ownership is a People-cell concern."}
      - {key: D, text: "Because it is not a threat", why: "Unrelated."}
    explanation: "Measurability is what turns an adjective into a requirement."
    refs: ["SABSA §3.3"]
    difficulty: 1
    tags: [metrics]
  - id: S3-133
    unit: S3
    objective: "S3.2"
    lesson: S3/02_metrics_measurement_and_performance_targets
    stem: "How does a control objective relate to an attribute's target?"
    options:
      - {key: A, text: "The objective is derived from the attribute together with its target, which gives the designer a level to design to", correct: true}
      - {key: B, text: "The objective replaces the target", why: "Both persist."}
      - {key: C, text: "They are unrelated", why: "The target gives the objective its threshold."}
      - {key: D, text: "The target is derived from the objective", why: "Reversed."}
    explanation: "'Confidential' alone gives no guidance; 'confidential with zero exposures, verified quarterly' does."
    refs: ["SABSA §3.3"]
    difficulty: 2
    tags: [metrics, targets, objectives]
  - id: S3-134
    unit: S3
    objective: "S3.2"
    lesson: S3/02_metrics_measurement_and_performance_targets
    stem: "Which is a hard metric with a hard proxy for a soft attribute?"
    options:
      - {key: A, text: "Training completion rate as a proxy for 'educated and aware'", correct: true}
      - {key: B, text: "Uptime as a proxy for 'available'", why: "Uptime is the direct hard metric for available, not a proxy."}
      - {key: C, text: "Survey score as a proxy for 'usable'", why: "A survey is the soft metric itself."}
      - {key: D, text: "Audit findings as a proxy for 'compliant'", why: "Direct hard metric."}
    explanation: "Awareness is judged; completion is counted and stands in for it."
    refs: ["SABSA §3.5"]
    difficulty: 3
    tags: [metrics, hard-soft]
  - id: S3-135
    unit: S3
    objective: "S3.2"
    lesson: S3/02_metrics_measurement_and_performance_targets
    stem: "When must performance targets be revisited?"
    options:
      - {key: A, text: "Never; they are fixed at design time", why: "They change with appetite."}
      - {key: B, text: "Whenever the risk appetite changes, and at each Manage and Measure feedback into planning", correct: true}
      - {key: C, text: "Only when a product is replaced", why: "Component changes do not drive targets."}
      - {key: D, text: "Only after a breach", why: "A breach may prompt it, but appetite review is the rule."}
    explanation: "Targets express appetite; measured results re-baseline them in the next planning cycle."
    refs: ["SABSA §5.1"]
    difficulty: 2
    tags: [metrics, targets, lifecycle]
  - id: S3-136
    unit: S3
    objective: "S3.2"
    lesson: S3/02_metrics_measurement_and_performance_targets
    stem: "Which is NOT a typical measurement approach?"
    options:
      - {key: A, text: "Reading monitoring data", why: "Common approach."}
      - {key: B, text: "Independent audit or penetration test", why: "Common approach."}
      - {key: C, text: "Selecting a vendor product", correct: true}
      - {key: D, text: "User survey", why: "Common soft approach."}
    explanation: "Approaches gather evidence; product selection does not."
    refs: ["SABSA §3.5"]
    difficulty: 1
    tags: [metrics, approach]
  - id: S3-137
    unit: S3
    objective: "S3.2"
    lesson: S3/02_metrics_measurement_and_performance_targets
    stem: "In the TOGAF guide, in which phase does the security audit verify the attributes?"
    options:
      - {key: A, text: "Phase G", correct: true}
      - {key: B, text: "Phase A", why: "Phase A sets the requirements."}
      - {key: C, text: "Phase B", why: "Phase B designs policy and domains."}
      - {key: D, text: "Preliminary Phase", why: "Capability and principles."}
    explanation: "Implementation governance in Phase G includes the security audit against the attributes and the Architecture Contract."
    refs: ["GUIDE:integrating-risk-and-security §5.8"]
    difficulty: 2
    tags: [metrics, togaf]
  - id: S3-138
    unit: S3
    objective: "S3.2"
    lesson: S3/02_metrics_measurement_and_performance_targets
    stem: "'Quantitative' or 'qualitative' describes which of the three columns?"
    options:
      - {key: A, text: "Metric type", correct: true}
      - {key: B, text: "Measurement approach", why: "Approach is how and how often."}
      - {key: C, text: "Performance target", why: "Target is the level."}
      - {key: D, text: "Attribute family", why: "Families group attributes, not measures."}
    explanation: "Hard is quantitative, soft is qualitative: the metric type."
    refs: ["SABSA §3.5"]
    difficulty: 1
    tags: [metrics, hard-soft]
  - id: S3-139
    unit: S3
    objective: "S3.2"
    lesson: S3/02_metrics_measurement_and_performance_targets
    stem: "Which is a well-formed target for 'non-repudiable'?"
    options:
      - {key: A, text: "100 % of sampled transactions carry a verifiable signature", correct: true}
      - {key: B, text: "Use digital signatures", why: "A mechanism, not a target."}
      - {key: C, text: "Non-repudiation is essential", why: "A priority statement."}
      - {key: D, text: "Quarterly audit", why: "Part of the approach."}
    explanation: "A target is a level on a metric that a test can confirm."
    refs: ["SABSA §3.5"]
    difficulty: 2
    tags: [metrics, targets]
  - id: S3-140
    unit: S3
    objective: "S3.2"
    lesson: S3/02_metrics_measurement_and_performance_targets
    stem: "A requirement without a measure cannot be governed. Which TOGAF concept is the nearest to SABSA's performance target?"
    options:
      - {key: A, text: "A Measure attached to a Requirement or Objective in the content metamodel", correct: true}
      - {key: B, text: "A Solution Building Block", why: "A solution, not a measure."}
      - {key: C, text: "A Transition Architecture", why: "A state, not a measure."}
      - {key: D, text: "A viewpoint", why: "A perspective, not a measure."}
    explanation: "TOGAF measures on requirements and objectives play the part of SABSA's targets."
    refs: ["GUIDE:integrating-risk-and-security §5.10", "SABSA §3.5"]
    difficulty: 2
    tags: [metrics, togaf, confusables]
  # ---------------------------------------------------------------- S3.3 two-sided risk and control types
  - id: S3-141
    unit: S3
    objective: "S3.3"
    lesson: S3/03_two_sided_risk_and_control_types
    stem: "How does SABSA define risk?"
    options:
      - {key: A, text: "The chance of loss only", why: "SABSA's risk includes the upside."}
      - {key: B, text: "Uncertainty of outcome, which may be worse (threat) or better (opportunity) than expected", correct: true}
      - {key: C, text: "The number of vulnerabilities in a system", why: "A count, not risk."}
      - {key: D, text: "The cost of controls", why: "Unrelated."}
    explanation: "Two-sided risk is SABSA's distinctive position."
    refs: ["SABSA §4"]
    difficulty: 1
    tags: [risk, two-sided]
  - id: S3-142
    unit: S3
    objective: "S3.3"
    lesson: S3/03_two_sided_risk_and_control_types
    stem: "What is an opportunity in SABSA's risk model?"
    options:
      - {key: A, text: "The absence of a threat", why: "It is a positive uncertainty, not a negation."}
      - {key: B, text: "The possibility that an outcome is better than expected", correct: true}
      - {key: C, text: "A weaker control", why: "Controls are not opportunities."}
      - {key: D, text: "A residual risk", why: "Residual risk is what remains after treatment."}
    explanation: "Threat and opportunity are the two sides of the same uncertainty."
    refs: ["SABSA §4"]
    difficulty: 1
    tags: [risk, opportunity]
  - id: S3-143
    unit: S3
    objective: "S3.3"
    lesson: S3/03_two_sided_risk_and_control_types
    stem: "What are the five SABSA control types?"
    options:
      - {key: A, text: "Enhance, protect, detect, recover, correct", correct: true}
      - {key: B, text: "Identify, protect, detect, respond, recover", why: "NIST framework functions."}
      - {key: C, text: "Avoid, transfer, mitigate, accept, exploit", why: "Risk treatment options."}
      - {key: D, text: "Plan, build, run, monitor, improve", why: "Not the SABSA list."}
    explanation: "One opportunity-side type (enhance) and four threat-side types ordered by when they act."
    refs: ["SABSA §4.2"]
    difficulty: 1
    tags: [controls, types]
  - id: S3-144
    unit: S3
    objective: "S3.3"
    lesson: S3/03_two_sided_risk_and_control_types
    stem: "Which control type acts on the opportunity side?"
    options:
      - {key: A, text: "Protect", why: "Threat side, before the event."}
      - {key: B, text: "Enhance", correct: true}
      - {key: C, text: "Detect", why: "Threat side, during."}
      - {key: D, text: "Correct", why: "Threat side, after."}
    explanation: "Enhance increases the likelihood or value of a good outcome."
    refs: ["SABSA §4.2"]
    difficulty: 1
    tags: [controls, enhance]
  - id: S3-145
    unit: S3
    objective: "S3.3"
    lesson: S3/03_two_sided_risk_and_control_types
    stem: "Backup and failover are controls of which type?"
    options:
      - {key: A, text: "Protect", why: "They do not reduce the likelihood of the event."}
      - {key: B, text: "Detect", why: "They do not discover the event."}
      - {key: C, text: "Recover", correct: true}
      - {key: D, text: "Correct", why: "They restore state; they do not remove the cause."}
    explanation: "Recover restores the service or asset to its required state after the event."
    refs: ["SABSA §4.2"]
    difficulty: 1
    tags: [controls, recover]
  - id: S3-146
    unit: S3
    objective: "S3.3"
    lesson: S3/03_two_sided_risk_and_control_types
    stem: "Patching the vulnerability that was exploited and changing the policy that allowed it are controls of which type?"
    options:
      - {key: A, text: "Recover", why: "Recovery restores state; this removes the cause."}
      - {key: B, text: "Correct", correct: true}
      - {key: C, text: "Detect", why: "Detection discovers; this changes the architecture."}
      - {key: D, text: "Enhance", why: "Threat side, not opportunity."}
    explanation: "Correct removes the cause so the event does not recur."
    refs: ["SABSA §4.2"]
    difficulty: 2
    tags: [controls, correct]
  - id: S3-147
    unit: S3
    objective: "S3.3"
    lesson: S3/03_two_sided_risk_and_control_types
    stem: "Intrusion detection and reconciliation are controls of which type?"
    options:
      - {key: A, text: "Detect", correct: true}
      - {key: B, text: "Protect", why: "They do not prevent."}
      - {key: C, text: "Recover", why: "They do not restore."}
      - {key: D, text: "Enhance", why: "Threat side."}
    explanation: "Detect discovers that a bad outcome is occurring or has occurred, and notifies."
    refs: ["SABSA §4.2"]
    difficulty: 1
    tags: [controls, detect]
  - id: S3-148
    unit: S3
    objective: "S3.3"
    lesson: S3/03_two_sided_risk_and_control_types
    stem: "Access control, encryption and segregation of duties are controls of which type?"
    options:
      - {key: A, text: "Protect", correct: true}
      - {key: B, text: "Detect", why: "They do not discover events."}
      - {key: C, text: "Recover", why: "They do not restore."}
      - {key: D, text: "Correct", why: "They do not remove a cause after the fact."}
    explanation: "Protect reduces the likelihood of a bad outcome by deterring or preventing it."
    refs: ["SABSA §4.2"]
    difficulty: 1
    tags: [controls, protect]
  - id: S3-149
    unit: S3
    objective: "S3.3"
    lesson: S3/03_two_sided_risk_and_control_types
    stem: "A single sign-on service that lets customers onboard in minutes and opens a new sales channel is a control of which type?"
    options:
      - {key: A, text: "Protect", why: "It also authenticates, but the described effect is increased value."}
      - {key: B, text: "Enhance", correct: true}
      - {key: C, text: "Detect", why: "It discovers nothing."}
      - {key: D, text: "Recover", why: "It restores nothing."}
    explanation: "Any control described as increasing value, speed, reach or revenue is enhance."
    refs: ["SABSA §4.2"]
    difficulty: 2
    tags: [controls, enhance]
  - id: S3-150
    unit: S3
    objective: "S3.3"
    lesson: S3/03_two_sided_risk_and_control_types
    stem: "Why is a design with only protective controls incomplete?"
    options:
      - {key: A, text: "Because protection is too expensive", why: "Cost is not the argument."}
      - {key: B, text: "Because it has no way of knowing it has failed, no way to restore and no way to prevent recurrence", correct: true}
      - {key: C, text: "Because protection is a Physical-layer concern only", why: "Control types apply at every layer."}
      - {key: D, text: "Because regulators require detection", why: "Some do, but the SABSA reason is layered strategy."}
    explanation: "Prevent what you can, detect what you cannot prevent, recover from what you detect, correct so it does not recur."
    refs: ["SABSA §4.2"]
    difficulty: 2
    tags: [controls, layered]
  - id: S3-151
    unit: S3
    objective: "S3.3"
    lesson: S3/03_two_sided_risk_and_control_types
    stem: "What does the older Blue Book multi-tiered control strategy (deter, prevent, contain, detect and notify, evidence and track, recover and restore, assure) relate to?"
    options:
      - {key: A, text: "It is a finer-grained version of the threat-side sequence protect, detect, recover, correct", correct: true}
      - {key: B, text: "It replaces the five control types", why: "It elaborates them."}
      - {key: C, text: "It is the list of attribute families", why: "Unrelated."}
      - {key: D, text: "It is the Lifecycle", why: "Unrelated."}
    explanation: "Deter and prevent are protect; detect and notify is detect; recover and restore is recover; evidence, track and assure support correction and assurance."
    refs: ["SABSA §4.2"]
    difficulty: 3
    tags: [controls, multi-tiered]
  - id: S3-152
    unit: S3
    objective: "S3.3"
    lesson: S3/03_two_sided_risk_and_control_types
    stem: "Which control type acts during the event?"
    options:
      - {key: A, text: "Protect", why: "Before."}
      - {key: B, text: "Detect", correct: true}
      - {key: C, text: "Recover", why: "After."}
      - {key: D, text: "Correct", why: "After."}
    explanation: "The four threat-side types are ordered by timing: protect before, detect during, recover and correct after."
    refs: ["SABSA §4.2"]
    difficulty: 2
    tags: [controls, timing]
  - id: S3-153
    unit: S3
    objective: "S3.3"
    lesson: S3/03_two_sided_risk_and_control_types
    stem: "What are the risk treatment options SABSA recognises?"
    options:
      - {key: A, text: "Avoid, transfer, mitigate, accept, plus exploit on the opportunity side", correct: true}
      - {key: B, text: "Protect, detect, recover", why: "Control types, not treatment options."}
      - {key: C, text: "Ignore, delay, escalate", why: "Not the SABSA list."}
      - {key: D, text: "Insure only", why: "Insurance is one form of transfer."}
    explanation: "The conventional four with a symmetrical fifth for opportunities."
    refs: ["SABSA §4.1"]
    difficulty: 2
    tags: [risk, treatment]
  - id: S3-154
    unit: S3
    objective: "S3.3"
    lesson: S3/03_two_sided_risk_and_control_types
    stem: "How does SABSA relate risk appetite, control-objective threshold and performance target?"
    options:
      - {key: A, text: "They are the same decision in three vocabularies; changing one must change the others", correct: true}
      - {key: B, text: "They are set by three different bodies and may disagree", why: "They must agree."}
      - {key: C, text: "Appetite applies only to opportunities", why: "It applies to both sides."}
      - {key: D, text: "Targets are technical and unrelated to appetite", why: "A target is an appetite statement."}
    explanation: "A 99.95 % target is an appetite of 0.05 % outage and a threshold for the availability objective."
    refs: ["SABSA §4.1"]
    difficulty: 2
    tags: [risk, appetite]
  - id: S3-155
    unit: S3
    objective: "S3.3"
    lesson: S3/03_two_sided_risk_and_control_types
    stem: "What does SABSA add to the conventional risk model?"
    options:
      - {key: A, text: "Opportunity and enablement, with the enhance control type", correct: true}
      - {key: B, text: "A larger threat catalogue", why: "Not the contribution."}
      - {key: C, text: "Quantitative-only assessment", why: "SABSA allows soft metrics."}
      - {key: D, text: "A ban on accepting risk", why: "Acceptance is a valid treatment."}
    explanation: "Two-sided risk is what distinguishes SABSA's model."
    refs: ["SABSA §4"]
    difficulty: 1
    tags: [risk, two-sided]
  - id: S3-156
    unit: S3
    objective: "S3.3"
    lesson: S3/03_two_sided_risk_and_control_types
    stem: "How does the TOGAF risk and security guide define risk?"
    options:
      - {key: A, text: "The effect of uncertainty on objectives, which may be positive or negative", correct: true}
      - {key: B, text: "The probability of a breach", why: "Too narrow."}
      - {key: C, text: "Loss expressed in money", why: "Not the guide's definition."}
      - {key: D, text: "A control gap", why: "A gap is a finding, not risk."}
    explanation: "The guide's definition, aligned with ISO 31000, agrees with SABSA's two-sided view."
    refs: ["GUIDE:integrating-risk-and-security §3.1.1"]
    difficulty: 2
    tags: [risk, togaf]
  - id: S3-157
    unit: S3
    objective: "S3.3"
    lesson: S3/03_two_sided_risk_and_control_types
    stem: "Root-cause analysis and lessons-learned changes to the architecture are of which control type?"
    options:
      - {key: A, text: "Correct", correct: true}
      - {key: B, text: "Recover", why: "They do not restore state."}
      - {key: C, text: "Detect", why: "They follow detection."}
      - {key: D, text: "Protect", why: "They are after the event, though they may produce new protective controls."}
    explanation: "Correction removes the cause and adjusts the architecture."
    refs: ["SABSA §4.2"]
    difficulty: 2
    tags: [controls, correct]
  - id: S3-158
    unit: S3
    objective: "S3.3"
    lesson: S3/03_two_sided_risk_and_control_types
    stem: "In the TOGAF guide, where is the risk mitigation plan produced?"
    options:
      - {key: A, text: "Phase E", correct: true}
      - {key: B, text: "Phase A", why: "Phase A does initial assessment."}
      - {key: C, text: "Phase H", why: "Change management."}
      - {key: D, text: "Preliminary Phase", why: "Capability and principles."}
    explanation: "The guide places the risk mitigation plan in Phase E, Opportunities and Solutions."
    refs: ["GUIDE:integrating-risk-and-security §5.6"]
    difficulty: 2
    tags: [risk, togaf]
  - id: S3-159
    unit: S3
    objective: "S3.3"
    lesson: S3/03_two_sided_risk_and_control_types
    stem: "Which TOGAF risk-technique concepts correspond to SABSA's threat-side ratings before and after treatment?"
    options:
      - {key: A, text: "Initial risk and residual risk", correct: true}
      - {key: B, text: "Baseline and target architecture", why: "Architecture states, not risk ratings."}
      - {key: C, text: "Gap and roadmap", why: "Migration concepts."}
      - {key: D, text: "Principle and rationale", why: "Principle parts."}
    explanation: "TOGAF's Phase A technique assesses initial risk and residual risk after mitigation."
    refs: ["SABSA §4", "GUIDE:integrating-risk-and-security §3.1"]
    difficulty: 2
    tags: [risk, togaf, confusables]
  - id: S3-160
    unit: S3
    objective: "S3.3"
    lesson: S3/03_two_sided_risk_and_control_types
    stem: "Which control types together form SABSA's layered threat-side strategy?"
    options:
      - {key: A, text: "Protect, detect, recover, correct", correct: true}
      - {key: B, text: "Enhance, protect", why: "Enhance is opportunity side."}
      - {key: C, text: "Detect only", why: "One layer is not layered."}
      - {key: D, text: "Avoid, transfer, accept", why: "Treatment options."}
    explanation: "No single type suffices; the four together cover before, during and after the event."
    refs: ["SABSA §4.2"]
    difficulty: 1
    tags: [controls, layered]
  # ---------------------------------------------------------------- S3.4 operational risk and assessment
  - id: S3-161
    unit: S3
    objective: "S3.4"
    lesson: S3/04_operational_risk_and_risk_assessment
    stem: "How is operational risk defined?"
    options:
      - {key: A, text: "The risk of loss or missed gain from inadequate or failed processes, people and systems, or from external events", correct: true}
      - {key: B, text: "The risk of a network outage", why: "One example, not the definition."}
      - {key: C, text: "Market and credit risk", why: "Different risk categories."}
      - {key: D, text: "The cost of running security operations", why: "Not a risk definition."}
    explanation: "SABSA adopts the regulators' definition so security sits where the business already accounts for risk."
    refs: ["SABSA §4.3"]
    difficulty: 1
    tags: [operational-risk, definitions]
  - id: S3-162
    unit: S3
    objective: "S3.4"
    lesson: S3/04_operational_risk_and_risk_assessment
    stem: "In which Matrix cell is operational risk management?"
    options:
      - {key: A, text: "Service Management × Motivation", correct: true}
      - {key: B, text: "Contextual × Motivation", why: "Business risk."}
      - {key: C, text: "Logical × Motivation", why: "Policies."}
      - {key: D, text: "Service Management × Process", why: "Process delivery management."}
    explanation: "The bottom of the Motivation column: assessment, monitoring, reporting and treatment while services run."
    refs: ["SABSA §2.2"]
    difficulty: 1
    tags: [operational-risk, cells]
  - id: S3-163
    unit: S3
    objective: "S3.4"
    lesson: S3/04_operational_risk_and_risk_assessment
    stem: "What are the stages of SABSA's operational risk management loop?"
    options:
      - {key: A, text: "Identify, assess, treat, monitor, report", correct: true}
      - {key: B, text: "Design, build, test, deploy", why: "A delivery lifecycle."}
      - {key: C, text: "Protect, detect, recover, correct", why: "Control types."}
      - {key: D, text: "Plan, design, implement, manage", why: "The SABSA Lifecycle, not the risk loop."}
    explanation: "The loop runs at the Service Management layer and feeds back to Strategy and Planning."
    refs: ["SABSA §4.3"]
    difficulty: 2
    tags: [operational-risk, loop]
  - id: S3-164
    unit: S3
    objective: "S3.4"
    lesson: S3/04_operational_risk_and_risk_assessment
    stem: "What is distinctive about the SABSA risk assessment compared with a conventional threat assessment?"
    options:
      - {key: A, text: "It is centred on the business attributes an asset needs, with impact assessed in business terms, and it covers opportunity as well as threat", correct: true}
      - {key: B, text: "It uses only quantitative data", why: "Soft measures are allowed."}
      - {key: C, text: "It ignores likelihood", why: "Likelihood is a step."}
      - {key: D, text: "It is performed only by auditors", why: "Not a SABSA rule."}
    explanation: "The question is 'what could stop each attribute being true, and how bad would that be for the business?'"
    refs: ["SABSA §4.4"]
    difficulty: 2
    tags: [assessment]
  - id: S3-165
    unit: S3
    objective: "S3.4"
    lesson: S3/04_operational_risk_and_risk_assessment
    stem: "Against what is impact assessed in a SABSA risk assessment?"
    options:
      - {key: A, text: "The technical value of the asset", why: "Leaves the business out."}
      - {key: B, text: "The business attribute, in business units such as fines, lost customers and reputation", correct: true}
      - {key: C, text: "The number of records", why: "A technical count."}
      - {key: D, text: "The replacement cost of hardware", why: "Not the business impact."}
    explanation: "Impact is measured against the attribute because that is what the drivers trace to."
    refs: ["SABSA §4.4"]
    difficulty: 2
    tags: [assessment, impact]
  - id: S3-166
    unit: S3
    objective: "S3.4"
    lesson: S3/04_operational_risk_and_risk_assessment
    stem: "Which is the correct order of the SABSA risk assessment steps?"
    options:
      - {key: A, text: "Asset and attribute; threat or opportunity; vulnerability; impact; likelihood; rating; compare with appetite", correct: true}
      - {key: B, text: "Vulnerability; asset; rating; impact", why: "Asset and attribute come first; rating follows impact and likelihood."}
      - {key: C, text: "Likelihood; impact; asset; treatment", why: "Asset first."}
      - {key: D, text: "Compare with appetite; then identify assets", why: "Appetite comparison is last."}
    explanation: "Start from the asset and the attributes it needs; end by comparing the rating with the target and appetite."
    refs: ["SABSA §4.4"]
    difficulty: 2
    tags: [assessment, procedure]
  - id: S3-167
    unit: S3
    objective: "S3.4"
    lesson: S3/04_operational_risk_and_risk_assessment
    stem: "How are impact and likelihood combined?"
    options:
      - {key: A, text: "Into a risk rating, typically on a matrix, that gives priority", correct: true}
      - {key: B, text: "They are reported separately and never combined", why: "Rating combines them."}
      - {key: C, text: "Only impact is used", why: "Both are steps."}
      - {key: D, text: "They are multiplied by the number of controls", why: "Not the method."}
    explanation: "Rating gives a priority to compare with appetite."
    refs: ["SABSA §4.4"]
    difficulty: 1
    tags: [assessment, rating]
