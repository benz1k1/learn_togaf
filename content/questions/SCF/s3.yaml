  - id: S3-176
    unit: S3
    objective: "S3.4"
    lesson: S3/04_operational_risk_and_risk_assessment
    stem: "Why does SABSA place information security inside operational risk rather than in a separate risk universe?"
    options:
      - {key: A, text: "So that security is accounted for where the board already tracks risk, beside fraud, process failure and supplier failure", correct: true}
      - {key: B, text: "Because regulators forbid separate security risk registers", why: "Not the reason."}
      - {key: C, text: "Because security risks are always small", why: "Not a SABSA claim."}
      - {key: D, text: "Because operational risk has no appetite", why: "It does."}
