  - id: S3-120
    unit: S3
    objective: "S3.1"
    lesson: S3/01_the_business_attributes_profile
    stem: "Which attribute is in the business-strategy family?"
    options:
      - {key: A, text: "Providing return on investment", correct: true}
      - {key: B, text: "Cost-effective", why: "Management."}
      - {key: C, text: "Standards-compliant", why: "Technical strategy."}
      - {key: D, text: "Timely", why: "User."}
    explanation: "Return on investment, investment re-use, governable, brand-enhancing and reputable are business-strategy attributes."
    refs: ["SABSA §3.4"]
