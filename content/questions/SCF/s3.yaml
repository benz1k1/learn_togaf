    objective: "S3.4"
    lesson: S3/04_operational_risk_and_risk_assessment
    stem: "A risk assessment rates losses thoroughly but never considers gains. In SABSA's terms it is what?"
    options:
      - {key: A, text: "Complete", why: "It omits the opportunity side."}
      - {key: B, text: "Incomplete, because SABSA's assessment covers opportunity as well as threat", correct: true}
      - {key: C, text: "A Component-layer assessment", why: "Layer is irrelevant."}
      - {key: D, text: "An assurance report", why: "Not what assurance means."}
