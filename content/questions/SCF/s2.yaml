      - {key: B, text: "Business governance: the organisation and its relationships", correct: true}
      - {key: C, text: "The entity and trust framework", why: "That is Logical × People."}
      - {key: D, text: "Identity and access-control systems", why: "That is Physical × People."}
    explanation: "The business view of 'who' is its governance: structures, accountabilities, customers, suppliers, partners, regulators."
    refs: ["SABSA §3.1"]
    difficulty: 2
    tags: [contextual, cells]
