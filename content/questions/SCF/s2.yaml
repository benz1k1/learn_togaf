questions:
  # ---------------------------------------------------------------- S2.1 Contextual layer
  - id: S2-101
    unit: S2
    objective: "S2.1"
    lesson: S2/01_the_contextual_layer
    stem: "Whose view is the Contextual layer of the SABSA Matrix?"
    options:
      - {key: A, text: "The business", correct: true}
      - {key: B, text: "The architect", why: "The architect's view is the Conceptual layer."}
      - {key: C, text: "The designer", why: "The designer's view is the Logical layer."}
      - {key: D, text: "The facilities manager", why: "That is the Service Management layer."}
    explanation: "The Contextual layer is the business view: the enterprise as it sees itself, in its own language."
    refs: ["SABSA §3"]
    difficulty: 1
    tags: [contextual, views]
  - id: S2-102
    unit: S2
    objective: "S2.1"
    lesson: S2/01_the_contextual_layer
    stem: "What is in the Contextual × Motivation cell?"
    options:
      - {key: A, text: "Risk management objectives", why: "That is Conceptual × Motivation."}
      - {key: B, text: "Business risk: opportunities and threats", correct: true}
      - {key: C, text: "Risk management policies", why: "That is Logical × Motivation."}
      - {key: D, text: "Operational risk management", why: "That is Service Management × Motivation."}
    explanation: "The business's own perception of risk, on both sides, before the architect has turned it into objectives."
    refs: ["SABSA §3.1"]
    difficulty: 1
    tags: [contextual, cells, risk]
