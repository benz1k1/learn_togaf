questions:
  # ---------------------------------------------------------------- S6.1 The SABSA Lifecycle
  - id: S6-101
    unit: S6
    objective: "S6.1"
    lesson: S6/01_the_sabsa_lifecycle
    stem: "Which is the correct order of the SABSA Lifecycle phases?"
    options:
      - {key: A, text: "Strategy and Planning, Design, Implement, Manage and Measure", correct: true}
      - {key: B, text: "Design, Strategy and Planning, Implement, Manage and Measure", why: "Strategy precedes design."}
      - {key: C, text: "Strategy and Planning, Implement, Design, Manage and Measure", why: "Design precedes implementation."}
      - {key: D, text: "Plan, Do, Check, Act", why: "That is the Deming cycle, not SABSA's names."}
    explanation: "Four phases in a loop, with Manage and Measure feeding back into Strategy and Planning."
    refs: ["SABSA §4"]
    difficulty: 1
    tags: [lifecycle]
  - id: S6-102
    unit: S6
    objective: "S6.1"
    lesson: S6/01_the_sabsa_lifecycle
    stem: "Which Matrix layers does the Strategy and Planning phase fill?"
    options:
      - {key: A, text: "Contextual and Conceptual", correct: true}
      - {key: B, text: "Contextual only", why: "The Conceptual layer, with the Business Attributes Profile, is also produced here."}
      - {key: C, text: "Logical and Physical", why: "Those are Design-phase layers."}
      - {key: D, text: "Service Management", why: "That is Manage and Measure."}
    explanation: "Strategy and Planning answers the business and architect questions."
    refs: ["SABSA §4"]
    difficulty: 1
    tags: [lifecycle, strategy]
  - id: S6-103
    unit: S6
    objective: "S6.1"
    lesson: S6/01_the_sabsa_lifecycle
    stem: "Which Matrix layers are covered by the Design phase?"
    options:
      - {key: A, text: "Logical, Physical, Component and Service Management", correct: true}
      - {key: B, text: "Logical only", why: "Physical and Component are still design layers."}
      - {key: C, text: "Logical and Physical only", why: "Component and the design of Service Management are included."}
      - {key: D, text: "Contextual and Conceptual", why: "Those are Strategy and Planning."}
    explanation: "Choosing the product and standard is design; installing it is Implement."
    refs: ["SABSA §4"]
    difficulty: 2
    tags: [lifecycle, design, trap]
  - id: S6-104
    unit: S6
    objective: "S6.1"
    lesson: S6/01_the_sabsa_lifecycle
    stem: "What is the signature output of the Strategy and Planning phase?"
    options:
      - {key: A, text: "The Business Attributes Profile with performance targets and the risk appetite", correct: true}
      - {key: B, text: "The security services catalogue", why: "Logical, Design phase."}
      - {key: C, text: "The product and standards list", why: "Component, Design phase."}
      - {key: D, text: "Attribute measurement reports", why: "Manage and Measure."}
    explanation: "Nothing is designed until the business has said what must be protected and enabled, measurably."
    refs: ["SABSA §4", "SABSA §5"]
    difficulty: 1
    tags: [lifecycle, attributes]
  - id: S6-105
    unit: S6
    objective: "S6.1"
    lesson: S6/01_the_sabsa_lifecycle
    stem: "In which lifecycle phase are the attribute metrics actually collected and compared with targets?"
    options:
      - {key: A, text: "Manage and Measure", correct: true}
      - {key: B, text: "Strategy and Planning", why: "Metrics are defined there, not collected."}
      - {key: C, text: "Design", why: "Design decides how they will be measured."}
      - {key: D, text: "Implement", why: "Implement builds; measurement starts once live."}
    explanation: "Manage and Measure operates the controls and measures performance against target."
    refs: ["SABSA §4"]
    difficulty: 1
    tags: [lifecycle, measure]
  - id: S6-106
    unit: S6
    objective: "S6.1"
    lesson: S6/01_the_sabsa_lifecycle
    stem: "Where do the findings of Manage and Measure flow?"
    options:
      - {key: A, text: "Back into Strategy and Planning, closing the loop", correct: true}
      - {key: B, text: "Into an archive; the lifecycle is linear", why: "The lifecycle is a loop."}
      - {key: C, text: "Directly into Implement", why: "Changes are re-planned first."}
      - {key: D, text: "Into the Component layer only", why: "Findings may change any layer, starting at strategy."}
    explanation: "Missed targets and changed threats re-enter Strategy and Planning."
    refs: ["SABSA §4"]
    difficulty: 1
    tags: [lifecycle, loop]
  - id: S6-107
    unit: S6
    objective: "S6.1"
    lesson: S6/01_the_sabsa_lifecycle
    stem: "In which lifecycle phase is the operational security process DESIGNED?"
    options:
      - {key: A, text: "Design", correct: true}
      - {key: B, text: "Manage and Measure", why: "That is where it is performed."}
      - {key: C, text: "Implement", why: "Implement builds what was designed."}
      - {key: D, text: "Strategy and Planning", why: "Strategy sets attributes and appetite."}
    explanation: "The Service Management layer is designed in Design and executed in Manage and Measure."
    refs: ["SABSA §4"]
    difficulty: 2
    tags: [lifecycle, trap]
  - id: S6-108
    unit: S6
    objective: "S6.1"
    lesson: S6/01_the_sabsa_lifecycle
    stem: "What does SABSA insist on during the Implement phase?"
    options:
      - {key: A, text: "That what is implemented is verified against the design and hand-over to Service Management is planned", correct: true}
      - {key: B, text: "That a specific project method is used", why: "SABSA expects the enterprise's own delivery method."}
      - {key: C, text: "That the Business Attributes Profile is rewritten", why: "The profile is a Strategy output."}
      - {key: D, text: "That no measurement takes place until a year after go-live", why: "Measurement should begin on day one."}
    explanation: "Verification against design is the start of assurance; hand-over lets measurement begin."
    refs: ["SABSA §4", "SABSA §6"]
    difficulty: 2
    tags: [lifecycle, implement]
  - id: S6-109
    unit: S6
    objective: "S6.1"
    lesson: S6/01_the_sabsa_lifecycle
    stem: "The relationship between the Matrix and the Lifecycle is best described as:"
    options:
      - {key: A, text: "The Matrix is the static picture of what to answer; the Lifecycle is the dynamic order in which it is filled, built and revisited", correct: true}
      - {key: B, text: "They are alternatives; an enterprise uses one or the other", why: "They are deliberately aligned and used together."}
      - {key: C, text: "The Lifecycle replaces the Service Management layer", why: "Manage and Measure is carried out in that layer."}
      - {key: D, text: "The Matrix is a lifecycle phase", why: "The Matrix is the whole grid."}
    explanation: "Each lifecycle phase maps onto a band of Matrix layers."
    refs: ["SABSA §4", "SABSA §2"]
    difficulty: 2
    tags: [lifecycle, matrix]
  - id: S6-110
    unit: S6
    objective: "S6.1"
    lesson: S6/01_the_sabsa_lifecycle
    stem: "Which lifecycle phase distinguishes SABSA from a design-only method?"
    options:
      - {key: A, text: "Manage and Measure", correct: true}
      - {key: B, text: "Design", why: "Every method designs."}
      - {key: C, text: "Implement", why: "Every method implements."}
      - {key: D, text: "Strategy and Planning", why: "Strategy is where SABSA is business-driven, but the measurement loop is what makes it more than design."}
    explanation: "Collecting metrics against targets and feeding back is what turns the profile into a checked promise."
    refs: ["SABSA §4"]
    difficulty: 2
    tags: [lifecycle, measure]
  - id: S6-111
    unit: S6
    objective: "S6.1"
    lesson: S6/01_the_sabsa_lifecycle
    stem: "A learner maps 'Implement = Physical and Component layers'. What is the error?"
    options:
      - {key: A, text: "Physical and Component are design layers; Implement is what happens after all design layers are complete", correct: true}
      - {key: B, text: "None; that is the SABSA mapping", why: "Design spans Logical to Service Management."}
      - {key: C, text: "Implement covers only the Component layer", why: "Implement is not a layer at all."}
      - {key: D, text: "Physical is a Strategy layer", why: "Physical is a design layer."}
    explanation: "Designing a component (choose product, standard) is Design; installing it is Implement."
    refs: ["SABSA §4"]
    difficulty: 2
    tags: [lifecycle, trap]
  - id: S6-112
    unit: S6
    objective: "S6.1"
    lesson: S6/01_the_sabsa_lifecycle
    stem: "What makes the SABSA Lifecycle a loop rather than a line?"
    options:
      - {key: A, text: "The feedback of attribute metrics and incidents from Manage and Measure into Strategy and Planning", correct: true}
      - {key: B, text: "The fact that Design is repeated for each layer", why: "Layer-by-layer design is still one pass."}
      - {key: C, text: "Its alignment with the ADM circle", why: "The alignment is a consequence, not the cause."}
      - {key: D, text: "The Implement phase running continuously", why: "Implement is a phase, not the loop."}
    explanation: "Without the returning arrow, the profile is written once and never tested."
    refs: ["SABSA §4"]
    difficulty: 2
    tags: [lifecycle, loop]
  - id: S6-113
    unit: S6
    objective: "S6.1"
    lesson: S6/01_the_sabsa_lifecycle
    stem: "Which conceptual frameworks does Strategy and Planning produce for Design to refine?"
    options:
      - {key: A, text: "Domain framework, trust framework and risk-management objectives", correct: true}
      - {key: B, text: "Product catalogue and standards list", why: "Component-layer content."}
      - {key: C, text: "Security mechanisms and platforms", why: "Physical-layer content."}
      - {key: D, text: "Incident and change procedures", why: "Service Management, designed in Design."}
    explanation: "The Conceptual layer's frameworks are refined at the Logical layer in Design."
    refs: ["SABSA §4", "SABSA §3"]
    difficulty: 3
    tags: [lifecycle, conceptual]
  - id: S6-114
    unit: S6
    objective: "S6.1"
    lesson: S6/01_the_sabsa_lifecycle
    stem: "How many phases does the SABSA Lifecycle have?"
    options:
      - {key: A, text: "Four", correct: true}
      - {key: B, text: "Six, one per Matrix layer", why: "Layers are six; lifecycle phases are four."}
      - {key: C, text: "Nine, like the ADM", why: "That is TOGAF."}
      - {key: D, text: "Three", why: "Manage and Measure is the fourth."}
    explanation: "Strategy and Planning, Design, Implement, Manage and Measure."
    refs: ["SABSA §4"]
    difficulty: 1
    tags: [lifecycle]
  - id: S6-115
    unit: S6
    objective: "S6.1"
    lesson: S6/01_the_sabsa_lifecycle
    stem: "Which TOGAF phase is the closest counterpart of Manage and Measure's closing loop?"
    options:
      - {key: A, text: "Phase H, where ERM re-evaluates the architecture and governance decides on a new cycle", correct: true}
      - {key: B, text: "Phase A", why: "Phase A opens the cycle."}
      - {key: C, text: "Phase D", why: "Phase D is technology design."}
      - {key: D, text: "The Preliminary Phase", why: "Preliminary establishes the capability."}
    explanation: "Both loops end by re-assessing against changed threat and opportunity and deciding whether to start again."
    refs: ["GUIDE:integrating-risk-and-security §5.9", "SABSA §4"]
    difficulty: 2
    tags: [lifecycle, adm]
  - id: S6-116
    unit: S6
    objective: "S6.1"
    lesson: S6/01_the_sabsa_lifecycle
    stem: "During Design, at which layer are security services, domains and trust relationships defined?"
    options:
      - {key: A, text: "Logical", correct: true}
      - {key: B, text: "Physical", why: "Physical holds mechanisms and platforms."}
      - {key: C, text: "Component", why: "Component holds products and standards."}
      - {key: D, text: "Conceptual", why: "Conceptual holds attributes and frameworks."}
    explanation: "Design walks Logical, Physical, Component and the Service Management design."
    refs: ["SABSA §4", "SABSA §3.3"]
    difficulty: 1
    tags: [lifecycle, design]
  - id: S6-117
    unit: S6
    objective: "S6.1"
    lesson: S6/01_the_sabsa_lifecycle
    stem: "Why does SABSA design the Service Management layer during Design rather than after go-live?"
    options:
      - {key: A, text: "So that operations, monitoring and audit exist from day one rather than being invented later", correct: true}
      - {key: B, text: "Because Service Management is a design layer below Component", why: "It is orthogonal to the design layers."}
      - {key: C, text: "Because operations staff are the designers", why: "Roles are not the reason."}
      - {key: D, text: "It does not; Service Management is designed in Manage and Measure", why: "It is executed there, designed earlier."}
    explanation: "Designing how controls will be run is part of designing the controls."
    refs: ["SABSA §4"]
    difficulty: 2
    tags: [lifecycle, service-management]
  - id: S6-118
    unit: S6
    objective: "S6.1"
    lesson: S6/01_the_sabsa_lifecycle
    stem: "'Business-driven' is earned in which lifecycle phase?"
    options:
      - {key: A, text: "Strategy and Planning, where the business states requirements in its own vocabulary", correct: true}
      - {key: B, text: "Implement, where the business pays", why: "Paying is not the SABSA sense."}
      - {key: C, text: "Design, where architects choose mechanisms", why: "Design is technical refinement."}
      - {key: D, text: "None; the term describes the Matrix, not the lifecycle", why: "The lifecycle phase that captures business drivers is where it is earned."}
    explanation: "Nothing is designed until the business has said what must be protected and enabled."
    refs: ["SABSA §1", "SABSA §4"]
    difficulty: 2
    tags: [lifecycle, business-driven]
  - id: S6-119
    unit: S6
    objective: "S6.1"
    lesson: S6/01_the_sabsa_lifecycle
    stem: "A performance target is missed during operation. Under the lifecycle, what happens next?"
    options:
      - {key: A, text: "The finding flows back into Strategy and Planning and the loop begins again", correct: true}
      - {key: B, text: "The target is lowered in the Service Management layer", why: "Targets are owned by the business at the Conceptual layer."}
      - {key: C, text: "The component is replaced without review", why: "Changes are re-planned through the loop."}
      - {key: D, text: "Nothing, until the next lifecycle starts on schedule", why: "The loop is event-driven as well as scheduled."}
    explanation: "Manage and Measure reports and feeds back."
    refs: ["SABSA §4", "SABSA §5"]
    difficulty: 2
    tags: [lifecycle, feedback]
  - id: S6-120
    unit: S6
    objective: "S6.1"
    lesson: S6/01_the_sabsa_lifecycle
    stem: "Which lifecycle phase includes procurement, configuration, integration and testing?"
    options:
      - {key: A, text: "Implement", correct: true}
      - {key: B, text: "Design", why: "Design selects; Implement procures and configures."}
      - {key: C, text: "Manage and Measure", why: "That operates what was built."}
      - {key: D, text: "Strategy and Planning", why: "That sets requirements."}
    explanation: "Implement builds the design and transitions it into service."
    refs: ["SABSA §4"]
    difficulty: 1
    tags: [lifecycle, implement]
  # ---------------------------------------------------------------- S6.2 Service Management layer
  - id: S6-121
    unit: S6
    objective: "S6.2"
    lesson: S6/02_the_service_management_layer
    stem: "How is the Service Management layer positioned relative to the other five layers?"
    options:
      - {key: A, text: "It runs across all of them rather than sitting beneath the Component layer", correct: true}
      - {key: B, text: "It is the seventh design layer, below Component", why: "It is orthogonal, not a further level of detail."}
      - {key: C, text: "It sits between Logical and Physical", why: "No layer sits there."}
      - {key: D, text: "It is the same as the Contextual layer", why: "Contextual is the business view."}
    explanation: "Operating, monitoring and auditing are needed at every level of abstraction."
    refs: ["SABSA §3.6"]
    difficulty: 1
    tags: [service-management, layers]
  - id: S6-122
    unit: S6
    objective: "S6.2"
    lesson: S6/02_the_service_management_layer
    stem: "Whose view is the Service Management layer?"
    options:
      - {key: A, text: "The facilities manager's", correct: true}
      - {key: B, text: "The tradesman's", why: "Component."}
      - {key: C, text: "The builder's", why: "Physical."}
      - {key: D, text: "The architect's", why: "Conceptual."}
    explanation: "The older name for the layer is the Operational layer."
    refs: ["SABSA §3.6"]
    difficulty: 1
    tags: [service-management]
  - id: S6-123
    unit: S6
    objective: "S6.2"
    lesson: S6/02_the_service_management_layer
    stem: "In the Service Management layer, the Motivation (Why) cell is:"
    options:
      - {key: A, text: "Operational risk management: continuous assessment, monitoring, reporting and treatment", correct: true}
      - {key: B, text: "Security standards", why: "Component × Motivation."}
      - {key: C, text: "Business risk and opportunity", why: "Contextual × Motivation."}
      - {key: D, text: "Risk-management policies", why: "Logical × Motivation."}
    explanation: "The risk process is run continuously in the operational row."
    refs: ["SABSA §3.6"]
    difficulty: 2
    tags: [service-management, risk]
  - id: S6-124
    unit: S6
    objective: "S6.2"
    lesson: S6/02_the_service_management_layer
    stem: "Which pair of processes keeps the architecture true to its design under pressure?"
    options:
      - {key: A, text: "Incident management and change management", correct: true}
      - {key: B, text: "Procurement and budgeting", why: "Not Service Management processes in SABSA."}
      - {key: C, text: "Strategy and Design", why: "Those are lifecycle phases."}
      - {key: D, text: "Classification and profiling", why: "Those are Logical and Conceptual activities."}
    explanation: "Incidents are detected and recovered; changes are assessed for their effect on attributes before being made."
    refs: ["SABSA §3.6", "GUIDE:integrating-risk-and-security §3.2.4"]
    difficulty: 1
    tags: [service-management, incident, change]
  - id: S6-125
    unit: S6
    objective: "S6.2"
    lesson: S6/02_the_service_management_layer
    stem: "What is the difference between assurance and audit?"
    options:
      - {key: A, text: "Assurance produces evidence and is owned by those who run the controls; audit is the independent examination of that evidence", correct: true}
      - {key: B, text: "They are synonyms", why: "SABSA keeps them distinct."}
      - {key: C, text: "Audit produces evidence; assurance examines it", why: "Reversed."}
      - {key: D, text: "Assurance is external; audit is internal", why: "Independence, not location, is the distinction."}
    explanation: "The operations team does not audit its own controls."
    refs: ["SABSA §3.6", "SABSA §6"]
    difficulty: 2
    tags: [service-management, assurance, audit, trap]
  - id: S6-126
    unit: S6
    objective: "S6.2"
    lesson: S6/02_the_service_management_layer
    stem: "Why must a change to a component be assessed in the Service Management layer before it is made?"
    options:
      - {key: A, text: "So the traceability chain from attribute to control is not silently broken", correct: true}
      - {key: B, text: "Because SABSA prohibits change", why: "SABSA manages change; it does not forbid it."}
      - {key: C, text: "Because only the Component layer may change", why: "Any layer may change, under control."}
      - {key: D, text: "To update the vendor list", why: "Not the reason."}
    explanation: "Change management protects the attribute-to-control links."
    refs: ["SABSA §3.6"]
    difficulty: 2
    tags: [service-management, change]
  - id: S6-127
    unit: S6
    objective: "S6.2"
    lesson: S6/02_the_service_management_layer
    stem: "Where are the Business Attributes Profile's metrics actually measured?"
    options:
      - {key: A, text: "In the Service Management layer", correct: true}
      - {key: B, text: "In the Conceptual layer where they are defined", why: "Defined there, measured operationally."}
      - {key: C, text: "In the Component layer", why: "Components are the things measured, not where measurement is managed."}
      - {key: D, text: "In the Contextual layer", why: "Contextual is the business view."}
    explanation: "Uptime, log reviews, recertification and restore tests are operational activities."
    refs: ["SABSA §3.6", "SABSA §5"]
    difficulty: 2
    tags: [service-management, metrics]
  - id: S6-128
    unit: S6
    objective: "S6.2"
    lesson: S6/02_the_service_management_layer
    stem: "The attribute Recoverable is most directly measured by which Service Management activity?"
    options:
      - {key: A, text: "Restore-test results against the recovery-time target", correct: true}
      - {key: B, text: "Log review", why: "That measures Auditable."}
      - {key: C, text: "Orphan-account counts", why: "That measures Access-controlled."}
      - {key: D, text: "Uptime monitoring", why: "That measures Available."}
    explanation: "Each attribute's metric is taken by a matching operational activity."
    refs: ["SABSA §3.6", "SABSA §5"]
    difficulty: 2
    tags: [service-management, metrics]
  - id: S6-129
    unit: S6
    objective: "S6.2"
    lesson: S6/02_the_service_management_layer
    stem: "The Blue Book name for the Service Management layer's Assets (What) cell is:"
    options:
      - {key: A, text: "Assurance of operational continuity", correct: true}
      - {key: B, text: "Operational risk management", why: "That is the Motivation cell."}
      - {key: C, text: "Security operations schedule", why: "That is the Time cell."}
      - {key: D, text: "Security of sites, networks and platforms", why: "That is the Location cell."}
    explanation: "Service delivery management: keeping the services running at the agreed level."
    refs: ["SABSA §3.6"]
    difficulty: 3
    tags: [service-management, cells]
  - id: S6-130
    unit: S6
    objective: "S6.2"
    lesson: S6/02_the_service_management_layer
    stem: "Joiners, movers and leavers handling belongs to which Service Management cell?"
    options:
      - {key: A, text: "People: account provisioning and user support", correct: true}
      - {key: B, text: "Process: management and support of systems", why: "That is operating the mechanisms."}
      - {key: C, text: "Location: management of environment", why: "Sites and networks."}
      - {key: D, text: "Time: calendar and timetable", why: "Scheduling."}
    explanation: "Personnel management is the People column of the operational row."
    refs: ["SABSA §3.6"]
    difficulty: 2
    tags: [service-management, people]
  - id: S6-131
    unit: S6
    objective: "S6.2"
    lesson: S6/02_the_service_management_layer
    stem: "The TOGAF risk and security guide's Phase G security audit corresponds to which Service Management theme?"
    options:
      - {key: A, text: "Audit: the independent check of processes, designs, code, configuration and testing", correct: true}
      - {key: B, text: "Operations", why: "Operations runs the controls."}
      - {key: C, text: "Change management", why: "Change assesses modifications."}
      - {key: D, text: "Incident management", why: "Incidents are events, not reviews."}
    explanation: "The guide's audit is the same activity at implementation time."
    refs: ["GUIDE:integrating-risk-and-security §5.8.1", "SABSA §3.6"]
    difficulty: 2
    tags: [service-management, audit, togaf]
  - id: S6-132
    unit: S6
    objective: "S6.2"
    lesson: S6/02_the_service_management_layer
    stem: "A profile attribute has a target that nothing in the Service Management layer measures. This is:"
    options:
      - {key: A, text: "An incomplete architecture, caught by the bottom-up check", correct: true}
      - {key: B, text: "Normal, since not all attributes are measurable", why: "Every profile attribute carries a metric and target."}
      - {key: C, text: "A Component-layer omission", why: "The gap is in operational measurement."}
      - {key: D, text: "A Contextual-layer error", why: "The business driver may be fine; the measurement is missing."}
    explanation: "A target nothing measures is an unkept promise."
    refs: ["SABSA §3.6", "SABSA §6"]
    difficulty: 2
    tags: [service-management, completeness]
  - id: S6-133
    unit: S6
    objective: "S6.2"
    lesson: S6/02_the_service_management_layer
    stem: "Which of the following is NOT one of the four operational themes the unit names for the Service Management layer?"
    options:
      - {key: A, text: "Product selection", correct: true}
      - {key: B, text: "Operations", why: "A genuine theme."}
      - {key: C, text: "Incident and change", why: "A genuine theme."}
