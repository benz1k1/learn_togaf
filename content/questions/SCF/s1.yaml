  # ---------------------------------------------------------------- S1.3 Zachman, TOGAF, Lifecycle
  - id: S1-141
    unit: S1
    objective: "S1.3"
    lesson: S1/03_zachman_togaf_and_the_lifecycle
    stem: "What does the SABSA Matrix borrow from the Zachman Framework?"
    options:
      - {key: A, text: "The grid of perspectives against the six interrogatives", correct: true}
      - {key: B, text: "The Business Attributes Profile", why: "That is SABSA's own contribution."}
      - {key: C, text: "The four-phase Lifecycle", why: "Zachman prescribes no method."}
      - {key: D, text: "The security domain model", why: "Domains are SABSA content, not Zachman's."}
    explanation: "SABSA takes Zachman's shape, rows of views against columns of interrogatives, and fills it with security content and a method."
    refs: ["SABSA §2.1"]
    difficulty: 1
    tags: [zachman]
  - id: S1-142
    unit: S1
    objective: "S1.3"
    lesson: S1/03_zachman_togaf_and_the_lifecycle
    stem: "Which is a difference between SABSA and Zachman?"
    options:
      - {key: A, text: "SABSA has six columns; Zachman has four", why: "Both have six."}
      - {key: B, text: "SABSA supplies a development method and a risk model; Zachman is a classification scheme with no method", correct: true}
      - {key: C, text: "Zachman is security-specific; SABSA is generic", why: "Reversed."}
      - {key: D, text: "SABSA has no rows", why: "SABSA has six rows."}
    explanation: "Zachman classifies; SABSA classifies, then prescribes the Lifecycle, the attributes and the risk model."
    refs: ["SABSA §1.3", "SABSA §2.1"]
    difficulty: 2
    tags: [zachman]
  - id: S1-143
    unit: S1
    objective: "S1.3"
    lesson: S1/03_zachman_togaf_and_the_lifecycle
    stem: "In SABSA's column order, which position does Motivation occupy?"
    options:
      - {key: A, text: "First", why: "Assets is first."}
      - {key: B, text: "Second", correct: true}
      - {key: C, text: "Last", why: "In Zachman 'why' is last; SABSA moves it to second."}
      - {key: D, text: "Fourth", why: "People is fourth."}
    explanation: "SABSA reorders Zachman's interrogatives so that Motivation (why) is the second column."
    refs: ["SABSA §2.1"]
    difficulty: 2
    tags: [zachman, columns]
