      - {key: B, text: "Logical × Location and Physical × Location", why: "Physical is infrastructure."}
      - {key: C, text: "Contextual × Location and Conceptual × Location", why: "Contextual is geography."}
      - {key: D, text: "Logical × People and Logical × Location", why: "People is the trust framework."}
