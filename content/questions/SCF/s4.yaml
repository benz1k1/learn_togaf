    objective: "S4.1"
    lesson: S4/01_the_logical_layer
    stem: "'Encryption service', 'AES-256 in the database layer' and 'the named HSM product' belong to which layers respectively?"
    options:
      - {key: A, text: "Logical; Physical; Component", correct: true}
      - {key: B, text: "Conceptual; Logical; Physical", why: "One layer too high each."}
      - {key: C, text: "Logical; Component; Physical", why: "Mechanism precedes product."}
      - {key: D, text: "Physical; Physical; Component", why: "The service is Logical."}
    explanation: "Service → mechanism → product is the three-layer drop."
    refs: ["SABSA §6"]
    difficulty: 2
    tags: [logical, layers, services]
