      - {key: A, text: "The sub-domain's own policy and exceptions, within the constraints of the super-domain's policy", correct: true}
      - {key: B, text: "The super-domain's policy", why: "That is the super-domain authority's."}
      - {key: C, text: "Nothing; sub-domains have no authority", why: "They do."}
      - {key: D, text: "The products for the whole enterprise", why: "Component decision, not policy."}
