  # ---------------------------------------------------------------- S4.3 trust
  - id: S4-155
    unit: S4
    objective: "S4.3"
    lesson: S4/03_trust_relationships
    stem: "What is trust in SABSA?"
    options:
      - {key: A, text: "An explicit, directed relationship between two domains in which one authority accepts assertions made under the other's policy", correct: true}
      - {key: B, text: "A feeling of confidence in a vendor", why: "Not a property of a system or a feeling."}
      - {key: C, text: "A property of an encrypted link", why: "A mechanism may support trust; it is not trust."}
      - {key: D, text: "Compliance with ISO 27001", why: "A standard, not a relationship."}
    explanation: "Trust always has a direction and a basis."
    refs: ["SABSA §6.4"]
    difficulty: 1
    tags: [trust, definitions]
  - id: S4-156
    unit: S4
    objective: "S4.3"
    lesson: S4/03_trust_relationships
    stem: "In a trust relationship, which party is the 'trusting' one?"
    options:
      - {key: A, text: "The domain whose authority accepts the other's assertions", correct: true}
      - {key: B, text: "The domain whose assertions are accepted", why: "That is the trusted party."}
      - {key: C, text: "The broker", why: "A third party, not one of the two."}
      - {key: D, text: "The regulator", why: "External."}
    explanation: "Trusting accepts; trusted is accepted."
    refs: ["SABSA §6.4"]
    difficulty: 1
    tags: [trust, definitions]
  - id: S4-157
    unit: S4
    objective: "S4.3"
    lesson: S4/03_trust_relationships
    stem: "A merchant accepts the card scheme's authorisation response; the scheme does not accept the merchant's assertions. What kind of trust?"
    options:
      - {key: A, text: "One-way", correct: true}
      - {key: B, text: "Two-way", why: "Only one direction is present."}
      - {key: C, text: "Transitive", why: "No third party."}
      - {key: D, text: "Brokered", why: "No broker."}
    explanation: "One-way (unilateral) trust runs in a single direction."
    refs: ["SABSA §6.4.1"]
    difficulty: 1
    tags: [trust, one-way]
  - id: S4-158
    unit: S4
    objective: "S4.3"
    lesson: S4/03_trust_relationships
    stem: "Two banks in a payment network authenticate each other's messages under one agreement. What kind of trust?"
    options:
      - {key: A, text: "Two-way", correct: true}
      - {key: B, text: "One-way", why: "Both directions are present."}
      - {key: C, text: "Transitive", why: "No pass-through."}
      - {key: D, text: "Isolated", why: "Not a trust kind."}
    explanation: "Two-way (bilateral, mutual) trust needs two decisions, one per authority, even in one agreement."
    refs: ["SABSA §6.4.1"]
    difficulty: 1
    tags: [trust, two-way]
  - id: S4-159
    unit: S4
    objective: "S4.3"
    lesson: S4/03_trust_relationships
    stem: "A trusts B and B trusts C. When does A trust C?"
    options:
      - {key: A, text: "Always; trust is transitive", why: "Not by default."}
      - {key: B, text: "Only when A's policy authority has explicitly allowed trust to pass through B", correct: true}
      - {key: C, text: "Never", why: "It can be permitted explicitly."}
      - {key: D, text: "Only if C is a sub-domain of A", why: "Sub-domain trust is a different relationship."}
    explanation: "Transitive trust is a designed decision, not an automatic consequence."
    refs: ["SABSA §6.4.1"]
    difficulty: 2
    tags: [trust, transitive]
  - id: S4-160
    unit: S4
    objective: "S4.3"
    lesson: S4/03_trust_relationships
    stem: "A supplier has access to the bank; the supplier's own subcontractors do not. What is this?"
    options:
      - {key: A, text: "Non-transitive trust", correct: true}
      - {key: B, text: "Transitive trust", why: "Trust does not pass to the subcontractors."}
      - {key: C, text: "Two-way trust", why: "Direction is not the point here."}
      - {key: D, text: "A super-domain", why: "Unrelated."}
    explanation: "Trust stops at B."
    refs: ["SABSA §6.4.1"]
    difficulty: 2
    tags: [trust, transitive]
  - id: S4-161
    unit: S4
    objective: "S4.3"
    lesson: S4/03_trust_relationships
    stem: "What is third-party or brokered trust?"
    options:
      - {key: A, text: "Two domains rely on a trusted third party, such as a certificate authority or federation hub, rather than trusting each other directly", correct: true}
      - {key: B, text: "Trust between a domain and its sub-domain", why: "That is containment."}
      - {key: C, text: "Trust that is automatically transitive", why: "Each party explicitly trusts the broker."}
      - {key: D, text: "Trust bought with insurance", why: "Not the meaning."}
    explanation: "The broker is an inter-domain service provided by a domain both parties already trust."
    refs: ["SABSA §6.4.2"]
    difficulty: 2
    tags: [trust, broker]
  - id: S4-162
    unit: S4
    objective: "S4.3"
    lesson: S4/03_trust_relationships
    stem: "When is an inter-domain service needed?"
    options:
      - {key: A, text: "When two domains with different policy authorities need to interact", correct: true}
      - {key: B, text: "Between a super-domain and its sub-domain", why: "One authority chain already governs the boundary."}
      - {key: C, text: "Inside a single domain", why: "Trust is implicit inside a domain."}
      - {key: D, text: "Whenever a network link exists", why: "Topology is not the criterion."}
    explanation: "Neither policy governs both sides of an independent boundary, so a service enforces the agreed terms."
    refs: ["SABSA §6.4.2"]
    difficulty: 2
    tags: [trust, inter-domain]
  - id: S4-163
    unit: S4
    objective: "S4.3"
    lesson: S4/03_trust_relationships
    stem: "What is an inter-domain policy or association?"
    options:
      - {key: A, text: "The agreement negotiated between two authorities that the inter-domain service enforces", correct: true}
      - {key: B, text: "The super-domain's policy", why: "Applies within one authority chain."}
      - {key: C, text: "A network ACL", why: "A mechanism."}
      - {key: D, text: "The attribute taxonomy", why: "Unrelated."}
    explanation: "Agreement is the policy; the service is the enforcement."
    refs: ["SABSA §6.4.2"]
    difficulty: 2
    tags: [trust, inter-domain]
  - id: S4-164
    unit: S4
    objective: "S4.3"
    lesson: S4/03_trust_relationships
    stem: "Between two peer sub-domains under the same bank, what trust exists by default?"
    options:
      - {key: A, text: "None; peer trust must be designed, by the bank's policy or by agreement between the peers", correct: true}
      - {key: B, text: "Full two-way trust", why: "Not inherent."}
      - {key: C, text: "Transitive trust through the bank", why: "Only if explicitly permitted."}
      - {key: D, text: "One-way trust from the larger to the smaller", why: "Size is irrelevant."}
    explanation: "Containment gives super/sub trust; peers get nothing inherent."
    refs: ["SABSA §6.4"]
    difficulty: 2
    tags: [trust, peers]
  - id: S4-165
    unit: S4
    objective: "S4.3"
    lesson: S4/03_trust_relationships
    stem: "What trust is inherent between a super-domain and its sub-domain?"
    options:
      - {key: A, text: "The super-domain trusts the sub-domain to the extent its policy complies; the sub-domain trusts the super-domain's authority as the source of its policy", correct: true}
      - {key: B, text: "None", why: "Containment gives inherent trust."}
      - {key: C, text: "Only one-way from sub to super", why: "Both directions, on the stated bases."}
      - {key: D, text: "Full transitive trust to all peers", why: "Peers are separate."}
    explanation: "The trust is inherent in the containment and the compliance rule."
    refs: ["SABSA §6.4"]
    difficulty: 2
    tags: [trust, sub-domains]
  - id: S4-166
    unit: S4
    objective: "S4.3"
    lesson: S4/03_trust_relationships
    stem: "Where is trust implicit rather than established?"
    options:
      - {key: A, text: "Within a single domain, under one policy and one authority", correct: true}
      - {key: B, text: "Between independent domains", why: "Must be established."}
      - {key: C, text: "Between peers", why: "Must be designed."}
      - {key: D, text: "Between a domain and a broker", why: "Explicitly chosen."}
    explanation: "Inside a domain the elements share policy and authority."
    refs: ["SABSA §6.4"]
    difficulty: 1
    tags: [trust]
  - id: S4-167
    unit: S4
    objective: "S4.3"
    lesson: S4/03_trust_relationships
    stem: "What does the entity and trust framework record for each pair of interacting domains?"
    options:
      - {key: A, text: "Direction, basis, transitivity, the inter-domain service and agreement, and the privileges a trusted entity receives", correct: true}
      - {key: B, text: "The IP addresses", why: "Component locators."}
      - {key: C, text: "The product versions", why: "Component."}
      - {key: D, text: "The budget", why: "Not architecture content."}
    explanation: "A Logical-layer deliverable that the Physical layer realises with certificates, federation protocols, VPNs and contracts."
    refs: ["SABSA §6.4.1"]
    difficulty: 2
    tags: [trust, framework]
  - id: S4-168
    unit: S4
    objective: "S4.3"
    lesson: S4/03_trust_relationships
    stem: "Supplier staff need access to the enterprise's systems. Which inter-domain service fits?"
    options:
      - {key: A, text: "A federation service accepting the supplier's authenticated identities under agreed terms, with the enterprise granting privileges", correct: true}
      - {key: B, text: "Giving the supplier the enterprise's admin credentials", why: "No inter-domain control at all."}
      - {key: C, text: "Making the supplier a sub-domain", why: "Its authority is independent; containment is impossible."}
      - {key: D, text: "Air-gapping the supplier", why: "That is isolation, not interaction."}
    explanation: "Federation is the classic inter-domain service between independent authorities."
    refs: ["SABSA §6.4.2"]
    difficulty: 2
    tags: [trust, inter-domain, federation]
  - id: S4-169
    unit: S4
    objective: "S4.3"
    lesson: S4/03_trust_relationships
    stem: "Does the existence of a trust broker make trust between its clients transitive by accident?"
    options:
      - {key: A, text: "Yes; anything the broker trusts, they trust", why: "Each party has explicitly chosen to trust the broker, and only the broker."}
      - {key: B, text: "No; each party has explicitly chosen to trust the broker, and further transitivity is a separate decision", correct: true}
      - {key: C, text: "Yes, for certificate authorities only", why: "No exception."}
      - {key: D, text: "Brokers are forbidden in SABSA", why: "They are a recognised pattern."}
    explanation: "Brokered trust is explicit, not accidental transitivity."
    refs: ["SABSA §6.4.2"]
    difficulty: 3
    tags: [trust, broker, transitive]
  - id: S4-170
    unit: S4
    objective: "S4.3"
    lesson: S4/03_trust_relationships
    stem: "What is direct trust?"
    options:
      - {key: A, text: "A trusts B on A's own verification, such as a bank checking a customer's identity documents", correct: true}
      - {key: B, text: "Trust via a certificate authority", why: "Brokered."}
      - {key: C, text: "Trust inherited from a super-domain", why: "Containment."}
      - {key: D, text: "Trust that passes through B to C", why: "Transitive."}
    explanation: "Direct trust rests on the trusting domain's own checks."
    refs: ["SABSA §6.4.1"]
    difficulty: 1
    tags: [trust, direct]
  - id: S4-171
    unit: S4
    objective: "S4.3"
    lesson: S4/03_trust_relationships
    stem: "A question states 'the merchant trusts the scheme, and therefore the scheme trusts the merchant'. What is wrong?"
    options:
      - {key: A, text: "It has turned one-way trust into two-way without a second decision by the scheme's authority", correct: true}
      - {key: B, text: "Nothing; trust is always mutual", why: "It is not."}
      - {key: C, text: "Merchants cannot trust schemes", why: "They can."}
      - {key: D, text: "It should say transitive", why: "No third party."}
    explanation: "Two-way trust needs two decisions."
    refs: ["SABSA §6.4.1"]
    difficulty: 2
    tags: [trust, one-way, two-way]
