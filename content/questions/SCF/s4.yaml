  # ---------------------------------------------------------------- S4.1 the Logical layer
  - id: S4-101
    unit: S4
    objective: "S4.1"
    lesson: S4/01_the_logical_layer
    stem: "Whose view is the Logical layer?"
    options:
      - {key: A, text: "The designer", correct: true}
      - {key: B, text: "The architect", why: "Conceptual."}
      - {key: C, text: "The builder", why: "Physical."}
      - {key: D, text: "The tradesman", why: "Component."}
    explanation: "The Logical layer is the designer's view: technology-independent design."
    refs: ["SABSA §6"]
    difficulty: 1
    tags: [logical, views]
  - id: S4-102
    unit: S4
    objective: "S4.1"
    lesson: S4/01_the_logical_layer
    stem: "What is a security service in SABSA?"
    options:
      - {key: A, text: "A logical capability that delivers a control or enablement objective, described by what it does without saying how", correct: true}
      - {key: B, text: "A named product installed on a server", why: "Component."}
      - {key: C, text: "A configured mechanism such as TLS", why: "Physical."}
      - {key: D, text: "A managed security contract", why: "Commercial."}
    explanation: "Services are Logical; mechanisms are Physical; products are Component."
    refs: ["SABSA §6"]
    difficulty: 1
    tags: [logical, services]
  - id: S4-103
