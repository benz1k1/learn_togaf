  # ---------------------------------------------------------------- S4.2 domains
  - id: S4-128
    unit: S4
    objective: "S4.2"
    lesson: S4/02_security_domains_and_policy_authorities
    stem: "What is a security domain?"
    options:
      - {key: A, text: "A set of elements subject to a common security policy defined and enforced by a single policy authority", correct: true}
      - {key: B, text: "A network segment", why: "A segment with no accountable authority is not a domain."}
      - {key: C, text: "One of Business, Data, Application and Technology architecture", why: "TOGAF's domain."}
      - {key: D, text: "A DNS zone", why: "Not the architecture meaning."}
    explanation: "Three parts: a set of elements, a common policy, one authority."
    refs: ["SABSA §6.3"]
    difficulty: 1
    tags: [domains, definitions]
  - id: S4-129
    unit: S4
    objective: "S4.2"
    lesson: S4/02_security_domains_and_policy_authorities
    stem: "What is a policy authority?"
    options:
      - {key: A, text: "The person or body accountable for a domain's policy: it defines it, approves exceptions and answers for the domain's risk", correct: true}
      - {key: B, text: "The regulator", why: "External; a domain's authority is internal to the domain."}
      - {key: C, text: "The firewall administrator", why: "An operator, not the accountable authority."}
      - {key: D, text: "The SABSA Institute", why: "Irrelevant."}
    explanation: "Naming the authority is what makes a domain real."
    refs: ["SABSA §6.3"]
    difficulty: 1
    tags: [domains, authority]
  - id: S4-130
    unit: S4
    objective: "S4.2"
    lesson: S4/02_security_domains_and_policy_authorities
    stem: "Two systems are under the same policy but different policy authorities. How many domains?"
    options:
      - {key: A, text: "One", why: "One authority is required for one domain."}
      - {key: B, text: "Two", correct: true}
      - {key: C, text: "Zero", why: "Each is a domain."}
      - {key: D, text: "It depends on the network", why: "Domains are defined by policy and authority, not topology."}
    explanation: "A domain is the scope of one policy from one authority; two authorities mean two domains."
    refs: ["SABSA §6.3"]
    difficulty: 2
    tags: [domains, definitions]
  - id: S4-131
    unit: S4
    objective: "S4.2"
    lesson: S4/02_security_domains_and_policy_authorities
    stem: "What is a sub-domain?"
    options:
      - {key: A, text: "A domain wholly contained within a super-domain, with its own authority and a policy that must comply with the super-domain's", correct: true}
      - {key: B, text: "A domain with no policy", why: "Every domain has a policy."}
      - {key: C, text: "A domain in another country", why: "Location is not the criterion."}
      - {key: D, text: "A domain with a weaker policy than its parent", why: "It may be stricter, never more permissive."}
    explanation: "The sub-domain's policy may add restrictions; it may not relax the super-domain's."
    refs: ["SABSA §6.3.1"]
    difficulty: 1
    tags: [domains, sub-domains]
  - id: S4-132
    unit: S4
    objective: "S4.2"
    lesson: S4/02_security_domains_and_policy_authorities
    stem: "May a sub-domain's policy be more permissive than its super-domain's?"
    options:
      - {key: A, text: "Yes, if its authority agrees", why: "The sub-domain authority cannot relax the parent policy."}
      - {key: B, text: "No; it must comply with the super-domain's policy and may only be more specific or more restrictive", correct: true}
      - {key: C, text: "Yes, for physical domains only", why: "The rule applies to all sub-domains."}
      - {key: D, text: "Yes, if the domains are peers", why: "Peers are not sub-domains."}
    explanation: "Compliance flows downward in a multi-tiered structure."
    refs: ["SABSA §6.3.1"]
    difficulty: 1
    tags: [domains, sub-domains, policy]
  - id: S4-133
    unit: S4
    objective: "S4.2"
    lesson: S4/02_security_domains_and_policy_authorities
    stem: "What is a multi-tiered domain structure?"
    options:
      - {key: A, text: "Several levels of super- and sub-domains with a matching hierarchy of policy authorities", correct: true}
      - {key: B, text: "A three-tier web application", why: "Not a domain concept."}
      - {key: C, text: "Domains in multiple data centres", why: "Physical layout."}
      - {key: D, text: "A domain with multiple policies", why: "A domain has one policy."}
    explanation: "Bank → business unit → department → project team is a multi-tiered structure."
    refs: ["SABSA §6.3.1"]
    difficulty: 1
    tags: [domains, multi-tiered]
  - id: S4-134
    unit: S4
    objective: "S4.2"
    lesson: S4/02_security_domains_and_policy_authorities
    stem: "What are peer domains?"
    options:
      - {key: A, text: "Domains at the same level with no containment between them", correct: true}
      - {key: B, text: "A domain and its sub-domain", why: "That is containment."}
      - {key: C, text: "Domains with the same name", why: "Not the criterion."}
      - {key: D, text: "Domains that share a network", why: "Topology is not the criterion."}
