      - {key: A, text: "Because policies are written for, services deployed in, trust established between, classifications applied within and privileges granted by domains", correct: true}
      - {key: B, text: "Because they determine the product list", why: "Products are Component."}
      - {key: C, text: "Because auditors require them", why: "Not the SABSA reason."}
      - {key: D, text: "Because they replace the attribute profile", why: "They scope it; they do not replace it."}
