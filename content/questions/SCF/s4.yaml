      - {key: A, text: "The organisation, roles and processes of the Business Architecture in Phase B", correct: true}
      - {key: B, text: "The technology platforms of Phase D", why: "Domains precede platforms."}
      - {key: C, text: "The migration plan of Phase F", why: "Unrelated."}
      - {key: D, text: "The Architecture Contract", why: "Governance artefact."}
    explanation: "Domains match real organisational units and jurisdictions, which is Phase B content."
