# S5 Physical and Component Layers bank (SCF). Authored from the SABSA framework as published by the
# SABSA Institute; SABSA section numbers refer to the White Paper and are to be verified against
# the registered PDF. status: draft until reviewed.
code: S5_BANK
exam: SCF
name: S5 Physical and Component Layers bank
kind: DRILL
source: authored
questions:
  # ---------------------------------------------------------------- S5.1 Physical layer
  - id: S5-101
    unit: S5
    objective: "S5.1"
    lesson: S5/01_the_physical_layer
    stem: "Whose view of the enterprise is the SABSA Physical layer?"
    options:
      - {key: A, text: "The builder's view", correct: true}
      - {key: B, text: "The designer's view", why: "The designer's view is the Logical layer."}
      - {key: C, text: "The tradesman's view", why: "The tradesman's view is the Component layer."}
      - {key: D, text: "The facilities manager's view", why: "That is the Service Management layer."}
    explanation: "SABSA names each layer after its reader: business, architect, designer, builder, tradesman, facilities manager. Physical is the builder."
    refs: ["SABSA §3.4"]
    difficulty: 1
    tags: [physical, layers]
  - id: S5-102
    unit: S5
    objective: "S5.1"
    lesson: S5/01_the_physical_layer
    stem: "Which of the following belongs in the Physical layer's Process (How) cell?"
    options:
      - {key: A, text: "Security mechanisms such as encryption and authentication protocols", correct: true}
      - {key: B, text: "Security services described by what they do for the business", why: "Services are the Logical layer's Process cell."}
      - {key: C, text: "Named security products and their protocols", why: "Products are the Component layer."}
      - {key: D, text: "Business processes and their risk", why: "That is the Contextual layer."}
    explanation: "Physical × Process is the security mechanisms cell: the means by which a logical service is delivered, technology-specific but vendor-neutral."
    refs: ["SABSA §3.4"]
    difficulty: 1
    tags: [physical, mechanism]
  - id: S5-103
    unit: S5
    objective: "S5.1"
    lesson: S5/01_the_physical_layer
    stem: "In the Physical layer, what does the Assets (What) cell contain?"
    options:
      - {key: A, text: "The business data model: physical data structures and storage", correct: true}
      - {key: B, text: "The inventory of information assets", why: "That is the Logical layer's Assets cell."}
      - {key: C, text: "ICT products including data repositories and processors", why: "That is the Component layer's Assets cell."}
      - {key: D, text: "Business assets and business decisions", why: "That is the Contextual layer."}
    explanation: "Physical × Assets turns the logical information assets into data structures and storage: the business data model / data dictionary and storage devices."
    refs: ["SABSA §3.4"]
    difficulty: 2
    tags: [physical, assets]
  - id: S5-104
    unit: S5
    objective: "S5.1"
    lesson: S5/01_the_physical_layer
    stem: "The Physical layer's Time (When) cell is best described as:"
    options:
      - {key: A, text: "Control-structure execution: the timing and sequencing of processes and sessions", correct: true}
      - {key: B, text: "The calendar of start times, lifetimes and deadlines", why: "That is the Logical layer's Time cell."}
      - {key: C, text: "Clocks, timers and interrupts", why: "Those are Component-layer timing tools."}
      - {key: D, text: "Business time dependence", why: "That is Contextual × Time."}
    explanation: "At the Physical layer, time becomes when controls actually run: session lifetimes, batch windows, rotation intervals."
    refs: ["SABSA §3.4"]
    difficulty: 2
    tags: [physical, time]
  - id: S5-105
    unit: S5
    objective: "S5.1"
    lesson: S5/01_the_physical_layer
    stem: "Which statement about the word 'physical' in SABSA is correct?"
    options:
      - {key: A, text: "It denotes the builder's level of abstraction and includes data structures, procedures and schedules, not only hardware", correct: true}
      - {key: B, text: "It denotes hardware only: servers, cables and devices", why: "Hardware is one cell (Location); the layer has six."}
      - {key: C, text: "It is a synonym for TOGAF's Technology Architecture", why: "The Physical layer overlaps Phases C and D and is broader than the technology domain."}
      - {key: D, text: "It refers to physical security of buildings", why: "Buildings and sites are a Service Management concern, not the layer's definition."}
    explanation: "SABSA's Physical layer is the builder's view across all six columns; hardware is only its Location cell."
    refs: ["SABSA §3.4"]
    difficulty: 2
    tags: [physical, trap]
  - id: S5-106
    unit: S5
    objective: "S5.1"
    lesson: S5/01_the_physical_layer
    stem: "Which ADM phases does the SABSA Physical layer overlap in the TOGAF crosswalk?"
    options:
      - {key: A, text: "Phases C and D", correct: true}
      - {key: B, text: "Phase D only", why: "Application-level mechanisms are chosen in Phase C too."}
      - {key: C, text: "Phases A and B", why: "Those hold the Contextual, Conceptual and Logical layers."}
      - {key: D, text: "Phases G and H", why: "Those hold the Service Management layer."}
    explanation: "Application mechanisms (authentication, logging, encryption inside applications) come in Phase C; platform and network hosting in Phase D."
    refs: ["GUIDE:integrating-risk-and-security §5.4", "GUIDE:integrating-risk-and-security §5.5"]
    difficulty: 2
    tags: [physical, crosswalk]
  - id: S5-107
    unit: S5
    objective: "S5.1"
    lesson: S5/01_the_physical_layer
    stem: "'TLS 1.3 with mutual authentication' is an example of content at which SABSA layer?"
    options:
      - {key: A, text: "Physical — it is a mechanism, technology-specific but vendor-neutral", correct: true}
      - {key: B, text: "Component — it is a product", why: "No product is named; a mechanism is."}
      - {key: C, text: "Logical — it is a service", why: "A service says what is delivered (confidentiality in transit), not how."}
      - {key: D, text: "Conceptual — it is an attribute", why: "Attributes are business words such as Confidential."}
    explanation: "A named technique with no vendor is a mechanism: Physical layer. The vendor's gateway that implements it is Component."
    refs: ["SABSA §3.4"]
    difficulty: 2
    tags: [physical, mechanism]
  - id: S5-108
    unit: S5
    objective: "S5.1"
    lesson: S5/01_the_physical_layer
    stem: "What does the Physical layer's People (Who) cell describe?"
    options:
      - {key: A, text: "The human interface: user interfaces to ICT systems and access-control systems", correct: true}
      - {key: B, text: "The entity schema and privilege profiles", why: "Those are Logical × People."}
      - {key: C, text: "Identities, functions, actions and access-control lists", why: "That is Component × People."}
      - {key: D, text: "Account provisioning and user support", why: "That is Service Management × People."}
    explanation: "Physically, entities meet the system through login screens, tokens and access-control systems."
    refs: ["SABSA §3.4"]
    difficulty: 2
    tags: [physical, people]
  - id: S5-109
    unit: S5
    objective: "S5.1"
    lesson: S5/01_the_physical_layer
    stem: "In the Physical layer, the Motivation (Why) cell holds:"
    options:
      - {key: A, text: "Security rules, practices and procedures that enforce policy", correct: true}
      - {key: B, text: "Risk-management policies for each domain", why: "Policies are Logical × Motivation."}
      - {key: C, text: "Security standards", why: "Standards are Component × Motivation in the Blue Book wording."}
      - {key: D, text: "Business risk and opportunity", why: "That is Contextual × Motivation."}
    explanation: "Policy is Logical; the concrete practices and procedures that carry it out are Physical."
    refs: ["SABSA §3.4"]
    difficulty: 2
    tags: [physical, motivation]
  - id: S5-110
    unit: S5
    objective: "S5.1"
    lesson: S5/01_the_physical_layer
    stem: "The Physical layer's Location (Where) cell is the closest SABSA neighbour of which TOGAF content?"
    options:
      - {key: A, text: "Phase D Technology Architecture: platforms and networks", correct: true}
      - {key: B, text: "Phase B organisation and location catalogs", why: "Business geography is Contextual × Location."}
      - {key: C, text: "The Architecture Repository", why: "The repository is a TOGAF storage concept, not a location cell."}
      - {key: D, text: "Phase E transition architectures", why: "Transitions are the Time column in Phases E and F."}
    explanation: "Platform and network infrastructure hosts the logical domains; TOGAF's Phase D describes the same platforms."
    refs: ["SABSA §3.4", "GUIDE:integrating-risk-and-security §5.5"]
    difficulty: 2
    tags: [physical, location]
  - id: S5-111
    unit: S5
    objective: "S5.1"
    lesson: S5/01_the_physical_layer
    stem: "Which layer sits immediately above the Physical layer in the SABSA Matrix?"
    options:
      - {key: A, text: "Logical", correct: true}
      - {key: B, text: "Conceptual", why: "Conceptual is two layers up."}
      - {key: C, text: "Component", why: "Component is below the Physical layer."}
      - {key: D, text: "Service Management", why: "Service Management runs across all layers rather than above Physical."}
    explanation: "The order is Contextual, Conceptual, Logical, Physical, Component, with Service Management across them."
    refs: ["SABSA §2"]
    difficulty: 1
    tags: [physical, layers]
  - id: S5-112
    unit: S5
    objective: "S5.1"
    lesson: S5/01_the_physical_layer
    stem: "A mechanism in the Physical layer that cannot be traced to any Logical-layer service is:"
    options:
      - {key: A, text: "An orphan control and a candidate for removal", correct: true}
      - {key: B, text: "Acceptable if it is a widely used product", why: "Popularity is not justification; traceability is."}
      - {key: C, text: "Evidence of a complete Physical layer", why: "Completeness is judged by links, not by population."}
      - {key: D, text: "A Component-layer item filed in the wrong row", why: "The problem is missing justification, not classification."}
    explanation: "Every Physical-layer cell must trace upward; a mechanism with no service above it is unjustified."
    refs: ["SABSA §3.4", "SABSA §6"]
    difficulty: 2
    tags: [physical, traceability]
  - id: S5-113
    unit: S5
    objective: "S5.1"
    lesson: S5/01_the_physical_layer
    stem: "According to the TOGAF risk and security guide, what does the Security Architect do in Phase D, where the Physical layer's platforms are hosted?"
    options:
      - {key: A, text: "Verifies that the controls are included and effective, and may produce a view justifying each technology by the risk it mitigates", correct: true}
      - {key: B, text: "Produces the Business Attributes Profile", why: "That is Phase A and Requirements Management."}
      - {key: C, text: "Signs the Architecture Contract", why: "That is Phase G."}
      - {key: D, text: "Designs the security domain model", why: "That is Phase B."}
    explanation: "Phase D usually has no separate security artefacts; the architect verifies controls and may supply a risk-justified technology view."
    refs: ["GUIDE:integrating-risk-and-security §5.5"]
    difficulty: 2
    tags: [physical, togaf]
  - id: S5-114
    unit: S5
    objective: "S5.1"
    lesson: S5/01_the_physical_layer
    stem: "Which pair correctly matches a Physical-layer cell to an example?"
    options:
      - {key: A, text: "Time — a session timeout of 15 minutes", correct: true}
      - {key: B, text: "Assets — the business attribute Confidential", why: "Attributes are Conceptual."}
      - {key: C, text: "People — a named vendor's identity product", why: "Named products are Component."}
      - {key: D, text: "Location — business geography and market regions", why: "That is Contextual × Location."}
    explanation: "A session timeout is control-structure execution timing: Physical × Time."
    refs: ["SABSA §3.4"]
    difficulty: 2
    tags: [physical, cells]
  - id: S5-115
    unit: S5
    objective: "S5.1"
    lesson: S5/01_the_physical_layer
    stem: "Why does SABSA keep vendor names out of the Physical layer?"
    options:
      - {key: A, text: "So products can change without redesigning the architecture", correct: true}
      - {key: B, text: "Because vendors are recorded only in the Contextual layer", why: "Vendors are not a Contextual concern; products are Component."}
      - {key: C, text: "Because the Physical layer describes services, not technology", why: "Services are Logical; Physical does describe technology, but generically."}
      - {key: D, text: "Because procurement is outside SABSA's scope", why: "The Component layer explicitly covers products and tools."}
    explanation: "Separating mechanism (Physical) from product (Component) gives substitutability."
    refs: ["SABSA §3.4", "SABSA §3.5"]
    difficulty: 2
    tags: [physical, component]
  - id: S5-116
    unit: S5
    objective: "S5.1"
    lesson: S5/01_the_physical_layer
    stem: "A classified information asset in the Logical layer becomes, at the Physical layer:"
    options:
      - {key: A, text: "A data structure in a storage location, with the same classification", correct: true}
      - {key: B, text: "A business attribute with a performance target", why: "Attributes are above the Logical layer, not below it."}
      - {key: C, text: "A reclassified asset at a lower sensitivity", why: "Classification does not change on the way down; only its embodiment does."}
      - {key: D, text: "A named database product", why: "Products are Component."}
    explanation: "The Physical Assets cell embodies the logical asset as a table, file or store; the classification carries down unchanged."
    refs: ["SABSA §3.4", "GUIDE:integrating-risk-and-security §5.4.2"]
    difficulty: 2
    tags: [physical, assets]
  - id: S5-117
    unit: S5
    objective: "S5.1"
    lesson: S5/01_the_physical_layer
    stem: "How many cells does the Physical layer have?"
    options:
      - {key: A, text: "Six, one per column: Assets, Motivation, Process, People, Location, Time", correct: true}
      - {key: B, text: "Three: mechanisms, data structures and platforms", why: "Those are examples from three of the six cells."}
      - {key: C, text: "Five, because Time applies only to Service Management", why: "Every layer has all six columns."}
      - {key: D, text: "Thirty-six", why: "Thirty-six is the whole Matrix."}
    explanation: "Every SABSA layer answers the same six questions."
    refs: ["SABSA §3", "SABSA §3.4"]
    difficulty: 1
    tags: [physical, matrix]
  - id: S5-118
    unit: S5
    objective: "S5.1"
    lesson: S5/01_the_physical_layer
    stem: "Which item is NOT Physical-layer content?"
    options:
      - {key: A, text: "The trust relationship model between entities", correct: true}
      - {key: B, text: "A quarterly privileged-access recertification procedure", why: "A procedure is Physical × Motivation."}
      - {key: C, text: "Encryption at rest with segregated key management", why: "A mechanism is Physical × Process."}
      - {key: D, text: "Host platforms and network layout", why: "Physical × Location."}
    explanation: "The trust relationship model is Logical × People; the others are Physical cells."
    refs: ["SABSA §3.3", "SABSA §3.4"]
    difficulty: 2
    tags: [physical, cells]
  - id: S5-119
    unit: S5
    objective: "S5.1"
    lesson: S5/01_the_physical_layer
    stem: "A policy states that privileged access is reviewed. At the Physical layer this becomes:"
    options:
      - {key: A, text: "A named procedure with steps and a schedule", correct: true}
      - {key: B, text: "A business attribute called Access-controlled", why: "That is the Conceptual layer above the policy."}
      - {key: C, text: "A specific identity-governance product", why: "Products are Component."}
      - {key: D, text: "A domain policy statement", why: "That is the Logical layer where the policy already is."}
    explanation: "Physical × Motivation holds the practices and procedures that carry out Logical-layer policy."
    refs: ["SABSA §3.4"]
    difficulty: 2
    tags: [physical, motivation]
  - id: S5-120
    unit: S5
    objective: "S5.1"
    lesson: S5/01_the_physical_layer
    stem: "The builder metaphor SABSA uses places 'a block wall on this footing with this reinforcement' at which layer?"
    options:
      - {key: A, text: "Physical", correct: true}
      - {key: B, text: "Logical", why: "The Logical drawing says 'a load-bearing wall here'."}
      - {key: C, text: "Component", why: "Component picks the brand of block."}
      - {key: D, text: "Contextual", why: "Contextual says why the building is needed."}
    explanation: "Architect (Logical), builder (Physical), tradesman (Component)."
    refs: ["SABSA §2", "SABSA §3.4"]
    difficulty: 1
    tags: [physical, metaphor]
  # ---------------------------------------------------------------- S5.2 Component layer
  - id: S5-121
    unit: S5
    objective: "S5.2"
    lesson: S5/02_the_component_layer
    stem: "Whose view of the enterprise is the SABSA Component layer?"
    options:
      - {key: A, text: "The tradesman's view", correct: true}
      - {key: B, text: "The builder's view", why: "The builder is the Physical layer."}
      - {key: C, text: "The architect's view", why: "The architect is the Conceptual layer."}
      - {key: D, text: "The business's view", why: "The business is the Contextual layer."}
    explanation: "Component is the tradesman: the most concrete design layer."
    refs: ["SABSA §3.5"]
    difficulty: 1
    tags: [component, layers]
  - id: S5-122
    unit: S5
    objective: "S5.2"
    lesson: S5/02_the_component_layer
    stem: "Which of the following is Component-layer content in the Process (How) column?"
    options:
      - {key: A, text: "Security products and tools, and the protocols they implement", correct: true}
      - {key: B, text: "Security mechanisms", why: "Mechanisms are Physical × Process."}
      - {key: C, text: "Security services", why: "Services are Logical × Process."}
      - {key: D, text: "Management and support of systems and services", why: "That is Service Management × Process."}
    explanation: "Component × Process is the products, tools and protocols that realise each mechanism."
    refs: ["SABSA §3.5"]
    difficulty: 1
    tags: [component, products]
  - id: S5-123
    unit: S5
    objective: "S5.2"
    lesson: S5/02_the_component_layer
    stem: "In the Blue Book wording, what does the Component layer's Motivation (Why) cell hold?"
    options:
      - {key: A, text: "Security standards", correct: true}
      - {key: B, text: "Security policies", why: "Policy is Logical."}
      - {key: C, text: "Business risk", why: "Contextual."}
      - {key: D, text: "Control objectives", why: "Conceptual."}
    explanation: "Standards constrain product choice and configuration; they sit in the Component layer's Why cell (later wording: risk-management tools and standards)."
    refs: ["SABSA §3.5"]
    difficulty: 2
    tags: [component, standards]
  - id: S5-124
    unit: S5
    objective: "S5.2"
    lesson: S5/02_the_component_layer
    stem: "Which SABSA layer corresponds most closely to a TOGAF Solution Building Block?"
    options:
      - {key: A, text: "Component", correct: true}
      - {key: B, text: "Logical", why: "Logical corresponds to an Architecture Building Block."}
      - {key: C, text: "Physical", why: "Physical corresponds to the ABB's specification as a mechanism."}
      - {key: D, text: "Service Management", why: "That is operations and governance, not a building block."}
    explanation: "ABB is Logical, its specification Physical, the SBB that implements it Component."
    refs: ["SABSA §3.5", "GUIDE:integrating-risk-and-security §5.6"]
    difficulty: 2
    tags: [component, sbb]
  - id: S5-125
    unit: S5
    objective: "S5.2"
    lesson: S5/02_the_component_layer
    stem: "A vulnerability scanner used to support the risk process is best classified as a:"
    options:
      - {key: A, text: "Tool", correct: true}
      - {key: B, text: "Product realising a security mechanism", why: "It supports a process; it does not deliver a security service itself."}
      - {key: C, text: "Standard", why: "A standard constrains choice; it is not software."}
      - {key: D, text: "Security service", why: "Services are Logical and describe what, not with what."}
    explanation: "Tools support a process rather than delivering a service directly; they live mostly in the Component layer's Motivation and Process cells."
    refs: ["SABSA §3.5"]
    difficulty: 2
    tags: [component, tools]
  - id: S5-126
    unit: S5
    objective: "S5.2"
    lesson: S5/02_the_component_layer
    stem: "'Hash passwords with algorithm A at cost factor B' is an example of a:"
    options:
      - {key: A, text: "Standard (Component layer)", correct: true}
      - {key: B, text: "Policy (Logical layer)", why: "The policy is 'all passwords are hashed'."}
      - {key: C, text: "Business attribute (Conceptual layer)", why: "Attributes are business words such as Confidential."}
      - {key: D, text: "Business driver (Contextual layer)", why: "A driver is a business reason, not a configuration."}
    explanation: "Policy says why we protect; a standard says which algorithm and configuration satisfy the mechanism."
    refs: ["SABSA §3.5"]
    difficulty: 2
    tags: [component, standards, trap]
  - id: S5-127
    unit: S5
    objective: "S5.2"
    lesson: S5/02_the_component_layer
    stem: "Where does the TOGAF risk and security guide say security standards should be placed so later cycles inherit them?"
    options:
      - {key: A, text: "The Standards Library of the Architecture Repository", correct: true}
      - {key: B, text: "The Governance Log", why: "The log records governance activity, not standards."}
      - {key: C, text: "The Architecture Vision", why: "The vision is a Phase A deliverable, not a reference store."}
      - {key: D, text: "The Risk Register", why: "The register lists risks, not standards."}
    explanation: "The guide's Requirements Management section adds security standards to the Standards Library."
    refs: ["GUIDE:integrating-risk-and-security §5.10.3"]
    difficulty: 2
    tags: [component, standards, togaf]
  - id: S5-128
    unit: S5
    objective: "S5.2"
    lesson: S5/02_the_component_layer
    stem: "What does the Component layer's Location (Where) cell contain?"
    options:
      - {key: A, text: "Nodes, addresses and other locators", correct: true}
      - {key: B, text: "Host platforms and network layout", why: "That is Physical × Location."}
      - {key: C, text: "Domain definitions and inter-domain associations", why: "That is Logical × Location."}
      - {key: D, text: "Management of buildings and sites", why: "That is Service Management × Location."}
    explanation: "Component-level location is concrete: IP addresses, hostnames, URIs, racks."
    refs: ["SABSA §3.5"]
    difficulty: 2
    tags: [component, location]
  - id: S5-129
    unit: S5
    objective: "S5.2"
    lesson: S5/02_the_component_layer
    stem: "What does the Component layer's People (Who) cell contain?"
    options:
      - {key: A, text: "Identities, functions, actions and access-control lists", correct: true}
      - {key: B, text: "The user interface and access-control systems", why: "Physical × People."}
      - {key: C, text: "Roles and responsibilities and the trust framework", why: "Conceptual × People."}
      - {key: D, text: "Account provisioning and user support", why: "Service Management × People."}
    explanation: "At the Component layer, people become concrete identities and permission sets."
    refs: ["SABSA §3.5"]
    difficulty: 2
    tags: [component, people]
  - id: S5-130
    unit: S5
    objective: "S5.2"
    lesson: S5/02_the_component_layer
    stem: "Which statement about the Component layer is FALSE?"
    options:
      - {key: A, text: "It is the technology layer and has no People or Time content", correct: true}
      - {key: B, text: "It is the most concrete of the design layers", why: "True: a purchase order could be written from it."}
      - {key: C, text: "Two enterprises with identical Physical layers may differ here", why: "True: that is the test for Component content."}
      - {key: D, text: "It holds products, tools and standards", why: "True by definition."}
    explanation: "Like every layer it has six columns, including identities and ACLs (People) and clocks and timers (Time)."
    refs: ["SABSA §3.5"]
    difficulty: 2
    tags: [component, trap]
  - id: S5-131
    unit: S5
    objective: "S5.2"
    lesson: S5/02_the_component_layer
    stem: "The Component layer's Time (When) cell holds:"
    options:
      - {key: A, text: "Security step timing and sequencing tools: schedules, clocks, timers and interrupts", correct: true}
      - {key: B, text: "Control-structure execution timing", why: "Physical × Time."}
      - {key: C, text: "The through-life risk-management framework", why: "Conceptual × Time."}
      - {key: D, text: "The security operations schedule", why: "Service Management × Time."}
    explanation: "Component-level time is the concrete scheduler, clock source and timer."
    refs: ["SABSA §3.5"]
    difficulty: 2
    tags: [component, time]
  - id: S5-132
    unit: S5
    objective: "S5.2"
    lesson: S5/02_the_component_layer
    stem: "In which ADM phases does the crosswalk place the Component layer?"
    options:
      - {key: A, text: "Phase D, and Phase E where security building blocks become SBBs", correct: true}
      - {key: B, text: "Phase A only", why: "Phase A holds the Contextual and Conceptual layers."}
