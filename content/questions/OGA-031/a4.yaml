# A4 Business Layer drill bank (learn_sabsa_archimate.md §4.3). Every question is original,
# cites the entailing ArchiMate 3.2 section, and is status: draft until reviewed. Ids A4-101 upward.
code: A4_BANK
exam: OGA-031
name: A4 Business Layer bank
kind: DRILL
source: authored
questions:
  # ------------------------------------------------------------ A4.1 active structure
  - id: A4-101
    unit: A4
    objective: "A4.1"
    lesson: A4/01_business_active_structure
    stem: "To which aspect of the ArchiMate language does the Business Role element belong?"
    options:
      - {key: A, text: "Behaviour", why: "Behaviour is what happens; a role is a responsibility for performing behaviour, which makes it active structure."}
      - {key: B, text: "Active structure", correct: true}
      - {key: C, text: "Passive structure", why: "Passive structure is what behaviour acts on, such as a business object."}
      - {key: D, text: "Motivation", why: "Motivation elements such as Goal and Driver are not part of the Business Layer at all."}
    explanation: "Business actor, role, collaboration and interface are the active-structure elements of the Business Layer; a role is the responsibility to which an actor is assigned."
    refs: ["ARCHIMATE §8.2", "ARCHIMATE §8.2.2"]
    difficulty: 1
    tags: [business, aspect, role]
  - id: A4-102
    unit: A4
    objective: "A4.1"
    lesson: A4/01_business_active_structure
    stem: "Which Business Layer element represents a business entity that is capable of performing behaviour?"
    options:
      - {key: A, text: "Business Role", why: "A role is the responsibility for behaviour, not the entity that performs it."}
      - {key: B, text: "Business Actor", correct: true}
      - {key: C, text: "Business Function", why: "A function is behaviour, not an entity that performs behaviour."}
      - {key: D, text: "Business Interface", why: "An interface is a point of access to services, not a performer of behaviour."}
    explanation: "The specification defines a business actor as a business entity capable of performing behaviour; it may be a person, a department or an external party such as a customer."
    refs: ["ARCHIMATE §8.2.1"]
    difficulty: 1
    tags: [business, definition, actor]
  - id: A4-103
    unit: A4
    objective: "A4.1"
    lesson: A4/01_business_active_structure
    stem: "A modeller shows the specific company 'ABC Corporation' taking on the responsibility 'Supplier'. Which is the correct representation?"
    options:
      - {key: A, text: "Business actor 'ABC Corporation' assigned to business role 'Supplier'", correct: true}
      - {key: B, text: "Business role 'ABC Corporation' assigned to business actor 'Supplier'", why: "The actor is the entity and the role is the responsibility; this reverses both element types."}
      - {key: C, text: "Business actor 'ABC Corporation' realizes business role 'Supplier'", why: "Realization never links two active-structure elements; the actor is assigned to the role."}
      - {key: D, text: "Business collaboration 'ABC Corporation' aggregates business role 'Supplier'", why: "A single company is an actor, not a collaboration, and taking on a responsibility is assignment."}
    explanation: "The specification uses exactly this example: a specific or generic actor is assigned to carry the responsibility depicted as the 'Supplier' role."
    refs: ["ARCHIMATE §8.2.2"]
    difficulty: 2
    tags: [business, actor, role, assignment]
  - id: A4-104
    unit: A4
    objective: "A4.1"
    lesson: A4/01_business_active_structure
    stem: "Which statement about a Business Collaboration is correct?"
    options:
      - {key: A, text: "It must have a permanent, official status in the organisation", why: "Unlike a department, a collaboration need not have official or permanent status."}
      - {key: B, text: "It aggregates two or more business internal active structure elements that work together", correct: true}
      - {key: C, text: "It is a behaviour element that describes collective work", why: "The collective behaviour is the business interaction; the collaboration is active structure."}
      - {key: D, text: "It can aggregate at most one business role and one business actor", why: "It aggregates two or more roles, actors or other collaborations, in any combination."}
    explanation: "A business collaboration is an aggregate of two or more internal active-structure elements — roles, actors or collaborations — that perform collective behaviour, and it may be temporary."
    refs: ["ARCHIMATE §8.2.3"]
    difficulty: 2
    tags: [business, collaboration]
  - id: A4-105
    unit: A4
    objective: "A4.1"
    lesson: A4/01_business_active_structure
    stem: "Which element models the channel — such as telephone, web or local office — through which a business service is made available?"
    options:
      - {key: A, text: "Business Service", why: "The service is the behaviour offered; the channel through which it is reached is the interface."}
      - {key: B, text: "Business Interface", correct: true}
      - {key: C, text: "Business Collaboration", why: "A collaboration is a grouping of actors and roles, not an access point."}
      - {key: D, text: "Representation", why: "A representation is a passive document or message, not a channel."}
    explanation: "A business interface is the point of access where business services are made available to the environment; it is often called a channel."
    refs: ["ARCHIMATE §8.2.4"]
    difficulty: 1
    tags: [business, interface]
  - id: A4-106
    unit: A4
    objective: "A4.1"
    lesson: A4/01_business_active_structure
    stem: "Which relationship connects a Business Interface to the Business Service it exposes?"
    options:
      - {key: A, text: "Realization", why: "A service is realized by a process, function or interaction, not by an interface."}
      - {key: B, text: "Serving", why: "An interface may serve a role; the link to the service it exposes is assignment."}
      - {key: C, text: "Assignment", correct: true}
      - {key: D, text: "Access", why: "Access links behaviour to passive structure; neither end here is passive."}
    explanation: "A business interface may be assigned to one or more business services, meaning those services are exposed through that interface."
    refs: ["ARCHIMATE §8.2.4"]
    difficulty: 2
    tags: [business, interface, assignment]
  - id: A4-107
    unit: A4
    objective: "A4.1"
    lesson: A4/01_business_active_structure
    stem: "Which of the following can be modelled as a Business Actor?"
    options:
      - {key: A, text: "Only individual employees of the enterprise", why: "Actors include groups such as departments and business units, and outside parties."}
      - {key: B, text: "Only organisational units inside the enterprise", why: "Individuals and external parties such as customers are actors too."}
      - {key: C, text: "Individuals, organisational units, and external parties such as customers and partners", correct: true}
      - {key: D, text: "Responsibilities such as 'approver' or 'supplier'", why: "A responsibility is a business role, not an actor."}
    explanation: "Actors may be individuals, departments and business units, and may also be entities outside the organisation such as customers and partners."
    refs: ["ARCHIMATE §8.2", "ARCHIMATE §8.2.1"]
    difficulty: 1
    tags: [business, actor]
  - id: A4-108
    unit: A4
    objective: "A4.1"
    lesson: A4/01_business_active_structure
    stem: "In the standard notation, which icon marks the Business Actor element?"
    options:
      - {key: A, text: "A stick figure", correct: true}
      - {key: B, text: "A cylinder lying on its side", why: "That icon marks the Business Role."}
      - {key: C, text: "Two overlapping circles", why: "That icon marks a Collaboration."}
      - {key: D, text: "A lollipop shape", why: "That icon marks an Interface."}
    explanation: "The actor uses the stick-figure icon; role, collaboration and interface use the cylinder, overlapping circles and lollipop respectively."
    refs: ["ARCHIMATE §8.2.1", "ARCHIMATE §8.6"]
    difficulty: 1
    tags: [business, notation, actor]
  - id: A4-109
    unit: A4
    objective: "A4.1"
    lesson: A4/01_business_active_structure
    stem: "Which Business Layer element is best suited to modelling a temporary provider network of several companies working together in a B2B arrangement?"
    options:
      - {key: A, text: "Business Actor", why: "A single actor cannot express that several parties work together on collective behaviour."}
      - {key: B, text: "Business Collaboration", correct: true}
      - {key: C, text: "Business Interface", why: "An interface is an access point, not a grouping of parties."}
      - {key: D, text: "Product", why: "A product is a bundle of services and a contract, not a grouping of actors."}
    explanation: "The specification names B2B interactions between organisations such as provider networks as a case where the possibly temporary business collaboration is especially useful."
    refs: ["ARCHIMATE §8.2.3"]
    difficulty: 2
    tags: [business, collaboration, which-element]
  - id: A4-110
    unit: A4
    objective: "A4.1"
    lesson: A4/01_business_active_structure
    stem: "According to the specification, which relationship may exist between a Business Interface and a Business Role?"
    options:
      - {key: A, text: "The interface may be part of the role through composition", correct: true}
      - {key: B, text: "The interface realizes the role", why: "Realization does not link an interface to a role."}
      - {key: C, text: "The role accesses the interface", why: "Access links behaviour to passive structure, and neither element is passive."}
      - {key: D, text: "The role triggers the interface", why: "Triggering is a dynamic relationship between behaviour elements or events."}
    explanation: "A business interface may be part of a business role or actor through composition; it may also serve a role."
    refs: ["ARCHIMATE §8.2.2", "ARCHIMATE §8.2.4"]
    difficulty: 2
    tags: [business, interface, role, composition]
  - id: A4-111
    unit: A4
    objective: "A4.1"
    lesson: A4/01_business_active_structure
    stem: "Which statement about naming Business Layer active-structure elements follows the specification's guidance?"
    options:
      - {key: A, text: "An actor's name should be a verb in the perfect tense", why: "Perfect-tense verbs are for events; actors take nouns."}
      - {key: B, text: "A role's name should be an '-ing' verb", why: "'-ing' verbs are for services; roles take nouns."}
      - {key: C, text: "Actor, role and interface names should preferably be nouns", correct: true}
      - {key: D, text: "A collaboration must always be named", why: "The specification says leaving a collaboration unnamed is rather common."}
    explanation: "Actor, role, collaboration and interface names should preferably be nouns, and a collaboration is often left unnamed."
    refs: ["ARCHIMATE §8.2.1", "ARCHIMATE §8.2.3"]
    difficulty: 2
    tags: [business, naming]
  - id: A4-112
    unit: A4
    objective: "A4.1"
    lesson: A4/01_business_active_structure
    stem: "Which of the following is NOT one of the three internal active structure elements of the Business Layer?"
    options:
      - {key: A, text: "Business Actor", why: "Actor is one of the three internal active-structure elements."}
      - {key: B, text: "Business Role", why: "Role is one of the three internal active-structure elements."}
      - {key: C, text: "Business Interface", correct: true}
      - {key: D, text: "Business Collaboration", why: "Collaboration is one of the three internal active-structure elements."}
    explanation: "Actor, role and collaboration are the internal active-structure elements; the interface is the external active-structure element."
    refs: ["ARCHIMATE §8.2"]
    difficulty: 2
    tags: [business, negative, active-structure]
  - id: A4-113
    unit: A4
    objective: "A4.1"
    lesson: A4/01_business_active_structure
    stem: "An actor assigned to a business role is responsible for what, according to the specification?"
    options:
      - {key: A, text: "Personally performing every activity of the role's processes", why: "The actor may also delegate and manage the performance."}
      - {key: B, text: "Ensuring the behaviour is carried out, by performing it or by delegating and managing it", correct: true}
      - {key: C, text: "Defining the business services the role exposes", why: "Services are realized by behaviour and exposed by interfaces, not defined by the actor."}
      - {key: D, text: "Nothing; assignment only records an organisational chart position", why: "Assignment to a role carries responsibility for the role's behaviour."}
    explanation: "An actor assigned to a role must ensure the corresponding behaviour happens, either by doing it or by delegating and managing its performance."
    refs: ["ARCHIMATE §8.2.2"]
    difficulty: 2
    tags: [business, role, assignment]
  - id: A4-114
    unit: A4
    objective: "A4.1"
    lesson: A4/01_business_active_structure
    stem: "In which element may a Business Actor be aggregated to show where it is situated?"
    options:
      - {key: A, text: "Location", correct: true}
      - {key: B, text: "Facility", why: "A facility is a technology-layer physical element; the specification says an actor may be aggregated in a location."}
      - {key: C, text: "Business Interface", why: "An interface is an access point and does not aggregate actors."}
      - {key: D, text: "Product", why: "A product aggregates services and passive elements, not actors."}
    explanation: "The specification states that a business actor can be aggregated in a location."
    refs: ["ARCHIMATE §8.2.1"]
    difficulty: 2
    tags: [business, actor, location]
  - id: A4-115
    unit: A4
    objective: "A4.1"
    lesson: A4/01_business_active_structure
    stem: "In the specification's contact-centre example, 'High-Risk Claims Adjudication' groups the roles 'Specialist' and 'Customer Service Representative'. Which element is it?"
    options:
      - {key: A, text: "Business Interaction", why: "The interaction is the behaviour; the grouping of the two roles is the collaboration."}
      - {key: B, text: "Business Collaboration", correct: true}
      - {key: C, text: "Business Actor", why: "An actor is a single entity, not a grouping of roles."}
      - {key: D, text: "Business Function", why: "A function is behaviour grouped by skills, not a grouping of roles."}
    explanation: "A collaboration of two business roles is the example's business collaboration; the behaviour it performs would be a business interaction."
    refs: ["ARCHIMATE §8.2", "ARCHIMATE §8.2.3"]
    difficulty: 2
    tags: [business, collaboration, example]
  - id: A4-116
    unit: A4
    objective: "A4.1"
    lesson: A4/01_business_active_structure
    stem: "Which relationship is used when one Business Actor, such as a contact centre, is made up of several employee actors?"
    options:
      - {key: A, text: "Assignment", why: "Assignment links structure to behaviour or an actor to a role, not a whole to its parts."}
      - {key: B, text: "Composition", correct: true}
      - {key: C, text: "Realization", why: "Realization links a concrete element to a more abstract one, not parts to a whole."}
      - {key: D, text: "Serving", why: "Serving is a dependency; it does not express part-whole structure."}
    explanation: "Every element may be composed of elements of its own type; the example's contact centre actor is composed of three employee actors."
    refs: ["ARCHIMATE §8.1", "ARCHIMATE §8.2"]
    difficulty: 1
    tags: [business, actor, composition]
  # ------------------------------------------------------------ A4.2 behaviour
  - id: A4-117
    unit: A4
    objective: "A4.2"
    lesson: A4/02_business_behaviour
    stem: "Which element represents a sequence of business behaviours that achieves a specific result, such as a defined set of products or services?"
    options:
      - {key: A, text: "Business Function", why: "A function groups behaviour by criteria such as skills; it is not defined as a sequence."}
      - {key: B, text: "Business Process", correct: true}
      - {key: C, text: "Business Service", why: "A service is externally exposed behaviour, not the internal sequence that realizes it."}
      - {key: D, text: "Business Event", why: "An event is an instantaneous state change."}
    explanation: "The business process is defined as a sequence of behaviours achieving a specific result."
    refs: ["ARCHIMATE §8.3.1"]
    difficulty: 1
    tags: [business, definition, process]
  - id: A4-118
    unit: A4
    objective: "A4.2"
    lesson: A4/02_business_behaviour
    stem: "What is the key criterion that distinguishes a Business Function from a Business Process?"
    options:
      - {key: A, text: "A function is performed by an application, a process by people", why: "Both are business behaviour performed by roles; automation is not the distinction."}
      - {key: B, text: "A function groups behaviour by required resources, skills or competencies; a process groups it by a sequence or flow", correct: true}
      - {key: C, text: "A function is external behaviour, a process internal", why: "Both are internal behaviour; the service is the external behaviour."}
      - {key: D, text: "A function cannot realize a service, a process can", why: "Both may realize business services."}
    explanation: "A process groups behaviour by the sequence needed to realize a product or service; a function groups it by required resources, skills, competencies or knowledge."
    refs: ["ARCHIMATE §8.3", "ARCHIMATE §8.3.2"]
    difficulty: 2
    tags: [business, process, function, confusable]
  - id: A4-119
    unit: A4
    objective: "A4.2"
    lesson: A4/02_business_behaviour
    stem: "A company policy says two people must always be involved in adjudicating high-risk claims. Which element models this behaviour?"
    options:
      - {key: A, text: "Business Process", why: "A process is performed by a single role; the requirement for two parties makes it collective behaviour."}
      - {key: B, text: "Business Function", why: "A function is also single-role internal behaviour."}
      - {key: C, text: "Business Interaction", correct: true}
      - {key: D, text: "Business Collaboration", why: "The collaboration is the grouping of the two roles; the behaviour they perform is the interaction."}
    explanation: "A business interaction is a unit of collective behaviour performed by two or more actors, roles or a collaboration; the specification uses exactly this claims example."
    refs: ["ARCHIMATE §8.3", "ARCHIMATE §8.3.3"]
    difficulty: 2
    tags: [business, interaction, which-element]
  - id: A4-120
    unit: A4
    objective: "A4.2"
    lesson: A4/02_business_behaviour
    stem: "Which statement about a Business Event is correct?"
    options:
      - {key: A, text: "It has a duration during which the organisation responds", why: "An event is instantaneous; it has no duration."}
      - {key: B, text: "It is instantaneous and may trigger or be raised by a process, function or interaction", correct: true}
      - {key: C, text: "It can only originate from outside the organisation", why: "Events may also be internal, generated by other processes."}
      - {key: D, text: "A business role is assigned to it", why: "Roles are assigned to processes and functions, not to events."}
    explanation: "A business event is a state change with no duration; it may trigger or be triggered by processes, functions and interactions, and may come from inside or outside."
    refs: ["ARCHIMATE §8.3.4"]
    difficulty: 2
    tags: [business, event]
  - id: A4-121
    unit: A4
    objective: "A4.2"
    lesson: A4/02_business_behaviour
    stem: "Which elements may realize a Business Service?"
    options:
      - {key: A, text: "Business role, actor or collaboration", why: "Active-structure elements are assigned to behaviour; they do not realize services."}
      - {key: B, text: "Business process, function or interaction", correct: true}
      - {key: C, text: "Business interface only", why: "An interface is assigned to a service to expose it; it does not realize it."}
      - {key: D, text: "Business event", why: "An event triggers behaviour; it does not realize a service."}
    explanation: "The three internal behaviour elements — process, function and interaction — may realize a business service."
    refs: ["ARCHIMATE §8.3.5"]
    difficulty: 2
    tags: [business, service, realization]
  - id: A4-122
    unit: A4
    objective: "A4.2"
    lesson: A4/02_business_behaviour
    stem: "What does the specification say an ArchiMate Business Process shows about the flow of activities?"
    options:
      - {key: A, text: "It lists the flow of activities in detail, replacing BPMN", why: "ArchiMate depicts the existence of processes, not their detailed flow; BPMN is used for that."}
      - {key: B, text: "It depicts the existence of the process and its relationships, but not the detailed activity flow", correct: true}
      - {key: C, text: "It can only model end-to-end processes, not workflows", why: "High-level, end-to-end, macro flows and workflows all use the same element."}
      - {key: D, text: "It must be decomposed to atomic tasks before it can be used in a model", why: "No such decomposition is required."}
    explanation: "An ArchiMate model shows that processes exist and how they relate; the detailed activity flow is left to a process design language such as BPMN."
    refs: ["ARCHIMATE §8.3.1"]
    difficulty: 2
    tags: [business, process, bpmn]
  - id: A4-123
    unit: A4
    objective: "A4.2"
    lesson: A4/02_business_behaviour
    stem: "A Business Function differs from a Capability in which way?"
    options:
      - {key: A, text: "A function is potential behaviour independent of the organisation; a capability is current day-to-day activity", why: "This is reversed."}
      - {key: B, text: "A function describes current, organisation-aligned activity; a capability represents potential behaviour independent of the organisation structure", correct: true}
      - {key: C, text: "There is no difference; the two are synonyms", why: "They are distinct elements; a function may realize a capability."}
      - {key: D, text: "A capability is a Business Layer element; a function is a strategy element", why: "The layers are the other way round."}
    explanation: "Business functions can realize capabilities: the function is aligned with the organisation and describes what it does today; the capability is potential behaviour independent of implementation."
    refs: ["ARCHIMATE §8.3.2"]
    difficulty: 3
    tags: [business, function, capability, confusable]
  - id: A4-124
    unit: A4
    objective: "A4.2"
    lesson: A4/02_business_behaviour
    stem: "In the specification's example, the function 'Claims Administration' is composed of several processes and an interaction, and realizes 'Claims Processing'. What element type is 'Claims Processing'?"
    options:
      - {key: A, text: "Business Process", why: "The processes are the parts of the function; what the function realizes is a service."}
      - {key: B, text: "Business Service", correct: true}
      - {key: C, text: "Business Interface", why: "An interface exposes a service; it is not what a function realizes."}
      - {key: D, text: "Product", why: "A product aggregates services; it is not realized directly by a function."}
    explanation: "Internal behaviour realizes external behaviour: the 'Claims Administration' function realizes the 'Claims Processing' business service."
    refs: ["ARCHIMATE §8.3"]
    difficulty: 2
    tags: [business, service, example]
  - id: A4-125
    unit: A4
    objective: "A4.2"
    lesson: A4/02_business_behaviour
    stem: "According to the naming guidance, which is the preferred form for a Business Event name?"
    options:
      - {key: A, text: "A noun, e.g. 'claim'", why: "Nouns are for structure elements."}
      - {key: B, text: "A verb in the perfect tense, e.g. 'claim received'", correct: true}
      - {key: C, text: "A verb ending in '-ing', e.g. 'claim processing'", why: "'-ing' verbs are the guidance for services."}
      - {key: D, text: "A verb-noun combination, e.g. 'adjudicate claim'", why: "That is the guidance for processes."}
    explanation: "Event names should preferably be verbs in the perfect tense, such as 'claim received'."
    refs: ["ARCHIMATE §8.3.4"]
    difficulty: 1
    tags: [business, naming, event]
  - id: A4-126
    unit: A4
    objective: "A4.2"
    lesson: A4/02_business_behaviour
    stem: "Which of the following may serve a Business Process?"
    options:
      - {key: A, text: "Business, application and technology services", correct: true}
      - {key: B, text: "Business services only", why: "Application and technology services may also serve a business process."}
      - {key: C, text: "Business roles", why: "A role is assigned to a process, not serving it."}
      - {key: D, text: "Business objects", why: "A process accesses business objects; they do not serve it."}
    explanation: "A business process may be served by business, application or technology services."
    refs: ["ARCHIMATE §8.3.1"]
    difficulty: 2
    tags: [business, process, serving]
  - id: A4-127
    unit: A4
    objective: "A4.2"
    lesson: A4/02_business_behaviour
    stem: "How is the purpose of a Business Service, in terms of the utility it delivers, expressed in a model?"
    options:
      - {key: A, text: "As a Goal element that the service realizes", why: "The specification names value, not goal, as the element carrying the service's purpose."}
      - {key: B, text: "As a Value element associated with the service", correct: true}
      - {key: C, text: "As a Contract aggregated in the service", why: "A contract is aggregated in a product, not a service."}
      - {key: D, text: "As a Requirement the service satisfies", why: "The purpose is modelled as an associated value."}
    explanation: "A business service has a purpose stating its utility in terms of the value it delivers, modelled as a value element associated with the service."
    refs: ["ARCHIMATE §8.3.5"]
    difficulty: 2
    tags: [business, service, value]
  - id: A4-128
    unit: A4
    objective: "A4.2"
    lesson: A4/02_business_behaviour
    stem: "An automated business process, with no human role performing it, is best related to the Application Layer how?"
    options:
      - {key: A, text: "It is realized by an application process", correct: true}
      - {key: B, text: "It is assigned to an application component", why: "The specification says an automated business process can be realized by an application process, to which the component is assigned."}
      - {key: C, text: "It is replaced by an application function and removed from the Business Layer", why: "The business process remains; realization links it downward."}
      - {key: D, text: "It accesses an application service", why: "Access is for passive structure; services serve a process."}
    explanation: "A role is assigned to a process to perform it manually; an automated business process can be realized by an application process."
    refs: ["ARCHIMATE §8.3.1"]
    difficulty: 3
    tags: [business, process, cross-layer]
  - id: A4-129
    unit: A4
    objective: "A4.2"
    lesson: A4/02_business_behaviour
    stem: "Which Business Layer behaviour element is described as externally visible and independent of how the functionality is realized internally?"
    options:
      - {key: A, text: "Business Process", why: "A process is internal behaviour, a black box to the consumer."}
      - {key: B, text: "Business Function", why: "A function is internal behaviour."}
      - {key: C, text: "Business Service", correct: true}
      - {key: D, text: "Business Interaction", why: "An interaction is internal to the collaboration that performs it."}
    explanation: "The business service models externally visible behaviour that offers added value regardless of how it is realized inside the organisation."
    refs: ["ARCHIMATE §8.3"]
    difficulty: 1
    tags: [business, service, external]
  - id: A4-130
    unit: A4
    objective: "A4.2"
    lesson: A4/02_business_behaviour
