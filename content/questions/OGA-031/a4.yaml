  # ------------------------------------------------------------ A4.3 passive structure and product
  - id: A4-133
    unit: A4
    objective: "A4.3"
    lesson: A4/03_business_passive_structure_and_product
    stem: "To which aspect does the Business Object element belong?"
    options:
      - {key: A, text: "Active structure", why: "Active structure performs behaviour; a business object is acted upon."}
      - {key: B, text: "Behaviour", why: "A business object never triggers or performs behaviour."}
      - {key: C, text: "Passive structure", correct: true}
      - {key: D, text: "Composite", why: "The composite element of the Business Layer is the product."}
    explanation: "Business objects are the passive-structure elements manipulated by behaviour such as processes and functions."
    refs: ["ARCHIMATE §8.4", "ARCHIMATE §8.4.1"]
    difficulty: 1
    tags: [business, aspect, object]
  - id: A4-134
    unit: A4
    objective: "A4.3"
    lesson: A4/03_business_passive_structure_and_product
    stem: "Which element represents a perceptible form — such as a document or message — of the information carried by a business object?"
    options:
      - {key: A, text: "Data Object", why: "A data object is data structured for automated processing, in the Application Layer."}
      - {key: B, text: "Representation", correct: true}
      - {key: C, text: "Artifact", why: "An artifact is a technology-layer file, not a business-level perceptible form."}
      - {key: D, text: "Contract", why: "A contract is an agreement, a specialization of business object."}
