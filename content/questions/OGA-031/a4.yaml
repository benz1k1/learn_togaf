    difficulty: 1
    tags: [business, representation, definition]
  - id: A4-135
    unit: A4
    objective: "A4.3"
    lesson: A4/03_business_passive_structure_and_product
    stem: "Which relationship connects a Business Process to the Business Object it creates or updates?"
