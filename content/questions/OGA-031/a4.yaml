      - {key: A, text: "Association", why: "Association is the weakest relationship; the specification states that behaviour accesses objects."}
      - {key: B, text: "Access", correct: true}
      - {key: C, text: "Flow", why: "Flow is a dynamic relationship between behaviour elements."}
      - {key: D, text: "Assignment", why: "Assignment links active structure to behaviour."}
