  - id: A2-132
    unit: A2
    objective: "A2.3"
    lesson: A2/03_meaning_value_and_motivation_relationships
    stem: "Which statement about Value is correct?"
    options:
      - {key: A, text: "Value must always be expressed as a monetary amount", why: "Non-monetary value, including functional value and the value of information, is explicitly recognized."}
      - {key: B, text: "Value may be associated with any concept, and with the stakeholder for whom it applies", correct: true}
      - {key: C, text: "Value can only be attached to business services", why: "It can be associated with any concept."}
      - {key: D, text: "Value is a Business Layer element", why: "It is a motivation element."}
    explanation: "A value can be associated with any concept, and the stakeholder for whom it holds may also be associated; it is often but not necessarily monetary."
    refs: ["ARCHIMATE §6.4.2"]
    difficulty: 1
    tags: [value]
  - id: A2-133
    unit: A2
    objective: "A2.3"
    lesson: A2/03_meaning_value_and_motivation_relationships
    stem: "Which relationship connects a Meaning to the Business Object it interprets?"
    options:
      - {key: A, text: "Realization", why: "Realization is for goals, outcomes, principles and requirements."}
      - {key: B, text: "Association", correct: true}
      - {key: C, text: "Access", why: "Access is from behaviour to passive structure."}
      - {key: D, text: "Influence", why: "Influence models contribution to achieving a motivation element."}
    explanation: "Meaning and value can be associated with any concept, including any structure or behaviour element."
    refs: ["ARCHIMATE §6.4.1", "ARCHIMATE §6.6"]
    difficulty: 2
    tags: [relationship, meaning]
  - id: A2-134
    unit: A2
    objective: "A2.3"
    lesson: A2/03_meaning_value_and_motivation_relationships
    stem: "When should Influence be used instead of Realization between an element and a motivation element?"
    options:
      - {key: A, text: "When the source is critical to the existence or achievement of the target", why: "That is exactly when realization should be used."}
      - {key: B, text: "When the source contributes to or counteracts the target but is not critical to its achievement", correct: true}
      - {key: C, text: "Only between two goals", why: "Influence works vertically from core elements and horizontally between any motivation elements."}
      - {key: D, text: "When the direction of the relationship is unknown", why: "That is what association is for."}
    explanation: "Realization is for relationships critical to the target's realization; influence for those that are not, and it may be positive or negative."
    refs: ["ARCHIMATE §5.2.3"]
    difficulty: 2
    tags: [relationship, influence, realization]
  - id: A2-135
    unit: A2
    objective: "A2.3"
    lesson: A2/03_meaning_value_and_motivation_relationships
    stem: "How is the Influence relationship drawn in the standard notation?"
    options:
      - {key: A, text: "A solid line with a filled arrowhead", why: "That is triggering."}
      - {key: B, text: "A dashed line with an open arrowhead, optionally annotated with + or −", correct: true}
      - {key: C, text: "A dotted line with a hollow triangular head", why: "That is realization."}
      - {key: D, text: "A solid line with a filled diamond", why: "That is composition."}
    explanation: "Influence is a dashed line with an open arrowhead; attributes such as +, −, ++ or a number may indicate the sign and strength."
    refs: ["ARCHIMATE §5.2.3"]
    difficulty: 2
    tags: [notation, influence]
  - id: A2-136
    unit: A2
    objective: "A2.3"
    lesson: A2/03_meaning_value_and_motivation_relationships
    stem: "The goal 'lay off employees' reduces the achievement of the goal 'improve company reputation'. How is this modelled?"
    options:
      - {key: A, text: "A negative influence relationship from 'lay off employees' to 'improve company reputation'", correct: true}
      - {key: B, text: "A realization relationship from 'improve company reputation' to 'lay off employees'", why: "Neither goal realizes the other; and the effect is negative."}
      - {key: C, text: "A constraint on 'improve company reputation'", why: "A constraint is a limitation on the architecture, not a contribution between goals."}
      - {key: D, text: "A triggering relationship between the two goals", why: "Triggering is not permitted between motivation elements."}
    explanation: "Influence may be negative, meaning the source prevents or counteracts the achievement of the target; the specification uses this exact example."
    refs: ["ARCHIMATE §5.2.3"]
    difficulty: 2
    tags: [influence, negative]
  - id: A2-137
    unit: A2
    objective: "A2.3"
    lesson: A2/03_meaning_value_and_motivation_relationships
    stem: "Which relationship is always allowed between any two elements?"
    options:
      - {key: A, text: "Influence", why: "Influence has a motivation element as target."}
      - {key: B, text: "Association", correct: true}
      - {key: C, text: "Realization", why: "Realization is restricted by the relationship tables."}
      - {key: D, text: "Serving", why: "Serving is restricted to permitted element pairs."}
    explanation: "An association relationship is always allowed between two elements, or between a relationship and an element; it represents an unspecified relationship."
    refs: ["ARCHIMATE §5.2.4"]
    difficulty: 1
    tags: [association]
  - id: A2-138
    unit: A2
    objective: "A2.3"
    lesson: A2/03_meaning_value_and_motivation_relationships
    stem: "How can the model show that the 'Claims Manager' business role is also a stakeholder in the architecture?"
    options:
      - {key: A, text: "By drawing a realization from the role to the stakeholder", why: "Realization is not the defined relationship for this."}
      - {key: B, text: "By assigning the business role to a Stakeholder element", correct: true}
      - {key: C, text: "By using the same element for both", why: "Business Role and Stakeholder are different element types."}
      - {key: D, text: "By an influence relationship from the role to the stakeholder", why: "Influence is for contributions to achieving motivation elements."}
    explanation: "A business internal active structure element (actor, role or collaboration) may be assigned to a stakeholder to express that someone with an operational position is also a stakeholder."
    refs: ["ARCHIMATE §6.6"]
    difficulty: 2
    tags: [relationship, stakeholder, assignment]
  - id: A2-139
    unit: A2
    objective: "A2.3"
    lesson: A2/03_meaning_value_and_motivation_relationships
    stem: "Which of the following relationships is NOT permitted between two motivation elements?"
    options:
      - {key: A, text: "Influence", why: "Permitted between any motivation elements."}
      - {key: B, text: "Aggregation between elements of the same type", why: "Every element may compose, aggregate and specialize elements of its own type."}
      - {key: C, text: "Serving", correct: true}
      - {key: D, text: "Association", why: "Always permitted."}
    explanation: "Serving, access, triggering and flow are core-element relationships; between motivation elements the language offers realization, influence, association, and composition/aggregation/specialization within a type."
    refs: ["ARCHIMATE §6.1", "ARCHIMATE §5.2.3"]
    difficulty: 2
    tags: [relationship, negative]
  - id: A2-140
    unit: A2
    objective: "A2.3"
    lesson: A2/03_meaning_value_and_motivation_relationships
    stem: "Which of the following describes the 'vertical' use of the influence relationship?"
    options:
      - {key: A, text: "Contribution between goals at the same level", why: "That is the horizontal use."}
      - {key: B, text: "A traceable path from core elements upward through requirements and principles to goals", correct: true}
      - {key: C, text: "Decomposition of a goal into sub-goals", why: "Decomposition uses aggregation."}
      - {key: D, text: "Layering a model from Technology up to Business", why: "That is serving and realization between core layers."}
    explanation: "Consistently modelling contributions from core elements up to requirements and goals with influence yields a traceable motivational path that supports impact assessment."
    refs: ["ARCHIMATE §5.2.3"]
    difficulty: 3
    tags: [influence, traceability]
  - id: A2-141
    unit: A2
    objective: "A2.3"
    lesson: A2/03_meaning_value_and_motivation_relationships
    stem: "Which viewpoint allows the use of all motivation elements without focusing on any particular subset?"
    options:
      - {key: A, text: "Stakeholder viewpoint", why: "Limited to stakeholder, driver, assessment, goal, outcome."}
      - {key: B, text: "Goal Contribution viewpoint", why: "Focuses on influence relationships between goals and requirements."}
      - {key: C, text: "Motivation viewpoint", correct: true}
      - {key: D, text: "Outcome Realization viewpoint", why: "That is a strategy viewpoint admitting only outcome, value and meaning from the motivation aspect."}
    explanation: "The Motivation viewpoint covers the entire motivation aspect and allows use of all motivation elements; its purpose is designing, deciding and informing."
    refs: ["ARCHIMATE §C.2", "ARCHIMATE §C.2.4"]
    difficulty: 1
    tags: [viewpoint, motivation]
  - id: A2-142
    unit: A2
    objective: "A2.3"
    lesson: A2/03_meaning_value_and_motivation_relationships
    stem: "An application component realizes a requirement, which realizes a principle, which realizes a goal. What may be concluded?"
    options:
      - {key: A, text: "Nothing; relationships cannot be chained", why: "Derivation of indirect relationships from chains is a defining feature of the language."}
      - {key: B, text: "A derived realization relationship from the application component to the goal is valid", correct: true}
      - {key: C, text: "The goal realizes the application component", why: "Direction is preserved in derivation; the core element realizes the goal, not the reverse."}
      - {key: D, text: "The component must be redrawn as a stakeholder", why: "There is no such rule."}
    explanation: "Indirect relationships can be derived from chains according to the rules of Appendix B; a requirement and indirectly a principle, outcome or goal can be realized by a core element."
    refs: ["ARCHIMATE §5.7", "ARCHIMATE §6.6"]
    difficulty: 3
    tags: [derivation, realization]
