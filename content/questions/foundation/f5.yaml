# F5 ADM Techniques bank (learn_togaf.md §2, §6). Authored, original paraphrase; every item cites the
# 10th Edition section it is grounded on. status: draft until reviewed.
code: F5_BANK
exam: FOUNDATION
name: F5 ADM Techniques
kind: DRILL
source: authored
questions:
  # ---------------------------------------------------------------- 5.1 Architecture Principles
  - id: F5-101
    unit: F5
    objective: "5.1"
    stem: "How does the TOGAF Standard characterise principles?"
    options:
      - {key: A, text: "General rules and guidelines, intended to be enduring and seldom amended, that inform how an organisation fulfils its mission", correct: true}
      - {key: B, text: "Detailed technical standards that are revised at the end of every ADM cycle"}
      - {key: C, text: "Measurable targets set by the Architecture Board for each project"}
      - {key: D, text: "Contractual obligations between the architecture function and implementation projects"}
    explanation: "Principles are general rules and guidelines meant to endure and change rarely. B describes standards and inverts the 'seldom amended' quality. C describes objectives or KPIs. D describes an Architecture Contract."
    refs: ["TECH §2.1"]
    difficulty: 1
    tags: [principles, definitions]
  - id: F5-102
    unit: F5
    objective: "5.1"
    stem: "Which statement correctly relates Architecture Principles to enterprise principles?"
    options:
      - {key: A, text: "Architecture Principles replace enterprise principles once the Architecture Board approves them"}
      - {key: B, text: "Architecture Principles are informed and constrained by enterprise principles and govern the architecture process", correct: true}
      - {key: C, text: "Enterprise principles are derived from Architecture Principles"}
      - {key: D, text: "The two sets are independent and must not reference each other"}
    explanation: "Sets of principles form a hierarchy: Architecture Principles are informed and constrained by the enterprise-level principles and govern the development, maintenance and use of the architecture. A and C reverse the relationship; D denies the hierarchy the standard describes."
    refs: ["TECH §2.1"]
    difficulty: 2
    tags: [principles]
  - id: F5-103
    unit: F5
    objective: "5.1"
    stem: "Who typically develops Architecture Principles, and who approves them?"
    options:
      - {key: A, text: "Developed by the CIO; approved by the project sponsor"}
      - {key: B, text: "Developed by the Enterprise Architects with key stakeholders; approved by the Architecture Board", correct: true}
      - {key: C, text: "Developed by the Architecture Board; approved by the Enterprise Architects"}
      - {key: D, text: "Developed by implementation teams; approved through a dispensation request"}
    explanation: "The standard says principles are typically developed by the Enterprise Architects in conjunction with key stakeholders and approved by the Architecture Board. C reverses the roles; A and D name parties the standard does not give this role to — a dispensation is a governance mechanism for non-compliance, not an approval route."
    refs: ["TECH §2.4"]
    difficulty: 1
    tags: [principles, governance]
  - id: F5-104
    unit: F5
    objective: "5.1"
    stem: "In the recommended template for a principle, which part should highlight the business benefits of adhering to the principle, using business terminology?"
    options:
      - {key: A, text: "Name"}
      - {key: B, text: "Statement"}
      - {key: C, text: "Rationale", correct: true}
      - {key: D, text: "Implications"}
    explanation: "The rationale explains the business benefit in business terms and describes relationships to other principles. The name is a memorable label, the statement is the unambiguous rule itself, and the implications describe the requirements, resources, costs and consequences of carrying the principle out."
    refs: ["TECH §2.3"]
    difficulty: 1
    tags: [principles, template]
  - id: F5-105
    unit: F5
    objective: "5.1"
    stem: "Which part of a principle should let the reader readily answer the question 'How does this affect me?'"
    options:
      - {key: A, text: "Implications", correct: true}
      - {key: B, text: "Rationale"}
      - {key: C, text: "Statement"}
      - {key: D, text: "Name"}
    explanation: "The implications describe the requirements on the business and IT — resources, costs, activities — and the consequences of adoption, so the reader can see how it affects them. The rationale explains benefits, the statement gives the rule, and the name is the label."
    refs: ["TECH §2.3"]
    difficulty: 2
    tags: [principles, template]
  - id: F5-106
    unit: F5
    objective: "5.1"
    stem: "According to the guidance on writing the Name and Statement of a principle, which of the following should be avoided?"
    options:
      - {key: A, text: "Referring to the business objectives the principle supports"}
      - {key: B, text: "Mentioning specific technology platforms and using ambiguous words such as 'support', 'open' or 'consider'", correct: true}
      - {key: C, text: "Keeping the statement short"}
      - {key: D, text: "Making the name easy to remember"}
    explanation: "The standard says specific technology platforms should not be mentioned in the name or statement, and warns against ambiguous words such as 'support', 'open', 'consider' and 'avoid'. Tracing to business objectives (A), brevity (C) and memorability (D) are all recommended."
    refs: ["TECH §2.3"]
    difficulty: 2
    tags: [principles, template]
  - id: F5-107
    unit: F5
    objective: "5.1"
    stem: "Which of the following is NOT one of the five criteria the standard gives for a good set of Architecture Principles?"
    options:
      - {key: A, text: "Understandable"}
      - {key: B, text: "Robust"}
      - {key: C, text: "Measurable", correct: true}
      - {key: D, text: "Consistent"}
    explanation: "The five criteria are understandable, robust, complete, consistent and stable. 'Measurable' belongs to SMART objectives (as used for business scenarios), not to the qualities of principles."
    refs: ["TECH §2.4.1"]
    difficulty: 1
    tags: [principles, qualities]
  - id: F5-108
    unit: F5
    objective: "5.1"
    stem: "A set of principles is described as enabling good-quality decisions about architectures and plans and allowing enforceable policies and standards to be created. Which quality is being described?"
    options:
      - {key: A, text: "Understandable"}
      - {key: B, text: "Robust", correct: true}
      - {key: C, text: "Complete"}
      - {key: D, text: "Stable"}
    explanation: "Robust principles are definitive and precise enough to support consistent decisions and enforceable policies. Understandable concerns quick grasp and unambiguous intent; complete means every important principle is defined; stable means enduring with an amendment process."
    refs: ["TECH §2.4.1"]
    difficulty: 2
    tags: [principles, qualities]
  - id: F5-109
    unit: F5
    objective: "5.1"
    stem: "Which quality of a set of principles acknowledges that strict adherence to one principle may require a loose interpretation of another?"
    options:
      - {key: A, text: "Complete"}
      - {key: B, text: "Robust"}
      - {key: C, text: "Consistent", correct: true}
      - {key: D, text: "Understandable"}
    explanation: "Consistency is about expressing the set so that interpretations can be balanced and principles do not contradict each other's spirit. Complete is about coverage, robust about precision for decision-making, understandable about clarity of intent."
    refs: ["TECH §2.4.1"]
    difficulty: 2
    tags: [principles, qualities]
  - id: F5-110
    unit: F5
    objective: "5.1"
    stem: "The quality 'stable' requires that principles are enduring yet able to accommodate change. What does the standard say must be established to achieve this?"
    options:
      - {key: A, text: "An annual re-approval of every principle by the Architecture Board"}
      - {key: B, text: "An amendment process for adding, removing or altering principles after they are ratified", correct: true}
      - {key: C, text: "A rule that principles may only be changed at the start of an ADM cycle"}
      - {key: D, text: "A separate set of temporary principles for each project"}
    explanation: "Stable principles need an amendment process for adding, removing or altering them after initial ratification. A, C and D invent constraints the standard does not state; D in particular contradicts principles being few and enduring."
    refs: ["TECH §2.4.1"]
    difficulty: 2
    tags: [principles, qualities]
  - id: F5-111
    unit: F5
    objective: "5.1"
    stem: "The principles of 'accessibility' and 'security' tend to pull towards conflicting decisions. What does the standard say should happen when one principle must take precedence over another on an issue?"
    options:
      - {key: A, text: "The lower-priority principle is removed from the set"}
      - {key: B, text: "The rationale for the precedence decision should always be documented", correct: true}
      - {key: C, text: "A dispensation must be requested from the Architecture Board"}
      - {key: D, text: "The decision is deferred to Phase G"}
    explanation: "Principles are applied as a set, read 'all other things being equal', and when one is given precedence the rationale is documented. A would break the completeness of the set; C confuses this with the dispensation route for non-compliance; D invents a phase rule."
    refs: ["TECH §2.5"]
    difficulty: 2
    tags: [principles, applying]
  - id: F5-112
    unit: F5
    objective: "5.1"
    stem: "Which of the following is listed by the standard as a typical influence on the development of Architecture Principles?"
    options:
      - {key: A, text: "Emerging industry trends", correct: true}
      - {key: B, text: "The Architecture Repository's version numbering scheme"}
      - {key: C, text: "The gradient scoring of the Practitioner exam"}
      - {key: D, text: "The size of the Architecture Board"}
    explanation: "The listed influences are enterprise mission and plans, strategic initiatives, external constraints, current systems and technology, and emerging industry trends. B, C and D are not among them."
    refs: ["TECH §2.4"]
    difficulty: 1
    tags: [principles]
  - id: F5-113
    unit: F5
    objective: "5.1"
    stem: "How do Architecture Principles support Architecture Governance activities, according to the ADM Techniques document?"
    options:
      - {key: A, text: "They replace the need for Architecture Compliance reviews"}
      - {key: B, text: "They act as a 'back-stop' for compliance assessments where interpretation is allowed, and support the decision to initiate a dispensation request", correct: true}
      - {key: C, text: "They define the membership of the Architecture Board"}
      - {key: D, text: "They set the penalties applied when a project violates the architecture"}
    explanation: "Principles provide a back-stop where compliance assessments allow interpretation and support deciding to raise a dispensation. A overstates it — compliance reviews still happen. C is a governance-framework matter. D is contradicted by the standard, which says no specific penalties are prescribed."
    refs: ["TECH §2.5"]
    difficulty: 3
    tags: [principles, governance]
  - id: F5-114
    unit: F5
    objective: "5.1"
    stem: "In which ADM phase are the Architecture Principles, including business principles, confirmed and elaborated as a named step?"
    options:
      - {key: A, text: "Phase B: Business Architecture"}
      - {key: B, text: "Phase A: Architecture Vision", correct: true}
      - {key: C, text: "Phase G: Implementation Governance"}
      - {key: D, text: "Phase H: Architecture Change Management"}
    explanation: "Phase A has a step 'Confirm and Elaborate Architecture Principles, including Business Principles'. Phase B develops the Business Architecture against them; G and H apply and maintain them but do not have this step."
    refs: ["ADM §3.3.7"]
    difficulty: 2
    tags: [principles, phase-a]
  # ---------------------------------------------------------------- 5.2 Stakeholder Management
  - id: F5-115
    unit: F5
    objective: "5.2"
    stem: "When should stakeholder analysis be carried out in the ADM?"
    options:
      - {key: A, text: "Once, in the Preliminary Phase, and then frozen"}
      - {key: B, text: "During Phase A to identify the key players, and updated throughout each subsequent phase", correct: true}
      - {key: C, text: "Only in Phase E, when solutions are being selected"}
      - {key: D, text: "Only in Phase G, when projects are being governed"}
    explanation: "Stakeholder analysis is used in Phase A and updated in each phase, because new stakeholders appear during Opportunities & Solutions, Migration Planning and Change Management. A freezes it and puts it in the wrong phase; C and D limit it to a single later phase."
    refs: ["TECH §3.2"]
    difficulty: 1
    tags: [stakeholders, phase-a]
  - id: F5-116
    unit: F5
    objective: "5.2"
    stem: "Which four concepts does the TOGAF Standard use throughout the ADM to address the different concerns of different stakeholders?"
    options:
      - {key: A, text: "Architecture View, Architecture Viewpoint, Concern, Stakeholder", correct: true}
      - {key: B, text: "Catalog, Matrix, Diagram, Deliverable"}
      - {key: C, text: "Baseline, Target, Transition, Gap"}
      - {key: D, text: "Driver, Goal, Objective, Measure"}
    explanation: "The four concepts named are view, viewpoint, concern and stakeholder. B lists artifact kinds and deliverables, C the states an architecture passes through, D the motivation elements of the content metamodel."
    refs: ["TECH §3.2"]
    difficulty: 1
    tags: [stakeholders, definitions]
  - id: F5-117
    unit: F5
    objective: "5.2"
    stem: "What is the correct order of the recommended steps in the stakeholder management process?"
    options:
      - {key: A, text: "Classify positions; identify stakeholders; tailor deliverables; determine approach"}
      - {key: B, text: "Identify stakeholders; classify stakeholder positions; determine stakeholder management approach; tailor engagement deliverables", correct: true}
      - {key: C, text: "Tailor engagement deliverables; determine approach; identify stakeholders; classify positions"}
      - {key: D, text: "Determine approach; identify stakeholders; tailor deliverables; classify positions"}
    explanation: "The four steps run identify, classify, determine approach, tailor deliverables. The other options reorder them; you cannot classify or choose an approach before identifying, and deliverables are tailored last."
    refs: ["TECH §3.3"]
    difficulty: 2
    tags: [stakeholders, steps]
  - id: F5-118
    unit: F5
    objective: "5.2"
    stem: "The sample stakeholder analysis in the ADM Techniques document distinguishes how many stakeholder types, in how many broad categories?"
    options:
      - {key: A, text: "22 types in five categories", correct: true}
      - {key: B, text: "12 types in four categories"}
      - {key: C, text: "Four types in two categories"}
      - {key: D, text: "40 types in eight categories"}
    explanation: "Figure 3-1 shows 22 stakeholder types in five categories, while noting any project may have more, fewer or different ones. The other numbers are not from the standard."
    refs: ["TECH §3.3.1"]
    difficulty: 3
    tags: [stakeholders]
  - id: F5-119
    unit: F5
    objective: "5.2"
    stem: "When identifying stakeholders, what danger does the standard warn about?"
    options:
      - {key: A, text: "Including too many senior executives"}
      - {key: B, text: "Concentrating too heavily on the formal organisation structure, since informal groups may be just as powerful", correct: true}
      - {key: C, text: "Identifying individuals rather than organisations"}
      - {key: D, text: "Consulting customers and suppliers"}
    explanation: "The warning is against relying on the formal structure; informal stakeholder groups can be as influential. C is backwards — the standard says the team ultimately needs to identify the correct individuals. A and D are not warnings; executives, customers and suppliers are all listed as possible stakeholders."
    refs: ["TECH §3.3.1"]
    difficulty: 2
    tags: [stakeholders]
  - id: F5-120
    unit: F5
    objective: "5.2"
    stem: "The 'Invisible team' in stakeholder identification refers to:"
    options:
      - {key: A, text: "Stakeholders who oppose the change and hide their objections"}
      - {key: B, text: "Those who must make a real contribution for the change to succeed but are not obviously associated with it, such as providers of support services", correct: true}
      - {key: C, text: "External regulators who never attend project meetings"}
      - {key: D, text: "The architecture team itself"}
    explanation: "The invisible team are contributors not obviously associated with the project, e.g. support service providers, in contrast to the visible team. A describes blockers, C a specific external stakeholder type, D the team doing the work."
    refs: ["TECH §3.3.1"]
    difficulty: 2
    tags: [stakeholders]
  - id: F5-121
    unit: F5
    objective: "5.2"
    stem: "Which of the following is recorded when classifying stakeholder positions in the example analysis table?"
    options:
      - {key: A, text: "Salary band and reporting line"}
      - {key: B, text: "Ability to disrupt the change, current and required understanding, current and required commitment, and required support", correct: true}
      - {key: C, text: "The catalogs, matrices and diagrams each stakeholder receives"}
      - {key: D, text: "The stakeholder's position on the power/interest grid"}
    explanation: "Table 3-1 records ability to disrupt change, understanding (current/required), commitment (current/required) and required support. C belongs to the stakeholder map produced in the tailoring step; D belongs to the approach step; A is not in the standard."
    refs: ["TECH §3.3.2"]
    difficulty: 3
    tags: [stakeholders, steps]
  - id: F5-122
    unit: F5
    objective: "5.2"
    stem: "What are the two axes of the stakeholder power grid used to determine the stakeholder management approach?"
    options:
      - {key: A, text: "Power and level of interest", correct: true}
      - {key: B, text: "Seniority and budget"}
      - {key: C, text: "Understanding and commitment"}
      - {key: D, text: "Risk and value"}
    explanation: "The grid plots power against level of interest. C lists dimensions from the classification table, D from the Business Value and Risk Matrix used in migration planning, and B is invented."
    refs: ["TECH §3.3.3"]
    difficulty: 1
    tags: [stakeholders, power-grid]
  - id: F5-123
    unit: F5
    objective: "5.2"
    stem: "A stakeholder has high power and a high level of interest in the architecture engagement. How is this stakeholder classified on the power grid?"
    options:
      - {key: A, text: "Keep Satisfied"}
      - {key: B, text: "Keep Informed"}
      - {key: C, text: "Key Player", correct: true}
      - {key: D, text: "Minimal Effort"}
    explanation: "High power and high interest are Key Players. Keep Satisfied is high power with low interest, Keep Informed is low power with high interest, Minimal Effort is low on both."
    refs: ["TECH §3.3.3"]
    difficulty: 1
    tags: [stakeholders, power-grid]
  - id: F5-124
    unit: F5
    objective: "5.2"
    stem: "A group of end users is very interested in the outcome of the engagement but has little power to block or advance it. Which grid quadrant and strategy applies?"
    options:
      - {key: A, text: "Key Players"}
      - {key: B, text: "Keep Satisfied"}
      - {key: C, text: "Keep Informed", correct: true}
      - {key: D, text: "Minimal Effort"}
    explanation: "Low power with high interest is Keep Informed. Key Players need both high power and high interest; Keep Satisfied is the high-power, low-interest quadrant; Minimal Effort applies only when both are low."
    refs: ["TECH §3.3.3"]
    difficulty: 2
    tags: [stakeholders, power-grid]
  - id: F5-125
    unit: F5
    objective: "5.2"
    stem: "Which quadrant of the power grid is reserved for stakeholders with both low power and low interest?"
    options:
      - {key: A, text: "Minimal Effort", correct: true}
      - {key: B, text: "Keep Informed"}
      - {key: C, text: "Keep Satisfied"}
      - {key: D, text: "Key Players"}
    explanation: "Low/low is Minimal Effort. The other three quadrants each require high power, high interest, or both."
    refs: ["TECH §3.3.3"]
    difficulty: 1
    tags: [stakeholders, power-grid]
  - id: F5-126
    unit: F5
    objective: "5.2"
    stem: "What is the purpose of the 'Tailor Engagement Deliverables' step?"
    options:
      - {key: A, text: "To identify the catalogs, matrices and diagrams the engagement must produce and validate with each stakeholder group", correct: true}
      - {key: B, text: "To negotiate the fee for the architecture engagement"}
      - {key: C, text: "To decide which stakeholders will sit on the Architecture Board"}
      - {key: D, text: "To rank stakeholders by their ability to disrupt the change"}
    explanation: "Tailoring deliverables means choosing the specific artifacts relevant to each stakeholder group so they can verify their concerns are addressed. D is the classification step; B and C are not part of the technique."
    refs: ["TECH §3.3.4"]
    difficulty: 1
    tags: [stakeholders, steps]
  - id: F5-127
    unit: F5
    objective: "5.2"
    stem: "Which columns make up the template stakeholder map in the ADM Techniques document?"
    options:
      - {key: A, text: "Stakeholder; Key Concerns; Class; Catalogs, Matrices and Diagrams", correct: true}
      - {key: B, text: "Stakeholder; Phase; Deliverable; Sign-off date"}
      - {key: C, text: "Stakeholder; Power; Interest; Budget"}
      - {key: D, text: "Stakeholder; Risk; Mitigation; Owner"}
    explanation: "The template lists each stakeholder, their key concerns, their class (grid quadrant) and the artifacts addressing the concerns. B looks like a deliverables schedule, C mixes grid axes with an invented column, D is a risk register."
    refs: ["TECH §3.4"]
    difficulty: 2
    tags: [stakeholders, stakeholder-map]
  - id: F5-128
    unit: F5
    objective: "5.2"
    stem: "In Phase A, the stakeholder map is described as the major product of the step 'Identify Stakeholders, Concerns, and Business Requirements'. Which of the following does it help to identify?"
    options:
      - {key: A, text: "The Solution Building Blocks to be procured"}
      - {key: B, text: "The concerns and viewpoints relevant to the project, the starting point for the Communications Plan, and roles and responsibilities for the Statement of Architecture Work", correct: true}
      - {key: C, text: "The Transition Architectures and their sequence"}
      - {key: D, text: "The residual risk after mitigation"}
    explanation: "The ADM says the stakeholder map supports the Architecture Vision (concerns and viewpoints), the Communications Plan (who is involved) and the Statement of Architecture Work (roles). SBBs and Transition Architectures are Phase E concerns; residual risk is a risk-management outcome."
    refs: ["ADM §3.3.2"]
    difficulty: 2
    tags: [stakeholders, phase-a]
  - id: F5-129
    unit: F5
    objective: "5.2"
    stem: "Which benefit of stakeholder management does the standard list?"
    options:
      - {key: A, text: "The most powerful stakeholders are identified early so their input can shape the architecture and secure their support", correct: true}
      - {key: B, text: "The architecture can be completed without stakeholder review"}
      - {key: C, text: "Stakeholders with conflicting objectives can be excluded from the engagement"}
      - {key: D, text: "Communication with stakeholders can be delayed until the architecture is final"}
    explanation: "Early identification of powerful stakeholders shaping and supporting the work is a listed benefit. B and D contradict the emphasis on early, frequent communication; C contradicts the benefit of identifying conflicts early in order to resolve them, not to exclude people."
    refs: ["TECH §3.1"]
    difficulty: 1
    tags: [stakeholders]
  # ---------------------------------------------------------------- 5.3 Gap Analysis and migration planning
  - id: F5-130
    unit: F5
    objective: "5.3"
    stem: "What is the basic premise of the gap analysis technique in the ADM?"
    options:
      - {key: A, text: "To estimate the cost of each work package"}
      - {key: B, text: "To highlight a shortfall between the Baseline and Target Architectures — items deliberately omitted, accidentally left out, or not yet defined", correct: true}
      - {key: C, text: "To rank stakeholders by their interest in the change"}
      - {key: D, text: "To select the reference models to be used in Phase B"}
    explanation: "Gap analysis validates an architecture by exposing the shortfall between baseline and target. A is a Phase F costing activity, C is stakeholder management, D is the first step of a domain phase."
    refs: ["TECH §5"]
    difficulty: 1
    tags: [gap-analysis]
  - id: F5-131
    unit: F5
    objective: "5.3"
    stem: "According to the ADM Techniques document, what is the most critical source of gaps that should be considered?"
    options:
      - {key: A, text: "Stakeholder concerns that have not been addressed in prior architectural work", correct: true}
      - {key: B, text: "Differences between vendors' product roadmaps"}
      - {key: C, text: "Missing entries in the Technology Standards catalog"}
      - {key: D, text: "Budget shortfalls in the current financial year"}
    explanation: "The standard names unaddressed stakeholder concerns as the most critical source of gaps. B, C and D might be inputs to some gap but are not what the standard singles out."
    refs: ["TECH §5.1"]
    difficulty: 2
    tags: [gap-analysis]
  - id: F5-132
    unit: F5
    objective: "5.3"
    stem: "In the gap analysis matrix, which building blocks are placed on which axis?"
    options:
      - {key: A, text: "Target ABBs on the vertical axis; Baseline ABBs on the horizontal axis"}
      - {key: B, text: "Baseline ABBs on the vertical axis; Target ABBs on the horizontal axis", correct: true}
      - {key: C, text: "Baseline SBBs on both axes"}
      - {key: D, text: "Stakeholders on the vertical axis; concerns on the horizontal axis"}
    explanation: "Baseline Architecture Building Blocks run down the vertical axis and Target ABBs across the horizontal axis. A swaps them, C uses the wrong kind of building block, D describes a stakeholder map."
    refs: ["TECH §5.2"]
    difficulty: 2
    tags: [gap-analysis]
  - id: F5-133
    unit: F5
    objective: "5.3"
    stem: "In the gap analysis matrix, how is a building block that exists in both the Baseline and Target Architectures recorded?"
    options:
      - {key: A, text: "It is marked 'Included' at the intersecting cell", correct: true}
      - {key: B, text: "It is placed in the 'New' row"}
      - {key: C, text: "It is placed in the 'Eliminated' column"}
      - {key: D, text: "It is left blank and omitted from the analysis"}
    explanation: "A building block present in both is marked 'Included'. 'New' is for target ABBs absent from the baseline, 'Eliminated' for baseline ABBs absent from the target; leaving it blank would defeat the purpose of the matrix."
    refs: ["TECH §5.2"]
    difficulty: 1
    tags: [gap-analysis]
  - id: F5-134
    unit: F5
    objective: "5.3"
    stem: "A Target Architecture ABB has no counterpart in the Baseline Architecture. Where is it recorded in the gap analysis matrix, and what does it signify?"
    options:
      - {key: A, text: "In the 'Eliminated' column; it signifies a deliberate removal"}
      - {key: B, text: "In the 'New' row; it signifies a gap to be filled by developing or procuring the building block", correct: true}
      - {key: C, text: "As 'Included'; it signifies no action is needed"}
      - {key: D, text: "In the Requirements Repository; it signifies a change request"}
    explanation: "A target ABB missing from the baseline is marked at the intersection with the 'New' row as a gap to develop or procure. A describes the opposite case, C describes a block present in both, D is not part of the technique."
    refs: ["TECH §5.2"]
    difficulty: 2
    tags: [gap-analysis]
  - id: F5-135
    unit: F5
    objective: "5.3"
    stem: "Which of the following is listed as a potential gap in the Data domain?"
    options:
      - {key: A, text: "Data not of sufficient currency", correct: true}
      - {key: B, text: "Cross-training requirements"}
      - {key: C, text: "Facilities gaps such as office space"}
      - {key: D, text: "Duplicate tool functionality"}
    explanation: "Data currency, location, availability and relationship gaps are data-domain examples. Cross-training (people), facilities and duplicate tools are all listed under business-domain gaps."
    refs: ["TECH §5.1"]
    difficulty: 3
    tags: [gap-analysis]
  - id: F5-136
    unit: F5
    objective: "5.3"
    stem: "In Phase E, what is created to review and consolidate the gap analysis results from Phases B to D?"
    options:
      - {key: A, text: "A Business Value and Risk Matrix"}
      - {key: B, text: "A Consolidated Gaps, Solutions, and Dependencies matrix", correct: true}
      - {key: C, text: "A Transition Architecture State Evolution Table"}
      - {key: D, text: "A Stakeholder Map Matrix"}
    explanation: "Phase E consolidates the domain gap results into the Consolidated Gaps, Solutions, and Dependencies matrix, which identifies SBBs that can address one or more gaps. A and C are Phase F tools; D is Phase A stakeholder management."
    refs: ["ADM §9.3.3"]
    difficulty: 1
    tags: [migration-planning, phase-e]
  - id: F5-137
    unit: F5
    objective: "5.3"
    stem: "What factors does the Implementation Factor catalog typically record?"
    options:
      - {key: A, text: "Risks, issues, assumptions, dependencies, actions and impacts affecting the Implementation and Migration Plan", correct: true}
      - {key: B, text: "The stakeholders, their concerns and the views they need"}
      - {key: C, text: "The Baseline and Target ABBs and whether each is included, new or eliminated"}
      - {key: D, text: "The effect and frequency of each transformation risk"}
    explanation: "The catalog documents the factors that shape the plan — risks, issues, assumptions, dependencies, actions and impacts — with descriptions and deductions. B is the stakeholder map, C the gap analysis matrix, D the risk assessment worksheet."
    refs: ["CONTENT §3.6.8", "ADM §9.3.3"]
    difficulty: 2
    tags: [migration-planning, phase-e]
  - id: F5-138
    unit: F5
    objective: "5.3"
    stem: "When formulating the Implementation and Migration Strategy in Phase E, which three basic strategic approaches does the ADM describe?"
    options:
      - {key: A, text: "Greenfield, Revolutionary, Evolutionary", correct: true}
      - {key: B, text: "Baseline First, Target First, Hybrid"}
      - {key: C, text: "Mainstream, Contain, Replace"}
      - {key: D, text: "Strategic, Segment, Capability"}
    explanation: "The three approaches are Greenfield (completely new), Revolutionary (switch on/switch off) and Evolutionary (convergence, e.g. parallel running). B describes architecture development approaches, C the classification of current systems, D the Architecture Landscape levels."
    refs: ["ADM §9.3.8"]
    difficulty: 2
    tags: [migration-planning, phase-e]
  - id: F5-139
    unit: F5
    objective: "5.3"
    stem: "Which of the following is one of the 'most common implementation methodologies' the ADM lists for addressing the risks identified in the Consolidated Gaps, Solutions, and Dependencies matrix?"
    options:
      - {key: A, text: "Quick win (snapshots)", correct: true}
      - {key: B, text: "Big bang"}
      - {key: C, text: "Waterfall"}
      - {key: D, text: "Top-down capability mapping"}
    explanation: "The three methodologies are quick win (snapshots), achievable targets and the value chain method. Big bang and waterfall are not listed; top-down mapping is an approach to building a capability catalog."
    refs: ["ADM §9.3.8"]
    difficulty: 3
    tags: [migration-planning, phase-e]
  - id: F5-140
    unit: F5
    objective: "5.3"
    stem: "When identifying and grouping work packages in Phase E, every current system under consideration is classified as one of which three?"
    options:
      - {key: A, text: "Included, New, Eliminated"}
      - {key: B, text: "Mainstream, Contain, Replace", correct: true}
      - {key: C, text: "Strategic, Tactical, Operational"}
      - {key: D, text: "Buy, Build, Re-use"}
    explanation: "Systems are classified Mainstream (part of the future system), Contain (to be replaced or modified within the planning horizon) or Replace. A is the gap matrix vocabulary; D is the solution-column decision for gaps, not the system classification; C is not from the standard."
    refs: ["ADM §9.3.9"]
    difficulty: 2
    tags: [migration-planning, phase-e]
  - id: F5-141
    unit: F5
    objective: "5.3"
    stem: "Which statement about Transition Architectures identified in Phase E is correct?"
    options:
      - {key: A, text: "The time-span between successive Transition Architectures must be of uniform duration"}
      - {key: B, text: "They should provide measurable business value and the intervals between them need not be uniform", correct: true}
      - {key: C, text: "They are only needed when a Greenfield approach is chosen"}
      - {key: D, text: "They must implement the most difficult activities first"}
    explanation: "Transition Architectures give clear, measurably valuable targets along the roadmap, and their spacing need not be uniform. A contradicts this; C is wrong because they suit an incremental approach; D is reversed — difficult activities go after those that easily deliver missing capability, unless there is a compelling reason."
    refs: ["ADM §9.3.10"]
    difficulty: 2
    tags: [migration-planning, transition-architecture]
  - id: F5-142
    unit: F5
    objective: "5.3"
    stem: "Which four concepts does the ADM name as key to transitioning from developing a Target Architecture to delivering it?"
    options:
      - {key: A, text: "Architecture Roadmap, Work Packages, Transition Architectures, Implementation and Migration Plan", correct: true}
      - {key: B, text: "Architecture Vision, Architecture Definition Document, Architecture Requirements Specification, Architecture Contract"}
      - {key: C, text: "Baseline, Target, Gap, Solution"}
      - {key: D, text: "Principles, Standards, Guidelines, Patterns"}
    explanation: "Phase E's approach names the roadmap, work packages, Transition Architectures and the Implementation and Migration Plan. B lists deliverables from earlier phases, C the gap-analysis vocabulary, D repository content types."
    refs: ["ADM §9.5"]
    difficulty: 2
    tags: [migration-planning, phase-e]
  - id: F5-143
    unit: F5
    objective: "5.3"
    stem: "In Phase F, the Implementation and Migration Plan must be co-ordinated with which four management frameworks?"
    options:
      - {key: A, text: "Business Planning, Enterprise Architecture, Project/Portfolio Management, Operations Management", correct: true}
      - {key: B, text: "Finance, Human Resources, Procurement, Legal"}
      - {key: C, text: "Strategic, Segment, Capability, Solution"}
      - {key: D, text: "ISM, ERM, ITIL, COBIT"}
    explanation: "The step 'Confirm Management Framework Interactions' names Business Planning, Enterprise Architecture, Project/Portfolio Management and Operations Management. B lists corporate functions, C landscape levels, D external standards."
    refs: ["ADM §10.3.1"]
    difficulty: 2
    tags: [migration-planning, phase-f]
  - id: F5-144
    unit: F5
    objective: "5.3"
    stem: "In Phase F, which tool is used to estimate the business value of each project after risks have been aggregated from the Consolidated Gaps, Solutions, and Dependencies matrix?"
    options:
      - {key: A, text: "The Business Value and Risk Matrix", correct: true}
      - {key: B, text: "The stakeholder power grid"}
      - {key: C, text: "The gap analysis matrix"}
      - {key: D, text: "The Implementation Factor catalog"}
    explanation: "The step 'Assign a Business Value to Each Work Package' estimates value with the Business Value and Risk Matrix, whose value and risk indexes carry weighted criteria approved by senior management. B is stakeholder management, C is domain-phase gap analysis, D is a Phase E catalog of planning factors."
    refs: ["ADM §10.3.2", "CONTENT §3.6.9"]
    difficulty: 2
    tags: [migration-planning, phase-f]
  - id: F5-145
    unit: F5
    objective: "5.3"
    stem: "In the Phase F step 'Confirm Architecture Roadmap and Update Architecture Definition Document', which table shows the proposed state of the domain architectures across the Transition Architectures?"
    options:
      - {key: A, text: "Transition Architecture State Evolution Table", correct: true}
      - {key: B, text: "Consolidated Gaps, Solutions, and Dependencies matrix"}
      - {key: C, text: "Implementation Factor catalog"}
      - {key: D, text: "Business Interaction matrix"}
    explanation: "The State Evolution Table shows the proposed state of the architectures at various levels across the transitions. B and C are Phase E planning tools; D is a Business Architecture artifact used to find dependencies."
    refs: ["ADM §10.3.5", "CONTENT §3.6.9"]
    difficulty: 2
    tags: [migration-planning, phase-f]
  - id: F5-146
    unit: F5
    objective: "5.3"
    stem: "Which table aligns projects and their deliverables with the Transition Architectures, allowing a series of Transition Architectures to be planned with the status of the architecture at specified times?"
    options:
      - {key: A, text: "Architecture Definition Increments Table", correct: true}
      - {key: B, text: "Business Value and Risk Matrix"}
      - {key: C, text: "Gap analysis matrix"}
      - {key: D, text: "Stakeholder Map Matrix"}
    explanation: "The Architecture Definition Increments Table lists projects and assigns their incremental deliverables across the Transition Architectures. B assesses projects against value and risk, C compares baseline with target ABBs, D records stakeholder concerns."
    refs: ["ADM §10.3.5", "CONTENT §3.6.8"]
    difficulty: 3
    tags: [migration-planning, phase-f]
  - id: F5-147
    unit: F5
    objective: "5.3"
    stem: "When prioritising migration projects in Phase F, which statement reflects the ADM guidance?"
    options:
      - {key: A, text: "Projects are ranked purely by their immediate financial return"}
      - {key: B, text: "A project can earn a high priority if it provides a critical deliverable on the path to a large benefit, even if its own immediate benefit is small", correct: true}
      - {key: C, text: "Prioritisation is done by the Architecture Board without stakeholder input"}
      - {key: D, text: "Risk is ignored at this stage and handled in Phase G"}
    explanation: "The ADM notes that a project may rank high as a critical step towards a large benefit. A contradicts the value-against-cost-and-risk approach, C contradicts the need for stakeholder agreement on the prioritised list, D contradicts the formal review of residual risk in this step."
    refs: ["ADM §10.3.4"]
    difficulty: 2
    tags: [migration-planning, phase-f]
  # ---------------------------------------------------------------- 5.4 Business Scenarios, interoperability, readiness, risk
  - id: F5-148
    unit: F5
    objective: "5.4"
    stem: "Which of the following is NOT one of the five elements a Business Scenario uniformly describes?"
    options:
      - {key: A, text: "Real business problems"}
      - {key: B, text: "The human and computing actors that provide the capabilities"}
      - {key: C, text: "The desired outcomes of proper execution"}
      - {key: D, text: "The detailed software design of the solution", correct: true}
    explanation: "A Business Scenario describes the problems, the business and technology environment, value streams enabled by capabilities, the desired outcomes and the actors. Detailed software design is explicitly outside its scope — the guide says scenarios are not engineering specifications."
    refs: ["GUIDE:business-scenarios §1"]
    difficulty: 1
    tags: [business-scenarios]
  - id: F5-149
    unit: F5
    objective: "5.4"
    stem: "In the Business Scenarios guide, what do the letters of 'SMART' stand for?"
    options:
      - {key: A, text: "Specific, Measurable, Achievable, Relevant, Time-bound"}
      - {key: B, text: "Specific, Measurable, Actionable, Realistic, Time-bound", correct: true}
      - {key: C, text: "Simple, Manageable, Agreed, Repeatable, Traceable"}
      - {key: D, text: "Strategic, Measurable, Aligned, Resourced, Tested"}
    explanation: "The guide uses Specific, Measurable, Actionable, Realistic and Time-bound. A is the popular project-management expansion with 'Achievable' and 'Relevant', which the guide does not use; C and D are invented."
    refs: ["GUIDE:business-scenarios §1"]
    difficulty: 2
    tags: [business-scenarios, smart]
  - id: F5-150
    unit: F5
    objective: "5.4"
    stem: "According to the Business Scenarios guide, a Business Scenario is NOT:"
    options:
      - {key: A, text: "A description of the business and technology environment in which a problem occurs"}
      - {key: B, text: "A use-case, which is a more detailed description of human-to-computer interaction typically used in software projects", correct: true}
      - {key: C, text: "A technique applicable outside the IT industry"}
      - {key: D, text: "A statement at a specific time that should be updated when things change"}
    explanation: "The guide states that scenarios are not use-cases, business models, business cases, SPIN or engineering specifications. A, C and D are all things the guide says a scenario is or can be."
    refs: ["GUIDE:business-scenarios §1"]
    difficulty: 2
    tags: [business-scenarios]
  - id: F5-151
    unit: F5
    objective: "5.4"
    stem: "In which ADM phase do Business Scenarios figure most prominently?"
    options:
      - {key: A, text: "Phase A: Architecture Vision", correct: true}
      - {key: B, text: "Phase E: Opportunities and Solutions"}
      - {key: C, text: "Phase G: Implementation Governance"}
      - {key: D, text: "Phase H: Architecture Change Management"}
    explanation: "Scenarios are most prominent in Phase A, where they define business requirements and build consensus; they are also used in Phase B and can be used wherever requirements must be derived. E, G and H are not the phases the guide highlights."
    refs: ["GUIDE:business-scenarios §6"]
    difficulty: 1
    tags: [business-scenarios, phase-a]
  - id: F5-152
    unit: F5
    objective: "5.4"
    stem: "Which sequence of steps is repeated in each phase of developing a Business Scenario?"
    options:
      - {key: A, text: "Plan, gather, analyse, document, review", correct: true}
      - {key: B, text: "Identify, classify, approach, tailor"}
      - {key: C, text: "Classify, identify, assess, mitigate, monitor"}
      - {key: D, text: "Baseline, target, gap, roadmap"}
    explanation: "Each iteration runs plan, gather, analyse, document and review. B is the stakeholder management process, C the risk management process, D the shape of a domain phase."
    refs: ["GUIDE:business-scenarios §3.1"]
    difficulty: 2
    tags: [business-scenarios, steps]
  - id: F5-153
    unit: F5
    objective: "5.4"
    stem: "What are the three phases through which a Business Scenario is developed?"
    options:
      - {key: A, text: "Premise Formulation, Initial Verification, Refinement", correct: true}
      - {key: B, text: "Vision, Definition, Implementation"}
      - {key: C, text: "Discovery, Design, Delivery"}
      - {key: D, text: "Draft, Review, Approve"}
    explanation: "The steps repeat across Premise Formulation, Initial Verification and Refinement, ending in a scenario approved by business leaders. B, C and D are not the guide's phase names."
    refs: ["GUIDE:business-scenarios §3.3"]
    difficulty: 3
    tags: [business-scenarios, steps]
  - id: F5-154
    unit: F5
    objective: "5.4"
    stem: "Once approved by the leaders of the business, where is the Business Scenario document placed, and what role does it play?"
    options:
      - {key: A, text: "In the Requirements Repository, as the high-level requirements statement that drives and validates the architecture work", correct: true}
      - {key: B, text: "In the Standards Library, as a mandatory standard"}
      - {key: C, text: "In the Architecture Contract, as the acceptance criteria"}
      - {key: D, text: "In the Reference Library, as a reusable pattern"}
    explanation: "The approved scenario goes into the Requirements Repository and drives the downstream architecture work. It is not a standard, a contract or a pattern."
    refs: ["GUIDE:business-scenarios §3.3"]
    difficulty: 2
    tags: [business-scenarios]
  - id: F5-155
    unit: F5
    objective: "5.4"
    stem: "How do the relative contributions to a Business Scenario change over time?"
    options:
      - {key: A, text: "The architect contributes most at the start; business management contributes most at the end"}
      - {key: B, text: "Business management contributes most in the early stages while problems are explored; the architect contributes most later when solutions are described", correct: true}
      - {key: C, text: "Vendors contribute most in the early stages"}
      - {key: D, text: "Only the architect contributes; stakeholders review the result"}
    explanation: "Business management's involvement peaks early and the architect's later; vendors, if involved, contribute most when specific technical solutions are explored, which is later still. A reverses the order, C puts vendors first, D contradicts the guide's insistence that scenarios are not solely the architect's province."
    refs: ["GUIDE:business-scenarios §5"]
    difficulty: 2
    tags: [business-scenarios]
  - id: F5-156
    unit: F5
    objective: "5.4"
    stem: "How does the ADM Techniques document define interoperability?"
    options:
      - {key: A, text: "The ability to share information and services", correct: true}
      - {key: B, text: "The ability of an organisation to undergo change"}
      - {key: C, text: "The effect of uncertainty on the achievement of objectives"}
      - {key: D, text: "A re-usable solution to a recurring problem"}
    explanation: "Interoperability is the ability to share information and services. B is readiness for transformation, C the ISO 31000 definition of risk, D a pattern."
    refs: ["TECH §6.1"]
    difficulty: 1
    tags: [interoperability, definitions]
  - id: F5-157
    unit: F5
    objective: "5.4"
    stem: "Which three categories of interoperability does the standard say many organisations find useful?"
    options:
      - {key: A, text: "Operational or business, information, technical", correct: true}
      - {key: B, text: "Strategic, segment, capability"}
      - {key: C, text: "Presentation, security, network"}
      - {key: D, text: "Initial, residual, accepted"}
    explanation: "The categories are business (how processes are shared), information (how information is shared) and technical (how technical services are shared). B lists landscape levels, D risk levels, and C mixes one EAI-style integration type with items not in the list."
    refs: ["TECH §6.2"]
    difficulty: 1
    tags: [interoperability]
  - id: F5-158
    unit: F5
    objective: "5.4"
    stem: "By which phase, at the latest, does the standard say the corporate operating model that indicates the interoperability approach should be determined?"
    options:
      - {key: A, text: "The Preliminary Phase"}
      - {key: B, text: "Phase E: Opportunities and Solutions", correct: true}
      - {key: C, text: "Phase G: Implementation Governance"}
      - {key: D, text: "Phase H: Architecture Change Management"}
    explanation: "The operating model should be determined in Phase A, if not in Phase B, and definitely by Phase E. A is earlier than the standard's first mention; G and H are too late — solutions are already selected in E."
    refs: ["TECH §6.3"]
    difficulty: 3
    tags: [interoperability]
  - id: F5-159
    unit: F5
    objective: "5.4"
    stem: "In the example 'Degrees of Interoperability' scheme, what characterises Degree 3?"
    options:
      - {key: A, text: "Unstructured data exchange of human-interpretable free text"}
      - {key: B, text: "Structured data exchange requiring manual compilation or dispatch"}
      - {key: C, text: "Seamless sharing of data among systems based on a common exchange model", correct: true}
      - {key: D, text: "Seamless sharing of information through universal interpretation by co-operating applications"}
    explanation: "Degree 3 is seamless sharing of data on a common exchange model. A is Degree 1, B Degree 2, D Degree 4."
    refs: ["TECH §6.4"]
    difficulty: 3
    tags: [interoperability]
  - id: F5-160
    unit: F5
    objective: "5.4"
    stem: "In which phase should the Business Information Interoperability Matrix start, and how does it evolve?"
    options:
      - {key: A, text: "It starts in Phase B to capture information sharing between stakeholders and evolves in Phase C to show which systems share what information", correct: true}
      - {key: B, text: "It starts in Phase D and is finalised in Phase G"}
      - {key: C, text: "It starts in the Preliminary Phase and never changes"}
      - {key: D, text: "It starts in Phase F when interoperability is logically implemented"}
    explanation: "The matrix begins in the Business Architecture between stakeholders and is refined in the Information Systems Architecture between specific systems. B, C and D place it in the wrong phases."
    refs: ["TECH §6.5"]
    difficulty: 2
    tags: [interoperability]
  - id: F5-161
    unit: F5
    objective: "5.4"
    stem: "When reconciling interoperability requirements with re-used SBBs or COTS products, which issue does the standard identify as the most significant, and how must a resulting change be handled?"
    options:
      - {key: A, text: "Technical interoperability; changes are handled by the network team"}
      - {key: B, text: "Business interoperability, because packages embed their own business processes; any change to the requirements must be signed off in a revised Statement of Architecture Work", correct: true}
      - {key: C, text: "Presentation interoperability; changes are handled through the user interface standards"}
      - {key: D, text: "Information interoperability; changes are handled in the Data Architecture only"}
    explanation: "The standard singles out business interoperability, since re-worked embedded processes can cost more than re-use saves, and requires sign-off by the Business Architects and sponsors in a revised Statement of Architecture Work. The other options name lesser categories and invent handling routes."
    refs: ["TECH §6.6"]
    difficulty: 3
    tags: [interoperability]
  - id: F5-162
    unit: F5
    objective: "5.4"
    stem: "Phase E consolidates and reconciles interoperability requirements. Which two basic approaches does the ADM give for resolving an interoperability conflict between building blocks?"
    options:
      - {key: A, text: "Create a building block that transforms or translates between the conflicting ones, or change the specification of the conflicting building blocks", correct: true}
      - {key: B, text: "Cancel the project, or accept the conflict as a residual risk"}
      - {key: C, text: "Escalate to the Architecture Board, or raise a dispensation"}
      - {key: D, text: "Replace all COTS products, or build everything in-house"}
    explanation: "The two approaches are a translating building block or a changed specification. B, C and D are not the options the ADM gives; C confuses interoperability reconciliation with governance escalation."
    refs: ["ADM §9.3.5"]
    difficulty: 2
    tags: [interoperability, phase-e]
  - id: F5-163
    unit: F5
    objective: "5.4"
    stem: "What is the purpose of a Business Transformation Readiness Assessment?"
    options:
      - {key: A, text: "To evaluate and quantify an organisation's readiness to undergo change", correct: true}
      - {key: B, text: "To measure the technical maturity of the target technology platform"}
      - {key: C, text: "To rank stakeholders by power and interest"}
      - {key: D, text: "To validate the Target Architecture against the Baseline"}
    explanation: "The technique evaluates and quantifies readiness to undergo change, with emphasis on the human element. B misreads it as a technology assessment, C is stakeholder management, D is gap analysis."
    refs: ["TECH §7"]
    difficulty: 1
    tags: [readiness]
  - id: F5-164
    unit: F5
    objective: "5.4"
    stem: "Which of the following is the correct order of the recommended activities in a Business Transformation Readiness Assessment?"
    options:
      - {key: A, text: "Assess risks; determine factors; present factors; work actions into the plan; rate factors"}
      - {key: B, text: "Determine the readiness factors; present them using maturity models; assess and rate them; assess risks and identify actions; work the actions into the Phase E and F plan", correct: true}
      - {key: C, text: "Present maturity models; determine factors; work actions into the plan; rate factors; assess risks"}
      - {key: D, text: "Rate factors; assess risks; determine factors; present factors; work actions into the plan"}
    explanation: "The order is determine, present (maturity models), assess/rate, assess risks and actions, then feed the Implementation and Migration Plan. The other options scramble the sequence — you cannot present or rate factors before determining them."
    refs: ["TECH §7.1"]
    difficulty: 2
    tags: [readiness, steps]
  - id: F5-165
    unit: F5
    objective: "5.4"
    stem: "How does the standard recommend presenting the readiness factors so that the assessment workshop is focused and productive?"
    options:
      - {key: A, text: "As a power/interest grid"}
      - {key: B, text: "As maturity models, each with a standard worksheet template", correct: true}
      - {key: C, text: "As a gap analysis matrix"}
      - {key: D, text: "As a list of Solution Building Blocks"}
    explanation: "Each factor is converted into a maturity model with a worksheet, letting participants assess current, target and intermediate maturity. The grid is stakeholder management, the matrix is gap analysis, SBBs belong to Phase E."
    refs: ["TECH §7.3"]
    difficulty: 2
    tags: [readiness]
  - id: F5-166
    unit: F5
    objective: "5.4"
    stem: "The BTEP readiness rating scheme rates each readiness factor with respect to which three things?"
    options:
      - {key: A, text: "Urgency, Readiness Status, Degree of Difficulty to Fix", correct: true}
      - {key: B, text: "Effect, Frequency, Impact"}
      - {key: C, text: "Power, Interest, Commitment"}
      - {key: D, text: "Cost, Schedule, Scope"}
    explanation: "Factors are rated for urgency, readiness status (Low to High) and degree of difficulty to fix. B is the risk assessment scheme, C stakeholder dimensions, D the usual risk classification categories."
    refs: ["TECH §7.4.2"]
    difficulty: 2
    tags: [readiness]
  - id: F5-167
    unit: F5
    objective: "5.4"
    stem: "A readiness factor's status is rated 'Acceptable'. What does that mean in the BTEP scheme?"
    options:
      - {key: A, text: "No readiness issues exist"}
      - {key: B, text: "Some readiness issues exist but there are no showstoppers", correct: true}
      - {key: C, text: "Substantial work is needed before proceeding"}
      - {key: D, text: "Action is needed before the transformation can begin"}
    explanation: "Acceptable means issues exist but none are showstoppers. A is 'High', C is 'Low', and D describes a factor rated 'urgent' on the separate urgency dimension."
    refs: ["TECH §7.4.2"]
    difficulty: 3
    tags: [readiness]
  - id: F5-168
    unit: F5
    objective: "5.4"
    stem: "Which of the following is one of the example readiness factors drawn from the BTEP?"
    options:
      - {key: A, text: "IT Capacity to Execute", correct: true}
      - {key: B, text: "Degree of Interoperability"}
      - {key: C, text: "Residual Risk"}
      - {key: D, text: "Architecture Continuum Position"}
    explanation: "IT Capacity to Execute is a BTEP factor, alongside Vision, Need, Funding, Sponsorship and Leadership, Governance and others. B is an interoperability measure, C a risk-management outcome, D not a readiness factor."
    refs: ["TECH §7.2"]
    difficulty: 2
    tags: [readiness]
  - id: F5-169
    unit: F5
    objective: "5.4"
    stem: "In which ADM phase is the Business Transformation Readiness Assessment carried out as a named step, and where are its results recorded?"
    options:
      - {key: A, text: "Phase A; the results are added to the Capability Assessment", correct: true}
      - {key: B, text: "Phase F; the results are added to the Implementation Governance Model"}
      - {key: C, text: "Phase B; the results are added to the Business Footprint diagram"}
      - {key: D, text: "Phase H; the results are added to the Change Request log"}
    explanation: "Phase A includes 'Assess Readiness for Business Transformation' and the results go into the Capability Assessment, shaping scope and identifying risk areas. The results are later reviewed in Phase E and monitored in Phase G, but the step itself is in Phase A."
    refs: ["ADM §3.3.5"]
    difficulty: 2
    tags: [readiness, phase-a]
  - id: F5-170
    unit: F5
    objective: "5.4"
    stem: "In which phase are the readiness factors, as part of the overall Implementation and Migration Plan, continuously monitored with corrective action through the IT governance framework?"
    options:
      - {key: A, text: "Phase A"}
      - {key: B, text: "Phase E"}
      - {key: C, text: "Phase G", correct: true}
      - {key: D, text: "The Preliminary Phase"}
    explanation: "Monitoring of the readiness factors happens in Phase G. Phase A is where the assessment is made, Phase E where it is reviewed for its impact on the roadmap, and the Preliminary Phase establishes the capability."
    refs: ["TECH §7.5"]
    difficulty: 2
    tags: [readiness, phase-g]
  - id: F5-171
    unit: F5
    objective: "5.4"
    stem: "What does the ADM Techniques document call the risk categorisation made before mitigating actions are determined and implemented?"
    options:
      - {key: A, text: "Residual Level of Risk"}
      - {key: B, text: "Initial Level of Risk", correct: true}
      - {key: C, text: "Accepted Risk"}
      - {key: D, text: "Corporate Risk"}
    explanation: "Initial risk is before mitigation; residual risk is after mitigating actions have been implemented. 'Accepted' describes what governance does with residual risk, and 'corporate risk' is the observation that EA risks are corporate risks, not a level."
    refs: ["TECH §8.1"]
    difficulty: 1
    tags: [risk]
  - id: F5-172
    unit: F5
    objective: "5.4"
    stem: "What is the correct sequence of activities in the risk management process described in the ADM Techniques document?"
    options:
      - {key: A, text: "Risk identification; risk classification; risk monitoring; initial risk assessment; risk mitigation"}
      - {key: B, text: "Risk classification; risk identification; initial risk assessment; risk mitigation and residual risk assessment; risk monitoring", correct: true}
      - {key: C, text: "Risk monitoring; risk mitigation; initial risk assessment; risk identification; risk classification"}
      - {key: D, text: "Initial risk assessment; risk classification; risk identification; risk monitoring; risk mitigation"}
    explanation: "The process is classification, identification, initial assessment, mitigation and residual assessment, monitoring. The other options move monitoring or assessment ahead of identification."
    refs: ["TECH §8.1"]
    difficulty: 2
    tags: [risk, steps]
  - id: F5-173
    unit: F5
    objective: "5.4"
    stem: "In the initial risk assessment, which two measures are combined to produce a preliminary assessment of a risk's impact?"
    options:
      - {key: A, text: "Effect and frequency", correct: true}
      - {key: B, text: "Power and interest"}
      - {key: C, text: "Urgency and difficulty to fix"}
      - {key: D, text: "Cost and schedule"}
    explanation: "Effect (catastrophic to negligible) and frequency (frequent to unlikely) combine into an impact of extremely high, high, moderate or low. B is the stakeholder grid, C the readiness rating, D two of the usual risk classification categories."
    refs: ["TECH §8.4"]
    difficulty: 1
    tags: [risk]
  - id: F5-174
    unit: F5
    objective: "5.4"
    stem: "On the example effect scale, a risk that infers serious financial loss in more than one line of business with no return on the IT investment is classified as:"
    options:
      - {key: A, text: "Catastrophic"}
      - {key: B, text: "Critical", correct: true}
      - {key: C, text: "Marginal"}
      - {key: D, text: "Negligible"}
    explanation: "Critical is serious loss across more than one line of business and no ROI. Catastrophic implies possible bankruptcy, marginal a minor loss in one line of business with reduced ROI, negligible a minimal impact on service delivery."
    refs: ["TECH §8.4"]
    difficulty: 3
    tags: [risk]
  - id: F5-175
    unit: F5
    objective: "5.4"
    stem: "After mitigation, a risk moves from 'frequent / catastrophic' to 'frequent / critical'. According to the standard, what should happen?"
    options:
      - {key: A, text: "The risk is closed because it has been reduced"}
      - {key: B, text: "The mitigation effort must be reconsidered, because the residual risk is still extremely high", correct: true}
      - {key: C, text: "The risk is transferred to the Architecture Board"}
      - {key: D, text: "The frequency rating is changed to 'seldom' to reflect the mitigation"}
    explanation: "Mitigation must reduce corporate impact, not just move the risk to an equally high cell; frequent/critical is still extremely high, so the mitigation is reconsidered. A closes it prematurely, C is not the process, D would falsify the assessment."
    refs: ["TECH §8.6"]
    difficulty: 2
    tags: [risk]
  - id: F5-176
    unit: F5
    objective: "5.4"
    stem: "In which phase are the risk identification and mitigation assessment worksheets maintained as governance artifacts and risk monitoring conducted?"
    options:
      - {key: A, text: "Phase A"}
      - {key: B, text: "Phase E"}
      - {key: C, text: "Phase G", correct: true}
      - {key: D, text: "The Preliminary Phase"}
    explanation: "Risk monitoring is a Phase G activity; the worksheets are kept up to date there, and unmitigated critical risks may trigger another ADM cycle. Phase A identifies risks and Phase E confirms them, but neither is where ongoing monitoring sits."
    refs: ["TECH §8.7"]
    difficulty: 2
    tags: [risk, phase-g]
  - id: F5-177
    unit: F5
    objective: "5.4"
    stem: "Which statement about the governance of risk in the ADM Techniques document is correct?"
    options:
      - {key: A, text: "The Enterprise Architect accepts all risks on behalf of the enterprise"}
      - {key: B, text: "Risks must first be accepted and then managed within the governance framework; residual risks need approval through IT governance and, where business acceptance is required, corporate governance", correct: true}
      - {key: C, text: "Risks are only reviewed at the end of Phase H"}
      - {key: D, text: "Once mitigated, risks no longer need to be tracked"}
    explanation: "The architect may identify and mitigate risks, but acceptance and management happen within the governance framework, and residual risks are approved through IT and, if needed, corporate governance. A overstates the architect's role; C and D contradict continuous monitoring in Phase G."
    refs: ["TECH §8.1", "TECH §8.7"]
    difficulty: 2
    tags: [risk, governance]
  # ---------------------------------------------------------------- 5.5 Capability-based planning and architecture patterns
  - id: F5-178
    unit: F5
    objective: "5.5"
    stem: "How does the TOGAF Standard describe the relationship between patterns and building blocks?"
    options:
      - {key: A, text: "A pattern is a type of Solution Building Block"}
      - {key: B, text: "Building blocks are what you use; patterns tell you how, when and why to use them and what trade-offs are involved", correct: true}
      - {key: C, text: "Patterns replace building blocks in the Architecture Continuum"}
      - {key: D, text: "Building blocks are derived automatically from patterns"}
    explanation: "Patterns put building blocks into context, describing how, when and why to use them and the trade-offs. A confuses pattern with building block; C and D invent relationships the standard does not state."
    refs: ["TECH §4.1.1"]
    difficulty: 1
    tags: [patterns]
  - id: F5-179
    unit: F5
    objective: "5.5"
    stem: "Which of the following is NOT one of the elements the standard says will be found in most pattern descriptions?"
    options:
      - {key: A, text: "Forces"}
      - {key: B, text: "Resulting Context"}
      - {key: C, text: "Owner", correct: true}
      - {key: D, text: "Known Uses"}
    explanation: "The listed elements are name, problem, context, forces, solution, resulting context, examples, rationale, related patterns and known uses. 'Owner' is not among them."
    refs: ["TECH §4.1.2"]
    difficulty: 2
    tags: [patterns]
  - id: F5-180
    unit: F5
    objective: "5.5"
    stem: "In a pattern description, which element records the post-conditions after the pattern is applied, including which forces have been resolved and which remain?"
    options:
      - {key: A, text: "Context"}
      - {key: B, text: "Resulting Context", correct: true}
      - {key: C, text: "Rationale"}
      - {key: D, text: "Problem"}
    explanation: "Resulting context describes the state after application and the trade-offs made. Context is the preconditions before application, rationale explains why the pattern works, problem states the intent."
    refs: ["TECH §4.1.2"]
    difficulty: 2
    tags: [patterns]
  - id: F5-181
    unit: F5
    objective: "5.5"
    stem: "The 'Forces' element of a pattern is said to equate in many ways to which of the following?"
    options:
      - {key: A, text: "The qualities architects seek to optimise and the concerns they seek to address, such as security, performance and scalability", correct: true}
      - {key: B, text: "The budget constraints of the project"}
      - {key: C, text: "The stakeholders on the power/interest grid"}
      - {key: D, text: "The ADM phases in which the pattern is used"}
    explanation: "Forces are the constraints and quality attributes in tension — security, manageability, performance, scalability, maintainability and so on. B, C and D are not what the standard equates forces with."
    refs: ["TECH §4.1.2"]
    difficulty: 2
    tags: [patterns]
  - id: F5-182
    unit: F5
    objective: "5.5"
    stem: "According to the terminology discussed in the ADM Techniques document, which kind of pattern is a low-level pattern specific to a programming language?"
    options:
      - {key: A, text: "Architecture pattern"}
      - {key: B, text: "Design pattern"}
      - {key: C, text: "Idiom", correct: true}
      - {key: D, text: "Business pattern"}
    explanation: "An idiom is language-specific. An architecture pattern gives a structural organisation of subsystems, a design pattern refines subsystems or components. 'Business pattern' is not one of the three types defined."
    refs: ["TECH §4.1.3"]
    difficulty: 3
    tags: [patterns, definitions]
  - id: F5-183
    unit: F5
    objective: "5.5"
    stem: "In which ADM phases does the standard say relevant re-usable assets from the Architecture Continuum, such as architecture patterns, should be considered for use?"
    options:
      - {key: A, text: "Phases A through D", correct: true}
      - {key: B, text: "Phases E and F only"}
      - {key: C, text: "Phase G only"}
      - {key: D, text: "The Preliminary Phase only"}
    explanation: "Each of the first four main phases, A to D, indicates when re-usable assets such as patterns should be considered. E and F plan delivery, G governs implementation, and the Preliminary Phase sets up the capability."
    refs: ["TECH §4.1.3"]
    difficulty: 2
    tags: [patterns]
  - id: F5-184
    unit: F5
    objective: "5.5"
    stem: "Why does the ADM Techniques document recommend identifying alternative Target Architectures and their trade-offs?"
    options:
      - {key: A, text: "Because the Architecture Board requires at least three options for every decision"}
      - {key: B, text: "Because more than one Target Architecture may conform to the vision, principles and requirements, and presenting alternatives helps draw out hidden agendas, principles and requirements", correct: true}
      - {key: C, text: "Because the ADM mandates a separate cycle for each alternative"}
      - {key: D, text: "Because alternatives replace the need for gap analysis"}
    explanation: "Several targets may satisfy the vision, principles and requirements, and discussing alternatives with stakeholders surfaces hidden concerns. A, C and D invent rules; the technique in fact uses gap analysis for each alternative."
    refs: ["TECH §9.1"]
    difficulty: 2
    tags: [alternatives]
  - id: F5-185
    unit: F5
    objective: "5.5"
    stem: "In the Architecture Alternatives and Trade-Offs method, how are alternatives commonly defined, and why?"
    options:
      - {key: A, text: "Per domain, to simplify the analysis, and then merged into an overall analysis", correct: true}
      - {key: B, text: "Per stakeholder, so each stakeholder receives their own architecture"}
      - {key: C, text: "Per project, so that each work package can be tendered separately"}
      - {key: D, text: "Per Transition Architecture, so that alternatives never overlap in time"}
    explanation: "Alternatives are commonly defined per architecture domain to keep the analysis simple, then merged. B, C and D are not what the standard says."
    refs: ["TECH §9.2"]
    difficulty: 3
    tags: [alternatives]
  - id: F5-186
    unit: F5
    objective: "5.5"
    stem: "What are the three parts of the architecture trade-off method?"
    options:
      - {key: A, text: "Select criteria; define alternatives and understand each; choose one alternative or combine features into the proposed alternative", correct: true}
      - {key: B, text: "Identify stakeholders; classify them; tailor deliverables"}
      - {key: C, text: "Determine factors; present factors; rate factors"}
      - {key: D, text: "Baseline first; target first; refine"}
    explanation: "The method selects criteria, defines alternatives, then selects or combines. B is stakeholder management, C readiness assessment, D iteration approaches."
    refs: ["TECH §9.2"]
    difficulty: 2
    tags: [alternatives, steps]
  - id: F5-187
    unit: F5
    objective: "5.5"
    stem: "How does the Business Capability Planning guide define a business capability?"
    options:
      - {key: A, text: "An ability that an organisation possesses, typically expressed in general, high-level terms, requiring a combination of people, processes and tools", correct: true}
      - {key: B, text: "A sequence of value-adding activities that produces a result for a customer"}
      - {key: C, text: "A software component that implements a business service"}
      - {key: D, text: "A time-boxed unit of agile work"}
    explanation: "A capability is an ability the organisation possesses, needing people, processes and tools. B is a value stream, C an application component, D a sprint."
    refs: ["GUIDE:business-capability-planning §6"]
    difficulty: 1
    tags: [capability-planning, definitions]
  - id: F5-188
    unit: F5
    objective: "5.5"
    stem: "A business capability description deliberately states:"
    options:
      - {key: A, text: "What the business does, without explaining how, why or where it is used", correct: true}
      - {key: B, text: "Exactly how the capability is implemented in applications"}
      - {key: C, text: "Which organisational unit owns it and its annual budget"}
      - {key: D, text: "The order in which its activities are performed"}
    explanation: "A capability delineates what, not how, why or where — those details surface when it is mapped to value streams and modelled as an instance. B and C describe instance detail, D describes a process."
    refs: ["GUIDE:business-capability-planning §6"]
    difficulty: 2
    tags: [capability-planning]
  - id: F5-189
    unit: F5
    objective: "5.5"
    stem: "Which approach to building a starter business capability catalog begins by identifying the 20 to 30 highest-level capabilities with senior business leaders?"
    options:
      - {key: A, text: "Bottom-up"}
      - {key: B, text: "Top-down", correct: true}
      - {key: C, text: "Incremental"}
      - {key: D, text: "Federated"}
    explanation: "Top-down starts with the 20–30 top-level capabilities and needs senior involvement. Bottom-up builds from parts of the business, incremental evolves the catalog as it is applied, and federated is not one of the three approaches."
    refs: ["GUIDE:business-capability-planning §6.2"]
    difficulty: 2
    tags: [capability-planning]
  - id: F5-190
    unit: F5
    objective: "5.5"
    stem: "The Business Capability Planning guide warns that when a capability catalog exceeds roughly how many items, it is probably describing capability instances, components or value stream stages rather than capabilities?"
    options:
      - {key: A, text: "20"}
      - {key: B, text: "50"}
      - {key: C, text: "100", correct: true}
      - {key: D, text: "500"}
    explanation: "The guide says that above about 100 items there is a high probability the entries are instances, components or stages. 20–30 is the number of top-level capabilities in a top-down start; 50 and 500 are not figures the guide gives."
    refs: ["GUIDE:business-capability-planning §6.2"]
    difficulty: 3
    tags: [capability-planning]
  - id: F5-191
    unit: F5
    objective: "5.5"
    stem: "According to the guide, from whose perspective is value in a value stream always defined?"
    options:
      - {key: A, text: "The stakeholder receiving the product, service or deliverable", correct: true}
      - {key: B, text: "The finance department, as the cost to produce"}
      - {key: C, text: "The Enterprise Architect"}
      - {key: D, text: "The IT operations team"}
    explanation: "Value is in the eye of the beholder — the customer, end user or recipient — and depends on their perception rather than the intrinsic cost to produce. B is explicitly what the guide contrasts it with; C and D are producers, not recipients."
    refs: ["GUIDE:business-capability-planning §5.1"]
    difficulty: 2
    tags: [capability-planning, value-streams]
  - id: F5-192
    unit: F5
    objective: "5.5"
    stem: "What is the purpose of mapping business capabilities to value stream stages?"
    options:
      - {key: A, text: "To identify which capabilities are critical to delivering stakeholder value and therefore must be instantiated to a sufficient standard", correct: true}
      - {key: B, text: "To assign each capability to a single application"}
      - {key: C, text: "To replace the business capability catalog"}
      - {key: D, text: "To calculate the cost of each capability"}
    explanation: "Cross-mapping shows which capabilities out of the total set are critical to value and must be instantiated well. B confuses mapping with instance modelling of applications, C is wrong because the catalog remains, D is not the stated purpose."
    refs: ["GUIDE:business-capability-planning §6.3"]
    difficulty: 2
    tags: [capability-planning, value-streams]
  - id: F5-193
    unit: F5
    objective: "5.5"
    stem: "Which four planning scenarios does the Business Capability Planning guide describe for business capability instances?"
    options:
      - {key: A, text: "Optimise, Consolidate, Create, Retire", correct: true}
      - {key: B, text: "Mainstream, Contain, Replace, Remove"}
      - {key: C, text: "Buy, Build, Re-use, Outsource"}
      - {key: D, text: "Plan, Do, Check, Act"}
    explanation: "The scenarios are optimise (most common), consolidate, create and retire (rare). B is the ADM classification of current systems with an extra item, C is a sourcing decision, D is a quality cycle."
    refs: ["GUIDE:business-capability-planning §7.1"]
    difficulty: 2
    tags: [capability-planning]
  - id: F5-194
    unit: F5
    objective: "5.5"
    stem: "In business capability planning, what is a 'plateau'?"
    options:
      - {key: A, text: "The point at which a capability catalog stops growing"}
      - {key: B, text: "One or more gaps addressed together such that the collection of enhancements preserves a functional value stream", correct: true}
      - {key: C, text: "The maximum maturity a capability instance can reach"}
      - {key: D, text: "A stakeholder on the power grid with stable interest"}
    explanation: "A plateau is a stepwise state in which the gaps addressed together keep the value stream functional — the guide's term for what the ADM calls a Transition Architecture increment. A, C and D are not the guide's meaning."
    refs: ["GUIDE:business-capability-planning §7.2"]
    difficulty: 3
    tags: [capability-planning]
  - id: F5-195
    unit: F5
    objective: "5.5"
    stem: "Why does the guide model the capabilities used in a value stream as capability 'instances'?"
    options:
      - {key: A, text: "To capture capabilities used in different areas of the organisation without creating conflicts or duplicates in the capability catalog, and to link the TOGAF domains through the value stream", correct: true}
      - {key: B, text: "Because each instance must be a separate software installation"}
      - {key: C, text: "To remove the need for a capability catalog"}
      - {key: D, text: "Because instances are the only element the ArchiMate language supports"}
    explanation: "Instances let the same capability appear in several value streams without duplicating catalog entries, and for the architect they connect the domains with the value stream as business context. B, C and D are not the guide's reasons."
    refs: ["GUIDE:business-capability-planning §6.4"]
    difficulty: 3
    tags: [capability-planning]
