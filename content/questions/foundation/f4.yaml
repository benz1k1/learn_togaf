    explanation: "The approach states the scope is primarily determined by the Architecture Vision. A is Phases E and F, B is Phase G, D is Phase D."
    refs: ["ADM §4.5.1"]
    difficulty: 2
    tags: [phase-b, approach]
  - id: F4-175
    unit: F4
    objective: "4.4"
    stem: "How does the standard describe Business Architecture in the Phase B approach?"
    options:
      - {key: A, text: "The taxonomy of technology services and logical technology components"}
      - {key: B, text: "Holistic, multi-dimensional business views of capabilities, end-to-end value delivery, information and organizational structure, and their relationships", correct: true}
      - {key: C, text: "The inventory of applications and their interfaces"}
      - {key: D, text: "Data at rest, in motion and in use"}
    explanation: "B is the approach's definition. A is Phase D vocabulary, C is the Application Architecture portfolio, D is the Data Architecture structure."
    refs: ["ADM §4.5"]
    difficulty: 2
    tags: [phase-b, approach]
  - id: F4-176
    unit: F4
    objective: "4.4"
    stem: "In Phase B, what is heat mapping used to show?"
    options:
      - {key: A, text: "Network latency between technology components"}
      - {key: B, text: "The risk of each migration project"}
      - {key: C, text: "A range of perspectives, such as maturity, effectiveness, performance and value or cost, on the same set of business capabilities", correct: true}
      - {key: D, text: "Data migration volumes between applications"}
    explanation: "Heat mapping colours capabilities by attributes such as maturity or cost. A is a Phase D concern, B is Phase F, D is a Phase C data migration concern."
    refs: ["ADM §4.5.3"]
    difficulty: 2
    tags: [phase-b, approach]
  - id: F4-177
    unit: F4
    objective: "4.4"
    stem: "How does an organization map differ from an organizational chart?"
    options:
      - {key: A, text: "It depicts the working relationships between organizational units, partners and stakeholder groups, not only hierarchical reporting", correct: true}
      - {key: B, text: "It lists the applications each unit uses"}
      - {key: C, text: "There is no difference"}
      - {key: D, text: "It is a Phase D artifact showing technology locations"}
    explanation: "The approach contrasts the map's web of relationships with a chart's reporting lines. B confuses it with an application/organization matrix, D with the Environments and Locations diagram."
    refs: ["ADM §4.5.5"]
    difficulty: 2
    tags: [phase-b, approach]
  - id: F4-178
    unit: F4
    objective: "4.4"
    stem: "According to the Phase B approach, what do value streams provide in relation to business capabilities?"
    options:
      - {key: A, text: "Value streams replace business capabilities in the Target Business Architecture"}
      - {key: B, text: "Value streams give the context of why capabilities are needed; capabilities give what the organization needs for a value stage to succeed", correct: true}
      - {key: C, text: "Value streams are the technology services that realize capabilities"}
      - {key: D, text: "Value streams are the work packages in which capabilities are delivered"}
    explanation: "The approach pairs the why (value streams) with the what (capabilities). A, C and D misplace value streams as replacements, technology or Phase E work packages."
    refs: ["ADM §4.5.4"]
    difficulty: 2
    tags: [phase-b, approach]
  - id: F4-179
    unit: F4
    objective: "4.4"
    stem: "Phase C consists of what?"
    options:
      - {key: A, text: "Data Architecture followed strictly by Application Architecture"}
      - {key: B, text: "Application Architecture followed strictly by Data Architecture"}
      - {key: C, text: "Data, Application and Technology Architecture"}
      - {key: D, text: "Some combination of Data and Application Architecture, in either order", correct: true}
    explanation: "The approach says either order is valid and advocates exist for both. A and B impose an order the standard does not, C adds Technology, which is Phase D."
    refs: ["ADM §5.2"]
    difficulty: 1
    tags: [phase-c, approach]
  - id: F4-180
    unit: F4
    objective: "4.4"
    stem: "Which of the following is an objective of Phase C?"
    options:
      - {key: A, text: "Develop the Target Information Systems Architectures, describing how they will enable the Business Architecture and the Architecture Vision", correct: true}
      - {key: B, text: "Develop the Target Business Architecture"}
      - {key: C, text: "Define the overall Solution Building Blocks"}
      - {key: D, text: "Ensure conformance with the Target Architecture by implementation projects"}
    explanation: "A is Phase C's first objective. B is Phase B, C is Phase E's third objective, D is Phase G."
    refs: ["ADM §5.1"]
    difficulty: 1
    tags: [phase-c, objectives]
  - id: F4-181
    unit: F4
    objective: "4.4"
    stem: "According to the Data Architecture approach, a Data Architecture should be able to handle which types of data?"
    options:
      - {key: A, text: "Public, private and confidential data"}
      - {key: B, text: "Baseline, target and transition data"}
      - {key: C, text: "Data at rest, data in motion, data in use and open data", correct: true}
      - {key: D, text: "Conceptual, logical and physical data"}
    explanation: "The data structure section names the four. A is a classification scheme the standard does not use here, B applies architecture states to data, D confuses the types with the three metamodel entities."
    refs: ["ADM §6.5.1"]
    difficulty: 2
    tags: [phase-c, approach]
  - id: F4-182
    unit: F4
    objective: "4.4"
    stem: "Which three metamodel entities are used to create a Data Architecture?"
    options:
      - {key: A, text: "Data entity, logical data component and physical data component", correct: true}
      - {key: B, text: "Business service, business function and business process"}
      - {key: C, text: "Application component, interface and application service"}
      - {key: D, text: "Technology service, logical technology component and physical technology component"}
    explanation: "The data structure section names the three data entities. B is Business Architecture vocabulary, C Application, D the Technology Architecture catalog decomposition."
    refs: ["ADM §6.5.1"]
    difficulty: 2
    tags: [phase-c, approach]
  - id: F4-183
    unit: F4
    objective: "4.4"
    stem: "Which three dimensions does the Data Architecture approach list under data governance?"
    options:
      - {key: A, text: "Confidentiality, integrity and availability"}
      - {key: B, text: "Structure, management system and people", correct: true}
      - {key: C, text: "Baseline, target and transition"}
      - {key: D, text: "Strategy, segment and capability"}
    explanation: "Data governance considers structure, management system and people. A is a security triad, C are architecture states, D are Landscape levels."
    refs: ["ADM §6.5.2"]
    difficulty: 2
    tags: [phase-c, approach]
  - id: F4-184
    unit: F4
    objective: "4.4"
    stem: "Which of the following is an objective of Phase D?"
    options:
      - {key: A, text: "Define the overall Solution Building Blocks to finalize the Target Architecture"}
      - {key: B, text: "Develop the Target Application Architecture"}
      - {key: C, text: "Develop the Target Technology Architecture that enables the Architecture Vision and the target business, data and application building blocks to be delivered through technology components and technology services", correct: true}
      - {key: D, text: "Establish the Architecture Capability"}
    explanation: "C is Phase D's first objective. A is Phase E, B is Phase C, D is the Preliminary Phase."
    refs: ["ADM §8.1"]
    difficulty: 1
    tags: [phase-d, objectives]
  - id: F4-185
    unit: F4
    objective: "4.4"
    stem: "What does the Phase D approach say about technology change and the ADM?"
    options:
      - {key: A, text: "Technology change is handled only through Phase H Change Requests"}
      - {key: B, text: "Technology change is outside the scope of Enterprise Architecture"}
      - {key: C, text: "Technology must always follow business requirements and never drive them"}
      - {key: D, text: "The ADM's flexibility lets technology change be a driver and strategic resource rather than only a recipient of Change Requests", correct: true}
    explanation: "The emerging technologies section says the Technology Architecture may both drive business capabilities and respond to information system requirements. A, B and C each deny that."
    refs: ["ADM §8.5.1"]
    difficulty: 2
    tags: [phase-d, approach]
  - id: F4-186
    unit: F4
    objective: "4.4"
    stem: "Which statement describes the application-driven approach to Phase C?"
    options:
      - {key: A, text: "Key applications such as ERP or CRM are treated as the core underpinning of mission-critical processes, and their implementation and integration is the primary focus", correct: true}
      - {key: B, text: "Data models are developed first, following Enterprise Architecture Planning"}
      - {key: C, text: "Technology platforms are selected before any applications"}
      - {key: D, text: "Data Architecture is omitted entirely"}
    explanation: "A paraphrases the approach. B describes the data-driven approach, C would put Phase D first, D contradicts Phase C's scope."
    refs: ["ADM §5.2"]
    difficulty: 2
    tags: [phase-c, approach]
  - id: F4-187
    unit: F4
    objective: "4.4"
    stem: "Which reference model does the Application Architecture approach name as focusing on the application-level components and services for an integrated information infrastructure?"
    options:
      - {key: A, text: "The Technical Reference Model (TRM)"}
      - {key: B, text: "The Integrated Information Infrastructure Reference Model (III-RM)", correct: true}
      - {key: C, text: "The Zachman Framework"}
      - {key: D, text: "The Enterprise Metamodel"}
    explanation: "The III-RM is named in the Application Architecture repository section. The TRM is referenced in Phase D, Zachman is cited as an example of requirement primitives in Phase B, the Enterprise Metamodel belongs to the Content document."
    refs: ["ADM §7.5.1"]
    difficulty: 2
    tags: [phase-c, approach]
  # ------------------------------------------------------------ 4.5 Phases E, F
  - id: F4-188
    unit: F4
    objective: "4.5"
    stem: "Which of the following is an objective of Phase E?"
    options:
      - {key: A, text: "Finalize the Architecture Roadmap"}
      - {key: B, text: "Ensure that the business value and cost of work packages is understood by key stakeholders"}
      - {key: C, text: "Determine whether an incremental approach is required and, if so, identify Transition Architectures that deliver continuous business value", correct: true}
      - {key: D, text: "Perform Architecture Governance functions for the solution"}
    explanation: "C is Phase E's second objective. A and B are Phase F objectives, D is Phase G."
    refs: ["ADM §9.1"]
    difficulty: 1
    tags: [phase-e, objectives]
  - id: F4-189
    unit: F4
    objective: "4.5"
    stem: "What is the third objective of Phase E?"
    options:
      - {key: A, text: "Define the Architecture Building Blocks for each domain"}
      - {key: B, text: "Define the overall Solution Building Blocks to finalize the Target Architecture based on the ABBs", correct: true}
      - {key: C, text: "Sign the Architecture Contract"}
      - {key: D, text: "Prioritize the migration projects"}
    explanation: "Defining the SBBs is the objective most often forgotten. A is done in Phases B to D, C is Phase G, D is a Phase F step."
    refs: ["ADM §9.1"]
    difficulty: 2
    tags: [phase-e, objectives]
  - id: F4-190
    unit: F4
    objective: "4.5"
    stem: "According to its approach, Phase E concentrates on what?"
    options:
      - {key: A, text: "How to deliver the architecture", correct: true}
      - {key: B, text: "What the Target Architecture should be"}
      - {key: C, text: "Whether the implementation conforms to the architecture"}
      - {key: D, text: "Maintaining the architecture development cycle"}
    explanation: "The approach opens by saying Phase E concentrates on how to deliver the architecture. B is Phases B to D, C is Phase G, D is Phase H."
    refs: ["ADM §9.5"]
    difficulty: 1
    tags: [phase-e, approach]
  - id: F4-191
    unit: F4
    objective: "4.5"
    stem: "Which four concepts does the standard call key to transitioning from developing to delivering a Target Architecture?"
    options:
      - {key: A, text: "Catalogs, matrices, diagrams and views"}
      - {key: B, text: "Architecture Roadmap, work packages, Transition Architectures and the Implementation and Migration Plan", correct: true}
      - {key: C, text: "Request for Architecture Work, Statement of Architecture Work, Architecture Vision and Architecture Contract"}
      - {key: D, text: "Baseline Architecture, Target Architecture, gap analysis and building blocks"}
    explanation: "The Phase E approach lists exactly those four. A are artifact kinds, C are governance deliverables from A and G, D are development-phase concepts."
    refs: ["ADM §9.5"]
    difficulty: 1
    tags: [phase-e, approach]
  - id: F4-192
    unit: F4
    objective: "4.5"
    stem: "How does the standard define a Transition Architecture?"
    options:
      - {key: A, text: "The final Target Architecture agreed with the sponsor"}
      - {key: B, text: "A logical group of changes necessary to realize the Target Architecture"}
      - {key: C, text: "A description of the enterprise at an architecturally significant state between the Baseline and Target Architectures", correct: true}
      - {key: D, text: "A schedule of the projects that will realize the Target Architecture"}
    explanation: "C is the definition. B defines a work package, D defines the Implementation and Migration Plan, A is simply the Target."
    refs: ["ADM §9.5"]
    difficulty: 1
    tags: [phase-e, approach]
  - id: F4-193
    unit: F4
    objective: "4.5"
    stem: "Which phase is the initial step in creating the Implementation and Migration Plan, and which phase completes it?"
    options:
      - {key: A, text: "Phase D initial, Phase E completes"}
      - {key: B, text: "Phase E initial, Phase G completes"}
      - {key: C, text: "Phase F initial, Phase G completes"}
      - {key: D, text: "Phase E initial, Phase F completes", correct: true}
    explanation: "The approach says Phase E is the initial step and Phase F completes the plan. A starts too early, B and C run into Phase G, which governs implementation rather than plans it."
    refs: ["ADM §9.5"]
    difficulty: 1
    tags: [phase-e, approach]
  - id: F4-194
    unit: F4
    objective: "4.5"
    stem: "When formulating the Implementation and Migration Strategy in Phase E, which three basic strategic approaches does the standard list?"
    options:
      - {key: A, text: "Greenfield, revolutionary and evolutionary", correct: true}
      - {key: B, text: "Quick win, achievable targets and value chain"}
      - {key: C, text: "Simplification, incremental and re-architecting"}
      - {key: D, text: "Mainstream, contain and replace"}
    explanation: "The three approaches are greenfield, revolutionary and evolutionary. B are the implementation methodologies named in the same step, C are Phase H change categories, D are the Phase E system classifications."
    refs: ["ADM §9.3.8"]
    difficulty: 2
    tags: [phase-e, steps]
  - id: F4-195
    unit: F4
    objective: "4.5"
    stem: "When grouping work packages in Phase E, every current system under consideration is classified as one of which three?"
    options:
      - {key: A, text: "Greenfield, revolutionary or evolutionary"}
      - {key: B, text: "Mainstream, contain or replace", correct: true}
      - {key: C, text: "Simplification, incremental or re-architecting"}
      - {key: D, text: "Baseline, transition or target"}
    explanation: "Mainstream (part of the future), contain (to be replaced or modified in the horizon) and replace. A are strategy approaches, C are Phase H change types, D are architecture states."
    refs: ["ADM §9.3.9"]
    difficulty: 2
    tags: [phase-e, steps]
  - id: F4-196
    unit: F4
    objective: "4.5"
    stem: "Which of the following is an objective of Phase F?"
    options:
      - {key: A, text: "Generate the initial complete version of the Architecture Roadmap"}
      - {key: B, text: "Ensure that the Implementation and Migration Plan is co-ordinated with the enterprise's approach to managing and implementing change in its overall change portfolio", correct: true}
      - {key: C, text: "Identify Transition Architectures"}
      - {key: D, text: "Ensure conformance with the Target Architecture by implementation projects"}
    explanation: "B is Phase F's second objective. A and C are Phase E, D is Phase G."
    refs: ["ADM §10.1"]
    difficulty: 1
    tags: [phase-f, objectives]
  - id: F4-197
    unit: F4
    objective: "4.5"
    stem: "According to its approach, what is the focus of Phase F?"
    options:
      - {key: A, text: "Developing the Target Technology Architecture"}
      - {key: B, text: "Signing the Architecture Contract with the implementation organization"}
      - {key: C, text: "Creating the Implementation and Migration Plan in co-operation with the project and portfolio managers", correct: true}
      - {key: D, text: "Monitoring business and technology change"}
    explanation: "C is the stated focus. A is Phase D, B is Phase G, D is Phase H."
    refs: ["ADM §10.5"]
    difficulty: 1
    tags: [phase-f, approach]
  - id: F4-198
    unit: F4
    objective: "4.5"
    stem: "According to the Phase F approach, what does Phase E hand over to Phase F?"
    options:
      - {key: A, text: "An incomplete Architecture Roadmap and Implementation and Migration Plan that address the Statement of Architecture Work", correct: true}
      - {key: B, text: "A finalized Architecture Definition Document"}
      - {key: C, text: "A signed Architecture Contract"}
      - {key: D, text: "Compliance Assessments for each project"}
    explanation: "The approach says Phase E provides an incomplete roadmap and plan that Phase F integrates with other change activity. B is Phase F's own output, C and D are Phase G outputs."
    refs: ["ADM §10.5"]
    difficulty: 2
    tags: [phase-f, approach]
  - id: F4-199
    unit: F4
    objective: "4.5"
    stem: "In Phase F step 1, which four management frameworks typically have to work closely together for the Implementation and Migration Plan to succeed?"
    options:
      - {key: A, text: "Business Capability Management, Project/Portfolio Management, Operations Management and Solution Development Methods"}
      - {key: B, text: "Business Planning, Enterprise Architecture, Project/Portfolio Management and Operations Management", correct: true}
      - {key: C, text: "ITIL, PRINCE2, IT4IT and ISO/IEC 20000"}
      - {key: D, text: "Business, Data, Application and Technology"}
    explanation: "B is the Phase F list. A is the similar but different list from the Preliminary Phase approach, C are example standards, D are the architecture domains."
    refs: ["ADM §10.3.1"]
    difficulty: 3
    tags: [phase-f, steps]
  - id: F4-200
    unit: F4
    objective: "4.5"
    stem: "In Phase F, how should the costs estimated for each project be broken down?"
    options:
      - {key: A, text: "Fixed and variable"}
      - {key: B, text: "Direct and indirect"}
      - {key: C, text: "Capital, and operations and maintenance", correct: true}
      - {key: D, text: "Business and IT"}
    explanation: "Step 3 splits costs into capital (to create the capability) and operations and maintenance (to run it). A, B and D are accounting distinctions the standard does not use here."
    refs: ["ADM §10.3.3"]
    difficulty: 2
    tags: [phase-f, steps]
  - id: F4-201
    unit: F4
    objective: "4.5"
    stem: "Which technique does Phase F use to estimate the business value of each project?"
    options:
      - {key: A, text: "The Consolidated Gaps, Solutions and Dependencies matrix"}
      - {key: B, text: "The stakeholder map"}
      - {key: C, text: "The Benefits diagram"}
      - {key: D, text: "The Business Value and Risk Matrix", correct: true}
    explanation: "Step 2 names the Business Value and Risk Matrix. A is the Phase E matrix from which risks are aggregated, B is a Phase A product, C is an artifact rather than the named technique."
    refs: ["ADM §10.3.2"]
    difficulty: 2
    tags: [phase-f, steps]
  # ------------------------------------------------------------ 4.6 Phases G, H
  - id: F4-202
    unit: F4
    objective: "4.6"
    stem: "Which of the following is an objective of Phase G?"
    options:
      - {key: A, text: "Ensure conformance with the Target Architecture by implementation projects", correct: true}
      - {key: B, text: "Ensure that the architecture development cycle is maintained"}
      - {key: C, text: "Finalize the Architecture Roadmap"}
      - {key: D, text: "Determine the Architecture Capability desired by the organization"}
    explanation: "A is Phase G's first objective. B is Phase H, C is Phase F, D is the Preliminary Phase."
    refs: ["ADM §11.1"]
    difficulty: 1
    tags: [phase-g, objectives]
  - id: F4-203
    unit: F4
    objective: "4.6"
    stem: "Through which deliverable does Phase G establish the connection between the architecture and the implementation organization?"
    options:
      - {key: A, text: "The Statement of Architecture Work"}
      - {key: B, text: "The Architecture Contract", correct: true}
      - {key: C, text: "The Compliance Assessment"}
      - {key: D, text: "The Implementation and Migration Plan"}
    explanation: "The approach states the connection is made through the Architecture Contract. A connects sponsor and architects in Phase A, C is a Phase G output but not the connecting agreement, D is the Phase F plan."
    refs: ["ADM §11.5"]
    difficulty: 1
    tags: [phase-g, approach]
  - id: F4-204
    unit: F4
    objective: "4.6"
    stem: "What is the favored approach in Phase G for deploying the Target Architecture?"
    options:
      - {key: A, text: "A single big-bang deployment after all development is complete"}
      - {key: B, text: "A pilot only, with full deployment deferred to the next ADM cycle"}
      - {key: C, text: "A series of transitions, each an incremental step that delivers business benefit in its own right", correct: true}
      - {key: D, text: "Deployment only after Phase H approves it"}
    explanation: "The approach favors a series of transitions to realize value early and reduce risk. A contradicts that, B and D are not in the standard."
    refs: ["ADM §11.5"]
    difficulty: 2
    tags: [phase-g, approach]
  - id: F4-205
    unit: F4
    objective: "4.6"
    stem: "Compliance with the defined architecture in Phase G applies to which projects?"
    options:
      - {key: A, text: "Only the implementation projects in the Architecture Roadmap"}
      - {key: B, text: "Only IT projects"}
      - {key: C, text: "Only projects with a signed Architecture Contract"}
      - {key: D, text: "The implementation projects and also other ongoing projects within the enterprise", correct: true}
    explanation: "The approach says a key aspect is compliance not only by the implementation projects but also by other ongoing projects. A, B and C narrow the scope."
    refs: ["ADM §11.5"]
    difficulty: 2
    tags: [phase-g, approach]
  - id: F4-206
    unit: F4
    objective: "4.6"
    stem: "What happens in parallel with Phase G?"
    options:
      - {key: A, text: "The execution of an organization-specific development process, where the actual development happens", correct: true}
      - {key: B, text: "Phase H runs concurrently"}
      - {key: C, text: "Phase A of the next cycle begins"}
      - {key: D, text: "The Requirements Management process is suspended"}
    explanation: "The approach notes that actual development happens in a parallel, organization-specific development process. B and C are sequencing errors, D contradicts Requirements Management operating for all phases."
    refs: ["ADM §11.5"]
    difficulty: 2
    tags: [phase-g, approach]
  - id: F4-207
    unit: F4
    objective: "4.6"
    stem: "When does Phase G close?"
    options:
      - {key: A, text: "When the Architecture Contract is signed"}
      - {key: B, text: "When the Architecture Board first meets"}
      - {key: C, text: "When the solutions are fully deployed once", correct: true}
      - {key: D, text: "When the Implementation and Migration Plan is approved"}
    explanation: "The last step says closure on Phase G is when the solutions are fully deployed once. A is step 3, not closure; B is a Phase H step; D is a Phase F output."
    refs: ["ADM §11.3.6"]
    difficulty: 2
    tags: [phase-g, steps]
  - id: F4-208
    unit: F4
    objective: "4.6"
    stem: "Which of the following is an objective of Phase H?"
    options:
      - {key: A, text: "Ensure conformance with the Target Architecture by implementation projects"}
      - {key: B, text: "Establish the Architecture Capability"}
      - {key: C, text: "Obtain approval for a Statement of Architecture Work"}
      - {key: D, text: "Ensure that the Enterprise Architecture Capability meets current requirements", correct: true}
    explanation: "D is Phase H's third objective. A is Phase G, B is the Preliminary Phase, C is Phase A."
    refs: ["ADM §12.1"]
    difficulty: 1
    tags: [phase-h, objectives]
  - id: F4-209
    unit: F4
    objective: "4.6"
    stem: "What is the goal of the architecture change management process?"
    options:
      - {key: A, text: "To ensure that the architecture achieves its original target business value", correct: true}
      - {key: B, text: "To reject all changes to the deployed architecture"}
      - {key: C, text: "To finalize the Architecture Roadmap"}
      - {key: D, text: "To replace the ADM with a change management method"}
    explanation: "The approach opens with that goal and adds managing change in a cohesive, architected way. B contradicts the dynamic architecture aim, C is Phase F, D is not in the standard."
    refs: ["ADM §12.5"]
    difficulty: 1
    tags: [phase-h, approach]
  - id: F4-210
    unit: F4
    objective: "4.6"
    stem: "Into which three categories does the Phase H approach classify required architectural changes?"
    options:
      - {key: A, text: "Corrective, adaptive and perfective"}
      - {key: B, text: "Simplification, incremental and re-architecting", correct: true}
      - {key: C, text: "Greenfield, revolutionary and evolutionary"}
      - {key: D, text: "Mainstream, contain and replace"}
    explanation: "B is the Phase H classification. A is software maintenance vocabulary, C are Phase E strategy approaches, D are Phase E system classifications."
    refs: ["ADM §12.5.2"]
    difficulty: 1
    tags: [phase-h, approach]
  - id: F4-211
    unit: F4
    objective: "4.6"
    stem: "Which category of change requires putting the whole architecture through the architecture development cycle again?"
    options:
      - {key: A, text: "Simplification change"}
      - {key: B, text: "Incremental change"}
      - {key: C, text: "Re-architecting change", correct: true}
      - {key: D, text: "Any change approved by the Architecture Board"}
    explanation: "Only re-architecting change restarts the cycle. Simplification is handled by change management, incremental may be either, and Architecture Board approval does not by itself decide the category."
    refs: ["ADM §12.5.2"]
    difficulty: 1
    tags: [phase-h, approach]
  - id: F4-212
    unit: F4
    objective: "4.6"
    stem: "According to the Phase H guideline, a change that impacts two or more stakeholders is likely to require what?"
    options:
      - {key: A, text: "Handling under a dispensation"}
      - {key: B, text: "An architecture redesign and re-entry to the ADM", correct: true}
      - {key: C, text: "Handling through change management techniques"}
      - {key: D, text: "No action until the next planned cycle"}
    explanation: "The guideline says two or more stakeholders points to redesign; one stakeholder or a change allowable under dispensation points to change management (A and C). D is not offered."
    refs: ["ADM §12.5.3"]
    difficulty: 2
    tags: [phase-h, approach]
  - id: F4-213
    unit: F4
    objective: "4.6"
    stem: "In the Phase H approach, a simplification change is said to be driven by which requirement?"
    options:
      - {key: A, text: "To reduce investment", correct: true}
      - {key: B, text: "To derive additional value from existing investment"}
      - {key: C, text: "To increase investment in order to create new value"}
      - {key: D, text: "To eliminate Architecture Governance"}
    explanation: "Simplification reduces investment; B is the driver of incremental change and C of re-architecting change. D is not in the standard."
    refs: ["ADM §12.5.2"]
    difficulty: 3
    tags: [phase-h, approach]
  - id: F4-214
    unit: F4
    objective: "4.6"
    stem: "According to the Phase H approach, which body assesses and approves Requests for Change?"
    options:
      - {key: A, text: "The sponsor of the original Request for Architecture Work"}
      - {key: B, text: "The Solution Architects"}
      - {key: C, text: "The Architecture Board", correct: true}
      - {key: D, text: "The portfolio managers"}
    explanation: "The drivers-for-change section says the Architecture Board assesses and approves RFCs. A signs the Statement of Architecture Work, B identify SBBs in Phase G, D co-operate on the plan in Phase F."
    refs: ["ADM §12.5.1"]
    difficulty: 2
    tags: [phase-h, approach]
  - id: F4-215
    unit: F4
    objective: "4.6"
    stem: "Ten systems are consolidated into one at the infrastructure level; the architecture above the physical layer does not change but the Baseline Technology Architecture description does. How does the standard classify this?"
    options:
      - {key: A, text: "A simplification change handled via change management techniques", correct: true}
      - {key: B, text: "An incremental change requiring partial re-architecting"}
      - {key: C, text: "A re-architecting change requiring a new ADM cycle"}
      - {key: D, text: "Not an architectural change at all"}
    explanation: "This is the standard's own example of a simplification change. B is the example of a new technology refreshing the Technology Architecture, C is the example of a change significant to business strategy, D is wrong because the Baseline description changes."
    refs: ["ADM §12.5.3"]
    difficulty: 2
    tags: [phase-h, approach]
  - id: F4-216
    unit: F4
    objective: "4.6"
    stem: "What does the Phase H approach say about 'creeping elegance'?"
    options:
      - {key: A, text: "It is the name given to incremental change"}
      - {key: B, text: "The governance body must avoid it and keep looking for changes that relate directly to business value", correct: true}
      - {key: C, text: "It should be encouraged to keep the architecture current"}
      - {key: D, text: "It refers to cost overruns in Phase F"}
    explanation: "The approach says it is especially important to avoid creeping elegance. A, C and D misdefine the term."
    refs: ["ADM §12.5"]
    difficulty: 3
    tags: [phase-h, approach]
  # ------------------------------------------------------------ 4.7 Requirements Management
  - id: F4-217
    unit: F4
    objective: "4.7"
    stem: "Which of the following is an objective of Requirements Management?"
    options:
      - {key: A, text: "Dispose of requirements that are no longer needed"}
      - {key: B, text: "Ensure that relevant architecture requirements are available for use by each phase as the phase is executed", correct: true}
      - {key: C, text: "Prioritize all requirements centrally on behalf of the phases"}
      - {key: D, text: "Finalize the Architecture Requirements Specification"}
    explanation: "B is the third objective. A and C are things the process explicitly does not do (the phase does), D is a Phase F output."
    refs: ["ADM §13.1"]
    difficulty: 1
    tags: [requirements-management, objectives]
  - id: F4-218
    unit: F4
    objective: "4.7"
    stem: "What does the Requirements Management circle at the centre of the ADM graphic denote?"
    options:
      - {key: A, text: "A static set of requirements agreed in Phase A"}
      - {key: B, text: "A phase executed after Phase H"}
      - {key: C, text: "A dynamic process whereby requirements and their changes are identified, stored and fed into and out of the relevant phases", correct: true}
      - {key: D, text: "The Architecture Board"}
    explanation: "The approach says the circle denotes a dynamic process, not a static set. A and B misread the diagram, D is a governance body from the Governance document."
    refs: ["ADM §13.5.1"]
    difficulty: 1
    tags: [requirements-management, approach]
  - id: F4-219
    unit: F4
    objective: "4.7"
    stem: "Which statement about the Requirements Management process itself is correct?"
    options:
      - {key: A, text: "It prioritizes every requirement before a phase can use it"}
      - {key: B, text: "It does not dispose of, address or prioritize any requirements; that is done within the relevant ADM phase", correct: true}
      - {key: C, text: "It implements changes in the current phase"}
      - {key: D, text: "It approves the Statement of Architecture Work"}
    explanation: "B is the approach's explicit statement. A contradicts it, C is a phase step in the table, D is the sponsor's act in Phase A."
    refs: ["ADM §13.5.1"]
    difficulty: 1
    tags: [requirements-management, approach]
  - id: F4-220
    unit: F4
    objective: "4.7"
    stem: "Which of the following can hold requirements information from multiple ADM cycles?"
    options:
      - {key: A, text: "The Architecture Requirements Specification"}
      - {key: B, text: "The Requirements Impact Assessment"}
      - {key: C, text: "The Statement of Architecture Work"}
      - {key: D, text: "The Architecture Requirements Repository", correct: true}
    explanation: "The approach says that, unlike the Specification and the Impact Assessment, the Repository can hold information from multiple cycles. C is a per-cycle Phase A deliverable."
    refs: ["ADM §13.5.1"]
    difficulty: 2
    tags: [requirements-management, approach]
  - id: F4-221
    unit: F4
    objective: "4.7"
    stem: "Where do the first high-level architecture requirements come from?"
    options:
      - {key: A, text: "The Architecture Vision, generated by means of the business scenario or an analogous technique", correct: true}
      - {key: B, text: "The Phase B gap analysis"}
      - {key: C, text: "The Phase H Change Requests"}
      - {key: D, text: "The Preliminary Phase tools strategy"}
    explanation: "Requirements development starts in the Architecture Vision. B produces gap requirements later, C produces requirements for a later cycle, D is unrelated."
    refs: ["ADM §13.5.2"]
    difficulty: 2
    tags: [requirements-management, approach]
  - id: F4-222
    unit: F4
    objective: "4.7"
    stem: "During a phase, where must new requirements that are outside the scope of the current Statement of Architecture Work be recorded?"
    options:
      - {key: A, text: "In the Architecture Requirements Specification"}
      - {key: B, text: "In the Architecture Requirements Repository, for management through the Requirements Management process", correct: true}
      - {key: C, text: "As a Change Request to Phase G"}
      - {key: D, text: "They are discarded"}
    explanation: "In-scope requirements go into the Specification (A); out-of-scope ones go into the Repository. C misuses Phase G, D contradicts the process."
    refs: ["ADM §13.5.2"]
    difficulty: 2
    tags: [requirements-management, approach]
  - id: F4-223
    unit: F4
    objective: "4.7"
    stem: "What does the TOGAF Standard say about requirements management processes and tools?"
    options:
      - {key: A, text: "It mandates a specific COTS requirements tool"}
      - {key: B, text: "It requires the Zachman Framework for requirements"}
      - {key: C, text: "It does not mandate or recommend any specific process or tool; it states what an effective process should achieve", correct: true}
      - {key: D, text: "It requires business scenarios and nothing else"}
    explanation: "The resources section describes the 'requirements for requirements' stance. A, B and D each impose something the standard does not."
    refs: ["ADM §13.5.3"]
    difficulty: 2
    tags: [requirements-management, approach]
  - id: F4-224
    unit: F4
    objective: "4.7"
    stem: "Which phases must select the approved requirements for that phase from the Architecture Requirements Repository and Specification?"
    options:
      - {key: A, text: "Phases B, C and D only"}
      - {key: B, text: "Phase A only"}
      - {key: C, text: "Phases G and H only"}
      - {key: D, text: "Every phase from the Preliminary Phase to Phase H", correct: true}
    explanation: "Requirements development says each phase from Preliminary to H selects its approved requirements and updates their status at completion. A, B and C restrict this to subsets."
    refs: ["ADM §13.5.2"]
    difficulty: 2
    tags: [requirements-management, approach]
  - id: F4-225
    unit: F4
    objective: "4.7"
    stem: "Which types of requirement should the architect identify in each relevant phase?"
    options:
      - {key: A, text: "Functional and non-functional requirements", correct: true}
      - {key: B, text: "Capital and operational requirements"}
      - {key: C, text: "Simplification and incremental requirements"}
      - {key: D, text: "Business requirements only"}
    explanation: "Functional and non-functional are named. B is a Phase F cost split, C are Phase H change types, D is too narrow."
    refs: ["ADM §13.5.2"]
    difficulty: 1
    tags: [requirements-management, approach]
  - id: F4-226
    unit: F4
    objective: "4.7"
    stem: "What does the Requirements Impact Assessment identify?"
    options:
      - {key: A, text: "The Solution Building Blocks to procure"}
      - {key: B, text: "The work packages in the Architecture Roadmap"}
      - {key: C, text: "The phases of the ADM that need to be revisited to address the changes", correct: true}
      - {key: D, text: "The compliance status of each implementation project"}
    explanation: "The outputs section says the assessment identifies the phases to revisit. A and B are Phase E content, D is a Phase G Compliance Assessment."
    refs: ["ADM §13.4"]
    difficulty: 1
    tags: [requirements-management, outputs]
  - id: F4-227
    unit: F4
    objective: "4.7"
    stem: "Which technique does the Requirements Management chapter name for analysing how a business goal or objective can be met by a process or value stream?"
    options:
      - {key: A, text: "Gap analysis"}
      - {key: B, text: "Business scenarios", correct: true}
      - {key: C, text: "Heat mapping"}
      - {key: D, text: "The Business Value and Risk Matrix"}
    explanation: "Business scenarios are the named resource. A is a development-phase step, C is a Phase B capability technique, D is a Phase F technique."
    refs: ["ADM §13.5.3"]
    difficulty: 2
    tags: [requirements-management, approach]
  - id: F4-228
    unit: F4
    objective: "4.7"
    stem: "In the Requirements Management steps, what is a 'gap requirement'?"
    options:
      - {key: A, text: "A requirement with no assigned owner"}
      - {key: B, text: "A requirement deferred to the next ADM cycle"}
      - {key: C, text: "A non-functional requirement that has no metric"}
      - {key: D, text: "Something eliminated from the Target Architecture by accident during gap analysis, which therefore requires a change to the Target Architecture", correct: true}
    explanation: "Step 10 defines a gap requirement as anything eliminated by accident. A, B and C are invented definitions."
    refs: ["ADM §13.3"]
    difficulty: 3
    tags: [requirements-management, steps]
  - id: F4-229
    unit: F4
    objective: "4.7"
    stem: "In the two-column Requirements Management steps table, in which column does 'Monitor baseline requirements' appear?"
    options:
      - {key: A, text: "Requirements Management steps", correct: true}
      - {key: B, text: "ADM phase steps"}
      - {key: C, text: "Phase H steps"}
      - {key: D, text: "Phase G steps"}
    explanation: "Monitoring the baseline (step 3) is done by the Requirements Management process. B holds the identify, assess and implement steps; C and D are not columns of the table."
    refs: ["ADM §13.3"]
    difficulty: 2
    tags: [requirements-management, steps]
