# F4 ADM Phases drill bank (learn_togaf.md §2, §6). Every question is original, cites the
# entailing ADM section, and is status: draft until reviewed. Ids F4-101 upward; F4-001..011
# live in starter.yaml.
code: F4_BANK
exam: FOUNDATION
name: F4 ADM Phases bank
kind: DRILL
source: authored
questions:
  # ------------------------------------------------------------ 4.1 Preliminary Phase
  - id: F4-101
    unit: F4
    objective: "4.1"
    stem: "Which of the following is one of the two objectives of the Preliminary Phase?"
    options:
      - {key: A, text: "Develop a high-level aspirational vision of the capabilities to be delivered"}
      - {key: B, text: "Determine the Architecture Capability desired by the organization", correct: true}
      - {key: C, text: "Finalize the Architecture Roadmap and the Implementation and Migration Plan"}
      - {key: D, text: "Ensure that the Architecture Governance Framework is executed"}
    explanation: "The Preliminary Phase determines and establishes the Architecture Capability. A is the first objective of Phase A, C is Phase F, D is Phase H."
    refs: ["ADM §2.1"]
    difficulty: 1
    tags: [preliminary, objectives]
  - id: F4-102
    unit: F4
    objective: "4.1"
    stem: "The standard summarizes the Preliminary Phase as being about defining which of the following?"
    options:
      - {key: A, text: "The Baseline and Target Architectures for each domain"}
      - {key: B, text: "The work packages and Transition Architectures"}
      - {key: C, text: "Where, what, why, who and how architecture is done in the enterprise", correct: true}
      - {key: D, text: "The value realization process for the deployed architecture"}
    explanation: "The approach section opens with 'where, what, why, who, and how we do architecture'. A is the work of Phases B to D, B is Phase E, D is Phase H step 1."
    refs: ["ADM §2.5"]
    difficulty: 1
    tags: [preliminary, approach]
  - id: F4-103
    unit: F4
    objective: "4.1"
    stem: "Which of the following is NOT listed as a main aspect of the Preliminary Phase approach?"
    options:
      - {key: A, text: "Defining the enterprise"}
      - {key: B, text: "Performing gap analysis between the Baseline and Target Architectures", correct: true}
      - {key: C, text: "Defining the Architecture Principles that will inform any architecture work"}
      - {key: D, text: "Evaluating the Enterprise Architecture maturity"}
    explanation: "Gap analysis is a step of the development phases B, C and D, not a Preliminary aspect. A, C and D are all in the approach's list of main aspects."
    refs: ["ADM §2.5"]
    difficulty: 2
    tags: [preliminary, approach]
  - id: F4-104
    unit: F4
    objective: "4.1"
    stem: "According to the Preliminary Phase approach, who must be appointed at this stage so that the activity has resources and clear support of business management?"
    options:
      - {key: A, text: "A sponsor", correct: true}
      - {key: B, text: "The Architecture Board"}
      - {key: C, text: "The Solution Architects"}
      - {key: D, text: "A portfolio manager"}
    explanation: "The enterprise-scope discussion says it is imperative that a sponsor is appointed at this stage. The Architecture Board is a governance body described in the Governance document, Solution Architects appear in Phase G, and portfolio managers co-operate in Phase F."
    refs: ["ADM §2.5.1"]
    difficulty: 2
    tags: [preliminary, approach]
  - id: F4-105
    unit: F4
    objective: "4.1"
    stem: "Which set of management frameworks does the standard say the TOGAF framework should be co-ordinated with?"
    options:
      - {key: A, text: "ITIL, PRINCE2, COBIT and CMMI"}
      - {key: B, text: "Business, Data, Application and Technology"}
      - {key: C, text: "Strategy, Segment and Capability Architecture"}
      - {key: D, text: "Business Capability Management, Project/Portfolio Management, Operations Management and Solution Development Methods", correct: true}
    explanation: "The four are named in the management frameworks discussion. A lists specific products and methods the standard only mentions as examples; B lists the architecture domains; C lists the Architecture Landscape levels."
    refs: ["ADM §2.5.5"]
    difficulty: 2
    tags: [preliminary, approach]
  - id: F4-106
    unit: F4
    objective: "4.1"
    stem: "Which statement about revisiting the Preliminary Phase is correct?"
    options:
      - {key: A, text: "It is executed once per enterprise and never revisited"}
      - {key: B, text: "It may be revisited from Phase A to ensure the Architecture Capability is suitable for a specific architecture problem", correct: true}
      - {key: C, text: "It is repeated at the start of every ADM phase"}
      - {key: D, text: "It may only be revisited from Phase H"}
    explanation: "The approach states the Preliminary Phase may be revisited from the Architecture Vision phase. A and C are extremes the standard does not state; D confuses this with Phase H, which issues a new Request for Architecture Work for a new cycle."
    refs: ["ADM §2.5"]
    difficulty: 2
    tags: [preliminary, approach]
  - id: F4-107
    unit: F4
    objective: "4.1"
    stem: "What does the standard recommend for evaluating Enterprise Architecture maturity in the Preliminary Phase?"
    options:
      - {key: A, text: "Take an existing Capability Maturity Model and customize it as required", correct: true}
      - {key: B, text: "Derive a completely new set of maturity factors for the enterprise"}
      - {key: C, text: "Use the Capability Assessment produced in Phase A"}
      - {key: D, text: "Defer maturity evaluation until Phase H"}
    explanation: "The planning section recommends customizing an existing model such as NASCIO or the US DoC ACMM. B is explicitly discouraged, C reverses the order (the Capability Assessment is a Phase A output), D is wrong because maturity is a Preliminary concern (though Phase H monitors it)."
    refs: ["ADM §2.5.7"]
    difficulty: 2
    tags: [preliminary, approach]
  - id: F4-108
    unit: F4
    objective: "4.1"
    stem: "Which of the following belongs to the objective 'Establish the Architecture Capability' rather than 'Determine the Architecture Capability'?"
    options:
      - {key: A, text: "Establish a Capability Maturity target"}
      - {key: B, text: "Review the organizational context for conducting Enterprise Architecture"}
      - {key: C, text: "Define and establish the Organizational Model for Enterprise Architecture", correct: true}
      - {key: D, text: "Identify the established frameworks, methods and processes that intersect with the capability"}
    explanation: "Defining the Organizational Model, the governance process, the tools and the principles are the 'establish' bullets. A, B and D are all 'determine' bullets."
    refs: ["ADM §2.1"]
    difficulty: 3
    tags: [preliminary, objectives]
  - id: F4-109
    unit: F4
    objective: "4.1"
    stem: "Tailoring the TOGAF framework in the Preliminary Phase considers which three kinds of tailoring?"
    options:
      - {key: A, text: "Terminology, process and content", correct: true}
      - {key: B, text: "Breadth, depth and time period"}
      - {key: C, text: "Business, data and technology"}
      - {key: D, text: "Strategic, interim and tactical"}
    explanation: "The tailoring step names terminology, process and content tailoring. B lists the scoping dimensions used in Phase A, C is a subset of the domains, D describes business objectives mentioned in the approach, not tailoring."
    refs: ["ADM §2.3.5"]
    difficulty: 2
    tags: [preliminary, steps]
  - id: F4-110
    unit: F4
    objective: "4.1"
    stem: "What does the Preliminary Phase approach say about defining business principles?"
    options:
      - {key: A, text: "The architecture function defines them in the Preliminary Phase"}
      - {key: B, text: "They are defined in Phase B as part of the Business Architecture"}
      - {key: C, text: "They are derived from the Technology Architecture"}
      - {key: D, text: "Defining them normally lies outside the scope of the architecture function; Architecture Principles may restate or cross-refer to them", correct: true}
    explanation: "The principles section says business principles are normally defined elsewhere in the enterprise and the Architecture Principles may restate or cross-refer to them. A, B and C all place business principle definition inside the architecture work."
    refs: ["ADM §2.5.4"]
    difficulty: 2
    tags: [preliminary, approach]
  - id: F4-111
    unit: F4
    objective: "4.1"
    stem: "Which body is normally responsible for approving the Architecture Principles?"
    options:
      - {key: A, text: "The sponsor of the Phase A project"}
      - {key: B, text: "The body responsible for Architecture Governance", correct: true}
      - {key: C, text: "The Solution Architects"}
      - {key: D, text: "Operations Management"}
    explanation: "The principles section links principles to governance: the governance body approves the principles and resolves architecture issues. A confuses this with signing the Statement of Architecture Work, C is a Phase G role, D is one of the co-ordinated management frameworks."
    refs: ["ADM §2.5.4"]
    difficulty: 2
    tags: [preliminary, approach]
  - id: F4-112
    unit: F4
    objective: "4.1"
    stem: "Which of the following is listed as an area to consider when reviewing the organizational context in the Preliminary Phase?"
    options:
      - {key: A, text: "The commercial models and budgetary plans for Enterprise Architecture activity", correct: true}
      - {key: B, text: "The data migration requirements for replaced applications"}
      - {key: C, text: "The work package portfolio and its dependencies"}
      - {key: D, text: "The terms of the Architecture Contract"}
    explanation: "Commercial models and budget plans open the organizational context list. B is a Phase C Data Architecture consideration, C is Phase E, D is Phase G."
    refs: ["ADM §2.5.2"]
    difficulty: 2
    tags: [preliminary, approach]
  # ------------------------------------------------------------ 4.2 Phase A
  - id: F4-113
    unit: F4
    objective: "4.2"
    stem: "Which of the following is an objective of Phase A, Architecture Vision?"
    options:
      - {key: A, text: "Develop the Target Business Architecture"}
      - {key: B, text: "Establish the Architecture Capability"}
      - {key: C, text: "Obtain approval for a Statement of Architecture Work that defines a program of works", correct: true}
      - {key: D, text: "Generate the initial complete version of the Architecture Roadmap"}
    explanation: "Phase A's second objective is approval of the Statement of Architecture Work. A is Phase B, B is the Preliminary Phase, D is Phase E."
    refs: ["ADM §3.1"]
    difficulty: 1
    tags: [phase-a, objectives]
  - id: F4-114
    unit: F4
    objective: "4.2"
    stem: "Phase A starts with the receipt of which document, and from whom?"
    options:
      - {key: A, text: "A Request for Architecture Work, from the sponsoring organization", correct: true}
      - {key: B, text: "A Statement of Architecture Work, from the Architecture Board"}
      - {key: C, text: "An Architecture Contract, from the implementation organization"}
      - {key: D, text: "A Requirements Impact Assessment, from the Requirements Management process"}
    explanation: "The approach says Phase A starts with receipt of a Request for Architecture Work from the sponsoring organization. B is Phase A's own output, C is a Phase G deliverable, D is a Requirements Management output."
    refs: ["ADM §3.5.1"]
    difficulty: 1
    tags: [phase-a, approach]
  - id: F4-115
    unit: F4
    objective: "4.2"
    stem: "Scoping decisions made in Phase A are constrained by what?"
    options:
      - {key: A, text: "The Implementation and Migration Plan"}
      - {key: B, text: "The overall scope for architecture activity established in the Preliminary Phase and embodied in the architecture framework", correct: true}
      - {key: C, text: "The signed Architecture Contract"}
      - {key: D, text: "The Target Technology Architecture"}
    explanation: "Phase A scoping is restricted to this cycle's objectives and constrained by the overall scope set in the Preliminary Phase. A and C do not exist yet (Phases F and G), D is developed later in Phase D."
    refs: ["ADM §3.5.1"]
    difficulty: 2
    tags: [phase-a, approach]
  - id: F4-116
    unit: F4
    objective: "4.2"
    stem: "During Phase A it becomes clear that the architecture framework in place cannot achieve the desired Architecture Vision. What does the standard say to do?"
    options:
      - {key: A, text: "Proceed to Phase B and address the framework later"}
      - {key: B, text: "Raise a Change Request for Phase H"}
      - {key: C, text: "Revisit the Preliminary Phase and extend the overall architecture framework", correct: true}
      - {key: D, text: "Abandon the ADM cycle"}
    explanation: "The approach states that where the framework is not appropriate, revisit the Preliminary Phase and extend the framework. A ignores the problem, B misuses Phase H (which handles change after deployment), D is not an option the standard offers."
    refs: ["ADM §3.5.1"]
    difficulty: 2
    tags: [phase-a, approach]
  - id: F4-117
    unit: F4
    objective: "4.2"
    stem: "The Architecture Vision provides the sponsor with a key tool to do what?"
    options:
      - {key: A, text: "Sign the Architecture Contract with the implementing organization"}
      - {key: B, text: "Prioritize the migration projects"}
      - {key: C, text: "Govern the implementation projects"}
      - {key: D, text: "Sell the benefits of the proposed capability to stakeholders and decision makers", correct: true}
    explanation: "The vision is described as the sponsor's tool to sell the benefits of the proposed capability. A is Phase G, B is Phase F, C is Phase G."
    refs: ["ADM §3.5.2"]
    difficulty: 1
    tags: [phase-a, approach]
  - id: F4-118
    unit: F4
    objective: "4.2"
    stem: "Which three Business Architecture concepts does Phase A search for existing materials on?"
    options:
      - {key: A, text: "Data entities, logical data components and physical data components"}
      - {key: B, text: "Business capabilities, value streams and organization maps", correct: true}
      - {key: C, text: "Work packages, Transition Architectures and the Architecture Roadmap"}
      - {key: D, text: "Catalogs, matrices and diagrams"}
    explanation: "The approach names business capabilities, value streams and organization maps, each with its Series Guide. A is the Data Architecture metamodel set, C is Phase E vocabulary, D is the artifact classification of the Content Framework."
    refs: ["ADM §3.5.2"]
    difficulty: 2
    tags: [phase-a, approach]
  - id: F4-119
    unit: F4
    objective: "4.2"
    stem: "The Architecture Vision provides a first-cut, high-level description of what?"
    options:
      - {key: A, text: "The Baseline and Target Architectures covering the Business, Data, Application and Technology domains", correct: true}
      - {key: B, text: "The Target Business Architecture only"}
      - {key: C, text: "The Transition Architectures and work packages"}
      - {key: D, text: "The Implementation and Migration Plan"}
    explanation: "The vision covers Baseline and Target across all four domains at a high level; the detail is developed in later phases. B is too narrow (that is Phase B's job), C is Phase E, D is Phases E and F."
    refs: ["ADM §3.5.2"]
    difficulty: 2
    tags: [phase-a, approach]
  - id: F4-120
    unit: F4
    objective: "4.2"
    stem: "In Phase A, what represents the consensus that the Architecture Vision has been accepted?"
    options:
      - {key: A, text: "The Architecture Board approving the Architecture Contract"}
      - {key: B, text: "Approval of the Implementation and Migration Plan"}
      - {key: C, text: "The sponsoring organization signing the Statement of Architecture Work", correct: true}
      - {key: D, text: "Sign-off of the Compliance Assessment"}
    explanation: "The approach says the consensus is represented by the sponsoring organization signing the Statement of Architecture Work. A and D belong to Phase G, B to Phase F."
    refs: ["ADM §3.5.2"]
    difficulty: 2
    tags: [phase-a, approach]
  - id: F4-121
    unit: F4
    objective: "4.2"
    stem: "Which technique does the standard describe as appropriate and useful to discover and document business requirements and to articulate an Architecture Vision that responds to them?"
    options:
      - {key: A, text: "Gap analysis"}
      - {key: B, text: "Business scenarios", correct: true}
      - {key: C, text: "The Business Value and Risk Matrix"}
      - {key: D, text: "The Consolidated Gaps, Solutions and Dependencies matrix"}
    explanation: "Business scenarios are named in the Develop Architecture Vision step. A is a Phase B to D step, C is a Phase F technique, D is a Phase E technique."
    refs: ["ADM §3.3.8"]
    difficulty: 1
    tags: [phase-a, steps]
  - id: F4-122
    unit: F4
    objective: "4.2"
    stem: "What does Phase A normally do with the business principles, business goals and strategic drivers of the organization?"
    options:
      - {key: A, text: "Ensure the existing definitions are current and clarify any ambiguity, defining them for the first time only if they do not exist", correct: true}
      - {key: B, text: "Replace them with Architecture Principles"}
      - {key: C, text: "Defer their definition to Phase B"}
      - {key: D, text: "Hand them to Requirements Management to define"}
    explanation: "The approach says these are normally already defined elsewhere; Phase A verifies and clarifies, otherwise defines them for the first time. B confuses two different sets of principles, C and D move the work to the wrong place."
    refs: ["ADM §3.5.1"]
    difficulty: 2
    tags: [phase-a, approach]
  - id: F4-123
    unit: F4
    objective: "4.2"
    stem: "Beyond the four basic domains, which of the following are given as example domains the Architecture Vision may explore?"
    options:
      - {key: A, text: "Baseline, Target and Transition"}
      - {key: B, text: "Strategy, Segment and Capability"}
      - {key: C, text: "Security, Digital, Knowledge and Partnership", correct: true}
      - {key: D, text: "Catalog, Matrix and Diagram"}
    explanation: "The approach lists information, security, digital, network management, knowledge, industry-specific, services, partnership and cybersecurity as example domains. A are architecture states, B are Landscape levels, D are artifact kinds."
    refs: ["ADM §3.5.2"]
    difficulty: 2
    tags: [phase-a, approach]
  - id: F4-124
    unit: F4
    objective: "4.2"
    stem: "What does the 'business assessment' conducted in the Architecture Vision phase involve?"
    options:
      - {key: A, text: "Consolidating the gap analysis results from the domain architectures"}
      - {key: B, text: "Documenting critical factors, assessing various courses of action and selecting the best one as the basis for the vision", correct: true}
      - {key: C, text: "Prioritizing projects by cost/benefit and risk"}
      - {key: D, text: "Reviewing implementation projects for architecture compliance"}
    explanation: "The approach describes a business assessment (for example with business scenarios) that assesses courses of action and selects the best. A is Phase E, C is Phase F, D is Phase G."
    refs: ["ADM §3.5.2"]
    difficulty: 2
    tags: [phase-a, approach]
  - id: F4-125
    unit: F4
    objective: "4.2"
    stem: "According to the first step of Phase A, how should each cycle of the ADM normally be handled?"
    options:
      - {key: A, text: "As a Transition Architecture"}
      - {key: B, text: "As a Change Request managed in Phase H"}
      - {key: C, text: "As a stand-alone activity outside the enterprise's governance"}
      - {key: D, text: "As a project, using the project management framework of the enterprise", correct: true}
    explanation: "Establishing the architecture project means running the cycle as a project under the enterprise's project management framework. A is a Phase E concept, B is Phase H, C contradicts the step's call for corporate and line management endorsement."
    refs: ["ADM §3.3.1"]
    difficulty: 2
    tags: [phase-a, steps]
  # ------------------------------------------------------------ 4.3 inputs, steps, outputs
  # Preliminary
  - id: F4-126
    unit: F4
    objective: "4.3"
    stem: "Which of the following is listed as a non-architectural input to the Preliminary Phase?"
    options:
      - {key: A, text: "Architecture Vision"}
      - {key: B, text: "Statement of Architecture Work"}
      - {key: C, text: "Partnership and contract agreements", correct: true}
      - {key: D, text: "Draft Architecture Definition Document"}
    explanation: "Partnership and contract agreements are in the non-architectural list along with strategies, plans and governance frameworks. A and B are Phase A outputs, D first appears from Phase A onwards; none can enter the Preliminary Phase."
    refs: ["ADM §2.2.2"]
    difficulty: 2
    tags: [preliminary, inputs]
  - id: F4-127
    unit: F4
    objective: "4.3"
    stem: "Which output of the Preliminary Phase does the standard mark as optional?"
    options:
      - {key: A, text: "Request for Architecture Work", correct: true}
      - {key: B, text: "Organizational Model for Enterprise Architecture"}
      - {key: C, text: "Tailored Architecture Framework"}
      - {key: D, text: "Initial Architecture Repository"}
    explanation: "The Request for Architecture Work is listed with '(optional)'; it may instead come from the sponsor to trigger Phase A. B, C and D are the core Preliminary outputs."
    refs: ["ADM §2.4"]
    difficulty: 1
    tags: [preliminary, outputs]
  - id: F4-128
    unit: F4
    objective: "4.3"
    stem: "In the Preliminary Phase, which step follows 'Define and establish the Enterprise Architecture team and organization'?"
    options:
      - {key: A, text: "Scope the enterprise organizations impacted"}
      - {key: B, text: "Identify and establish Architecture Principles", correct: true}
      - {key: C, text: "Tailor the TOGAF framework and, if any, other selected architecture frameworks"}
      - {key: D, text: "Develop a strategy and implementation plan for tools and techniques"}
    explanation: "The six steps run scope, governance, team, principles, tailor, tools. A is step 1, C is step 5, D is step 6."
    refs: ["ADM §2.3"]
    difficulty: 2
    tags: [preliminary, steps]
  - id: F4-129
    unit: F4
    objective: "4.3"
    stem: "Which of the following is listed as a reference material external to the enterprise for the Preliminary Phase?"
    options:
      - {key: A, text: "Product information on candidate products"}
      - {key: B, text: "Planning methodologies"}
      - {key: C, text: "Governance models and frameworks"}
      - {key: D, text: "The TOGAF Library", correct: true}
    explanation: "The Preliminary Phase's external references are the TOGAF Library and other architecture frameworks. A is a Phase D external reference, B is a Phase E non-architectural input, C is a Phase E and F architectural input."
    refs: ["ADM §2.2.1"]
    difficulty: 3
    tags: [preliminary, inputs]
  # Phase A
  - id: F4-130
    unit: F4
    objective: "4.3"
    stem: "Which of the following is NOT an output of Phase A?"
    options:
      - {key: A, text: "Communications Plan"}
      - {key: B, text: "Capability Assessment"}
      - {key: C, text: "Draft Architecture Requirements Specification", correct: true}
      - {key: D, text: "Architecture Vision"}
    explanation: "The Architecture Requirements Specification first appears as a draft output of Phase B. The Communications Plan, Capability Assessment and Architecture Vision are all produced in Phase A."
    refs: ["ADM §3.4", "ADM §4.4"]
    difficulty: 2
    tags: [phase-a, outputs]
  - id: F4-131
    unit: F4
    objective: "4.3"
    stem: "Which of the following is an architectural input to Phase A?"
    options:
      - {key: A, text: "Populated Architecture Repository", correct: true}
      - {key: B, text: "Draft Architecture Requirements Specification"}
      - {key: C, text: "Architecture Roadmap"}
      - {key: D, text: "Implementation Governance Model"}
    explanation: "Phase A's architectural inputs are the Organizational Model, the Tailored Architecture Framework and the populated Architecture Repository. B first exists after Phase B, C after Phase E, D after Phase F."
    refs: ["ADM §3.2.3"]
    difficulty: 2
    tags: [phase-a, inputs]
  - id: F4-132
    unit: F4
    objective: "4.3"
    stem: "In Phase A, which step comes immediately after 'Assess readiness for business transformation'?"
    options:
      - {key: A, text: "Evaluate capabilities"}
      - {key: B, text: "Identify stakeholders, concerns and business requirements"}
      - {key: C, text: "Develop Architecture Vision"}
      - {key: D, text: "Define scope", correct: true}
    explanation: "Readiness is step 5 and Define scope is step 6. A is step 4 (before), B is step 2, C is step 8."
    refs: ["ADM §3.3"]
    difficulty: 2
    tags: [phase-a, steps]
  - id: F4-133
    unit: F4
    objective: "4.3"
    stem: "The stakeholder map produced in Phase A step 2 is used to support which outputs?"
    options:
      - {key: A, text: "Architecture Definition Document, Architecture Requirements Specification and Architecture Roadmap"}
      - {key: B, text: "Architecture Vision, Communications Plan and Statement of Architecture Work", correct: true}
      - {key: C, text: "Architecture Contract and Compliance Assessments"}
      - {key: D, text: "Requirements Impact Assessment and Architecture Requirements Repository"}
    explanation: "The step says the map identifies the concerns and viewpoints for the Architecture Vision, the stakeholders for the Communications Plan and the roles for the Statement of Architecture Work. A are Phase B to F deliverables, C Phase G, D Requirements Management."
    refs: ["ADM §3.3.2"]
    difficulty: 2
    tags: [phase-a, steps]
  - id: F4-134
    unit: F4
    objective: "4.3"
    stem: "Phase A step 10 distinguishes which two levels of risk?"
    options:
      - {key: A, text: "Initial level of risk and residual level of risk", correct: true}
      - {key: B, text: "Strategic risk and tactical risk"}
      - {key: C, text: "Business risk and technical risk"}
      - {key: D, text: "Inherent risk and accepted risk"}
    explanation: "The step defines the initial level (before mitigation) and the residual level (after mitigation). B, C and D are plausible risk vocabularies but not the standard's."
    refs: ["ADM §3.3.10"]
    difficulty: 2
    tags: [phase-a, steps]
  # Phase B
  - id: F4-135
    unit: F4
    objective: "4.3"
    stem: "Which input is listed for Phase B but NOT for Phase A?"
    options:
      - {key: A, text: "Request for Architecture Work"}
      - {key: B, text: "Organizational Model for Enterprise Architecture"}
      - {key: C, text: "Capability Assessment", correct: true}
      - {key: D, text: "Tailored Architecture Framework"}
    explanation: "The Capability Assessment is produced in Phase A, so it can only be an input from Phase B onwards. A, B and D are inputs to both phases."
    refs: ["ADM §4.2.2", "ADM §3.2"]
    difficulty: 3
    tags: [phase-b, inputs]
  - id: F4-136
    unit: F4
    objective: "4.3"
    stem: "Which of the following is NOT an input to Phase B?"
    options:
      - {key: A, text: "Enterprise Continuum"}
      - {key: B, text: "Draft Architecture Requirements Specification", correct: true}
      - {key: C, text: "Architecture Vision"}
      - {key: D, text: "Communications Plan"}
