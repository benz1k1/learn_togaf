# Authored F2 bank (learn_togaf.md §2, §6). Original paraphrase; every item cites the section
# that entails its answer; status: draft until reviewed.
code: F2_BANK
exam: FOUNDATION
name: F2 Definitions drill bank
kind: DRILL
source: authored
questions:
  # ------------------------------------------------------------ 2.1 key terms
  - id: F2-101
    unit: F2
    objective: "2.1"
    stem: "According to the Definitions chapter, what is a 'stakeholder'?"
    options:
      - {key: A, text: "An individual, team, organisation, or class thereof, having an interest in a system", correct: true}
      - {key: B, text: "A person who funds the architecture project"}
      - {key: C, text: "Any user of an application"}
      - {key: D, text: "A member of the Architecture Board"}
    explanation: "A stakeholder is anyone, or any group or class, with an interest in the system. B is only the sponsor. C is one kind of stakeholder, not the definition. D is a governance role, not the definition."
    refs: ["INTRO §4.76"]
    difficulty: 1
    tags: [definitions, stakeholder]
    status: draft
  - id: F2-102
    unit: F2
    objective: "2.1"
    stem: "How does the standard define an 'architecture view'?"
    options:
      - {key: A, text: "A specification of the conventions for a kind of model"}
      - {key: B, text: "A depiction of a system seen from the standpoint of a related set of concerns", correct: true}
      - {key: C, text: "A diagram drawn in a standard notation"}
      - {key: D, text: "The full description of a system in every respect"}
    explanation: "A view represents the system from the perspective of related concerns. A is close to a viewpoint or model kind. C is too narrow; a view may comprise several models, not just one diagram. D is the opposite: a view is a partial perspective."
    refs: ["INTRO §4.20"]
    difficulty: 1
    tags: [definitions, view]
    status: draft
  - id: F2-103
    unit: F2
    objective: "2.1"
    stem: "What is an 'architecture viewpoint'?"
    options:
      - {key: A, text: "A representation of a system for a set of concerns"}
      - {key: B, text: "The specified conventions for constructing one particular kind of architecture view", correct: true}
      - {key: C, text: "The opinion of a senior stakeholder about the architecture"}
      - {key: D, text: "A catalog of all views produced in a phase"}
    explanation: "A viewpoint specifies the conventions, the definition or schema, for a kind of view. A is the view itself. C is a colloquial misreading. D resembles a taxonomy of views, a different term."
    refs: ["INTRO §4.21"]
    difficulty: 1
    tags: [definitions, viewpoint]
    status: draft
  - id: F2-104
    unit: F2
    objective: "2.1"
    stem: "In the standard's definitions, what is a 'gap'?"
    options:
      - {key: A, text: "A statement of difference between two states, used when comparing the Baseline and Target Architecture", correct: true}
      - {key: B, text: "A requirement that has not yet been approved"}
      - {key: C, text: "A period during which no architecture work takes place"}
      - {key: D, text: "A missing member of the architecture team"}
    explanation: "A gap is a difference between two states, found by gap analysis between baseline and target. B is a requirements status, not a gap. C and D are everyday meanings the standard does not use."
    refs: ["INTRO §4.48"]
    difficulty: 1
    tags: [definitions, gap]
    status: draft
  - id: F2-105
    unit: F2
    objective: "2.1"
    stem: "Which statement about a 'work package' is consistent with its definition?"
    options:
      - {key: A, text: "It must always be a complete project"}
      - {key: B, text: "It is a set of actions identified to achieve one or more objectives, and can be part of a project, a whole project, or a programme", correct: true}
      - {key: C, text: "It is a deliverable signed off by the Architecture Board"}
      - {key: D, text: "It is a technology component to be procured"}
    explanation: "A work package is a set of actions toward business objectives and may be sized as part of a project, a project, or a programme. A is too restrictive. C confuses it with a deliverable. D confuses it with an SBB."
    refs: ["INTRO §4.89"]
    difficulty: 2
    tags: [definitions, work-package]
    status: draft
  - id: F2-106
    unit: F2
    objective: "2.1"
    stem: "What is a 'Transition Architecture'?"
    options:
      - {key: A, text: "The description of the final future state of the enterprise"}
      - {key: B, text: "A formal description of the architecture as it will stand at one architecturally significant moment in time", correct: true}
      - {key: C, text: "The current state of the enterprise before any change"}
      - {key: D, text: "A plan for moving people between departments"}
    explanation: "A Transition Architecture is a formal description of an intermediate, architecturally significant state; one or more show the path from Baseline to Target. A is the Target. C is the Baseline. D is not an architecture term."
    refs: ["INTRO §4.84"]
    difficulty: 1
    tags: [definitions, transition]
    status: draft
  - id: F2-107
    unit: F2
    objective: "2.1"
    stem: "Which of the following best matches the standard's definition of 'baseline'?"
    options:
      - {key: A, text: "An informal sketch of the current systems"}
      - {key: B, text: "A specification that has been formally reviewed and agreed, that serves as the basis for further change and can be altered only through formal change control", correct: true}
      - {key: C, text: "The lowest acceptable level of system performance"}
      - {key: D, text: "The first Transition Architecture on the roadmap"}
    explanation: "A baseline is a formally agreed specification under change control. A lacks the formal agreement. C is a performance meaning the standard does not use. D confuses baseline with a transition state."
    refs: ["INTRO §4.24"]
    difficulty: 2
    tags: [definitions, baseline]
    status: draft
  - id: F2-108
    unit: F2
    objective: "2.1"
    stem: "The standard defines both 'capability' and 'business capability'. What distinguishes them?"
    options:
      - {key: A, text: "Capability is the general-purpose definition, an ability an organisation, person or system possesses; business capability refines it to a particular ability a business may possess or exchange to achieve a specific purpose", correct: true}
      - {key: B, text: "Capability refers only to IT; business capability refers only to people"}
      - {key: C, text: "They are identical terms"}
      - {key: D, text: "Business capability is the general term; capability is specific to Business Architecture"}
    explanation: "Capability is general purpose; business capability is the refinement used in Business Architecture. B invents a split not in the standard. C ignores the refinement. D reverses the relationship."
    refs: ["INTRO §4.33", "INTRO §4.28"]
    difficulty: 2
    tags: [definitions, capability]
    status: draft
  - id: F2-109
    unit: F2
    objective: "2.1"
    stem: "What is the relationship between 'architecture level' and 'architecture partition' in the Definitions chapter?"
    options:
      - {key: A, text: "They are synonyms"}
      - {key: B, text: "Levels divide the Architecture Landscape into levels of granularity; partitions are subsets created by dividing an architecture to ease development and management; the standard states the two are distinct", correct: true}
      - {key: C, text: "A partition is one of the three levels"}
      - {key: D, text: "Levels apply only to solutions, partitions only to architectures"}
    explanation: "Level is about granularity of the landscape; partition is about dividing an architecture for manageability, and the level definition explicitly says they are distinct. A and C conflate them. D is invented."
    refs: ["INTRO §4.16", "INTRO §4.18"]
    difficulty: 2
    tags: [definitions, levels, partitions]
    status: draft
  - id: F2-110
    unit: F2
    objective: "2.1"
    stem: "What is a 'building block'?"
    options:
      - {key: A, text: "A potentially reusable component that, combined with other building blocks, delivers architectures and solutions", correct: true}
      - {key: B, text: "A work product that describes one aspect of the architecture"}
      - {key: C, text: "A contractually specified output of a phase"}
      - {key: D, text: "A unit of physical infrastructure only"}
    explanation: "A building block is a potentially reusable, combinable component. B is an artifact. C is a deliverable. D is too narrow; building blocks exist for business, data and applications as well as technology."
    refs: ["INTRO §4.26"]
    difficulty: 1
    tags: [definitions, building-block]
    status: draft
  - id: F2-111
    unit: F2
    objective: "2.1"
    stem: "Which properties does the standard require of a 'requirement'?"
    options:
      - {key: A, text: "It must be approved by the Architecture Board and funded"}
      - {key: B, text: "It must be unambiguous, testable or measurable, and necessary for acceptability", correct: true}
      - {key: C, text: "It must be expressed as a user story"}
      - {key: D, text: "It must be derived from a business scenario"}
    explanation: "A requirement is a statement of need that is unambiguous, testable or measurable, and necessary for acceptability. A describes governance status. C and D describe possible formats or sources, not the definition."
    refs: ["INTRO §4.65"]
    difficulty: 2
    tags: [definitions, requirement]
    status: draft
  - id: F2-112
    unit: F2
    objective: "2.1"
    stem: "How does the standard define an 'objective'?"
    options:
      - {key: A, text: "A high-level aspiration with no fixed measure"}
      - {key: B, text: "An organisational aim declared in a Specific, Measurable, Actionable, Realistic and Timebound way", correct: true}
      - {key: C, text: "An external condition that drives the enterprise"}
      - {key: D, text: "A principle that guides architecture decisions"}
    explanation: "An objective is a SMART organisational aim. A describes a goal more loosely than the standard allows for an objective. C is a driver. D is a principle."
    refs: ["INTRO §4.59"]
    difficulty: 2
    tags: [definitions, objective]
    status: draft
  - id: F2-113
    unit: F2
    objective: "2.1"
    stem: "What is a 'pattern' in the standard's vocabulary?"
    options:
      - {key: A, text: "A technique for placing building blocks in context, for instance to describe a reusable solution to a problem", correct: true}
      - {key: B, text: "A standard the enterprise must comply with"}
      - {key: C, text: "A synonym for building block"}
      - {key: D, text: "A diagram notation"}
    explanation: "Building blocks are what you use; patterns tell you how, when and why to use them and the trade-offs involved. B is a standard. C is contradicted by the definition's note. D is not stated."
    refs: ["INTRO §4.60"]
    difficulty: 2
    tags: [definitions, pattern]
    status: draft
  - id: F2-114
    unit: F2
    objective: "2.1"
    stem: "Which option matches the definition of 'Architecture Governance'?"
    options:
      - {key: A, text: "The practice of monitoring and directing architecture-related work to deliver desired outcomes and adhere to principles, standards and roadmaps", correct: true}
      - {key: B, text: "Ensuring business processes deliver business outcomes and comply with regulation"}
      - {key: C, text: "The discipline of monitoring the management of the whole business"}
      - {key: D, text: "The approval of project budgets by the Architecture Board"}
    explanation: "Architecture Governance is specifically about monitoring and directing architecture work. B is Business Governance. C is the general definition of Governance. D is not a defined term."
    refs: ["INTRO §4.14", "INTRO §4.49", "INTRO §4.30"]
    difficulty: 2
    tags: [definitions, governance]
    status: draft
  - id: F2-115
    unit: F2
    objective: "2.1"
    stem: "In the Definitions chapter, what is an 'enterprise'?"
    options:
      - {key: A, text: "The highest level, typically, of description of an organisation, usually covering all missions and functions, and often spanning multiple organisations", correct: true}
      - {key: B, text: "A single business unit with its own profit and loss"}
      - {key: C, text: "The set of IT systems owned by a company"}
      - {key: D, text: "A legal entity registered with a regulator"}
    explanation: "The definition stresses the highest level of description, all missions and functions, and spanning organisations. B is narrower than the definition allows. C reduces the enterprise to IT. D is a legal notion the standard does not use."
    refs: ["INTRO §4.43"]
    difficulty: 2
    tags: [definitions, enterprise]
    status: draft
  - id: F2-116
    unit: F2
    objective: "2.1"
    stem: "What is a 'Foundation Architecture'?"
    options:
      - {key: A, text: "The architecture of a company's headquarters building"}
      - {key: B, text: "Generic building blocks and their inter-relationships, together with principles and guidelines, forming the base on which more specific architectures are built", correct: true}
      - {key: C, text: "The Baseline Architecture of the first ADM cycle"}
      - {key: D, text: "An industry-specific reference model"}
    explanation: "A Foundation Architecture is the generic base for more specific architectures; the TRM is the example. A is a literal misreading. C confuses it with the baseline. D describes an Industry Architecture."
    refs: ["INTRO §4.46"]
    difficulty: 2
    tags: [definitions, foundation-architecture]
    status: draft
  - id: F2-117
    unit: F2
    objective: "2.1"
    stem: "Which definition matches 'Segment Architecture'?"
    options:
      - {key: A, text: "A summary formal description of the enterprise providing an executive-level, long-term view for direction setting"}
      - {key: B, text: "A detailed, formal description of particular areas of an enterprise, used at programme or portfolio level to organise and align change", correct: true}
      - {key: C, text: "An architecture that describes the abilities an enterprise possesses"}
      - {key: D, text: "A subset of architecture created to ease its development"}
    explanation: "Segment Architecture is the programme- or portfolio-level description of areas of the enterprise. A is Strategic Architecture. C is Capability Architecture. D is an architecture partition."
    refs: ["INTRO §4.68", "INTRO §4.78", "INTRO §4.34"]
    difficulty: 2
    tags: [definitions, levels]
    status: draft
  - id: F2-118
    unit: F2
    objective: "2.1"
    stem: "How does the Definitions chapter define an 'Architecture Principle'?"
    options:
      - {key: A, text: "A qualitative statement of intent the architecture is expected to satisfy", correct: true}
      - {key: B, text: "A measurable target for system performance"}
      - {key: C, text: "A legal obligation the enterprise must satisfy"}
      - {key: D, text: "A standard selected from the Standards Library"}
    explanation: "A principle is a qualitative statement of intent. B is quantitative, which the standard associates with requirements and the Architecture Requirements Specification. C is a legal standard. D is a standard, not a principle."
    refs: ["INTRO §4.19"]
    difficulty: 1
    tags: [definitions, principles]
    status: draft
  - id: F2-119
    unit: F2
    objective: "2.1"
    stem: "What is a 'capability increment'?"
    options:
      - {key: A, text: "A discrete slice of a capability architecture that delivers specific value; once every increment is complete the capability is realised", correct: true}
      - {key: B, text: "An annual increase in the architecture team's headcount"}
      - {key: C, text: "A version number applied to a Transition Architecture"}
      - {key: D, text: "A new metamodel entity type added to the content framework"}
    explanation: "A capability increment is a value-delivering slice of a capability architecture. B, C and D are not the defined meaning."
    refs: ["INTRO §4.35"]
    difficulty: 3
    tags: [definitions, capability]
    status: draft
  - id: F2-120
    unit: F2
    objective: "2.1"
    stem: "Which statement correctly relates architecture viewpoints, model kinds and architecture views?"
    options:
      - {key: A, text: "A viewpoint references one or more model kinds; a view incorporates one or more models", correct: true}
      - {key: B, text: "A view references model kinds; a viewpoint incorporates models"}
      - {key: C, text: "Model kinds are instances of views"}
      - {key: D, text: "A viewpoint is a collection of views"}
    explanation: "The note under Model Kind states that a viewpoint references model kinds and a view incorporates models. B swaps the two. C inverts the abstraction. D describes a taxonomy of views, not a viewpoint."
    refs: ["INTRO §4.58"]
    difficulty: 3
    tags: [definitions, views]
    status: draft
  - id: F2-121
    unit: F2
    objective: "2.1"
    stem: "What is a 'course of action' in the standard's definitions?"
    options:
      - {key: A, text: "A legal proceeding against a supplier"}
      - {key: B, text: "The direction and focus that strategic goals and objectives give, often aimed at delivering the value proposition set out in the business model", correct: true}
      - {key: C, text: "The sequence of steps in an ADM phase"}
      - {key: D, text: "The migration path defined in Phase F"}
    explanation: "A course of action is strategic direction and focus tied to goals, objectives and the business model. A is an everyday meaning. C and D describe process steps and plans, not the term."
    refs: ["INTRO §4.38"]
    difficulty: 3
    tags: [definitions]
    status: draft
  - id: F2-122
    unit: F2
    objective: "2.1"
    stem: "A sales representative who visits customers is used as an example in the Definitions chapter. Of what?"
    options:
      - {key: A, text: "A role"}
      - {key: B, text: "An actor", correct: true}
      - {key: C, text: "A stakeholder"}
      - {key: D, text: "A business service"}
    explanation: "An actor is a person, organisation or system with one or more roles that initiates or interacts with activities; the travelling sales representative is the example. A role is the expected behaviour of an actor. A stakeholder has an interest in a system. A business service encapsulates business behaviour."
    refs: ["INTRO §4.2", "INTRO §4.67"]
    difficulty: 2
    tags: [definitions, actor, role]
    status: draft
  # ------------------------------------------------------------ 2.2 confusable terms
  - id: F2-123
    unit: F2
    objective: "2.2"
    stem: "A project's Architecture Definition Document has been reviewed and signed off by the sponsor. Which work product category applies to the document?"
    options:
      - {key: A, text: "Artifact"}
      - {key: B, text: "Building block"}
      - {key: C, text: "Deliverable", correct: true}
      - {key: D, text: "Viewpoint"}
    explanation: "A signed-off, contractually specified work product is a deliverable; the ADD is the standard's own example. The artifacts are the catalogs, matrices and diagrams inside it. Building blocks are the components it describes. A viewpoint is a convention, not a work product."
    refs: ["INTRO §4.40", "INTRO §4.23", "INTRO §4.26"]
    difficulty: 1
    tags: [confusables, deliverables]
    status: draft
  - id: F2-124
    unit: F2
    objective: "2.2"
    stem: "Which statement correctly distinguishes the Architecture Vision from the Architecture Definition Document?"
    options:
      - {key: A, text: "The Vision is the deliverable container for all core artifacts; the Definition Document is a succinct aspirational summary"}
      - {key: B, text: "The Vision is a succinct description of the Target Architecture and its business value that bounds detailed work; the Definition Document is the container for the core artifacts across all domains and states", correct: true}
      - {key: C, text: "They are two names for the same document at different versions"}
      - {key: D, text: "The Vision is produced in Phase G; the Definition Document in Phase A"}
    explanation: "The Vision is the early, succinct, aspirational summary; the ADD is the full container spanning Business, Data, Application and Technology and Baseline, Transition and Target states. A swaps them. C is wrong; they are distinct deliverables. D has the phases wrong: the Vision is output from A and E, the ADD from A through F."
    refs: ["INTRO §4.22", "CONTENT §4.2.3", "CONTENT §4.2.8", "CONTENT §4.1"]
    difficulty: 2
    tags: [confusables, vision, add]
    status: draft
  - id: F2-125
    unit: F2
    objective: "2.2"
    stem: "How do the Architecture Definition Document and the Architecture Requirements Specification complement each other?"
    options:
      - {key: A, text: "The Definition Document gives the quantitative view; the Requirements Specification gives the qualitative view"}
      - {key: B, text: "The Definition Document gives a qualitative view communicating the architects' intent; the Requirements Specification gives a quantitative view of measurable criteria an implementation must meet", correct: true}
      - {key: C, text: "The Requirements Specification is a chapter inside the Definition Document"}
      - {key: D, text: "The Definition Document is for business stakeholders only; the Requirements Specification is for IT only"}
    explanation: "Qualitative intent in the ADD, quantitative criteria in the ARS, which typically forms part of an implementation contract. A reverses them. C is wrong; they are companion deliverables. D invents an audience split."
    refs: ["CONTENT §4.2.3", "CONTENT §4.2.6"]
    difficulty: 2
    tags: [confusables, add, ars]
    status: draft
  - id: F2-126
    unit: F2
    objective: "2.2"
    stem: "Who sends the Request for Architecture Work, and to whom?"
    options:
      - {key: A, text: "The architecture organisation sends it to the sponsoring organisation"}
      - {key: B, text: "The sponsoring organisation sends it to the architecture organisation to trigger an architecture development cycle", correct: true}
      - {key: C, text: "The Architecture Board sends it to implementation projects"}
      - {key: D, text: "The project manager sends it to the Architecture Board"}
    explanation: "The Request comes from the sponsor to the architecture organisation and starts a cycle. A reverses the direction, which describes the Statement of Architecture Work's origin instead. C and D name the wrong parties."
    refs: ["CONTENT §4.2.17"]
    difficulty: 1
    tags: [confusables, request-for-architecture-work]
    status: draft
  - id: F2-127
    unit: F2
    objective: "2.2"
    stem: "Which statement describes the Statement of Architecture Work?"
    options:
      - {key: A, text: "It defines the scope and approach for completing an architecture development cycle, is the document against which the project is measured, and may form the basis of a contract between supplier and consumer of architecture services", correct: true}
      - {key: B, text: "It is sent by the sponsor to trigger the cycle and lists the organisation's mission and budget"}
      - {key: C, text: "It is the joint agreement between development partners and sponsors on implementation deliverables"}
      - {key: D, text: "It schedules the projects that will realise the Target Architecture"}
    explanation: "The Statement is the architect's scoped response, the yardstick for the project. B is the Request for Architecture Work. C is the Architecture Contract. D is the Implementation and Migration Plan."
    refs: ["CONTENT §4.2.20"]
    difficulty: 2
    tags: [confusables, statement-of-architecture-work]
    status: draft
  - id: F2-128
    unit: F2
    objective: "2.2"
    stem: "What distinguishes the Architecture Roadmap from the Implementation and Migration Plan?"
    options:
      - {key: A, text: "The Roadmap lists work packages on a timeline from Baseline to Target with their business value; the Implementation and Migration Plan is the schedule of projects, grouped into portfolios and programmes, that realise the target", correct: true}
      - {key: B, text: "The Roadmap is produced by the sponsor; the Plan by the architects"}
      - {key: C, text: "The Roadmap is only produced in Phase H; the Plan in Phase A"}
      - {key: D, text: "They are the same document under different names"}
    explanation: "Work packages on a timeline versus a project schedule. B is invented. C is wrong on phases: the Roadmap develops through E and F from B, C, D components, and the Plan is output from E and F. D is wrong; they are distinct deliverables."
    refs: ["CONTENT §4.2.7", "CONTENT §4.2.14"]
    difficulty: 2
    tags: [confusables, roadmap, migration-plan]
    status: draft
  - id: F2-129
    unit: F2
    objective: "2.2"
    stem: "Which statement correctly distinguishes the Enterprise Continuum from the Architecture Repository?"
    options:
      - {key: A, text: "The Continuum is a categorisation mechanism for classifying building blocks from generic to specific; the Repository is the holding area where projects manage deliverables, find reusable assets and publish outputs", correct: true}
      - {key: B, text: "The Continuum stores assets; the Repository classifies them"}
      - {key: C, text: "The Continuum is the technology part of the Repository"}
      - {key: D, text: "The Repository is a subset of the Solutions Continuum"}
    explanation: "Classify versus store. B reverses the roles. C and D invent containment relationships; the continuum classifies what the repository holds, and the Solutions Continuum is a classification, not a container."
    refs: ["INTRO §4.45", "CONTENT §4.2.5"]
    difficulty: 1
    tags: [confusables, continuum, repository]
    status: draft
  - id: F2-130
    unit: F2
    objective: "2.2"
    stem: "A Change Request and a Requirements Impact Assessment both contain the phases to be revisited and the phase to lead on prioritisation. What distinguishes them?"
    options:
      - {key: A, text: "The Change Request is raised by an implementation project when the definition proves unsuitable or opportunities arise; the Requirements Impact Assessment is produced by Requirements Management when new facts invalidate existing requirements", correct: true}
      - {key: B, text: "The Change Request is produced by Requirements Management; the Impact Assessment by projects"}
      - {key: C, text: "The Change Request is only used in the Preliminary Phase"}
      - {key: D, text: "They are identical and interchangeable"}
    explanation: "Origin is the difference: a project raises the Change Request (output of F, G, H, input to H); Requirements Management produces the Impact Assessment. B reverses them. C is wrong on phases. D ignores the different purposes."
    refs: ["CONTENT §4.2.11", "CONTENT §4.2.18", "CONTENT §4.1"]
    difficulty: 3
    tags: [confusables, change-request, impact-assessment]
    status: draft
  - id: F2-131
    unit: F2
    objective: "2.2"
    stem: "Which pair correctly distinguishes a Compliance Assessment from a Capability Assessment?"
    options:
      - {key: A, text: "Compliance Assessment: periodic review of an implementation project against the architecture, with completed checklists, from Phase G; Capability Assessment: understanding baseline and target capability of the enterprise, IT and architecture function, plus readiness to transform, from Phases A and E", correct: true}
      - {key: B, text: "Compliance Assessment is done before architecture definition; Capability Assessment during implementation"}
      - {key: C, text: "Both are produced by the Architecture Board in Phase H"}
      - {key: D, text: "Compliance Assessment measures business capabilities; Capability Assessment measures adherence to standards"}
    explanation: "Compliance is about a project's adherence during implementation (Phase G); Capability is about the enterprise's readiness and maturity before detailed definition (A and E). B reverses the timing. C is wrong on phase and author. D swaps the subject matter."
    refs: ["CONTENT §4.2.13", "CONTENT §4.2.10", "CONTENT §4.1"]
    difficulty: 2
    tags: [confusables, compliance, capability-assessment]
    status: draft
  - id: F2-132
    unit: F2
    objective: "2.2"
    stem: "What is an Architecture Contract?"
    options:
      - {key: A, text: "The document the sponsor sends to start the cycle"}
      - {key: B, text: "A joint agreement between the development partners and the sponsors about what an architecture will deliver, to what quality, and whether it is fit for purpose", correct: true}
      - {key: C, text: "The schedule of projects that realise the target"}
      - {key: D, text: "The list of standards in the Standards Library"}
    explanation: "Architecture Contracts are joint agreements on deliverables, quality and fitness for purpose, delivered through governance; two forms are described. A is the Request for Architecture Work. C is the Implementation and Migration Plan. D is not a deliverable."
    refs: ["CONTENT §4.2.2"]
    difficulty: 2
    tags: [confusables, architecture-contract]
    status: draft
  - id: F2-133
    unit: F2
    objective: "2.2"
    stem: "A Preliminary Phase output records the scope of organisations impacted, the roles and responsibilities of the architecture team, constraints, budget and the governance and support strategy. Which deliverable is this?"
