      - {key: B, text: "Architecture partitions", correct: true}
      - {key: C, text: "Transition Architectures"}
      - {key: D, text: "Capability increments"}
    explanation: "Dividing an architecture into subsets to ease development and management creates partitions. Levels are about granularity (strategic, segment, capability), not geography. Transition Architectures are intermediate states in time. Capability increments are value-delivering slices of a capability."
