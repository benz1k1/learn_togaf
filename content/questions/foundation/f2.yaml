  - id: F2-135
    unit: F2
    objective: "2.2"
    stem: "Which statement about views and viewpoints is correct?"
    options:
      - {key: A, text: "Viewpoints are generic and can be stored in libraries for reuse; a view is always specific to the architecture it is created for", correct: true}
      - {key: B, text: "Views are generic and reusable; viewpoints are specific to one architecture"}
      - {key: C, text: "A view can exist without any viewpoint, even implicitly"}
      - {key: D, text: "A viewpoint is the diagram; the view is the text describing it"}
