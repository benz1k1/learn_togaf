    stem: "Which statement correctly distinguishes an ABB from an SBB?"
    options:
      - {key: A, text: "An ABB specifies required SBBs at a more logical, supplier-independent level; an SBB is a physical or implementation-specific component that realises one or more ABBs", correct: true}
      - {key: B, text: "An ABB is physical; an SBB is logical"}
