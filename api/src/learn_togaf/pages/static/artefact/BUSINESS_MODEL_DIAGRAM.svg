<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" font-family="sans-serif" font-size="12" role="img" aria-label="Example Business Model Diagram for a fictional retail bank, an original study illustration">
<defs><marker id="arr-business-model-diagram" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="0" y="0" width="760" height="262" fill="#fff"/>
<text x="10" y="20" text-anchor="start" font-size="12" fill="#222" font-weight="bold">Example: Business Model Diagram — retail bank</text>
<text x="750" y="20" text-anchor="end" font-size="11" fill="#666" font-style="italic">diagram: Phase A</text>
<rect x="10" y="40" width="236" height="130" rx="6" fill="#e0ecff" stroke="#7aa2e3" stroke-width="1"/>
<text x="18" y="55" text-anchor="start" font-size="11" fill="#222" font-weight="bold">Create value</text>
<text x="18" y="71" text-anchor="start" font-size="11" fill="#345">Key activities: Onboarding,</text>
<text x="18" y="85" text-anchor="start" font-size="11" fill="#345">Payments, Lending</text>
<text x="18" y="99" text-anchor="start" font-size="11" fill="#345">Key resources: Core Banking, branch</text>
<text x="18" y="113" text-anchor="start" font-size="11" fill="#345">network, card licence</text>
<text x="18" y="127" text-anchor="start" font-size="11" fill="#345">Key partners: Card network, credit</text>
<text x="18" y="141" text-anchor="start" font-size="11" fill="#345">bureau, cloud provider</text>
<rect x="262" y="40" width="236" height="130" rx="6" fill="#e3f5e1" stroke="#7fbf7a" stroke-width="1"/>
<text x="270" y="55" text-anchor="start" font-size="11" fill="#222" font-weight="bold">Deliver value</text>
<text x="270" y="71" text-anchor="start" font-size="11" fill="#345">Value proposition: everyday banking</text>
<text x="270" y="85" text-anchor="start" font-size="11" fill="#345">that fits in a pocket</text>
<text x="270" y="99" text-anchor="start" font-size="11" fill="#345">Channels: Branch, Mobile App, Card</text>
<text x="270" y="113" text-anchor="start" font-size="11" fill="#345">Segments: retail customers, small</text>
<text x="270" y="127" text-anchor="start" font-size="11" fill="#345">business owners</text>
<rect x="514" y="40" width="236" height="130" rx="6" fill="#fff1d6" stroke="#e0b060" stroke-width="1"/>
<text x="522" y="55" text-anchor="start" font-size="11" fill="#222" font-weight="bold">Capture value</text>
<text x="522" y="71" text-anchor="start" font-size="11" fill="#345">Revenue: interest margin on lending,</text>
<text x="522" y="85" text-anchor="start" font-size="11" fill="#345">card interchange, account fees</text>
<text x="522" y="99" text-anchor="start" font-size="11" fill="#345">Costs: technology run, branch estate,</text>
<text x="522" y="113" text-anchor="start" font-size="11" fill="#345">staff, fraud losses</text>
<line x1="246" y1="105" x2="262" y2="105" stroke="#555" marker-end="url(#arr-business-model-diagram)"/>
<line x1="498" y1="105" x2="514" y2="105" stroke="#555" marker-end="url(#arr-business-model-diagram)"/>
<path d="M632 170 L632 195 L128 195 L128 172" fill="none" stroke="#555" stroke-dasharray="5 4" marker-end="url(#arr-business-model-diagram)"/>
<text x="380" y="210" text-anchor="middle" font-size="10" fill="#345">profit reinvested in the Mobile App and lending capacity</text>
<text x="380" y="236" text-anchor="middle" font-size="10" fill="#345">One model per line of business; this is Northgate Bank&#x27;s retail line. The three blocks answer create / deliver / capture.</text>
<text x="10" y="254" text-anchor="start" font-size="11" fill="#666">Original illustration for study; the artifact is defined in CONTENT §3.6.3</text>
</svg>
