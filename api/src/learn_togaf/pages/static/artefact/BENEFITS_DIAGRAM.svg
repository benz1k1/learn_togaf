<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 382" font-family="sans-serif" font-size="12" role="img" aria-label="Example Benefits Diagram for a fictional retail bank, an original study illustration">
<defs><marker id="arr-benefits-diagram" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="0" y="0" width="760" height="382" fill="#fff"/>
<text x="10" y="20" text-anchor="start" font-size="12" fill="#222" font-weight="bold">Example: Benefits Diagram — retail bank</text>
<text x="750" y="20" text-anchor="end" font-size="11" fill="#666" font-style="italic">diagram: Phase E</text>
<rect x="80" y="50" width="560" height="260" rx="0" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
<line x1="80" y1="180.0" x2="640" y2="180.0" stroke="#ddd" stroke-width="1" stroke-dasharray="5 4"/><line x1="360.0" y1="50" x2="360.0" y2="310" stroke="#ddd" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="80" y1="310" x2="650" y2="310" stroke="#333" marker-end="url(#arr-benefits-diagram)"/><line x1="80" y1="310" x2="80" y2="40" stroke="#333" marker-end="url(#arr-benefits-diagram)"/>
<text x="360.0" y="334" text-anchor="middle" font-size="11" fill="#222">complexity →  (low ... high)</text><text x="60" y="180.0" text-anchor="middle" font-size="11" transform="rotate(-90 60 180.0)">benefit →  (low ... high)</text>
<text x="88" y="66" text-anchor="start" font-size="10" fill="#999" font-style="italic">quick wins</text><text x="632" y="66" text-anchor="end" font-size="10" fill="#999" font-style="italic">major projects</text><text x="88" y="302" text-anchor="start" font-size="10" fill="#999" font-style="italic">fill-ins</text><text x="632" y="302" text-anchor="end" font-size="10" fill="#999" font-style="italic">avoid</text>
<circle cx="388" cy="89" r="34" fill="#e3f5e1" stroke="#7fbf7a" fill-opacity="0.85"/><text x="388.0" y="93.0" text-anchor="middle" font-size="9" fill="#222">Mobile payments</text>
<circle cx="276" cy="128" r="24" fill="#e3f5e1" stroke="#7fbf7a" fill-opacity="0.85"/><text x="276.0" y="132.0" text-anchor="middle" font-size="9" fill="#222">Card fraud scoring</text>
<circle cx="147" cy="232" r="16" fill="#e0ecff" stroke="#7aa2e3" fill-opacity="0.85"/><text x="147.2" y="236.0" text-anchor="middle" font-size="9" fill="#222">Statement e-delivery</text>
<circle cx="248" cy="245" r="18" fill="#e0ecff" stroke="#7aa2e3" fill-opacity="0.85"/><text x="248.0" y="249.0" text-anchor="middle" font-size="9" fill="#222">Branch tablets</text>
<circle cx="573" cy="154" r="40" fill="#fff1d6" stroke="#e0b060" fill-opacity="0.85"/><text x="572.8" y="158.0" text-anchor="middle" font-size="9" fill="#222">Core Banking upgrade</text>
<circle cx="500" cy="258" r="30" fill="#fde2e1" stroke="#d9776f" fill-opacity="0.85"/><text x="500.0" y="262.0" text-anchor="middle" font-size="9" fill="#222">Warehouse replacement</text>
<text x="660" y="90" text-anchor="start" font-size="10" fill="#345">bubble size = size</text><text x="660" y="106" text-anchor="start" font-size="10" fill="#345">of the opportunity</text><text x="660" y="130" text-anchor="start" font-size="10" fill="#345">colour = benefit class</text>
<rect x="660" y="140" width="12" height="12" rx="6" fill="#e3f5e1" stroke="#7fbf7a" stroke-width="1"/><text x="678" y="150" text-anchor="start" font-size="10" fill="#222">revenue</text>
<rect x="660" y="158" width="12" height="12" rx="6" fill="#e0ecff" stroke="#7aa2e3" stroke-width="1"/><text x="678" y="168" text-anchor="start" font-size="10" fill="#222">cost</text>
<rect x="660" y="176" width="12" height="12" rx="6" fill="#fff1d6" stroke="#e0b060" stroke-width="1"/><text x="678" y="186" text-anchor="start" font-size="10" fill="#222">risk / compliance</text>
<rect x="660" y="194" width="12" height="12" rx="6" fill="#fde2e1" stroke="#d9776f" stroke-width="1"/><text x="678" y="204" text-anchor="start" font-size="10" fill="#222">end of life</text>
<text x="380" y="356" text-anchor="middle" font-size="10" fill="#345">Opportunities from the Architecture Definition plotted by size, benefit and complexity, so stakeholders can select, prioritise and sequence them.</text>
<text x="10" y="374" text-anchor="start" font-size="11" fill="#666">Original illustration for study; the artifact is defined in CONTENT §3.6.8</text>
</svg>
