<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 314" font-family="sans-serif" font-size="12" role="img" aria-label="Example Process Flow Diagram for a fictional retail bank, an original study illustration">
<defs><marker id="arr-process-flow-diagram" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="0" y="0" width="760" height="314" fill="#fff"/>
<text x="10" y="20" text-anchor="start" font-size="12" fill="#222" font-weight="bold">Example: Process Flow Diagram — retail bank</text>
<text x="750" y="20" text-anchor="end" font-size="11" fill="#666" font-style="italic">diagram: Phase B</text>
<text x="14" y="44" text-anchor="start" font-size="11" fill="#222" font-weight="bold">Process: Open an account (swim-lane per owner; the supporting application is a lane too)</text>
<rect x="10" y="56" width="740" height="66" rx="0" fill="#fafafa" stroke="#bbb" stroke-width="1"/><rect x="10" y="56" width="92" height="66" rx="0" fill="#f2f2f2" stroke="#999" stroke-width="1"/><text x="56" y="93" text-anchor="middle" font-size="11" fill="#222" font-weight="bold">Customer</text>
<rect x="10" y="126" width="740" height="66" rx="0" fill="#fafafa" stroke="#bbb" stroke-width="1"/><rect x="10" y="126" width="92" height="66" rx="0" fill="#f2f2f2" stroke="#999" stroke-width="1"/><text x="56" y="163" text-anchor="middle" font-size="11" fill="#222" font-weight="bold">Branch Teller</text>
<rect x="10" y="196" width="740" height="66" rx="0" fill="#fafafa" stroke="#bbb" stroke-width="1"/><rect x="10" y="196" width="92" height="66" rx="0" fill="#f2f2f2" stroke="#999" stroke-width="1"/><text x="56" y="233" text-anchor="middle" font-size="11" fill="#222" font-weight="bold">Core Banking</text>
<circle cx="130" cy="89" r="9" fill="#2e7d32"/><text x="130" y="112" text-anchor="middle" font-size="10" fill="#345">event: walks in</text>
<rect x="160" y="72" width="120" height="34" rx="6" fill="#fff" stroke="#666" stroke-width="1"/>
<text x="220.0" y="92.3" text-anchor="middle" font-size="10" fill="#222">Submit application</text>
<rect x="160" y="142" width="120" height="34" rx="6" fill="#fff" stroke="#666" stroke-width="1"/>
<text x="220.0" y="162.3" text-anchor="middle" font-size="10" fill="#222">Verify identity</text>
<polygon points="340,142 372,159 340,176 308,159" fill="#fff1d6" stroke="#e0b060"/><text x="340" y="163" text-anchor="middle" font-size="10" fill="#222">KYC ok?</text>
<text x="340" y="190" text-anchor="middle" font-size="10" fill="#345" font-style="italic">control: KYC policy</text>
<rect x="420" y="142" width="110" height="34" rx="6" fill="#fff" stroke="#666" stroke-width="1"/>
<text x="475.0" y="162.3" text-anchor="middle" font-size="10" fill="#222">Select product</text>
<rect x="420" y="212" width="110" height="34" rx="6" fill="#fff" stroke="#666" stroke-width="1"/>
<text x="475.0" y="232.3" text-anchor="middle" font-size="10" fill="#222">Create account</text>
<rect x="570" y="212" width="110" height="34" rx="6" fill="#fff" stroke="#666" stroke-width="1"/>
<text x="625.0" y="232.3" text-anchor="middle" font-size="10" fill="#222">Issue card</text>
<rect x="570" y="72" width="120" height="34" rx="6" fill="#fff" stroke="#666" stroke-width="1"/>
<text x="630.0" y="85.8" text-anchor="middle" font-size="10" fill="#222">Receive welcome</text>
<text x="630.0" y="98.8" text-anchor="middle" font-size="10" fill="#222">pack</text>
<text x="630" y="118" text-anchor="middle" font-size="10" fill="#345" font-style="italic">product: welcome pack</text>
<circle cx="725" cy="89" r="9" fill="#fff" stroke="#333" stroke-width="3"/>
<line x1="139" y1="89" x2="160" y2="89" stroke="#555" marker-end="url(#arr-process-flow-diagram)"/>
<line x1="220" y1="106" x2="220" y2="142" stroke="#555" marker-end="url(#arr-process-flow-diagram)"/>
<line x1="280" y1="159" x2="308" y2="159" stroke="#555" marker-end="url(#arr-process-flow-diagram)"/>
<line x1="372" y1="159" x2="420" y2="159" stroke="#555" marker-end="url(#arr-process-flow-diagram)"/>
<text x="396" y="154" text-anchor="middle" font-size="10" fill="#345">yes</text>
<path d="M340 176 L340 200 L290 200 L290 176" fill="none" stroke="#c0392b" stroke-dasharray="5 4" marker-end="url(#arr-process-flow-diagram)"/>
<text x="320" y="212" text-anchor="middle" font-size="10" fill="#345">no: decline</text>
<line x1="475" y1="176" x2="475" y2="212" stroke="#555" marker-end="url(#arr-process-flow-diagram)"/>
<line x1="530" y1="229" x2="570" y2="229" stroke="#555" marker-end="url(#arr-process-flow-diagram)"/>
<line x1="625" y1="212" x2="625" y2="106" stroke="#555" marker-end="url(#arr-process-flow-diagram)"/>
<line x1="690" y1="89" x2="716" y2="89" stroke="#555" marker-end="url(#arr-process-flow-diagram)"/>
<text x="380" y="288" text-anchor="middle" font-size="10" fill="#345">Rounded boxes are activities; the diamond is a decision under a control; circles are start/end events; italics name products and controls.</text>
<text x="10" y="306" text-anchor="start" font-size="11" fill="#666">Original illustration for study; the artifact is defined in CONTENT §3.6.4</text>
</svg>
