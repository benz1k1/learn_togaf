<text x="380" y="324" text-anchor="middle" font-size="10" fill="#345">Entities feed services; services reside in components that hold the master copy (solid) or a replica (dashed). Sizing and criticality read off this.</text>
<text x="10" y="342" text-anchor="start" font-size="11" fill="#666">Original illustration for study; the artifact is defined in CONTENT §3.6.5</text>
