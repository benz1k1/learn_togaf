<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="sans-serif" font-size="12" role="img" aria-label="Example Value Stream Map for a fictional retail bank, an original study illustration">
<defs><marker id="arr-value-stream-map" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="0" y="0" width="760" height="280" fill="#fff"/>
<text x="10" y="20" text-anchor="start" font-size="12" fill="#222" font-weight="bold">Example: Value Stream Map — retail bank</text>
<text x="750" y="20" text-anchor="end" font-size="11" fill="#666" font-style="italic">diagram: Phase A</text>
<text x="14" y="50" text-anchor="start" font-size="11" fill="#222" font-weight="bold">Value stream: Obtain a loan</text>
<text x="14" y="65" text-anchor="start" font-size="10" fill="#345">Triggered by: Customer   ·   Value received: money in the account and a repayment plan</text>
<polygon points="14,78 140,78 154,98.0 140,118 14,118" fill="#e0ecff" stroke="#7aa2e3"/><text x="84.0" y="102.0" text-anchor="middle" font-size="11" fill="#222" font-weight="bold">Apply</text>
<text x="84" y="134" text-anchor="middle" font-size="10" fill="#345">value: application captured</text>
<polygon points="161,78 287,78 301,98.0 287,118 161,118 175,98.0" fill="#e3f5e1" stroke="#7fbf7a"/><text x="236.0" y="102.0" text-anchor="middle" font-size="11" fill="#222" font-weight="bold">Assess</text>
<text x="236" y="134" text-anchor="middle" font-size="10" fill="#345">value: credit decision</text>
<polygon points="308,78 434,78 448,98.0 434,118 308,118 322,98.0" fill="#fff1d6" stroke="#e0b060"/><text x="383.0" y="102.0" text-anchor="middle" font-size="11" fill="#222" font-weight="bold">Approve</text>
<text x="383" y="134" text-anchor="middle" font-size="10" fill="#345">value: offer accepted</text>
<polygon points="455,78 581,78 595,98.0 581,118 455,118 469,98.0" fill="#f3e3f7" stroke="#b58ac9"/><text x="530.0" y="102.0" text-anchor="middle" font-size="11" fill="#222" font-weight="bold">Disburse</text>
<text x="530" y="134" text-anchor="middle" font-size="10" fill="#345">value: funds credited</text>
<polygon points="602,78 728,78 742,98.0 728,118 602,118 616,98.0" fill="#e0ecff" stroke="#7aa2e3"/><text x="677.0" y="102.0" text-anchor="middle" font-size="11" fill="#222" font-weight="bold">Service</text>
<text x="677" y="134" text-anchor="middle" font-size="10" fill="#345">value: repayments collected</text>
<text x="14" y="160" text-anchor="start" font-size="10" fill="#666" font-style="italic">Capabilities that enable each stage:</text>
<line x1="84" y1="172" x2="84" y2="180" stroke="#999" marker-end="url(#arr-value-stream-map)"/>
<rect x="20" y="182" width="128" height="24" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
<text x="84.0" y="197.3" text-anchor="middle" font-size="10" fill="#222">Customer Onboarding</text>
<rect x="20" y="210" width="128" height="24" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
<text x="84.0" y="225.3" text-anchor="middle" font-size="10" fill="#222">Identity Verification</text>
<line x1="231" y1="172" x2="231" y2="180" stroke="#999" marker-end="url(#arr-value-stream-map)"/>
<rect x="167" y="182" width="128" height="24" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
<text x="231.0" y="197.3" text-anchor="middle" font-size="10" fill="#222">Credit Assessment</text>
<rect x="167" y="210" width="128" height="24" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
<text x="231.0" y="225.3" text-anchor="middle" font-size="10" fill="#222">Risk Management</text>
<line x1="378" y1="172" x2="378" y2="180" stroke="#999" marker-end="url(#arr-value-stream-map)"/>
<rect x="314" y="182" width="128" height="24" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
<text x="378.0" y="197.3" text-anchor="middle" font-size="10" fill="#222">Loan Origination</text>
<line x1="525" y1="172" x2="525" y2="180" stroke="#999" marker-end="url(#arr-value-stream-map)"/>
<rect x="461" y="182" width="128" height="24" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
<text x="525.0" y="197.3" text-anchor="middle" font-size="10" fill="#222">Payments</text>
<rect x="461" y="210" width="128" height="24" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
<text x="525.0" y="225.3" text-anchor="middle" font-size="10" fill="#222">Transfers</text>
<line x1="672" y1="172" x2="672" y2="180" stroke="#999" marker-end="url(#arr-value-stream-map)"/>
<rect x="608" y="182" width="128" height="24" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
<text x="672.0" y="197.3" text-anchor="middle" font-size="10" fill="#222">Loan Servicing</text>
<rect x="608" y="210" width="128" height="24" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
<text x="672.0" y="225.3" text-anchor="middle" font-size="10" fill="#222">Payments</text>
<text x="380" y="254" text-anchor="middle" font-size="10" fill="#345">Stages are read left to right; each names the value item it adds. Capabilities are mapped beneath the stage they support.</text>
<text x="10" y="272" text-anchor="start" font-size="11" fill="#666">Original illustration for study; the artifact is defined in CONTENT §3.6.3</text>
</svg>
