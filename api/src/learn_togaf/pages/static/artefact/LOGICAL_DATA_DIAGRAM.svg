<text x="298" y="77" text-anchor="start" font-size="10" fill="#222">account_id  PK</text>
<text x="298" y="92" text-anchor="start" font-size="10" fill="#222">customer_id  FK</text>
<text x="298" y="107" text-anchor="start" font-size="10" fill="#345">product_type</text>
<text x="298" y="122" text-anchor="start" font-size="10" fill="#345">currency</text>
<text x="298" y="137" text-anchor="start" font-size="10" fill="#345">balance</text>
