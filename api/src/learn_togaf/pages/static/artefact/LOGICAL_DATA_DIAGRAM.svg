<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 346" font-family="sans-serif" font-size="12" role="img" aria-label="Example Logical Data Diagram for a fictional retail bank, an original study illustration">
<defs><marker id="arr-logical-data-diagram" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
