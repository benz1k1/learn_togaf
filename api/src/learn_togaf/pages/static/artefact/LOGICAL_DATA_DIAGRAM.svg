<text x="560" y="244" text-anchor="middle" font-size="10" fill="#345">0..1 card per transaction</text>
<text x="380" y="320" text-anchor="middle" font-size="10" fill="#345">For developers and DB designers: keys, attributes and cardinalities. Physical types and indexes are left to the physical model.</text>
<text x="10" y="338" text-anchor="start" font-size="11" fill="#666">Original illustration for study; the artifact is defined in CONTENT §3.6.5</text>
