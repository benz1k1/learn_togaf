<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 354" font-family="sans-serif" font-size="12" role="img" aria-label="Example Application Communication Diagram for a fictional retail bank, an original study illustration">
<defs><marker id="arr-application-communication-diagram" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="0" y="0" width="760" height="354" fill="#fff"/>
<text x="10" y="20" text-anchor="start" font-size="12" fill="#222" font-weight="bold">Example: Application Communication Diagram — retail bank</text>
<text x="750" y="20" text-anchor="end" font-size="11" fill="#666" font-style="italic">diagram: Phase C application</text>
<circle cx="50" cy="77" r="7" fill="#fff" stroke="#333"/>
<line x1="50" y1="84" x2="50" y2="104" stroke="#333" stroke-width="1"/>
<line x1="38" y1="92" x2="62" y2="92" stroke="#333" stroke-width="1"/>
<line x1="50" y1="104" x2="40" y2="120" stroke="#333" stroke-width="1"/>
<line x1="50" y1="104" x2="60" y2="120" stroke="#333" stroke-width="1"/>
<text x="50" y="134" text-anchor="middle" font-size="11" fill="#222">Customer</text>
<rect x="130" y="80" width="130" height="46" rx="6" fill="#e0ecff" stroke="#7aa2e3" stroke-width="1"/>
<text x="195.0" y="106.7" text-anchor="middle" font-size="11" fill="#222" font-weight="bold">Mobile App</text>
<rect x="340" y="80" width="140" height="46" rx="6" fill="#e0ecff" stroke="#7aa2e3" stroke-width="1"/>
<text x="410.0" y="106.7" text-anchor="middle" font-size="11" fill="#222" font-weight="bold">Core Banking</text>
<rect x="340" y="200" width="140" height="46" rx="6" fill="#e0ecff" stroke="#7aa2e3" stroke-width="1"/>
<text x="410.0" y="226.7" text-anchor="middle" font-size="11" fill="#222" font-weight="bold">Card Switch</text>
<rect x="580" y="200" width="130" height="46" rx="6" fill="#e0ecff" stroke="#7aa2e3" stroke-width="1"/>
<text x="645.0" y="226.7" text-anchor="middle" font-size="11" fill="#222" font-weight="bold">Fraud Engine</text>
<rect x="580" y="80" width="130" height="46" rx="6" fill="#e0ecff" stroke="#7aa2e3" stroke-width="1"/>
<text x="645.0" y="106.7" text-anchor="middle" font-size="11" fill="#222" font-weight="bold">Data Warehouse</text>
<rect x="130" y="200" width="130" height="46" rx="6" fill="#f3e3f7" stroke="#b58ac9" stroke-width="1"/>
<text x="195.0" y="219.7" text-anchor="middle" font-size="11" fill="#222">Card network</text>
<text x="195.0" y="233.7" text-anchor="middle" font-size="11" fill="#222">(external)</text>
<line x1="72" y1="103" x2="130" y2="103" stroke="#555" marker-end="url(#arr-application-communication-diagram)"/>
<line x1="260" y1="96" x2="340" y2="96" stroke="#555" marker-end="url(#arr-application-communication-diagram)"/>
<text x="300" y="72" text-anchor="middle" font-size="9" fill="#345">IF-01 REST: Account balance, transfer</text>
<line x1="340" y1="112" x2="260" y2="112" stroke="#555" marker-end="url(#arr-application-communication-diagram)"/>
<text x="330" y="140" text-anchor="middle" font-size="9" fill="#345">IF-05 push: Transaction alert</text>
<line x1="410" y1="200" x2="410" y2="126" stroke="#555" marker-end="url(#arr-application-communication-diagram)"/>
<text x="540" y="166" text-anchor="middle" font-size="9" fill="#345">IF-02 queue: Card authorisation, settlement</text>
<line x1="480" y1="96" x2="580" y2="96" stroke="#555" marker-end="url(#arr-application-communication-diagram)"/>
<text x="530" y="72" text-anchor="middle" font-size="9" fill="#345">IF-03 batch: Transaction file</text>
<line x1="480" y1="223" x2="580" y2="223" stroke="#555" marker-end="url(#arr-application-communication-diagram)"/>
<text x="530" y="195" text-anchor="middle" font-size="9" fill="#345">IF-04 REST: Card transaction</text>
<line x1="260" y1="223" x2="340" y2="223" stroke="#555" marker-end="url(#arr-application-communication-diagram)"/>
<text x="300" y="260" text-anchor="middle" font-size="9" fill="#345">IF-06 ISO 8583: Authorisation</text>
<path d="M240 126 L240 170 L330 170 L330 200" fill="none" stroke="#555" marker-end="url(#arr-application-communication-diagram)"/>
<text x="280" y="165" text-anchor="middle" font-size="9" fill="#345">freeze card</text>
<rect x="110" y="270" width="190" height="28" rx="6" fill="#e3f5e1" stroke="#7fbf7a" stroke-width="1" stroke-dasharray="5 4"/><text x="205" y="288" text-anchor="middle" font-size="10" fill="#222">business service: Transfer funds</text>
<line x1="170" y1="126" x2="170" y2="270" stroke="#7fbf7a" stroke-width="1" stroke-dasharray="5 4"/><line x1="350" y1="126" x2="300" y2="276" stroke="#7fbf7a" stroke-width="1" stroke-dasharray="5 4"/>
<text x="380" y="328" text-anchor="middle" font-size="10" fill="#345">Boxes are application components, arrows are interfaces labelled with type and the data entity carried; dashed = association with a business service.</text>
<text x="10" y="346" text-anchor="start" font-size="11" fill="#666">Original illustration for study; the artifact is defined in CONTENT §3.6.6</text>
</svg>
